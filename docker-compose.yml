services:
  db:
    restart: unless-stopped
    image: postgres:16
    # NO published ports. api + worker reach the database over the compose network
    # by name. Publishing 5432 puts it on the internet via Docker's iptables rules,
    # which are evaluated BEFORE ufw — a "firewalled" host with an open database.
    # For psql from your laptop, tunnel instead:  ssh -L 5432:localhost:5432 user@host
    environment:
      POSTGRES_DB: techdeva
      POSTGRES_USER: postgres
      # no defaults: an unset value must fail loudly, not silently reuse a known one
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/00_role.sh:/docker-entrypoint-initdb.d/00_role.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_beauty_aesthetic.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/10_growth_engine.sql:/docker-entrypoint-initdb.d/10_growth_engine.sql:ro
      - ./db/11_client_portal.sql:/docker-entrypoint-initdb.d/11_client_portal.sql:ro
      - ./db/13_attribution.sql:/docker-entrypoint-initdb.d/13_attribution.sql:ro

  redis:
    restart: unless-stopped
    image: redis:7
    # NO published ports, same reason as the database above.
    #
    # DURABILITY. The image declares VOLUME /data, so Docker was already keeping
    # an ANONYMOUS volume - RDB snapshots survived a recreate. Two gaps remained:
    # AOF was off, so work between snapshots could still be lost; and an unnamed
    # volume is one `docker compose down -v` away from vanishing silently.
    # A named volume plus appendonly closes both. The reaper in scheduler.tick()
    # is the second line of defence; this is the first.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    restart: unless-stopped
    build: ./app
    environment:
      # password via PGPASSWORD, never in the DSN: a URL mangles + / = 
      DATABASE_URL: postgresql://techdeva_app@db:5432/techdeva
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      HERMES_URL: ${HERMES_URL:-}
      HERMES_REPLY_PATH: ${HERMES_REPLY_PATH:-/reply}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_TIMEOUT: ${HERMES_TIMEOUT:-8}
      HERMES_RETRIES: ${HERMES_RETRIES:-2}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}   # Social Inbox: Meta webhook check (app/social_agent.py)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      # Google Ads reporting: TechDeva's developer token (Google Ads API
      # Center) and, when client accounts are reached through TechDeva's
      # manager account, that manager's customer id. ops/setup/ads_setup.py
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v21}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      META_AD_LIBRARY_TOKEN: ${META_AD_LIBRARY_TOKEN:-}
      # --- client portal / auth (Build 2) ---
      # AUTH_REQUIRED=true ignores the X-Tenant-Id / X-Role headers everywhere.
      # Turn it on (with a real SESSION_SECRET) before this API is public.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # --- generation (Build 3): provider is configurable, never hard-coded ---
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      # Ordered fallback. One model being rate limited upstream is normal,
      # so the workforce walks the list rather than stopping.
      AI_MODEL_CHAIN: ${AI_MODEL_CHAIN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # AI pictures for posts (app/aidesign.py): image models in order, daily limit per business
      GEMINI_IMAGE_MODELS: ${GEMINI_IMAGE_MODELS:-gemini-2.5-flash-image,gemini-3-pro-image-preview}
      AI_PICTURES_PER_DAY: ${AI_PICTURES_PER_DAY:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # --- competitor discovery (Build 5) ---
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
      SERPER_KEY: ${SERPER_KEY:-}
      # --- WhatsApp self-service (Part 4) ---
      # The shared secret the API presents to a tenant's pairing sidecar.
      HERMES_INTERNAL_KEY: ${HERMES_INTERNAL_KEY:-}
      # --- email for "Forgot password?" (optional; without it the request
      # waits in the founder console and is sent by WhatsApp) ---
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # the signup page + client dashboard (the API image is built from ./app)
      - ./web:/srv/web:ro
      # post videos (app/videos.py); shared with the worker, which publishes them
      - mediadata:/srv/media
    depends_on: [db, redis]

  # The AI phone agent's bridge (app/voice_bridge.py): Asterisk (ops/voice,
  # host network) hands it each call's audio. OFF unless started with
  # `docker compose --profile voice up -d voice`; ports on localhost only.
  voice:
    profiles: ["voice"]
    restart: unless-stopped
    build: ./app
    command: ["python","-m","app.voice_bridge"]
    environment:
      DATABASE_URL: postgresql://techdeva_app@db:5432/techdeva
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_MAX_CALLS: ${VOICE_MAX_CALLS:-3}
    # /etc/techdeva/voice (root-only, outside the repo): bridge.token, shared
    # with Asterisk. Only read when this service is started.
    volumes: ["/etc/techdeva/voice:/run/voice:ro"]
    ports: ["127.0.0.1:9092:9092", "127.0.0.1:9093:9093"]
    depends_on: [db]

  worker:
    restart: unless-stopped
    build: ./app
    command: ["python","-m","app.worker"]
    volumes:
      - mediadata:/srv/media
    environment:
      # password via PGPASSWORD, never in the DSN: a URL mangles + / = 
      DATABASE_URL: postgresql://techdeva_app@db:5432/techdeva
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      # same signing key as the api: the worker runs the same app code, and
      # auth.py refuses to sign or check a token without it (AUTH_REQUIRED
      # defaults to true)
      SESSION_SECRET: ${SESSION_SECRET:-}
      HERMES_URL: ${HERMES_URL:-}
      HERMES_REPLY_PATH: ${HERMES_REPLY_PATH:-/reply}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_TIMEOUT: ${HERMES_TIMEOUT:-8}
      HERMES_RETRIES: ${HERMES_RETRIES:-2}
      META_AD_LIBRARY_TOKEN: ${META_AD_LIBRARY_TOKEN:-}
      # --- ad autopilot (growth planner): pauses and launches on its schedule ---
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v21}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      # --- trial data deletion: the 3-day warning email (only when set) ---
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # --- generation (Build 3): provider is configurable, never hard-coded ---
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      # Ordered fallback. One model being rate limited upstream is normal,
      # so the workforce walks the list rather than stopping.
      AI_MODEL_CHAIN: ${AI_MODEL_CHAIN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # --- competitor discovery (Build 5) ---
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
      SERPER_KEY: ${SERPER_KEY:-}
      # --- WhatsApp self-service (Part 4) ---
      # The shared secret the API presents to a tenant's pairing sidecar.
      HERMES_INTERNAL_KEY: ${HERMES_INTERNAL_KEY:-}
    depends_on: [db, redis]

volumes:
  dbdata:
  redisdata:
  mediadata:
