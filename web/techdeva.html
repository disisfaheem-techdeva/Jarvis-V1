<!-- @td-theme:start -->
<script>
/* TechDeva theme + brand colour, for pages served by FastAPI (web/*.html).
   sync.py inlines this into each page's <head>, so the saved theme applies
   before the first paint. Next.js has its own copy of the theme part
   (techdeva-web/src/components/ui/theme.ts); both use the "td-theme" key.

   TD.toggleHTML()  markup for the light/dark switch, for script-rendered
                    headers. In static markup, <span data-td-theme-slot></span>
                    is replaced with it. Any [data-td-theme-toggle] works,
                    even if rendered later.
   TD.brand(hex)    a business's own accent colour. Works out readable text
                    on it and a readable text shade of it for the current
                    theme, so a light brand colour never gives white-on-white
                    buttons and a dark one never vanishes on the dark canvas. */
(function () {
  var KEY = "td-theme", doc = document.documentElement, brandHex = null;

  function theme() { return doc.dataset.theme === "light" ? "light" : "dark"; }

  function rgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(c) {
    var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(c, to, t) { return c.map(function (x, i) { return Math.round(x + (to[i] - x) * t); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function applyBrand() {
    var props = ["--accent", "--accent-hover", "--accent-ink", "--accent-tint", "--accent-line", "--fg-on-accent", "--ring"];
    if (!brandHex) { props.forEach(function (p) { doc.style.removeProperty(p); }); return; }
    var c = rgb(brandHex), white = [255, 255, 255], black = [0, 0, 0];
    var light = theme() === "light";
    var bg = light ? white : [10, 10, 15];
    // text on the accent fill: whichever of white or near-black reads better
    var on = contrast(c, white) >= contrast(c, [20, 16, 5]) ? white : [20, 16, 5];
    // the accent as text on the page: step it toward white (dark theme) or
    // black (light theme) until it reaches 4.5:1
    var ink = c, t = 0;
    while (contrast(ink, bg) < 4.5 && t < 1) { t += 0.05; ink = mix(c, light ? black : white, t); }
    var s = doc.style;
    s.setProperty("--accent", hex(c));
    s.setProperty("--accent-hover", hex(mix(c, on === white ? black : white, 0.12)));
    s.setProperty("--fg-on-accent", hex(on));
    s.setProperty("--accent-ink", hex(ink));
    s.setProperty("--ring", hex(ink));
    s.setProperty("--accent-tint", "rgb(" + c.join(" ") + " / " + (light ? 0.1 : 0.16) + ")");
    s.setProperty("--accent-line", "rgb(" + c.join(" ") + " / 0.4)");
  }

  function sync() {
    var light = theme() === "light";
    var btns = document.querySelectorAll("[data-td-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      btns[i].setAttribute("title", light ? "Dark theme" : "Light theme");
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = light ? "light" : "dark";
  }

  function set(next) {
    if (next === "light") doc.dataset.theme = "light"; else delete doc.dataset.theme;
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage blocked: lasts this page view */ }
    applyBrand();
    sync();
  }

  try { if (localStorage.getItem(KEY) === "light") doc.dataset.theme = "light"; } catch (e) { /* default dark */ }

  var SUN = '<svg class="td-i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg class="td-i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  window.TD = {
    theme: theme,
    setTheme: set,
    brand: function (h) { brandHex = h && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(h) ? h.slice(0, h.length === 9 ? 7 : h.length) : null; applyBrand(); },
    toggleHTML: function (cls) {
      var light = theme() === "light";
      return '<button type="button" class="td-theme-btn' + (cls ? " " + cls : "") + '" data-td-theme-toggle aria-label="' +
        (light ? "Switch to dark theme" : "Switch to light theme") + '" title="' + (light ? "Dark theme" : "Light theme") + '">' + SUN + MOON + "</button>";
    }
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-td-theme-toggle]");
    if (b) set(theme() === "light" ? "dark" : "light");
  });
  document.addEventListener("DOMContentLoaded", function () {
    // static pages: <span data-td-theme-slot="extra classes"></span> becomes the switch
    var slots = document.querySelectorAll("[data-td-theme-slot]");
    for (var i = 0; i < slots.length; i++) slots[i].outerHTML = window.TD.toggleHTML(slots[i].getAttribute("data-td-theme-slot"));
    sync();
  });
})();
</script>

<body class="td td-grain page-techdeva min-h-screen bg-bg text-fg">
<!-- Founder identity: a violet line across the top, so this screen is never mistaken for a business dashboard. -->
<div aria-hidden="true" class="fixed inset-x-0 top-0 z-50 h-[3px] bg-[linear-gradient(90deg,var(--p-violet-500),var(--p-violet-800),var(--p-violet-500))]"></div>

<div id="login" class="relative flex min-h-screen items-start justify-center px-4 pt-[12vh]">
  <div aria-hidden="true" class="td-ambient pointer-events-none absolute inset-0"></div>
  <div class="td-glass td-rim relative w-full max-w-sm rounded-[var(--p-radius-xl)] p-6 sm:p-8">
    <span class="role-badge">Founder console</span>
    <h1 class="mt-3 font-display text-2xl font-semibold tracking-tight">TechDeva</h1>
    <div class="sub">For the TechDeva founder only. Businesses sign in at <a href="/dashboard">/dashboard</a>.</div>
    <form id="lf" class="mt-6 flex flex-col gap-3">
      <label class="td-sr-only" for="email">Email</label>
      <input id="email" class="td-input" type="email" placeholder="Email" autocomplete="username">
      <label class="td-sr-only" for="pw">Password</label>
      <input id="pw" class="td-input" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="lerr" role="alert"></div>

  </div>
</div>

<div class="shell min-h-screen grid-cols-[256px_minmax(0,1fr)] max-[900px]:grid-cols-1" id="app" style="display:none">
  <aside id="aside" class="flex flex-col border-r border-line bg-bg-elevated px-3 py-4 min-[901px]:sticky min-[901px]:top-0 min-[901px]:h-screen">
    <div class="flex items-center gap-2 px-3 pb-2">
      <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-accent-ink shadow-[0_0_8px_var(--accent-glow)]"></span>
      <span class="font-display text-[17px] font-semibold tracking-tight">TechDeva</span>
    </div>
    <span class="role-badge mx-3 self-start">Founder console</span>
    <div class="sub px-3 pb-2">Every client, in one place</div>
    <nav id="nav" aria-label="Founder console" class="flex-1 overflow-auto"></nav>
    <div class="sidefoot border-t border-line px-3 pt-3 text-xs text-fg-muted">
      <div id="who"></div>
      <div class="mt-2"><a href="#" id="chgpw">My account</a> · <a href="#" id="out">Sign out</a></div>
    </div>
  </aside>
  <main class="min-w-0 px-4 pt-6 pb-20 sm:px-8">
    <div class="relative mb-2 flex flex-wrap items-end justify-between gap-4 overflow-hidden rounded-[var(--p-radius-xl)] border border-line bg-bg-elevated px-6 py-6">
      <div aria-hidden="true" class="td-ambient pointer-events-none absolute inset-0 opacity-70"></div>
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-[0.07] [background-image:linear-gradient(var(--fg)_1px,transparent_1px),linear-gradient(90deg,var(--fg)_1px,transparent_1px)] [background-size:32px_32px]"></div>
      <div class="relative flex items-start gap-3"><button id="menubtn" aria-label="Open menu">☰</button>
        <div><h1 id="vtitle" class="font-display text-3xl font-semibold tracking-tight">Overview</h1><div class="sub" id="vsub"></div></div></div>
      <div class="relative flex flex-wrap items-center gap-2"><span class="scope">Founder view · all businesses</span><button id="refresh">Refresh</button><span data-td-theme-slot></span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
let TOKEN = null, D = {};
const NAV = [
  ['RUNNING THE BUSINESS', [
    ['jarvis','Jarvis'], ['overview','Overview'], ['requests','Requests'], ['clients','Clients'], ['connections','Connections'], ['pipeline','Pipeline & trials']]],
  ['WHAT THE AI DELIVERS', [
    ['bookings','Bookings'], ['workforce','AI workforce'], ['approvals','Waiting on you']]],
  ['MONEY', [
    ['revenue','My revenue'], ['clientmoney','Client business'], ['invoices','Invoices out']]],
  ['PLATFORM', [
    ['health','Health'], ['incidents','Incidents'], ['aiusage','AI usage & API log']]]
];
const TITLES = {jarvis:['Jarvis','Pick a client, then say or type what to change for them.'],
  overview:['Overview','The whole business on one screen.'],
  clients:['Clients','Everyone onboard, what they pay, and what they are getting.'],
  connections:['Connections','Which clients have connected WhatsApp, Facebook, Instagram and Google. Clients connect these themselves in their dashboard.'],
  pipeline:['Pipeline & trials','Who signed up and who is still on a trial.'],
  requests:['Requests','Things clients asked for that need you: agents, payments, password resets.'],
  bookings:['Bookings','Appointments the AI has put in your clients diaries.'],
  workforce:['AI workforce','What each client’s agents are doing right now.'],
  approvals:['Waiting on you','Work the platform stopped on and cannot finish alone.'],
  revenue:['My revenue','What clients have paid TechDeva.'],
  clientmoney:['Client business','Money moving through your clients businesses.'],
  invoices:['Invoices out','Invoices TechDeva has issued to clients, and their status.'],
  health:['Health','Queues, workers and the AI chain.'],
  incidents:['Incidents','Anything the monitor has opened.'],
  aiusage:['AI usage & API log','AI credits each client used this month, and every AI call (who, which agent, model, time, result; never the text).']};

async function api(path, opts){
  opts = opts || {};
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, Object.assign({credentials:'include'}, opts, {headers:h}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return d;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => 'PKR ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const when = s => { if (!s) return '-';
  const d = new Date(s), days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago'; return String(s).slice(0,10); };
function kpi(label, value, note, cls){
  return '<div class="card"><div class="k-label">' + esc(label) + '</div><div class="k-value ' +
    (cls||'') + '">' + value + '</div><div class="k-note">' + esc(note||'') + '</div></div>';
}
function tbl(head, rows){
  if (!rows.length) return '<div class="empty">Nothing recorded yet.</div>';
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

// ------------------------------------------------------------------ login
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('lgo'), err = document.getElementById('lerr');
  b.disabled = true; b.textContent = 'Signing in...'; err.textContent = '';
  try {
    const d = await api('/auth/login', {method:'POST', body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value })});
    if (d.role !== 'techdeva_admin') err.textContent = 'That account is an ' + d.role + '.';
    else { TOKEN = d.token; show(); }
  } catch (ex) { err.textContent = ex.message; }
  b.disabled = false; b.textContent = 'Sign in';
});
document.getElementById('out').onclick = async e => {
  e.preventDefault();
  try { await api('/auth/logout', {method:'POST'}); } catch (x) {}
  TOKEN = null; location.href = '/techdeva';
};
document.getElementById('refresh').onclick = () => load();
document.getElementById('menubtn').onclick = () => document.getElementById('aside').classList.toggle('open');
document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) document.getElementById('aside').classList.remove('open'); });
const NAV_OPEN = (() => { try { return JSON.parse(localStorage.getItem('td-founder-nav') || '{}') || {}; } catch (e) { return {}; } })();
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-navgrp]');
  if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  NAV_OPEN[b.getAttribute('data-navgrp')] = open;
  try { localStorage.setItem('td-founder-nav', JSON.stringify(NAV_OPEN)); } catch (err) { /* lasts this visit */ }
  b.setAttribute('aria-expanded', String(open));
  b.parentNode.classList.toggle('collapsed', !open);
});
window.addEventListener('hashchange', paint);

function show(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  load();
}
function current(){ return (location.hash.replace('#/','') || 'overview'); }

function wireAiUsage(){
  document.querySelectorAll('[data-aisave]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-aisave'), v = document.querySelector('[data-aic="' + id + '"]').value.trim();
    try { await api('/techdeva/clients/' + id + '/ai-credits', {method:'PUT', body: JSON.stringify({ai_credits: v})}); D.aiu = undefined; paint(); }
    catch (e) { alert(e.message); }
  });
}

async function load(){
  const [book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans, conns] = await Promise.all([
    api('/techdeva/book'),
    api('/techdeva/health').catch(() => null),
    api('/techdeva/operations').catch(() => null),
    api('/ai/health').catch(() => null),
    api('/incidents').catch(() => null),
    api('/techdeva/overview').catch(() => null),
    api('/techdeva/invoices').catch(() => null),
    api('/techdeva/agent-requests').catch(() => null),
    api('/techdeva/payment-claims').catch(() => null),
    api('/techdeva/password-resets').catch(() => null),
    api('/plans').catch(() => null),
    api('/techdeva/connections').catch(() => null)
  ]);
  D = {book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans, conns, usage: D.usage, ret: D.ret};
  // conversation counts ask every agent, so they arrive after the page
  api('/techdeva/usage').then(u => { D.usage = u; if (current() === 'clients' || current() === 'overview') paint(); }).catch(() => {});
  renderNav(); paint();
}

function renderNav(){
  const b = D.book || {}, cur = current();
  const badge = {clients: b.clients ? b.clients.length : 0,
                 approvals: b.awaiting_approval || 0,
                 incidents: (D.inc && D.inc.open) || 0,
                 requests: openRequests()};
  /* Each section folds open and shut; the one holding the open page is always
     open, the rest remember the last choice. A closed section still shows how
     many things inside need you. */
  document.getElementById('nav').innerHTML = NAV.map(g => {
    const gid = 'nvg-' + g[0].toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const open = g[1].some(it => it[0] === cur) || NAV_OPEN[gid] !== false;
    const sum = g[1].reduce((n, it) => n + (Number(badge[it[0]]) || 0), 0);
    return '<div class="navsec' + (open ? '' : ' collapsed') + '">' +
      '<button type="button" class="navgrp" data-navgrp="' + gid + '" aria-expanded="' + open + '" aria-controls="' + gid + '">' +
      '<span>' + g[0] + '</span><span class="navend">' + (sum ? '<span class="tag navsum">' + sum + '</span>' : '') +
      '<svg class="navchev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>' +
      '<div class="navitems" id="' + gid + '">' + g[1].map(it =>
      '<a href="#/' + it[0] + '" class="' + (cur === it[0] ? 'on' : '') + '">' +
      '<span>' + it[1] + '</span>' +
      (badge[it[0]] ? '<span class="tag">' + badge[it[0]] + '</span>' : '') + '</a>').join('') + '</div></div>';
  }).join('');
}

function paint(){
  const v = current(), t = TITLES[v] || TITLES.overview;
  document.getElementById('vtitle').textContent = t[0];
  document.getElementById('vsub').textContent = t[1];
  renderNav();
  const el = document.getElementById('view');
  const fn = VIEWS[v] || VIEWS.overview;
  el.innerHTML = fn();
  if (v === 'clients') wireClients();
  if (v === 'invoices') wireInvoices();
  if (v === 'jarvis') wireJarvis();
  if (v === 'requests') wireRequests();
  if (v === 'aiusage') wireAiUsage();
}

/* ---- Jarvis voice helpers ----
   jarvisHeard: the phrase heard in THIS listening session. Chrome (Android
   especially) fires onresult repeatedly, often re-sending the same or a growing
   copy of the phrase; appending each one typed the user's words several times.
   jarvisSpeak: read Jarvis's reply aloud after a spoken request. */
function jarvisHeard(ev){
  var parts = [];
  for (var i = 0; i < ev.results.length; i++) {
    var t = ((ev.results[i][0] && ev.results[i][0].transcript) || '').trim();
    if (!t) continue;
    var last = parts.length ? parts[parts.length - 1] : '';
    if (last && (t === last || t.toLowerCase().indexOf(last.toLowerCase()) === 0)) parts[parts.length - 1] = t;
    else if (last && last.toLowerCase().indexOf(t.toLowerCase()) === 0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
var JARVIS_SPOKEN = false;
var JARVIS_LANG = 'en', JARVIS_AUDIO = null, JARVIS_LAST = '';
try { JARVIS_LANG = localStorage.getItem('jarvis_lang') || 'en'; } catch (e) {}
function jarvisLangLabel(){ return JARVIS_LANG === 'ur' ? 'اردو' : 'EN'; }
function jarvisToggleLang(btn){
  JARVIS_LANG = JARVIS_LANG === 'ur' ? 'en' : 'ur';
  try { localStorage.setItem('jarvis_lang', JARVIS_LANG); } catch (e) {}
  if (btn) btn.textContent = jarvisLangLabel();
}
function jarvisRecLang(){ return JARVIS_LANG === 'ur' ? 'ur-PK' : 'en-US'; }
function jarvisBrowserSpeak(text){
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text)) ? 'ur-PK' : 'en-US';
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* Jarvis speaks through the server (Gemini voice, real Urdu); the browser's
   own voice is only the fallback when the server voice is busy. */
function jarvisSpeak(text){
  if (!text) return;
  text = String(text).slice(0, 600);
  JARVIS_LAST = text;
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  try { if (JARVIS_AUDIO) JARVIS_AUDIO.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  var h = {'Content-Type': 'application/json'};
  if (typeof TOKEN !== 'undefined' && TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  fetch('/console/speak', {method: 'POST', credentials: 'include', headers: h,
                           body: JSON.stringify({text: text, lang: urdu ? 'ur' : 'en'})})
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JARVIS_AUDIO = a; return a.play(); })
    .catch(function(){ jarvisBrowserSpeak(text); });
}
function jarvisListenBtn(cls){
  return ' <button class="' + cls + '" type="button" onclick="jarvisSpeak(JARVIS_LAST)" title="Hear this reply">&#128266; Listen</button>';
}
let JV_CLIENT = '';
async function jvLoadPosts(){
  const el = document.getElementById('jv-posts');
  if (!el || !JV_CLIENT) return;
  const q = '?tenant=' + encodeURIComponent(JV_CLIENT);
  el.innerHTML = '<div class="empty">Loading...</div>';
  let acc, ps;
  try { [acc, ps] = await Promise.all([api('/social/accounts' + q), api('/social/posts' + q)]); }
  catch (e) { el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const head = acc.connected
    ? '<div class="sub">Posting to: ' + esc(acc.pages.map(p => p.name + (p.instagram ? ' + Instagram' : '')).join(', ')) + '</div>'
    : '<div class="sub">This client has not connected Facebook yet. They connect it from their own dashboard (Jarvis, Connect Facebook).</div>';
  const rows = (ps.posts || []).map(p => {
    const res = p.results || {};
    const errs = Object.keys(res).filter(k => res[k] && !res[k].ok).map(k => k + ': ' + (res[k].error || 'failed'));
    const waiting = p.status === 'draft' || p.status === 'failed';
    return '<div class="card" style="padding:10px 12px;margin-top:8px"><div class="k-note">' +
      esc((p.platforms || []).join(' + ')) + ' · ' + esc(p.status) + ' · ' + when(p.created_at) + '</div>' +
      (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" style="max-width:200px;border-radius:8px;margin:6px 0;display:block">' : '') +
      '<div style="white-space:pre-wrap">' + esc(p.caption) + '</div>' +
      (errs.length ? '<div class="sub warn">' + esc(errs.join(' | ')) + '</div>' : '') +
      (waiting ? '<div class="k-note" style="margin-top:6px">Waiting for the client to approve.</div>' : '') +
      '</div>';
  });

function wireJarvis(){
  const sel = document.getElementById('jv-client'), box = document.getElementById('jv-in');
  const go = document.getElementById('jv-go'), mic = document.getElementById('jv-mic');
  const lb = document.getElementById('jv-lang'); if (lb) lb.textContent = jarvisLangLabel();
  const out = document.getElementById('jv-out'), note = document.getElementById('jv-note');
  if (!sel) return;
  if (JV_CLIENT) sel.value = JV_CLIENT;
  sel.onchange = () => { JV_CLIENT = sel.value; out.innerHTML = ''; jvLoadPosts(); };
  if (sel.value) jvLoadPosts();
  const send = async () => {
    const msg = box.value.trim();
    if (!msg) return;
    if (!sel.value) { note.textContent = 'Pick a client first.'; return; }
    JV_CLIENT = sel.value;
    note.textContent = 'Thinking... (can take up to a minute)'; go.disabled = true;
    try {
      const d = await api('/console', {method:'POST', body: JSON.stringify({message: msg, tenant_id: sel.value})});
      box.value = '';
      let extra = '';
      if (d.kind === 'business') extra = (d.action === 'create' ? 'Added to ' : 'Updated in ') + (d.resource || '');
      if (d.kind === 'teach') extra = 'Their WhatsApp agent will now follow: ' + (d.lesson || '');
      if (d.kind === 'dashboard') extra = 'Dashboard changed: ' + JSON.stringify(d.changed || {});
      if (d.kind === 'post') { extra = 'Drafted. The client decides whether it goes out.'; jvLoadPosts(); }
      const name = sel.options[sel.selectedIndex].text;
      out.innerHTML = '<div class="card" style="padding:12px 14px"><div class="k-note">' + esc(name) +
        '</div><div>' + esc(d.reply || 'Done.') + '</div>' +
        (extra ? '<div class="sub" style="margin-top:6px">' + esc(extra) + '</div>' : '') + jarvisListenBtn('tiny') + '</div>';
      JARVIS_LAST = d.reply || 'Done.';
      note.textContent = '';
      if (JARVIS_SPOKEN) { jarvisSpeak(d.reply || 'Done.'); JARVIS_SPOKEN = false; }
    } catch (e) {
      note.textContent = e.message || 'Jarvis could not do that.';
      if (JARVIS_SPOKEN) { jarvisSpeak(note.textContent); JARVIS_SPOKEN = false; }
    }
    go.disabled = false;
  };
  go.onclick = send;
  box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const label = String.fromCodePoint(127908) + ' Speak';
  if (!SR) { mic.style.display = 'none'; return; }
  mic.textContent = label;
  let rec = null, on = false;
  mic.onclick = () => {
    if (on) { rec && rec.stop(); return; }
    try { rec = new SR(); } catch (e) { mic.style.display = 'none'; return; }
    rec.lang = jarvisRecLang(); rec.interimResults = false; rec.maxAlternatives = 1;
    on = true; mic.textContent = '... Listening';
    const base = box.value.trim();
    rec.onresult = ev => { const heard = jarvisHeard(ev);
      if (heard) { box.value = (base ? base + ' ' : '') + heard; JARVIS_SPOKEN = true; } };
    rec.onerror = rec.onend = () => { on = false; mic.textContent = label; };
    try { rec.start(); } catch (e) { on = false; mic.textContent = label; }
  };
}

function wireClients(){

  });
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-save');
    try { await api('/techdeva/clients/' + id + '/payment', {method:'POST',
      body: JSON.stringify({amount: el.querySelector('[data-amt="' + id + '"]').value})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-plan]').forEach(sel => sel.onchange = async () => {
    try { await api('/techdeva/clients/' + sel.getAttribute('data-plan') + '/plan', {method:'PUT', body: JSON.stringify({plan_key: sel.value})});
          D.usage = null; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-psave]').forEach(b => b.onclick = async () => {
    const k = b.getAttribute('data-psave'), v = a => el.querySelector('[' + a + '="' + k + '"]').value;
    const shown = el.querySelector('[data-pv="' + k + '"]').checked;
    try { await api('/techdeva/plans/' + k, {method:'PUT', body: JSON.stringify({price_pkr: v('data-pp'), price_usd: v('data-pu'), max_numbers: v('data-pn'), max_conversations: v('data-pc'),
                                                                               ai_credits: v('data-pa'), max_concurrent_tasks: v('data-pt'), published: shown})});
          b.textContent = 'Saved'; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-sub]').forEach(a => a.onclick = async e => {
    e.preventDefault();
    const v = prompt('Address for this client, before .techdeva.net (e.g. drirfan). Empty removes it.', a.getAttribute('data-cur'));
    if (v === null) return;
    try { await api('/techdeva/clients/' + a.getAttribute('data-sub') + '/subdomain', {method:'PUT', body: JSON.stringify({subdomain: v.trim()})}); load(); }
    catch (err) { alert(err.message); }
  });
  el.querySelectorAll('[data-trial]').forEach(b => b.onclick = async () => {
    try { await api('/techdeva/clients/' + b.getAttribute('data-trial') + '/trial', {method:'POST', body: JSON.stringify({days: 7})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-activate]').forEach(b => b.onclick = async () => {
    if (!confirm('Mark this business as a paying client? Its dashboard will never be locked by the trial.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-activate') + '/activate', {method:'POST'}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    if (!confirm('Hide this client from the book? Nothing is deleted.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-hide') + '/hide',
      {method:'POST', body: JSON.stringify({hidden:true})}); load(); }
    catch (e) { alert(e.message); }
  });
}

function wireRequests(){
  const el = document.getElementById('view');
  const go = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await fn(b); } catch (e) { alert(e.message); b.disabled = false; }
  });
  go('[data-agok]', async b => { await api('/techdeva/agent-requests/' + b.getAttribute('data-agok') + '/approve', {method:'POST'}); load(); });
  go('[data-agrb]', async b => {
    if (!confirm('Rebuild the WhatsApp agent of ' + b.getAttribute('data-name') + ' from the current template?\n\n' +
                 'The server removes the old agent and builds a new one (about 4 minutes). The business must connect its ' +
                 'number again with a new QR scan, and the agent starts with fresh chat memory. Their business data on ' +
                 'the platform is not affected.')) return;
    await api('/techdeva/agent-requests/' + b.getAttribute('data-agrb') + '/rebuild', {method:'POST'}); load();
  });
  go('[data-agno]', async b => {
    const why = prompt('What should the client read? (e.g. We will call you to set it up)', '');
    if (why === null) { b.disabled = false; return; }
    await api('/techdeva/agent-requests/' + b.getAttribute('data-agno') + '/reject', {method:'POST', body: JSON.stringify({reason: why})}); load();
  });
  go('[data-clok]', async b => {
    if (!confirm('You found this money in your account?')) { b.disabled = false; return; }
    await api('/techdeva/payment-claims/' + b.getAttribute('data-clok') + '/confirm', {method:'POST'}); load();
  });
  go('[data-clno]', async b => {
    const why = prompt('What should the client read?', 'We could not find this payment. Please send a screenshot on WhatsApp.');
    if (why === null) { b.disabled = false; return; }
    await api('/techdeva/payment-claims/' + b.getAttribute('data-clno') + '/reject', {method:'POST', body: JSON.stringify({reason: why})}); load();
  });
  go('[data-rslink]', async b => {
    const d = await api('/techdeva/password-resets/' + b.getAttribute('data-rslink') + '/link', {method:'POST'});
    const out = document.getElementById('rs-out');
    out.innerHTML = 'Link for ' + esc(d.email) + ' (one hour): <input readonly style="width:100%;margin-top:4px" value="' + esc(d.link) + '" onclick="this.select()">';
    b.disabled = false;
  });
  const save = document.getElementById('pay-how-save');
  if (save) save.onclick = async () => {
    const m = document.getElementById('pay-how-msg');
    try { await api('/techdeva/settings/payment_instructions', {method:'PUT', body: JSON.stringify({value: document.getElementById('pay-how').value})}); m.textContent = 'Saved.'; }
    catch (e) { m.textContent = e.message; }
  };
}

  if (W[key] !== undefined) return W[key];

  api(path).then(d => { W[key] = d; }).catch(e => { W[key] = {error: e.message}; })
    .then(() => { if (['team','catalog','clientsvc','work'].indexOf(current()) !== -1) paint(); });
  return null;
}

VIEWS.work = function(){

  if (!t || !cs || !team) return '<div class="empty">Loading...</div>';

    '<input id="tk-title" placeholder="e.g. Set up WhatsApp agent" ' + wkInput + ' style="flex:2;min-width:220px">' +
    '<select id="tk-cs" ' + wkInput + '><option value="">Client service (optional)...</option>' +
      cs.items.filter(i => i.status !== 'ended').map(i => '<option value="' + esc(i.id) + '"' + (W.newTaskCs === i.id ? ' selected' : '') + '>' + esc(i.client_name + ' — ' + i.service_name) + '</option>').join('') + '</select>' +
    '<select id="tk-who" ' + wkInput + '><option value="">Give to...</option>' + team.team.filter(p => p.has_pin || !/@pin\.invalid$/.test(p.email || '')).map(p => '<option value="' + esc(p.id) + '">' + esc(p.name || p.email) + '</option>').join('') + '</select>' +
    '<input id="tk-due" type="date" ' + wkInput + '><button class="primary" id="tk-add">Add task</button></div></div>';
  const col = (st, label) => {
    let list = t.tasks.filter(x => x.status === st);
    if (st === 'done') list = list.slice(0, 20);
    return '<div class="card" style="min-width:0"><div class="k-label">' + label + ' (' + t.tasks.filter(x => x.status === st).length + ')</div>' +
      (list.length ? list.map(x => {
        const late = x.due_on && x.status !== 'done' && String(x.due_on).slice(0, 10) < today;
        return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px">' +
          '<div style="font-weight:600">' + esc(x.title) + '</div>' +
          '<div class="k-note">' + esc(x.client_name || 'TechDeva') + ' · ' + esc(x.assignee_name || 'nobody yet') +
          (x.due_on ? ' · <span class="' + (late ? 'bad' : '') + '">due ' + esc(String(x.due_on).slice(0, 10)) + '</span>' : '') + '</div>' +
          '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
          (st !== 'todo' ? '<button data-tkmv="' + esc(x.id) + '" data-to="' + (st === 'done' ? 'doing' : 'todo') + '">←</button>' : '') +
          (st !== 'done' ? '<button class="primary" data-tkmv="' + esc(x.id) + '" data-to="' + (st === 'todo' ? 'doing' : 'done') + '">' + (st === 'todo' ? 'Start' : 'Done') + '</button>' : '') +
          '<button data-tkdel="' + esc(x.id) + '">Delete</button></div></div>';
      }).join('') : '<div class="k-note" style="margin-top:10px">Nothing here.</div>') + '</div>';
  };
  out += '<div class="grid" style="margin-top:0">' + col('todo', 'To do') + col('doing', 'Doing') + col('done', 'Done') + '</div>' +
    '<div class="k-note" style="margin-top:10px">Your team sees these under <b>Client work</b> in TechDeva\'s dashboard and can move the ones given to them.</div></section>';
  wkAct('#tk-add', async () => {
    if (!wkVal('tk-title')) throw new Error('Write the task.');
    await api('/techdeva/work/tasks', {method:'POST', body: JSON.stringify({title: wkVal('tk-title'), client_service_id: wkVal('tk-cs'), assignee_user_id: wkVal('tk-who'), due_on: wkVal('tk-due')})});
    W.newTaskCs = null; wkFresh();
  });

  wkAct('[data-tkdel]', async b => {
    if (!confirm('Delete this task?')) { b.disabled = false; return; }
    await api('/techdeva/work/tasks/' + b.getAttribute('data-tkdel'), {method:'DELETE'}); wkFresh();
  });
  return out;
};

  const amounts = confirm('Show rupee amounts?\n\nOK = show sales in PKR (only with their permission)\nCancel = show growth in % only');
  const full = c.months.filter(m => !m.partial), last = c.last_full, best = full.reduce((a, m) => m.revenue > a.revenue ? m : a, full[0]);
  const avg = full.reduce((a, m) => a + m.revenue, 0) / full.length;
  const pct = v => c.baseline > 0 ? Math.round(100 * (v - c.baseline) / c.baseline) : null;
  const fig = v => amounts ? money(v) : (pct(v) == null ? '' : (pct(v) >= 0 ? '+' : '') + pct(v) + '% vs before');
  const top = Math.max(c.baseline, ...full.map(m => m.revenue), 1);
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups for this page to open the one-pager.'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Growth with TechDeva</title><style>' +
    'body{font-family:Arial,sans-serif;color:#111;max-width:760px;margin:30px auto;padding:0 20px}h1{color:#6d28d9;margin:0 0 4px}.sub{color:#555;margin:0 0 24px}' +
    '.k{display:flex;gap:14px;margin:18px 0}.k div{flex:1;border:1px solid #ddd;border-radius:10px;padding:14px}.k b{display:block;font-size:26px;color:#6d28d9}' +
    '.bars{display:flex;gap:8px;align-items:flex-end;height:200px;border-bottom:1px solid #ccc;position:relative;margin-top:24px}.bars i{flex:1;background:#8B5CF6;border-radius:6px 6px 0 0}' +
    '.base{position:absolute;left:0;right:0;border-top:2px dashed #999}.lab{display:flex;gap:8px}.lab span{flex:1;text-align:center;font-size:12px;color:#555}' +
    '.note{color:#666;font-size:12px;margin-top:24px}@media print{button{display:none}}</style></head><body>' +
    '<button onclick="print()" style="float:right">Print / save as PDF</button>' +
    '<h1>' + esc(named ? c.name : 'A client of TechDeva') + '</h1><p class="sub">Sales before and since TechDeva started (' + esc(grwMonth(c.started_on)) + ')</p>' +
    '<div class="k"><div>Before TechDeva<b>' + (amounts ? money(c.baseline) : '100%') + '</b>per month</div>' +
    '<div>Last month (' + esc(grwMonth(last.month)) + ')<b>' + esc(fig(last.revenue)) + '</b>' + (amounts && pct(last.revenue) != null ? (pct(last.revenue) >= 0 ? '+' : '') + pct(last.revenue) + '%' : '') + '</div>' +
    '<div>Average since start<b>' + esc(fig(avg)) + '</b>over ' + full.length + ' month' + (full.length === 1 ? '' : 's') + '</div>' +
    '<div>Best month<b>' + esc(fig(best.revenue)) + '</b>' + esc(grwMonth(best.month)) + '</div></div>' +
    '<div class="bars"><div class="base" style="bottom:' + (100 * c.baseline / top) + '%"></div>' + full.map(m => '<i style="height:' + Math.max(2, 100 * m.revenue / top) + '%"></i>').join('') + '</div>' +
    '<div class="lab">' + full.map(m => '<span>' + esc(grwMonth(m.month)) + '</span>').join('') + '</div>' +
    '<p class="note">Dashed line: sales per month before TechDeva (' + esc(c.baseline_source || '') + '). Bars: recorded sales each full month since. ' +
    'Leads last month: ' + last.leads + ' · completed visits: ' + last.visits + '. Source: the business\'s own payment records in TechDeva.</p></body></html>');
  w.document.close();
}
/* ======================================================== Part 27: Change my password */
function pwOpen(){
  document.getElementById('pw-box')?.remove();
  const o = document.createElement('div'); o.id = 'pw-box';
  o.style.cssText = 'position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML = '<form id="pw_f" class="card" style="width:min(380px,100%);display:grid;gap:10px">' +
    '<b>My account</b><div id="acct_box" class="k-note">Loading…</div>' +
    '<b style="margin-top:6px">Change my password</b>' +
    '<label class="k-note">Current password<br><input type="password" id="pw_cur" autocomplete="current-password" required style="width:100%"></label>' +
    '<label class="k-note">New password (at least 10 characters)<br><input type="password" id="pw_new" autocomplete="new-password" minlength="10" required style="width:100%"></label>' +
    '<label class="k-note">New password again<br><input type="password" id="pw_new2" autocomplete="new-password" minlength="10" required style="width:100%"></label>' +
    '<div id="pw_msg" class="k-note" style="min-height:18px"></div>' +
    '<div style="display:flex;gap:8px"><button class="primary" type="submit" id="pw_go">Change password</button><button type="button" id="pw_x">Cancel</button></div>' +
    '<div style="border-top:1px solid #333;padding-top:10px"><button type="button" id="pw_all">Sign out all other devices</button>' +
    '<div class="k-note" style="margin-top:4px">This device stays signed in.</div></div></form>';
  document.body.appendChild(o);
  const g = id => document.getElementById(id), msg = (t, ok) => { g('pw_msg').textContent = t; g('pw_msg').className = ok ? 'k-note good' : 'k-note bad'; };
  g('pw_x').onclick = () => o.remove();
  g('pw_all').onclick = async () => {
    if (!confirm('Sign out every other device where you are signed in?')) return;
    g('pw_all').disabled = true;
    try { const r = await api('/auth/sign-out-everywhere', {method: 'POST'}); if (TOKEN && r.token) TOKEN = r.token; msg('Done: every other device is signed out.', true); }
    catch (ex) { msg(ex.message); }
    g('pw_all').disabled = false;
  };
  api('/auth/account').then(a => {
    g('acct_box').innerHTML = '<label class="k-note">Your name<br><input id="ac_name" maxlength="80" value="' + esc(a.name) + '" style="width:100%"></label>' +
      '<div class="k-note">Signs in as ' + esc(a.email) + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button type="button" id="ac_save">Save name</button><span id="ac_msg" class="k-note"></span></div>';
    g('ac_save').onclick = async () => {
      try {
        const r = await api('/auth/account', {method: 'PUT', body: JSON.stringify({name: g('ac_name').value})});
        g('ac_msg').textContent = r.changed.length ? 'Saved.' : 'Nothing changed.'; g('ac_msg').className = 'k-note good';
        const w = document.getElementById('who'); if (w && r.name) w.textContent = r.name;
      } catch (ex) { g('ac_msg').textContent = ex.message; g('ac_msg').className = 'k-note bad'; }
    };
  }).catch(ex => { g('acct_box').textContent = ex.message; });
  g('pw_f').onsubmit = async e => {
    e.preventDefault();
    if (g('pw_new').value.length < 10) return msg('The new password must be at least 10 characters.');
    if (g('pw_new').value !== g('pw_new2').value) return msg('The two new passwords are not the same.');
    g('pw_go').disabled = true;
    try {
      const r = await api('/auth/change-password', {method: 'POST', body: JSON.stringify({current_password: g('pw_cur').value, new_password: g('pw_new').value})});
      if (TOKEN && r.token) TOKEN = r.token;      // the old login was just signed out with the others
      msg('Password changed. Any other device signed in as you has been signed out.', true); setTimeout(() => o.remove(), 2200);
    } catch (ex) { g('pw_go').disabled = false; msg(ex.message); }
  };
}
document.getElementById('chgpw').onclick = e => { e.preventDefault(); pwOpen(); };
</script></body></html>
