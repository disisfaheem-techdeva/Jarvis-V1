<!-- @td-theme:start -->
<script>
/* Theme + brand colour, for pages served by FastAPI (web/*.html). Kept free of
   any product name: it is inlined into white-label partner pages too.
   sync.py inlines this into each page's <head>, so the saved theme applies
   before the first paint. Next.js has its own copy of the theme part
   (the Next.js portal's components/ui/theme.ts); both use the "td-theme" key.

   TD.toggleHTML()  markup for the light/dark switch, for script-rendered
                    headers. In static markup, <span data-td-theme-slot></span>
                    is replaced with it. Any [data-td-theme-toggle] works,
                    even if rendered later.
   TD.brand(hex)    a business's own accent colour. Works out readable text
                    on it and a readable text shade of it for the current
                    theme, so a light brand colour never gives white-on-white
                    buttons and a dark one never vanishes on the dark canvas. */
(function () {
  var KEY = "td-theme", doc = document.documentElement, brandHex = null;

  function theme() { return doc.dataset.theme === "light" ? "light" : "dark"; }

  function rgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(c) {
    var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(c, to, t) { return c.map(function (x, i) { return Math.round(x + (to[i] - x) * t); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function applyBrand() {
    var props = ["--accent", "--accent-hover", "--accent-ink", "--accent-tint", "--accent-line", "--fg-on-accent", "--ring"];
    if (!brandHex) { props.forEach(function (p) { doc.style.removeProperty(p); }); return; }
    var c = rgb(brandHex), white = [255, 255, 255], black = [0, 0, 0];
    var light = theme() === "light";
    var bg = light ? white : [10, 10, 15];
    // text on the accent fill: whichever of white or near-black reads better
    var on = contrast(c, white) >= contrast(c, [20, 16, 5]) ? white : [20, 16, 5];
    // the accent as text on the page: step it toward white (dark theme) or
    // black (light theme) until it reaches 4.5:1
    var ink = c, t = 0;
    while (contrast(ink, bg) < 4.5 && t < 1) { t += 0.05; ink = mix(c, light ? black : white, t); }
    var s = doc.style;
    s.setProperty("--accent", hex(c));
    s.setProperty("--accent-hover", hex(mix(c, on === white ? black : white, 0.12)));
    s.setProperty("--fg-on-accent", hex(on));
    s.setProperty("--accent-ink", hex(ink));
    s.setProperty("--ring", hex(ink));
    s.setProperty("--accent-tint", "rgb(" + c.join(" ") + " / " + (light ? 0.1 : 0.16) + ")");
    s.setProperty("--accent-line", "rgb(" + c.join(" ") + " / 0.4)");
  }

  function sync() {
    var light = theme() === "light";
    var btns = document.querySelectorAll("[data-td-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      btns[i].setAttribute("title", light ? "Dark theme" : "Light theme");
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = light ? "light" : "dark";
  }

  function set(next) {
    if (next === "light") doc.dataset.theme = "light"; else delete doc.dataset.theme;
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage blocked: lasts this page view */ }
    applyBrand();
    sync();
  }

  try { if (localStorage.getItem(KEY) === "light") doc.dataset.theme = "light"; } catch (e) { /* default dark */ }

  var SUN = '<svg class="td-i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg class="td-i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  window.TD = {
    theme: theme,
    setTheme: set,
    brand: function (h) { brandHex = h && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(h) ? h.slice(0, h.length === 9 ? 7 : h.length) : null; applyBrand(); },
    toggleHTML: function (cls) {
      var light = theme() === "light";
      return '<button type="button" class="td-theme-btn' + (cls ? " " + cls : "") + '" data-td-theme-toggle aria-label="' +
        (light ? "Switch to dark theme" : "Switch to light theme") + '" title="' + (light ? "Dark theme" : "Light theme") + '">' + SUN + MOON + "</button>";
    }
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-td-theme-toggle]");
    if (b) set(theme() === "light" ? "dark" : "light");
  });
  document.addEventListener("DOMContentLoaded", function () {
    // static pages: <span data-td-theme-slot="extra classes"></span> becomes the switch
    var slots = document.querySelectorAll("[data-td-theme-slot]");
    for (var i = 0; i < slots.length; i++) slots[i].outerHTML = window.TD.toggleHTML(slots[i].getAttribute("data-td-theme-slot"));
    sync();
  });
})();
</script>

<body class="td td-grain page-techdeva min-h-screen bg-bg text-fg">
<!-- Founder identity: a violet line across the top, so this screen is never mistaken for a business dashboard. -->
<div aria-hidden="true" class="fixed inset-x-0 top-0 z-50 h-[3px] bg-[linear-gradient(90deg,var(--p-violet-500),var(--p-violet-800),var(--p-violet-500))]"></div>

<div id="login" class="relative flex min-h-screen items-start justify-center px-4 pt-[12vh]">
  <div aria-hidden="true" class="td-ambient pointer-events-none absolute inset-0"></div>
  <div class="td-glass td-rim relative w-full max-w-sm rounded-[var(--p-radius-xl)] p-6 sm:p-8">
    <span class="role-badge">Founder console</span>
    <h1 class="mt-3 font-display text-2xl font-semibold tracking-tight">TechDeva</h1>
    <div class="sub">For the TechDeva founder only. Businesses sign in at <a href="/dashboard">/dashboard</a>.</div>
    <form id="lf" class="mt-6 flex flex-col gap-3">
      <label class="td-sr-only" for="email">Email</label>
      <input id="email" class="td-input" type="email" placeholder="Email" autocomplete="username">
      <label class="td-sr-only" for="pw">Password</label>
      <input id="pw" class="td-input" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="lerr" role="alert"></div>
      <button class="primary h-11! w-full" id="lgo">Sign in</button>
    </form>
  </div>
</div>

<div class="shell min-h-screen grid-cols-[256px_minmax(0,1fr)] max-[900px]:grid-cols-1" id="app" style="display:none">
  <aside id="aside" class="flex flex-col border-r border-line bg-bg-elevated px-3 py-4 min-[901px]:sticky min-[901px]:top-0 min-[901px]:h-screen">
    <div class="flex items-center gap-2 px-3 pb-2">
      <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-accent-ink shadow-[0_0_8px_var(--accent-glow)]"></span>
      <span class="font-display text-[17px] font-semibold tracking-tight">TechDeva</span>
    </div>
    <span class="role-badge mx-3 self-start">Founder console</span>
    <div class="sub px-3 pb-2">Every client, in one place</div>
    <nav id="nav" aria-label="Founder console" class="flex-1 overflow-auto"></nav>
    <div class="sidefoot border-t border-line px-3 pt-3 text-xs text-fg-muted">
      <div id="who"></div>
      <div class="mt-2"><a href="#" id="chgpw">My account</a> · <a href="#" id="out">Sign out</a></div>
    </div>
  </aside>
  <main class="min-w-0 px-4 pt-6 pb-20 sm:px-8">
    <div class="relative mb-2 flex flex-wrap items-end justify-between gap-4 overflow-hidden rounded-[var(--p-radius-xl)] border border-line bg-bg-elevated px-6 py-6">
      <div aria-hidden="true" class="td-ambient pointer-events-none absolute inset-0 opacity-70"></div>
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-[0.07] [background-image:linear-gradient(var(--fg)_1px,transparent_1px),linear-gradient(90deg,var(--fg)_1px,transparent_1px)] [background-size:32px_32px]"></div>
      <div class="relative flex items-start gap-3"><button id="menubtn" aria-label="Open menu">☰</button>
        <div><h1 id="vtitle" class="font-display text-3xl font-semibold tracking-tight">Overview</h1><div class="sub" id="vsub"></div></div></div>
      <div class="relative flex flex-wrap items-center gap-2"><span class="scope">Founder view · all businesses</span><button id="refresh">Refresh</button><span data-td-theme-slot></span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
let TOKEN = null, D = {};
const NAV = [
  ['RUNNING THE BUSINESS', [
    ['jarvis','Jarvis'], ['hermes','Hermes'], ['overview','Overview'], ['requests','Requests'], ['clients','Clients'], ['connections','Connections'], ['pipeline','Pipeline & trials']]],
  ['WHAT THE AI DELIVERS', [
    ['bookings','Bookings'], ['workforce','AI workforce'], ['approvals','Waiting on you']]],
  ['MONEY', [
    ['revenue','My revenue'], ['clientmoney','Client business'], ['invoices','Invoices out']]],
  ['PARTNER NETWORK', [
    ['partners','Partners'], ['partnermoney','Partner money']]],
  ['PLATFORM', [
    ['health','Health'], ['incidents','Incidents'], ['aiusage','AI usage & API log'], ['apikeys','API Manager']]]
];
const TITLES = {jarvis:['Jarvis','Pick a client, then say or type what to change for them.'],
  hermes:['Hermes','Every business\'s WhatsApp agent: which are connected and answering, and switch any of them off or on.'],
  overview:['Overview','The whole business on one screen.'],
  clients:['Clients','Everyone onboard, what they pay, and what they are getting.'],
  connections:['Connections','Which clients have connected WhatsApp, Facebook, Instagram and Google. Clients connect these themselves in their dashboard.'],
  pipeline:['Pipeline & trials','Who signed up and who is still on a trial.'],
  requests:['Requests','Things clients asked for that need you: agents, payments, password resets.'],
  bookings:['Bookings','Appointments the AI has put in your clients diaries.'],
  workforce:['AI workforce','What each client’s agents are doing right now.'],
  approvals:['Waiting on you','Work the platform stopped on and cannot finish alone.'],
  revenue:['My revenue','What clients have paid TechDeva.'],
  clientmoney:['Client business','Money moving through your clients businesses.'],
  invoices:['Invoices out','Invoices TechDeva has issued to clients, and their status.'],
  partners:['Partners','Agencies that sell TechDeva under their own brand: approve them, set their split, and watch their set-up.'],
  partnermoney:['Partner money','Every payment of a partner\'s client, split at that partner\'s terms; refunds, the review queue and payouts.'],
  health:['Health','Queues, workers and the AI chain.'],
  incidents:['Incidents','Anything the monitor has opened.'],
  apikeys:['API Manager','AI keys for any provider, which WhatsApp agent runs on which key and model, and each agent\'s calls and limit hits. Keys are never shown, only their last 4 characters.'],
  aiusage:['AI usage & API log','AI credits each client used this month, and every AI call (who, which agent, model, time, result; never the text).']};

async function api(path, opts){
  opts = opts || {};
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, Object.assign({credentials:'include'}, opts, {headers:h}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return d;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => 'PKR ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const when = s => { if (!s) return '-';
  const d = new Date(s), days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago'; return String(s).slice(0,10); };
function kpi(label, value, note, cls){
  return '<div class="card"><div class="k-label">' + esc(label) + '</div><div class="k-value ' +
    (cls||'') + '">' + value + '</div><div class="k-note">' + esc(note||'') + '</div></div>';
}
function tbl(head, rows){
  if (!rows.length) return '<div class="empty">Nothing recorded yet.</div>';
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

// ------------------------------------------------------------------ login
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('lgo'), err = document.getElementById('lerr');
  b.disabled = true; b.textContent = 'Signing in...'; err.textContent = '';
  try {
    const d = await api('/auth/login', {method:'POST', body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value })});
    if (d.role !== 'techdeva_admin') err.textContent = 'That account is an ' + d.role + '.';
    else { TOKEN = d.token; show(); }
  } catch (ex) { err.textContent = ex.message; }
  b.disabled = false; b.textContent = 'Sign in';
});
document.getElementById('out').onclick = async e => {
  e.preventDefault();
  try { await api('/auth/logout', {method:'POST'}); } catch (x) {}
  TOKEN = null; location.href = '/techdeva';
};
document.getElementById('refresh').onclick = () => load();
document.getElementById('menubtn').onclick = () => document.getElementById('aside').classList.toggle('open');
document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) document.getElementById('aside').classList.remove('open'); });
const NAV_OPEN = (() => { try { return JSON.parse(localStorage.getItem('td-founder-nav') || '{}') || {}; } catch (e) { return {}; } })();
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-navgrp]');
  if (!b) return;
  const open = b.getAttribute('aria-expanded') !== 'true';
  NAV_OPEN[b.getAttribute('data-navgrp')] = open;
  try { localStorage.setItem('td-founder-nav', JSON.stringify(NAV_OPEN)); } catch (err) { /* lasts this visit */ }
  b.setAttribute('aria-expanded', String(open));
  b.parentNode.classList.toggle('collapsed', !open);
});
window.addEventListener('hashchange', paint);

function show(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  load();
}
function current(){ return (location.hash.replace('#/','') || 'overview'); }

function wireAiUsage(){
  document.querySelectorAll('[data-aisave]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-aisave'), v = document.querySelector('[data-aic="' + id + '"]').value.trim();
    try { await api('/techdeva/clients/' + id + '/ai-credits', {method:'PUT', body: JSON.stringify({ai_credits: v})}); D.aiu = undefined; paint(); }
    catch (e) { alert(e.message); }
  });
}

async function load(){
  const [book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans, conns] = await Promise.all([
    api('/techdeva/book'),
    api('/techdeva/health').catch(() => null),
    api('/techdeva/operations').catch(() => null),
    api('/ai/health').catch(() => null),
    api('/incidents').catch(() => null),
    api('/techdeva/overview').catch(() => null),
    api('/techdeva/invoices').catch(() => null),
    api('/techdeva/agent-requests').catch(() => null),
    api('/techdeva/payment-claims').catch(() => null),
    api('/techdeva/password-resets').catch(() => null),
    api('/plans').catch(() => null),
    api('/techdeva/connections').catch(() => null)
  ]);
  D = {book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans, conns, usage: D.usage, ret: D.ret};
  // conversation counts ask every agent, so they arrive after the page
  api('/techdeva/usage').then(u => { D.usage = u; if (current() === 'clients' || current() === 'overview') paint(); }).catch(() => {});
  renderNav(); paint();
}

function renderNav(){
  const b = D.book || {}, cur = current();
  const badge = {clients: b.clients ? b.clients.length : 0,
                 approvals: b.awaiting_approval || 0,
                 incidents: (D.inc && D.inc.open) || 0,
                 requests: openRequests()};
  /* Each section folds open and shut; the one holding the open page is always
     open, the rest remember the last choice. A closed section still shows how
     many things inside need you. */
  document.getElementById('nav').innerHTML = NAV.map(g => {
    const gid = 'nvg-' + g[0].toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const open = g[1].some(it => it[0] === cur) || NAV_OPEN[gid] !== false;
    const sum = g[1].reduce((n, it) => n + (Number(badge[it[0]]) || 0), 0);
    return '<div class="navsec' + (open ? '' : ' collapsed') + '">' +
      '<button type="button" class="navgrp" data-navgrp="' + gid + '" aria-expanded="' + open + '" aria-controls="' + gid + '">' +
      '<span>' + g[0] + '</span><span class="navend">' + (sum ? '<span class="tag navsum">' + sum + '</span>' : '') +
      '<svg class="navchev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>' +
      '<div class="navitems" id="' + gid + '">' + g[1].map(it =>
      '<a href="#/' + it[0] + '" class="' + (cur === it[0] ? 'on' : '') + '">' +
      '<span>' + it[1] + '</span>' +
      (badge[it[0]] ? '<span class="tag">' + badge[it[0]] + '</span>' : '') + '</a>').join('') + '</div></div>';
  }).join('');
}

/* API Manager actions. Every change reloads the page's data from the server. */
function wireApiKeys(){
  const view = document.getElementById('view');
  const msg = document.getElementById('apk-msg');
  const reload = () => { D.apk = undefined; if (current() === 'apikeys') paint(); };
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--danger)' : ''; } };
  const provs = (D.apk && D.apk.providers) || [];
  const prov = document.getElementById('apk-prov');
  if (prov) prov.onchange = () => {
    const p = provs.find(x => x.key === prov.value) || {};
    document.getElementById('apk-base-wrap').style.display = prov.value === 'custom' ? '' : 'none';
    document.getElementById('apk-model').placeholder = p.model || (prov.value === 'gemini' ? '' : 'model name');
  };
  const detail = r => { const t = r.detail || {}; return [t.http ? 'HTTP ' + t.http : '', t.ms != null ? t.ms + ' ms' : '',
    t.models != null ? t.models + ' models' : '', t.reply != null ? 'replied "' + t.reply + '"' : ''].filter(Boolean).join(' · '); };
  const form = document.getElementById('apk-add');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('apk-go'), keyEl = document.getElementById('apk-key');
    go.disabled = true; go.textContent = 'Saving and testing...';
    try {
      const r = await api('/techdeva/api-keys', {method: 'POST', body: JSON.stringify({
        provider: prov.value, label: document.getElementById('apk-label').value,
        owner_note: document.getElementById('apk-note').value, base_url: document.getElementById('apk-base').value,
        model: document.getElementById('apk-model').value, key: keyEl.value})});
      keyEl.value = '';
      say(r.status === 'ok' ? 'Saved key …' + r.last4 + ' and it works (' + detail(r) + ').' : 'Saved key …' + r.last4 + ', but the test said: ' + (r.error || r.status) + (detail(r) ? ' (' + detail(r) + ')' : ''), r.status !== 'ok');
      setTimeout(reload, 2500);
    } catch (ex) { say(ex.message, true); go.disabled = false; go.textContent = 'Save and test'; }
  });
  const run = (attr, path, busy) => view.querySelectorAll('[data-' + attr + ']').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = busy;
    try { await api('/techdeva/api-keys/' + b.dataset[attr] + path, {method: 'POST'}); } catch (ex) { alert(ex.message); }
    reload();
  });
  run('apktest', '/test', 'Testing...'); run('apktry', '/try', 'Asking...');
  view.querySelectorAll('[data-apkmodel]').forEach(i => i.addEventListener('change', async () => {
    try { const r = await api('/techdeva/api-keys/' + i.dataset.apkmodel, {method: 'PUT', body: JSON.stringify({model: i.value.trim()})});
          if (r.reapply && r.reapply.length) alert('Saved. ' + r.reapply.join(', ') + ' will switch to this model within a minute.'); }
    catch (ex) { alert(ex.message); }
    reload();
  }));
  const toggle = (attr, off) => view.querySelectorAll('[data-' + attr + ']').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api('/techdeva/api-keys/' + b.dataset[attr], {method: 'PUT', body: JSON.stringify({disabled: off})}); } catch (ex) { alert(ex.message); }
    reload();
  });
  toggle('apkoff', true); toggle('apkon', false);
  view.querySelectorAll('[data-apkdel]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete the key "' + b.dataset.apkname + '"? It cannot be recovered.')) return;
    b.disabled = true;
    try { await api('/techdeva/api-keys/' + b.dataset.apkdel, {method: 'DELETE'}); } catch (ex) { alert(ex.message); }
    reload();
  });
  view.querySelectorAll('[data-apkset]').forEach(b => b.onclick = async () => {
    const agent = b.dataset.apkset, sel = view.querySelector('[data-apksel="' + agent + '"]');
    b.disabled = true; b.textContent = 'Saving...';
    const msel = view.querySelector('[data-apkmsel="' + agent + '"]');
    try { await api('/techdeva/api-keys/assign/' + encodeURIComponent(agent), {method: 'PUT', body: JSON.stringify({key_id: sel.value || null, model: (sel.value && msel && msel.value) || null})}); }
    catch (ex) { alert(ex.message); }
    reload();
  });
  /* Each agent's model list follows the key chosen beside it. */
  const keyList = (D.apk && D.apk.keys) || [];
  view.querySelectorAll('[data-apksel]').forEach(sel => {
    const agent = sel.dataset.apksel, msel = view.querySelector('[data-apkmsel="' + agent + '"]');
    const ag = ((D.apk && D.apk.agents) || []).find(a => a.agent_key === agent) || {};
    const fill = () => {
      if (!msel) return;

/* ---- Jarvis voice helpers ----
   jarvisHeard: the phrase heard in THIS listening session. Chrome (Android
   especially) fires onresult repeatedly, often re-sending the same or a growing
   copy of the phrase; appending each one typed the user's words several times.
   jarvisSpeak: read Jarvis's reply aloud after a spoken request. */
function jarvisHeard(ev){
  var parts = [];
  for (var i = 0; i < ev.results.length; i++) {
    var t = ((ev.results[i][0] && ev.results[i][0].transcript) || '').trim();
    if (!t) continue;
    var last = parts.length ? parts[parts.length - 1] : '';
    if (last && (t === last || t.toLowerCase().indexOf(last.toLowerCase()) === 0)) parts[parts.length - 1] = t;
    else if (last && last.toLowerCase().indexOf(t.toLowerCase()) === 0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
var JARVIS_SPOKEN = false;
var JARVIS_LANG = 'en', JARVIS_AUDIO = null, JARVIS_LAST = '';
try { JARVIS_LANG = localStorage.getItem('jarvis_lang') || 'en'; } catch (e) {}
function jarvisLangLabel(){ return JARVIS_LANG === 'ur' ? 'اردو' : 'EN'; }
function jarvisToggleLang(btn){
  JARVIS_LANG = JARVIS_LANG === 'ur' ? 'en' : 'ur';
  try { localStorage.setItem('jarvis_lang', JARVIS_LANG); } catch (e) {}
  if (btn) btn.textContent = jarvisLangLabel();
}
function jarvisRecLang(){ return JARVIS_LANG === 'ur' ? 'ur-PK' : 'en-US'; }
function jarvisBrowserSpeak(text){
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text)) ? 'ur-PK' : 'en-US';
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* Jarvis speaks through the server (Gemini voice, real Urdu); the browser's
   own voice is only the fallback when the server voice is busy. */
function jarvisSpeak(text){
  if (!text) return;
  text = String(text).slice(0, 600);
  JARVIS_LAST = text;
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  try { if (JARVIS_AUDIO) JARVIS_AUDIO.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  var h = {'Content-Type': 'application/json'};
  if (typeof TOKEN !== 'undefined' && TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  fetch('/console/speak', {method: 'POST', credentials: 'include', headers: h,
                           body: JSON.stringify({text: text, lang: urdu ? 'ur' : 'en'})})
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JARVIS_AUDIO = a; return a.play(); })
    .catch(function(){ jarvisBrowserSpeak(text); });
}
function jarvisListenBtn(cls){
  return ' <button class="' + cls + '" type="button" onclick="jarvisSpeak(JARVIS_LAST)" title="Hear this reply">&#128266; Listen</button>';
}

function wireJarvis(){
  const sel = document.getElementById('jv-client'), box = document.getElementById('jv-in');
  const go = document.getElementById('jv-go'), mic = document.getElementById('jv-mic');
  const lb = document.getElementById('jv-lang'); if (lb) lb.textContent = jarvisLangLabel();
  const out = document.getElementById('jv-out'), note = document.getElementById('jv-note');
  if (!sel) return;
  if (JV_CLIENT) sel.value = JV_CLIENT;
  sel.onchange = () => { JV_CLIENT = sel.value; out.innerHTML = ''; jvLoadPosts(); };
  if (sel.value) jvLoadPosts();
  const send = async () => {
    const msg = box.value.trim();
    if (!msg) return;
    if (!sel.value) { note.textContent = 'Pick a client first.'; return; }
    JV_CLIENT = sel.value;
    note.textContent = 'Thinking... (can take up to a minute)'; go.disabled = true;
    try {
      const d = await api('/console', {method:'POST', body: JSON.stringify({message: msg, tenant_id: sel.value})});
      box.value = '';
      let extra = '';
      if (d.kind === 'business') extra = (d.action === 'create' ? 'Added to ' : 'Updated in ') + (d.resource || '');
      if (d.kind === 'teach') extra = 'Their WhatsApp agent will now follow: ' + (d.lesson || '');
      if (d.kind === 'dashboard') extra = 'Dashboard changed: ' + JSON.stringify(d.changed || {});
      if (d.kind === 'post') { extra = 'Drafted. The client decides whether it goes out.'; jvLoadPosts(); }
      const name = sel.options[sel.selectedIndex].text;
      out.innerHTML = '<div class="card" style="padding:12px 14px"><div class="k-note">' + esc(name) +
        '</div><div>' + esc(d.reply || 'Done.') + '</div>' +
        (extra ? '<div class="sub" style="margin-top:6px">' + esc(extra) + '</div>' : '') + jarvisListenBtn('tiny') + '</div>';
      JARVIS_LAST = d.reply || 'Done.';
      note.textContent = '';
      if (JARVIS_SPOKEN) { jarvisSpeak(d.reply || 'Done.'); JARVIS_SPOKEN = false; }
    } catch (e) {
      note.textContent = e.message || 'Jarvis could not do that.';
      if (JARVIS_SPOKEN) { jarvisSpeak(note.textContent); JARVIS_SPOKEN = false; }
    }
    go.disabled = false;
  };
  go.onclick = send;
  box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const label = String.fromCodePoint(127908) + ' Speak';
  if (!SR) { mic.style.display = 'none'; return; }
  mic.textContent = label;
  let rec = null, on = false;
  mic.onclick = () => {
    if (on) { rec && rec.stop(); return; }
    try { rec = new SR(); } catch (e) { mic.style.display = 'none'; return; }
    rec.lang = jarvisRecLang(); rec.interimResults = false; rec.maxAlternatives = 1;
    on = true; mic.textContent = '... Listening';
    const base = box.value.trim();
    rec.onresult = ev => { const heard = jarvisHeard(ev);
      if (heard) { box.value = (base ? base + ' ' : '') + heard; JARVIS_SPOKEN = true; } };
    rec.onerror = rec.onend = () => { on = false; mic.textContent = label; };
    try { rec.start(); } catch (e) { on = false; mic.textContent = label; }
  };
}

function wireClients(){
  const el = document.getElementById('view');
  el.querySelectorAll('[data-fee]').forEach(i => i.addEventListener('change', async () => {
    try { await api('/techdeva/clients/' + i.getAttribute('data-fee') + '/account',
      {method:'PUT', body: JSON.stringify({monthly_fee: i.value || 0})}); load(); }
    catch (e) { alert(e.message); }
  }));
  el.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const box = document.getElementById('pay-' + b.getAttribute('data-pay'));
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  });
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-save');
    try { await api('/techdeva/clients/' + id + '/payment', {method:'POST',
      body: JSON.stringify({amount: el.querySelector('[data-amt="' + id + '"]').value})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-plan]').forEach(sel => sel.onchange = async () => {
    try { await api('/techdeva/clients/' + sel.getAttribute('data-plan') + '/plan', {method:'PUT', body: JSON.stringify({plan_key: sel.value})});
          D.usage = null; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-psave]').forEach(b => b.onclick = async () => {
    const k = b.getAttribute('data-psave'), v = a => el.querySelector('[' + a + '="' + k + '"]').value;
    const shown = el.querySelector('[data-pv="' + k + '"]').checked;
    try { await api('/techdeva/plans/' + k, {method:'PUT', body: JSON.stringify({price_pkr: v('data-pp'), price_usd: v('data-pu'), max_numbers: v('data-pn'), max_conversations: v('data-pc'),
                                                                               ai_credits: v('data-pa'), max_concurrent_tasks: v('data-pt'), published: shown})});
          b.textContent = 'Saved'; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-sub]').forEach(a => a.onclick = async e => {
    e.preventDefault();
    const v = prompt('Address for this client, before .techdeva.net (e.g. drirfan). Empty removes it.', a.getAttribute('data-cur'));
    if (v === null) return;
    try { await api('/techdeva/clients/' + a.getAttribute('data-sub') + '/subdomain', {method:'PUT', body: JSON.stringify({subdomain: v.trim()})}); load(); }
    catch (err) { alert(err.message); }
  });
  el.querySelectorAll('[data-trial]').forEach(b => b.onclick = async () => {
    try { await api('/techdeva/clients/' + b.getAttribute('data-trial') + '/trial', {method:'POST', body: JSON.stringify({days: 7})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-activate]').forEach(b => b.onclick = async () => {
    if (!confirm('Mark this business as a paying client? Its dashboard will never be locked by the trial.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-activate') + '/activate', {method:'POST'}); load(); }
    catch (e) { alert(e.message); }
  });
  /* Delete for good (app/retention.py founder_delete): the server checks again
     that the business is not paying, not TechDeva's own and not hand-managed. */
  const delOne = (id, name) => api('/techdeva/clients/' + id, {method: 'DELETE', body: JSON.stringify({confirm: name})});
  el.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    const name = b.getAttribute('data-cname');
    const typed = prompt('Delete "' + name + '" for good? Its logins, customers, bookings, invoices and WhatsApp agent are all deleted and cannot be brought back.\n\nType the business name to confirm:');
    if (typed === null) return;
    if (typed.trim().toLowerCase() !== name.trim().toLowerCase()) { alert('The name did not match. Nothing was deleted.'); return; }
    b.disabled = true; b.textContent = 'Deleting...';
    try { const r = await delOne(b.getAttribute('data-cdel'), name); alert('Deleted ' + r.business + ' (' + r.rows + ' records' + (r.agents.length ? ', agent removed within a few minutes' : '') + ').'); }
    catch (e) { alert(e.message); }
    load();
  });
  const sels = () => [...el.querySelectorAll('[data-csel]:checked')];
  const delSel = document.getElementById('cl-delsel'), delMsg = document.getElementById('cl-delmsg');
  const count = () => { if (delSel) { const n = sels().length; delSel.disabled = !n; delSel.textContent = n ? 'Delete selected (' + n + ')' : 'Delete selected'; } };
  el.querySelectorAll('[data-csel]').forEach(c => c.onchange = count);
  const all = document.getElementById('cl-selall');
  if (all) all.onclick = () => { const box = [...el.querySelectorAll('[data-csel]')], on = box.some(c => !c.checked); box.forEach(c => { c.checked = on; }); count(); };
  if (delSel) delSel.onclick = async () => {
    const list = sels(); if (!list.length) return;
    const typed = prompt('Delete ' + list.length + ' businesses for good? Their logins, customers, bookings, invoices and WhatsApp agents are all deleted and cannot be brought back.\n\n' +
      list.slice(0, 15).map(c => '- ' + c.getAttribute('data-cname')).join('\n') + (list.length > 15 ? '\n... and ' + (list.length - 15) + ' more' : '') +
      '\n\nType DELETE ' + list.length + ' to confirm:');
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== 'DELETE ' + list.length) { alert('That did not match. Nothing was deleted.'); return; }
    delSel.disabled = true;
    let ok = 0; const bad = [];
    for (const c of list) {
      if (delMsg) delMsg.textContent = 'Deleting ' + (ok + bad.length + 1) + ' of ' + list.length + '...';
      try { await delOne(c.getAttribute('data-csel'), c.getAttribute('data-cname')); ok++; }
      catch (e) { bad.push(c.getAttribute('data-cname') + ': ' + e.message); }
    }
    alert('Deleted ' + ok + ' of ' + list.length + '.' + (bad.length ? '\n\nNot deleted:\n' + bad.join('\n') : ''));
    load();
  };
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    if (!confirm('Hide this client from the book? Nothing is deleted.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-hide') + '/hide',
      {method:'POST', body: JSON.stringify({hidden:true})}); load(); }
    catch (e) { alert(e.message); }
  });
}

function openRequests(){
  const ag = (D.agents && D.agents.requests) || [], cl = (D.claims && D.claims.claims) || [],
        rs = (D.resets && D.resets.requests) || [];
  return ag.filter(a => a.status === 'requested' || a.status === 'failed').length +
         cl.filter(c => c.status === 'pending').length + rs.filter(r => r.delivered === 'pending').length;
}

  });
  go('[data-pretry]', async b => { await post('/techdeva/partners/' + b.getAttribute('data-pretry') + '/provisioning/retry'); again(); });
  go('[data-pterms]', async b => {
    const pct = prompt('Partner\'s share for ' + b.getAttribute('data-name') + ', in % (TechDeva keeps the rest). Applies from today; past payments keep their split.', b.getAttribute('data-pct'));
    if (pct === null) { b.disabled = false; return; }

    if (floor === null) { b.disabled = false; return; }

    if (floor.trim()) { body.min_techdeva_amount = floor.trim(); body.floor_currency = 'USD'; }
    await post('/techdeva/partners/' + b.getAttribute('data-pterms') + '/terms', body); again();
  });
  go('[data-opaid]', async b => {
    const ref = prompt('Bank / transfer reference of the money you SENT:', '');
    if (!ref) { b.disabled = false; return; }
    await post('/techdeva/partner-payouts/' + b.getAttribute('data-opaid') + '/mark', {status: 'paid', reference: ref}); again();
  });
  go('[data-ofail]', async b => {
    const why = prompt('Why did the payout fail? Its earnings go into the next payout.', '');
    if (!why) { b.disabled = false; return; }
    await post('/techdeva/partner-payouts/' + b.getAttribute('data-ofail') + '/mark', {status: 'failed', reason: why}); again();
  });
  go('#p-gather', async () => { const r = await post('/techdeva/partner-payouts/run'); alert((r.created || []).length + ' payout(s) gathered.'); again(); });
  go('[data-lclear]', async b => {
    const note = prompt('What did you check? (kept on record)', '');
    if (!note) { b.disabled = false; return; }
    await post('/techdeva/partner-ledger/' + b.getAttribute('data-lclear') + '/clear-review', {note: note}); again();
  });
  const reverse = kind => async b => {
    const amt = prompt((kind === 'refund' ? 'Refund' : 'Chargeback') + ' amount (the client paid ' + b.getAttribute('data-amt') + '):', b.getAttribute('data-amt'));
    if (amt === null) { b.disabled = false; return; }
    const fee = kind === 'chargeback' ? prompt('Chargeback fee the bank charged (0 if none):', '0') : '0';
    if (fee === null) { b.disabled = false; return; }
    await post('/techdeva/partner-ledger/' + b.getAttribute(kind === 'refund' ? 'data-lref' : 'data-lcb') + '/reverse', {amount: amt, kind: kind, gateway_fee: fee}); again();
  };
  go('[data-lref]', reverse('refund'));
  go('[data-lcb]', reverse('chargeback'));

  if (form) form.onsubmit = async e => {

        contact_name: v('pa-cname'), contact_email: v('pa-email'), contact_phone: v('pa-phone')});
      again();
    } catch (ex) { msg.textContent = ex.message; }
  };
}

/* ======================================================== Part 21: trial data + server alert
   Faheem's rules: only paying clients' data is kept (unpaid trials are deleted
   15 days after the trial ended, owner warned 3 days before; "Keep" stops it),
   and at 8 paying clients the console says it is time for a second server. */
NAV.forEach(g => { if (g[0] === 'PLATFORM' && !g[1].some(x => x[0] === 'trialdata')) g[1].push(['trialdata', 'Trial data & server']); });
TITLES.trialdata = ['Trial data & server', 'Unpaid trials are deleted 15 days after the trial ends. Paying clients against server room.'];
function retLoad(){ api('/techdeva/retention').then(r => { D.ret = r; paint(); }).catch(() => {}); }
setTimeout(retLoad, 500);
setInterval(retLoad, 10 * 60 * 1000);
function serverBanner(){
  const r = D.ret;
  if (!r || !r.server_alert) return '';
  return '<div class="card" style="border:1px solid var(--gold);margin-bottom:16px"><div class="k-label" style="color:var(--gold)">Time to buy a new server</div>' +
    '<div style="margin:6px 0">You have <b>' + r.paying + ' paying client' + (r.paying === 1 ? '' : 's') + '</b> (alert at ' + r.server_alert_at + '). This server fits about 6 more busy WhatsApp agents.</div>' +
    '<div class="k-note">Buy a 16 GB VPS for client agents (holds about 35–40 busy clients) and tell Claude when it is ready, so new agents go there and the clinic stays alone on this server. ' +
    '<a href="#/trialdata" style="color:var(--gold)">Details</a></div></div>';
}
const _overviewBeforeRet = VIEWS.overview;
VIEWS.overview = function(){ return serverBanner() + _overviewBeforeRet.apply(this, arguments); };
VIEWS.trialdata = function(){
  const r = D.ret;
  if (!r) { retLoad(); return '<div class="empty">Loading...</div>'; }
  const day = s => s ? new Date(s).toLocaleDateString([], {day: 'numeric', month: 'short', year: 'numeric'}) : '-';
  let out = serverBanner() + '<section><div class="grid" style="margin-top:0;margin-bottom:16px">' +
    kpi('Paying clients', r.paying, 'marked paying, not test, not TechDeva') +
    kpi('New server at', r.server_alert_at, 'paying clients') +
    kpi('Trials to be deleted', r.upcoming.filter(u => !u.hold).length, 'unpaid, trial ended') + '</div>';
  out += '<div class="card" style="margin-bottom:16px"><div class="k-label">Alert me to buy a new server at</div><div style="display:flex;gap:8px;margin-top:8px">' +
    '<input id="ret-at" type="number" min="1" value="' + esc(r.server_alert_at) + '" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;width:100px">' +
    '<button class="primary" id="ret-at-save">Save</button><span class="k-note" style="align-self:center">paying clients</span></div></div>';
  out += '<div class="card" style="margin-bottom:16px"><div class="k-label">Unpaid trials: data deleted ' + r.grace_days + ' days after the trial ends</div>' +
    '<div class="k-note" style="margin:4px 0 10px">The owner sees the date on their locked dashboard, and is warned ' + r.warn_days + ' days before (plus an email if the server can send email). Keep = never delete while kept.</div>' +
    tbl('<th>Business</th><th>Trial ended</th><th>Deleted on</th><th>Days left</th><th>Warned</th><th></th>',
      r.upcoming.map(u => '<tr' + (u.hold ? ' style="opacity:.6"' : '') + '><td><b>' + esc(u.name) + '</b></td><td>' + day(u.trial_ends_at) + '</td><td>' +
        (u.hold ? '<span class="dim">kept</span>' : '<span class="' + (u.days_left <= r.warn_days ? 'bad' : '') + '">' + day(u.deletes_on) + '</span>') + '</td><td>' +
        (u.hold ? '-' : u.days_left) + '</td><td>' + (u.warned_at ? day(u.warned_at) + (u.emailed ? ' (email)' : '') : '<span class="dim">not yet</span>') + '</td><td>' +
        '<button data-rethold="' + esc(u.id) + '" data-on="' + (u.hold ? '' : '1') + '">' + (u.hold ? 'Stop keeping' : 'Keep') + '</button></td></tr>')) + '</div>';
  out += '<div class="card"><div class="k-label">Deleted</div>' + tbl('<th>Business</th><th>Trial ended</th><th>Deleted</th><th>Rows</th><th>WhatsApp agent</th>',
    r.deleted.map(x => '<tr><td>' + esc(x.business_name) + '</td><td>' + day(x.trial_ended_at) + '</td><td>' + day(x.deleted_at) + '</td><td>' +
      Object.values(x.rows_deleted || {}).reduce((a, b) => a + b, 0) + '</td><td>' +
      (!(x.agent_keys || []).length ? '<span class="dim">none</span>' : x.agents_removed_at ? '<span class="good">removed</span>' :
        '<span class="bad">' + (x.agent_error ? esc(x.agent_error) : 'waiting for the server job') + '</span><div class="k-note">' + esc(x.agent_keys.join(', ')) + '</div>') + '</td></tr>')) + '</div></section>';
  setTimeout(() => {
    const s = document.getElementById('ret-at-save');
    if (s) s.onclick = async () => { s.disabled = true; try { await api('/techdeva/retention-settings', {method: 'PUT', body: JSON.stringify({server_alert_at: document.getElementById('ret-at').value})}); retLoad(); } catch (e) { alert(e.message); s.disabled = false; } };
    document.querySelectorAll('[data-rethold]').forEach(b => b.onclick = async () => {
      const on = !!b.getAttribute('data-on');
      if (!on && !confirm('Stop keeping this business? Its data will be deleted on its deletion day if it has not paid.')) return;
      b.disabled = true;
      try { await api('/techdeva/retention/' + b.getAttribute('data-rethold'), {method: 'PUT', body: JSON.stringify({hold: on})}); retLoad(); }
      catch (e) { alert(e.message); b.disabled = false; }
    });
  }, 0);
  return out;
};
/* ======================================================== Part 22: Sales team
   Each operator's work, from what they log on their Sales page in TechDeva's
   dashboard: contacts, new leads, meetings and clients won (today, 7 and 30
   days, this month) against the targets set here; open leads and overdue
   follow-ups; their salary and cost per client landed (founder only). */
NAV.forEach(g => { if (g[0] === 'TECHDEVA TEAM & SERVICES' && !g[1].some(x => x[0] === 'sales')) g[1].splice(1, 0, ['sales', 'Sales team']); });
TITLES.sales = ['Sales team', 'How each operator is doing: contacts, leads, meetings and clients won against target.'];
const SLF = { data: undefined, person: {}, open: null, targets: null };
function slfLoad(){ SLF.data = null; api('/techdeva/sales').then(d => { SLF.data = d; }).catch(e => { SLF.data = {error: e.message}; }).then(() => { if (current() === 'sales') paint(); }); }
function slfPerson(uid){ SLF.person[uid] = null; api('/techdeva/sales/people/' + uid).then(d => { SLF.person[uid] = d; }).catch(e => { SLF.person[uid] = {error: e.message}; }).then(() => { if (current() === 'sales') paint(); }); }
const slfWhen = s => s ? new Date(s).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '-';
function slfVs(got, target){
  if (!target) return '<b>' + got + '</b>';
  const cls = got >= target ? 'good' : got >= target / 2 ? 'warn' : 'bad';
  return '<b class="' + cls + '">' + got + '</b><span class="dim"> / ' + target + '</span>';
}
function slfBars(days, vals, target){
  const max = Math.max(target || 0, ...vals, 1);
  return '<div style="display:flex;gap:2px;align-items:flex-end;height:28px" title="Contacts per day, last 14 days">' + vals.map((v, i) =>
    '<span title="' + esc(days[i]) + ': ' + v + '" style="width:6px;height:' + Math.max(2, Math.round(v * 28 / max)) + 'px;border-radius:2px;background:' +
    (target && v >= target ? 'var(--growth)' : v ? 'var(--gold)' : 'var(--line)') + '"></span>').join('') + '</div>';
}
VIEWS.sales = function(){

  const sum = (k, per) => people.reduce((a, p) => a + (((p.stats || {})[k] || {})[per] || 0), 0);
  const pl = d.pipeline || {};
  const open = ['new', 'contacted', 'meeting', 'proposal'].reduce((a, k) => a + (pl[k] || 0), 0);
  const payroll = people.filter(p => p.active).reduce((a, p) => a + (p.salary || 0), 0);
  const wonM = sum('won', 'month');
  let out = '<section><div class="grid" style="margin-top:0;margin-bottom:16px">' +

    kpi('Clients won this month', wonM, sum('won', 'd30') + ' in the last 30 days', wonM ? 'good' : '') +
    kpi('Sales payroll', money(payroll), wonM ? money(payroll / wonM) + ' per client won this month' : 'no clients won yet this month') + '</div>';
  out += '<div class="card" style="margin-bottom:16px;overflow-x:auto"><div class="k-label">Operators</div>' +
    '<div class="k-note" style="margin:4px 0 10px">Counted from what each person logs on their Sales page (Contacts = WhatsApp, calls, visits and meetings held). Days are Pakistan days. Salary and cost per client are only on this page.</div>' +
    tbl('<th>Person</th><th>Contacts today</th><th>Last 14 days</th><th>7 / 30 days</th><th>Leads (month)</th><th>Meetings (month)</th><th>Won (month)</th><th>Open · overdue</th><th>Salary</th><th>Cost / client</th><th></th>',
      people.map(p => {
        const s = p.stats || {}, g = (k, per) => ((s[k] || {})[per] || 0);
        return '<tr' + (p.active ? '' : ' style="opacity:.55"') + '><td><b>' + esc(p.name) + '</b><div class="k-note">' + esc(p.job || (p.access === 'owner' ? 'full access' : 'staff')) +
          (p.last_login_at ? ' · seen ' + when(p.last_login_at) : '') + '</div></td>' +
          '<td>' + slfVs(g('contacts', 'today'), p.contacts_per_day) + '</td>' +
          '<td>' + slfBars(d.days, p.daily || [], p.contacts_per_day) + '</td>' +
          '<td>' + g('contacts', 'd7') + ' / ' + g('contacts', 'd30') + '</td>' +
          '<td>' + slfVs(g('leads', 'month'), p.leads_per_month) + '</td>' +
          '<td>' + slfVs(g('meetings', 'month'), p.meetings_per_month) + '</td>' +
          '<td>' + slfVs(g('won', 'month'), p.clients_per_month) + '</td>' +
          '<td>' + p.open_leads + (p.overdue ? ' · <span class="bad">' + p.overdue + ' overdue</span>' : '') + (p.upcoming_meetings ? '<div class="k-note">' + p.upcoming_meetings + ' meeting' + (p.upcoming_meetings === 1 ? '' : 's') + ' booked</div>' : '') + '</td>' +
          '<td>' + (p.salary != null ? money(p.salary) : '<span class="dim">not set</span>') + '</td>' +
          '<td>' + (p.cost_per_client != null ? money(p.cost_per_client) : '<span class="dim">-</span>') + '</td>' +
          '<td style="white-space:nowrap"><button data-slfp="' + esc(p.user_id) + '">' + (SLF.open === p.user_id ? 'Hide' : 'Details') + '</button> ' +
          '<button data-slft="' + esc(p.user_id) + '">Targets</button></td></tr>' +
          (SLF.targets === p.user_id ? '<tr><td colspan="11"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">' +
            [['contacts_per_day', 'Contacts a day'], ['leads_per_month', 'New leads a month'], ['meetings_per_month', 'Meetings a month'], ['clients_per_month', 'Clients won a month']].map(t =>
              '<label class="k-note" style="display:flex;flex-direction:column;gap:2px">' + t[1] + '<input type="number" min="0" max="10000" id="slft-' + t[0] + '" value="' + (p[t[0]] || 0) + '" ' + wkInput + ' style="width:130px"></label>').join('') +
            '<button class="primary" data-slftsave="' + esc(p.user_id) + '">Save targets</button><button data-slftx="1">Cancel</button></div></td></tr>' : '') +
          (SLF.open === p.user_id ? '<tr><td colspan="11">' + slfDetail(p.user_id) + '</td></tr>' : '');
      })) + '</div>';
  out += '<div class="k-note">Salaries are set on the <a href="#/team" style="color:var(--gold)">Team</a> page (Edit an employee). Operators add leads, log contacts and book meetings on <b>Sales</b> in TechDeva\'s dashboard.</div></section>';
  wkAct('[data-slfp]', async b => { const u = b.getAttribute('data-slfp'); SLF.open = SLF.open === u ? null : u; if (SLF.open) slfPerson(u); paint(); });
  wkAct('[data-slft]', async b => { const u = b.getAttribute('data-slft'); SLF.targets = SLF.targets === u ? null : u; paint(); });
  wkAct('[data-slftx]', async () => { SLF.targets = null; paint(); });
  wkAct('[data-slftsave]', async b => {
    const body = {};
    ['contacts_per_day', 'leads_per_month', 'meetings_per_month', 'clients_per_month'].forEach(k => body[k] = wkVal('slft-' + k) || 0);
    await api('/techdeva/sales/people/' + b.getAttribute('data-slftsave'), {method: 'PUT', body: JSON.stringify(body)});
    SLF.targets = null; slfLoad();
  });
  wkAct('[data-slflink]', async b => {
    const sel = document.getElementById('slfc-' + b.getAttribute('data-slflink'));
    await api('/techdeva/sales/leads/' + b.getAttribute('data-slflink') + '/client', {method: 'PUT', body: JSON.stringify({client_tenant_id: sel ? sel.value : ''})});

  });
  return out;
};
const SLF_ST = {new: 'New', contacted: 'Contacted', meeting: 'Meeting', proposal: 'Proposal', won: 'Won', lost: 'Lost'};

          (l.notes ? '<div class="k-note">' + esc(l.notes) + '</div>' : '') + '</td><td>' + esc(SLF_ST[l.status] || l.status) + '</td><td>' +
          esc([l.contact_name, l.phone].filter(Boolean).join(' · ') || '-') + '</td><td>' + esc(l.source) + '</td><td>' + (l.last_contact_at ? slfWhen(l.last_contact_at) : '<span class="dim">never</span>') +
          '</td><td' + (late ? ' class="bad"' : '') + '>' + (l.status === 'won' || l.status === 'lost' ? '-' : slfWhen(l.next_followup_at)) + '</td><td>' +
          (l.status === 'won' || l.client_name
            ? '<select id="slfc-' + esc(l.id) + '" ' + wkInput + ' style="max-width:180px"><option value="">Not linked</option>' +
              clients.map(c => '<option value="' + esc(c.id) + '"' + (String(c.id) === String(l.client_tenant_id) ? ' selected' : '') + '>' + esc(c.name || 'Unnamed') + '</option>').join('') +
              '</select> <button data-slflink="' + esc(l.id) + '">Save</button>'
            : '<span class="dim">-</span>') + '</td></tr>';
      }));
  h += '<div class="k-label" style="margin-top:14px">Meetings (' + x.meetings.length + ')</div>' +
    tbl('<th>When</th><th>Business</th><th>Type</th><th>Where</th><th>Status</th>', x.meetings.map(m =>
      '<tr><td>' + slfWhen(m.starts_at) + '</td><td>' + esc(m.business_name) + '</td><td>' + (m.mode === 'online' ? 'Online' : 'In person') + '</td><td>' +
      (m.mode === 'online' ? (m.meet_link ? '<a target="_blank" rel="noopener" href="' + esc(m.meet_link) + '" style="color:var(--gold)">link</a>' : '-') : esc(m.place || '-')) +
      '</td><td>' + esc(m.status.replace('_', '-')) + '</td></tr>'));
  h += '<div class="k-label" style="margin-top:14px">Contact log (latest ' + x.contacts.length + ')</div>' +
    tbl('<th>When</th><th>Business</th><th>How</th><th>Result</th><th>Note</th>', x.contacts.map(c =>
      '<tr><td>' + slfWhen(c.at) + '</td><td>' + esc(c.business_name) + '</td><td>' + esc(c.channel) + '</td><td>' + esc(c.outcome || '-') + '</td><td>' + esc(c.note || '') + '</td></tr>'));
  return h;
}
/* ======================================================== Part 26: Growth proof
   Has each client grown since TechDeva started? Their own recorded payments,
   month by month, against the sales level before TechDeva (the baseline),
   and the agreed profit share. The one-pager is the sales tool: before and
   after, by default without the client's name and without rupee amounts. */
NAV.forEach(g => { if (g[0] === 'MONEY' && !g[1].some(x => x[0] === 'growth')) g[1].splice(0, 0, ['growth', 'Growth proof']); });
TITLES.growth = ['Growth proof', 'How much more each client takes in since TechDeva started: the number to sell on and to bill on.'];
const GRW = { data: undefined, edit: null };
function grwLoad(){ GRW.data = null; api('/techdeva/growth').then(d => { GRW.data = d; }).catch(e => { GRW.data = {error: e.message}; }).then(() => { if (current() === 'growth') paint(); }); }
const grwMonth = s => new Date(s + 'T00:00:00').toLocaleDateString([], {month: 'short', year: 'numeric'});
const grwPct = p => p == null ? '' : (p > 0 ? '+' : '') + p + '%';
function grwBars(c){
  const ms = c.months || [], top = Math.max(1, c.baseline || 0, ...ms.map(m => m.revenue));
  return '<div style="display:flex;gap:6px;align-items:flex-end;height:120px;margin:10px 0 4px;position:relative">' +
    (c.baseline != null ? '<div title="baseline" style="position:absolute;left:0;right:0;bottom:' + (100 * c.baseline / top) + '%;border-top:2px dashed #A78BFA"></div>' : '') +
    ms.map(m => '<div title="' + esc(grwMonth(m.month) + ': ' + money(m.revenue)) + '" style="flex:1;min-width:10px;height:' + Math.max(2, 100 * m.revenue / top) + '%;background:' +
      (m.partial ? '#4c3d80' : (c.baseline != null && m.revenue >= c.baseline ? '#8B5CF6' : '#5b5b6b')) + ';border-radius:4px 4px 0 0"></div>').join('') + '</div>' +
    '<div style="display:flex;gap:6px">' + ms.map(m => '<div class="k-note" style="flex:1;min-width:10px;text-align:center;font-size:10px">' + esc(grwMonth(m.month).split(' ')[0]) + '</div>').join('') + '</div>';
}
VIEWS.growth = function(){
  if (GRW.data === undefined) grwLoad();
  const d = GRW.data;
  if (!d) return '<div class="empty">Loading...</div>';
  if (d.error) return '<div class="empty">' + esc(d.error) + '</div>';
  const cs = d.clients || [];
  const withBase = cs.filter(c => c.baseline != null && c.last_full);
  const growing = withBase.filter(c => c.last_full.growth > 0).length;
  const shareLast = cs.reduce((a, c) => a + ((c.last_full && c.last_full.share) || 0), 0);
  let out = '<section><div class="grid" style="margin-top:0;margin-bottom:16px">' +
    kpi('Clients with a baseline', withBase.length + ' of ' + cs.length, cs.length - withBase.length ? (cs.length - withBase.length) + ' still need one (press Terms)' : 'all set', withBase.length === cs.length ? 'good' : '') +
    kpi('Growing last month', growing + ' of ' + withBase.length, 'sales above their baseline', growing ? 'good' : '') +
    kpi('Your share, last month', money(shareLast), 'growth x the share % you agreed (only where set)') + '</div>';
  out += '<div class="card" style="overflow-x:auto"><div class="k-note" style="margin-bottom:10px">Sales are each client\'s recorded payments (Pakistan months). The baseline is what you entered from their old register, or else the average of the months before the start that already have payments. A month only counts once it is over; this month is shown as "so far".</div>' +
    tbl('<th>Business</th><th>Started</th><th>Baseline / month</th><th>Last full month</th><th>Growth</th><th>This month so far</th><th>Share</th><th>Since start</th><th></th>',
      cs.map(c => {
        const l = c.last_full, t = c.this_month, s = c.since_start;
        const row = '<tr><td><b>' + esc(c.name) + '</b></td><td>' + esc(grwMonth(c.started_on)) + (c.start_entered ? '' : '<div class="k-note">signup date</div>') + '</td>' +
          '<td>' + (c.baseline != null ? money(c.baseline) + '<div class="k-note">' + esc(c.baseline_source) + '</div>' : '<span class="warn">not set</span><div class="k-note">enter it from their old register</div>') + '</td>' +
          '<td>' + (l ? money(l.revenue) + '<div class="k-note">' + esc(grwMonth(l.month)) + ' · ' + l.leads + ' leads · ' + l.visits + ' visits</div>' : '<span class="dim">no full month yet</span>') + '</td>' +
          '<td>' + (l && l.growth != null ? '<b class="' + (l.growth > 0 ? 'good' : 'bad') + '">' + money(l.growth) + '</b><div class="k-note">' + esc(grwPct(l.growth_pct)) + '</div>' : '<span class="dim">-</span>') + '</td>' +
          '<td>' + (t ? money(t.revenue) : '-') + '</td>' +
          '<td>' + (c.share_pct != null ? c.share_pct + '%' + (l && l.share != null ? '<div class="k-note">' + money(l.share) + ' last month</div>' : '') : '<span class="dim">not agreed</span>') + '</td>' +
          '<td>' + (s ? money(s.growth) + '<div class="k-note">over ' + s.months + ' month' + (s.months === 1 ? '' : 's') + (s.share != null ? ' · share ' + money(s.share) : '') + '</div>' : '<span class="dim">-</span>') + '</td>' +
          '<td style="white-space:nowrap"><button data-grwe="' + esc(c.tenant_id) + '">' + (GRW.edit === c.tenant_id ? 'Close' : 'Terms') + '</button> ' +
          '<button data-grwp="' + esc(c.tenant_id) + '"' + (c.baseline != null && l ? '' : ' disabled title="Needs a baseline and one full month"') + '>One-pager</button></td></tr>';
        if (GRW.edit !== c.tenant_id) return row;
        return row + '<tr><td colspan="9"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
          '<label class="k-note">TechDeva started<br><input type="date" id="grw_start" value="' + esc(c.start_entered ? c.started_on : '') + '"></label>' +
          '<label class="k-note">Sales per month before TechDeva (PKR)<br><input type="number" min="0" id="grw_base" value="' + esc(c.baseline_monthly == null ? '' : c.baseline_monthly) + '" placeholder="from their register"></label>' +
          '<label class="k-note">Where that number comes from<br><input id="grw_note" maxlength="200" value="' + esc(c.baseline_note || '') + '" placeholder="e.g. average Apr-Jun 2026, cash register"></label>' +
          '<label class="k-note">Profit share agreed (%)<br><input type="number" min="0" max="50" step="0.5" id="grw_share" value="' + esc(c.share_pct == null ? '' : c.share_pct) + '" placeholder="leave empty if none"></label>' +
          '<button class="primary" data-grws="' + esc(c.tenant_id) + '">Save</button></div>' +
          '<div class="k-note" style="margin-top:6px">Leave "sales per month before" empty to use the months before the start that already have payments. ' + grwBars(c) + '</div></td></tr>';
      })) + '</div></section>';
  setTimeout(() => {
    document.querySelectorAll('[data-grwe]').forEach(b => b.onclick = () => { GRW.edit = GRW.edit === b.dataset.grwe ? null : b.dataset.grwe; paint(); });
    wkAct('[data-grws]', async b => {
      const v = id => document.getElementById(id).value;
      await api('/techdeva/growth/' + b.dataset.grws, {method: 'PUT', body: JSON.stringify({
        started_on: v('grw_start') || null, baseline_monthly: v('grw_base'), baseline_note: v('grw_note'), share_pct: v('grw_share')})});
      GRW.edit = null; grwLoad();
    });
    document.querySelectorAll('[data-grwp]').forEach(b => b.onclick = () => grwOnePager(cs.find(c => c.tenant_id === b.dataset.grwp)));
  }, 0);
  return out;
};
// The before / after page to show a prospect. By default it hides the client's
// name and the rupee amounts (their figures are theirs); untick to show them,
// with the client's permission.
function grwOnePager(c){
  if (!c) return;
  const named = confirm('Show the business name "' + c.name + '" on the page?\n\nOK = show it (only with their permission)\nCancel = "A client of TechDeva"');
  const amounts = confirm('Show rupee amounts?\n\nOK = show sales in PKR (only with their permission)\nCancel = show growth in % only');
  const full = c.months.filter(m => !m.partial), last = c.last_full, best = full.reduce((a, m) => m.revenue > a.revenue ? m : a, full[0]);
  const avg = full.reduce((a, m) => a + m.revenue, 0) / full.length;
  const pct = v => c.baseline > 0 ? Math.round(100 * (v - c.baseline) / c.baseline) : null;
  const fig = v => amounts ? money(v) : (pct(v) == null ? '' : (pct(v) >= 0 ? '+' : '') + pct(v) + '% vs before');
  const top = Math.max(c.baseline, ...full.map(m => m.revenue), 1);
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups for this page to open the one-pager.'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Growth with TechDeva</title><style>' +
    'body{font-family:Arial,sans-serif;color:#111;max-width:760px;margin:30px auto;padding:0 20px}h1{color:#6d28d9;margin:0 0 4px}.sub{color:#555;margin:0 0 24px}' +
    '.k{display:flex;gap:14px;margin:18px 0}.k div{flex:1;border:1px solid #ddd;border-radius:10px;padding:14px}.k b{display:block;font-size:26px;color:#6d28d9}' +
    '.bars{display:flex;gap:8px;align-items:flex-end;height:200px;border-bottom:1px solid #ccc;position:relative;margin-top:24px}.bars i{flex:1;background:#8B5CF6;border-radius:6px 6px 0 0}' +
    '.base{position:absolute;left:0;right:0;border-top:2px dashed #999}.lab{display:flex;gap:8px}.lab span{flex:1;text-align:center;font-size:12px;color:#555}' +
    '.note{color:#666;font-size:12px;margin-top:24px}@media print{button{display:none}}</style></head><body>' +
    '<button onclick="print()" style="float:right">Print / save as PDF</button>' +
    '<h1>' + esc(named ? c.name : 'A client of TechDeva') + '</h1><p class="sub">Sales before and since TechDeva started (' + esc(grwMonth(c.started_on)) + ')</p>' +
    '<div class="k"><div>Before TechDeva<b>' + (amounts ? money(c.baseline) : '100%') + '</b>per month</div>' +
    '<div>Last month (' + esc(grwMonth(last.month)) + ')<b>' + esc(fig(last.revenue)) + '</b>' + (amounts && pct(last.revenue) != null ? (pct(last.revenue) >= 0 ? '+' : '') + pct(last.revenue) + '%' : '') + '</div>' +
    '<div>Average since start<b>' + esc(fig(avg)) + '</b>over ' + full.length + ' month' + (full.length === 1 ? '' : 's') + '</div>' +
    '<div>Best month<b>' + esc(fig(best.revenue)) + '</b>' + esc(grwMonth(best.month)) + '</div></div>' +
    '<div class="bars"><div class="base" style="bottom:' + (100 * c.baseline / top) + '%"></div>' + full.map(m => '<i style="height:' + Math.max(2, 100 * m.revenue / top) + '%"></i>').join('') + '</div>' +
    '<div class="lab">' + full.map(m => '<span>' + esc(grwMonth(m.month)) + '</span>').join('') + '</div>' +
    '<p class="note">Dashed line: sales per month before TechDeva (' + esc(c.baseline_source || '') + '). Bars: recorded sales each full month since. ' +
    'Leads last month: ' + last.leads + ' · completed visits: ' + last.visits + '. Source: the business\'s own payment records in TechDeva.</p></body></html>');
  w.document.close();
}
/* ======================================================== Part 27: Change my password */
function pwOpen(){
  document.getElementById('pw-box')?.remove();
  const o = document.createElement('div'); o.id = 'pw-box';
  o.style.cssText = 'position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML = '<form id="pw_f" class="card" style="width:min(380px,100%);display:grid;gap:10px">' +
    '<b>My account</b><div id="acct_box" class="k-note">Loading…</div>' +
    '<b style="margin-top:6px">Change my password</b>' +
    '<label class="k-note">Current password<br><input type="password" id="pw_cur" autocomplete="current-password" required style="width:100%"></label>' +
    '<label class="k-note">New password (at least 10 characters)<br><input type="password" id="pw_new" autocomplete="new-password" minlength="10" required style="width:100%"></label>' +
    '<label class="k-note">New password again<br><input type="password" id="pw_new2" autocomplete="new-password" minlength="10" required style="width:100%"></label>' +
    '<div id="pw_msg" class="k-note" style="min-height:18px"></div>' +
    '<div style="display:flex;gap:8px"><button class="primary" type="submit" id="pw_go">Change password</button><button type="button" id="pw_x">Cancel</button></div>' +
    '<div style="border-top:1px solid #333;padding-top:10px"><button type="button" id="pw_all">Sign out all other devices</button>' +
    '<div class="k-note" style="margin-top:4px">This device stays signed in.</div></div></form>';
  document.body.appendChild(o);
  const g = id => document.getElementById(id), msg = (t, ok) => { g('pw_msg').textContent = t; g('pw_msg').className = ok ? 'k-note good' : 'k-note bad'; };
  g('pw_x').onclick = () => o.remove();
  g('pw_all').onclick = async () => {
    if (!confirm('Sign out every other device where you are signed in?')) return;
    g('pw_all').disabled = true;
    try { const r = await api('/auth/sign-out-everywhere', {method: 'POST'}); if (TOKEN && r.token) TOKEN = r.token; msg('Done: every other device is signed out.', true); }
    catch (ex) { msg(ex.message); }
    g('pw_all').disabled = false;
  };
  api('/auth/account').then(a => {
    g('acct_box').innerHTML = '<label class="k-note">Your name<br><input id="ac_name" maxlength="80" value="' + esc(a.name) + '" style="width:100%"></label>' +
      '<div class="k-note">Signs in as ' + esc(a.email) + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button type="button" id="ac_save">Save name</button><span id="ac_msg" class="k-note"></span></div>';
    g('ac_save').onclick = async () => {
      try {
        const r = await api('/auth/account', {method: 'PUT', body: JSON.stringify({name: g('ac_name').value})});
        g('ac_msg').textContent = r.changed.length ? 'Saved.' : 'Nothing changed.'; g('ac_msg').className = 'k-note good';
        const w = document.getElementById('who'); if (w && r.name) w.textContent = r.name;
      } catch (ex) { g('ac_msg').textContent = ex.message; g('ac_msg').className = 'k-note bad'; }
    };
  }).catch(ex => { g('acct_box').textContent = ex.message; });
  g('pw_f').onsubmit = async e => {
    e.preventDefault();
    if (g('pw_new').value.length < 10) return msg('The new password must be at least 10 characters.');
    if (g('pw_new').value !== g('pw_new2').value) return msg('The two new passwords are not the same.');
    g('pw_go').disabled = true;
    try {
      const r = await api('/auth/change-password', {method: 'POST', body: JSON.stringify({current_password: g('pw_cur').value, new_password: g('pw_new').value})});
      if (TOKEN && r.token) TOKEN = r.token;      // the old login was just signed out with the others
      msg('Password changed. Any other device signed in as you has been signed out.', true); setTimeout(() => o.remove(), 2200);
    } catch (ex) { g('pw_go').disabled = false; msg(ex.message); }
  };
}
document.getElementById('chgpw').onclick = e => { e.preventDefault(); pwOpen(); };
