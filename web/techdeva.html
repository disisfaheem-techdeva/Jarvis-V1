<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechDeva Founder Console</title>
<style>
:root{--bg:#0B0B0F;--panel:#17161D;--panel2:#111016;--line:#2E2B37;--text:#F4F1EA;
  --muted:#A29D8F;--accent:#E8C547;--tech:#4DA6F0;--growth:#34D07C;--warn:#E0A458;
  --danger:#E06A6A;--gold:#E8C547;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--panel2);border-right:1px solid var(--line);padding:20px 0;
  display:flex;flex-direction:column}
.brand{padding:0 20px 18px;font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.brand b{color:var(--gold)}
nav{flex:1;overflow:auto}
.navgrp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5c6a8a;
  padding:16px 20px 6px}
nav a{display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:8px 20px;color:var(--muted);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent}
nav a:hover{color:var(--text);background:#0c1220}
nav a.on{color:var(--text);background:#141c30;border-left-color:var(--accent);font-weight:600}
nav a .tag{font-size:11px;color:var(--warn)}
.sidefoot{padding:14px 20px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.sidefoot a{color:var(--gold);text-decoration:none}
main{min-width:0;padding:24px 28px 80px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;gap:8px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#08101f;font-weight:600}
button.tiny{padding:4px 9px;font-size:12px;border-radius:7px}
.grid{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.k-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-value{font-size:29px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.k-note{font-size:12px;color:var(--muted);margin-top:4px}
.good{color:var(--growth)}.warn{color:var(--warn)}.bad{color:var(--danger)}.dim{color:var(--muted)}
section{margin-top:24px}
section h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:0 10px 9px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line)}
tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.active{color:var(--growth);border-color:#1e5a3c}
.pill.trial{color:var(--tech);border-color:#1d4368}
.fee{width:104px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;text-align:right}
.fee:focus{outline:none;border-color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:2px;
  background:linear-gradient(180deg,var(--accent),#2a3f86)}
.bar span{font-size:10px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.row button{white-space:nowrap}
.health{display:flex;gap:18px;flex-wrap:wrap}
.health div{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--growth)}.dot.bad{background:var(--danger)}.dot.warn{background:var(--warn)}
.pay{display:none;gap:8px;margin-top:8px}
.pay input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;width:110px}
#login{max-width:380px;margin:14vh auto;padding:26px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r)}
#login input{width:100%;margin:8px 0;padding:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit}
.err{color:var(--danger);font-size:13px;min-height:18px}
/* Founder identity: gold, not the clients' blue, so this screen is never
   mistaken for a business dashboard. */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:3px;z-index:50;
  background:linear-gradient(90deg,#E8C547,#B8862B,#E8C547)}
.role-badge{display:inline-block;margin:6px 20px 4px;padding:3px 10px;border-radius:999px;font-size:10.5px;
  font-weight:700;letter-spacing:.12em;color:#1a1405;background:linear-gradient(90deg,#E8C547,#C99A32)}
.scope{font-size:12px;color:var(--gold);border:1px solid #5a4a1a;background:#1d1809;border-radius:999px;padding:4px 11px;white-space:nowrap}
nav a.on{background:#1f1b10}
.bar i{background:linear-gradient(180deg,#E8C547,#7a5c16)}
#menubtn{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  aside.open{transform:none}
  #menubtn{display:inline-block}
  main{padding:18px 16px 70px}
  .card{overflow-x:auto}
}
</style></head><body>

<div id="login">
  <div class="brand" style="padding:0 0 8px">TECH<b>DEVA</b></div>
  <div class="role-badge" style="margin:0 0 10px">FOUNDER CONSOLE</div>
  <div class="sub">For the TechDeva founder only. Businesses sign in at <a href="/dashboard" style="color:var(--gold)">/dashboard</a>.</div>
  <form id="lf">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="primary" id="lgo" style="width:100%">Sign in</button>
  </form>
</div>

<div class="shell" id="app" style="display:none">
  <aside id="aside">
    <div class="brand">TECH<b>DEVA</b></div>
    <div class="role-badge">FOUNDER CONSOLE</div>
    <div class="sub" style="padding:0 20px 6px">Every client, in one place</div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <div id="who"></div>
      <div style="margin-top:8px"><a href="#" id="out">Sign out</a></div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div style="display:flex;gap:12px;align-items:flex-start"><button id="menubtn" aria-label="Open menu">☰</button>
        <div><h1 id="vtitle">Overview</h1><div class="sub" id="vsub"></div></div></div>
      <div class="tools"><span class="scope">Founder view · all businesses</span><button id="refresh">Refresh</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
let TOKEN = null, D = {};
const NAV = [
  ['RUNNING THE BUSINESS', [
    ['jarvis','Jarvis'], ['overview','Overview'], ['requests','Requests'], ['clients','Clients'], ['pipeline','Pipeline & trials']]],
  ['WHAT THE AI DELIVERS', [
    ['bookings','Bookings'], ['workforce','AI workforce'], ['approvals','Waiting on you']]],
  ['MONEY', [
    ['revenue','My revenue'], ['clientmoney','Client business'], ['invoices','Invoices out']]],
  ['PLATFORM', [
    ['health','Health'], ['incidents','Incidents']]]
];
const TITLES = {jarvis:['Jarvis','Pick a client, then say or type what to change for them.'],
  overview:['Overview','The whole business on one screen.'],
  clients:['Clients','Everyone onboard, what they pay, and what they are getting.'],
  pipeline:['Pipeline & trials','Who signed up and who is still on a trial.'],
  requests:['Requests','Things clients asked for that need you: agents, payments, password resets.'],
  bookings:['Bookings','Appointments the AI has put in your clients diaries.'],
  workforce:['AI workforce','What each client’s agents are doing right now.'],
  approvals:['Waiting on you','Work the platform stopped on and cannot finish alone.'],
  revenue:['My revenue','What clients have paid TechDeva.'],
  clientmoney:['Client business','Money moving through your clients businesses.'],
  invoices:['Invoices out','Invoices TechDeva has issued to clients, and their status.'],
  health:['Health','Queues, workers and the AI chain.'],
  incidents:['Incidents','Anything the monitor has opened.']};

async function api(path, opts){
  opts = opts || {};
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, Object.assign({credentials:'include'}, opts, {headers:h}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return d;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => 'PKR ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const when = s => { if (!s) return '-';
  const d = new Date(s), days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago'; return String(s).slice(0,10); };
function kpi(label, value, note, cls){
  return '<div class="card"><div class="k-label">' + esc(label) + '</div><div class="k-value ' +
    (cls||'') + '">' + value + '</div><div class="k-note">' + esc(note||'') + '</div></div>';
}
function tbl(head, rows){
  if (!rows.length) return '<div class="empty">Nothing recorded yet.</div>';
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

// ------------------------------------------------------------------ login
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('lgo'), err = document.getElementById('lerr');
  b.disabled = true; b.textContent = 'Signing in...'; err.textContent = '';
  try {
    const d = await api('/auth/login', {method:'POST', body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value })});
    if (d.role !== 'techdeva_admin') err.textContent = 'That account is an ' + d.role + '.';
    else { TOKEN = d.token; show(); }
  } catch (ex) { err.textContent = ex.message; }
  b.disabled = false; b.textContent = 'Sign in';
});
document.getElementById('out').onclick = async e => {
  e.preventDefault();
  try { await api('/auth/logout', {method:'POST'}); } catch (x) {}
  TOKEN = null; location.href = '/techdeva';
};
document.getElementById('refresh').onclick = () => load();
document.getElementById('menubtn').onclick = () => document.getElementById('aside').classList.toggle('open');
document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) document.getElementById('aside').classList.remove('open'); });
window.addEventListener('hashchange', paint);

function show(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  load();
}
function current(){ return (location.hash.replace('#/','') || 'overview'); }

async function load(){
  const [book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans] = await Promise.all([
    api('/techdeva/book'),
    api('/techdeva/health').catch(() => null),
    api('/techdeva/operations').catch(() => null),
    api('/ai/health').catch(() => null),
    api('/incidents').catch(() => null),
    api('/techdeva/overview').catch(() => null),
    api('/techdeva/invoices').catch(() => null),
    api('/techdeva/agent-requests').catch(() => null),
    api('/techdeva/payment-claims').catch(() => null),
    api('/techdeva/password-resets').catch(() => null),
    api('/plans').catch(() => null)
  ]);
  D = {book, health, ops, ai, inc, over, invoices, agents, claims, resets, plans, usage: D.usage};
  // conversation counts ask every agent, so they arrive after the page
  api('/techdeva/usage').then(u => { D.usage = u; if (current() === 'clients' || current() === 'overview') paint(); }).catch(() => {});
  renderNav(); paint();
}

function renderNav(){
  const b = D.book || {}, cur = current();
  const badge = {clients: b.clients ? b.clients.length : 0,
                 approvals: b.awaiting_approval || 0,
                 incidents: (D.inc && D.inc.open) || 0,
                 requests: openRequests()};
  document.getElementById('nav').innerHTML = NAV.map(g =>
    '<div class="navgrp">' + g[0] + '</div>' + g[1].map(it =>
      '<a href="#/' + it[0] + '" class="' + (cur === it[0] ? 'on' : '') + '">' +
      '<span>' + it[1] + '</span>' +
      (badge[it[0]] ? '<span class="tag">' + badge[it[0]] + '</span>' : '') + '</a>').join('')
  ).join('');
}

function paint(){
  const v = current(), t = TITLES[v] || TITLES.overview;
  document.getElementById('vtitle').textContent = t[0];
  document.getElementById('vsub').textContent = t[1];
  renderNav();
  const el = document.getElementById('view');
  const fn = VIEWS[v] || VIEWS.overview;
  el.innerHTML = fn();
  if (v === 'clients') wireClients();
  if (v === 'invoices') wireInvoices();
  if (v === 'jarvis') wireJarvis();
  if (v === 'requests') wireRequests();
}

/* ---- Jarvis voice helpers ----
   jarvisHeard: the phrase heard in THIS listening session. Chrome (Android
   especially) fires onresult repeatedly, often re-sending the same or a growing
   copy of the phrase; appending each one typed the user's words several times.
   jarvisSpeak: read Jarvis's reply aloud after a spoken request. */
function jarvisHeard(ev){
  var parts = [];
  for (var i = 0; i < ev.results.length; i++) {
    var t = ((ev.results[i][0] && ev.results[i][0].transcript) || '').trim();
    if (!t) continue;
    var last = parts.length ? parts[parts.length - 1] : '';
    if (last && (t === last || t.toLowerCase().indexOf(last.toLowerCase()) === 0)) parts[parts.length - 1] = t;
    else if (last && last.toLowerCase().indexOf(t.toLowerCase()) === 0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
var JARVIS_SPOKEN = false;
var JARVIS_LANG = 'en', JARVIS_AUDIO = null, JARVIS_LAST = '';
try { JARVIS_LANG = localStorage.getItem('jarvis_lang') || 'en'; } catch (e) {}
function jarvisLangLabel(){ return JARVIS_LANG === 'ur' ? 'اردو' : 'EN'; }
function jarvisToggleLang(btn){
  JARVIS_LANG = JARVIS_LANG === 'ur' ? 'en' : 'ur';
  try { localStorage.setItem('jarvis_lang', JARVIS_LANG); } catch (e) {}
  if (btn) btn.textContent = jarvisLangLabel();
}
function jarvisRecLang(){ return JARVIS_LANG === 'ur' ? 'ur-PK' : 'en-US'; }
function jarvisBrowserSpeak(text){
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text)) ? 'ur-PK' : 'en-US';
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* Jarvis speaks through the server (Gemini voice, real Urdu); the browser's
   own voice is only the fallback when the server voice is busy. */
function jarvisSpeak(text){
  if (!text) return;
  text = String(text).slice(0, 600);
  JARVIS_LAST = text;
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  try { if (JARVIS_AUDIO) JARVIS_AUDIO.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  var h = {'Content-Type': 'application/json'};
  if (typeof TOKEN !== 'undefined' && TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  fetch('/console/speak', {method: 'POST', credentials: 'include', headers: h,
                           body: JSON.stringify({text: text, lang: urdu ? 'ur' : 'en'})})
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JARVIS_AUDIO = a; return a.play(); })
    .catch(function(){ jarvisBrowserSpeak(text); });
}
function jarvisListenBtn(cls){
  return ' <button class="' + cls + '" type="button" onclick="jarvisSpeak(JARVIS_LAST)" title="Hear this reply">&#128266; Listen</button>';
}
let JV_CLIENT = '';
async function jvLoadPosts(){
  const el = document.getElementById('jv-posts');
  if (!el || !JV_CLIENT) return;
  const q = '?tenant=' + encodeURIComponent(JV_CLIENT);
  el.innerHTML = '<div class="empty">Loading...</div>';
  let acc, ps;
  try { [acc, ps] = await Promise.all([api('/social/accounts' + q), api('/social/posts' + q)]); }
  catch (e) { el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const head = acc.connected
    ? '<div class="sub">Posting to: ' + esc(acc.pages.map(p => p.name + (p.instagram ? ' + Instagram' : '')).join(', ')) + '</div>'
    : '<div class="sub">This client has not connected Facebook yet. They connect it from their own dashboard (Jarvis, Connect Facebook).</div>';
  const rows = (ps.posts || []).map(p => {
    const res = p.results || {};
    const errs = Object.keys(res).filter(k => res[k] && !res[k].ok).map(k => k + ': ' + (res[k].error || 'failed'));
    const waiting = p.status === 'draft' || p.status === 'failed';
    return '<div class="card" style="padding:10px 12px;margin-top:8px"><div class="k-note">' +
      esc((p.platforms || []).join(' + ')) + ' · ' + esc(p.status) + ' · ' + when(p.created_at) + '</div>' +
      (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" style="max-width:200px;border-radius:8px;margin:6px 0;display:block">' : '') +
      '<div style="white-space:pre-wrap">' + esc(p.caption) + '</div>' +
      (errs.length ? '<div class="sub warn">' + esc(errs.join(' | ')) + '</div>' : '') +
      (waiting ? '<div class="k-note" style="margin-top:6px">Waiting for the client to approve.</div>' : '') +
      '</div>';
  });
  el.innerHTML = head + (rows.length ? rows.join('') : '<div class="empty">No posts yet for this client.</div>') +
    '<div id="jv-pmsg" class="sub" style="margin-top:6px"></div>';
  const msg = t => { const m = document.getElementById('jv-pmsg'); if (m) m.textContent = t; };
  el.querySelectorAll('[data-jpub]').forEach(b => b.onclick = async () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to post publicly'; return; }
    b.disabled = true; b.textContent = 'Posting...';
    try { const r = await api('/social/posts/' + b.dataset.jpub + '/publish' + q, {method: 'POST'});
          await jvLoadPosts(); msg('Result: ' + r.status); }
    catch (e) { await jvLoadPosts(); msg(e.message); }
  });
  el.querySelectorAll('[data-jdis]').forEach(b => b.onclick = async () => {
    try { await api('/social/posts/' + b.dataset.jdis + q, {method: 'DELETE'}); await jvLoadPosts(); msg('Discarded.'); }
    catch (e) { msg(e.message); }
  });
}
function wireJarvis(){
  const sel = document.getElementById('jv-client'), box = document.getElementById('jv-in');
  const go = document.getElementById('jv-go'), mic = document.getElementById('jv-mic');
  const lb = document.getElementById('jv-lang'); if (lb) lb.textContent = jarvisLangLabel();
  const out = document.getElementById('jv-out'), note = document.getElementById('jv-note');
  if (!sel) return;
  if (JV_CLIENT) sel.value = JV_CLIENT;
  sel.onchange = () => { JV_CLIENT = sel.value; out.innerHTML = ''; jvLoadPosts(); };
  if (sel.value) jvLoadPosts();
  const send = async () => {
    const msg = box.value.trim();
    if (!msg) return;
    if (!sel.value) { note.textContent = 'Pick a client first.'; return; }
    JV_CLIENT = sel.value;
    note.textContent = 'Thinking... (can take up to a minute)'; go.disabled = true;
    try {
      const d = await api('/console', {method:'POST', body: JSON.stringify({message: msg, tenant_id: sel.value})});
      box.value = '';
      let extra = '';
      if (d.kind === 'business') extra = (d.action === 'create' ? 'Added to ' : 'Updated in ') + (d.resource || '');
      if (d.kind === 'teach') extra = 'Their WhatsApp agent will now follow: ' + (d.lesson || '');
      if (d.kind === 'dashboard') extra = 'Dashboard changed: ' + JSON.stringify(d.changed || {});
      if (d.kind === 'post') { extra = 'Drafted. The client decides whether it goes out.'; jvLoadPosts(); }
      const name = sel.options[sel.selectedIndex].text;
      out.innerHTML = '<div class="card" style="padding:12px 14px"><div class="k-note">' + esc(name) +
        '</div><div>' + esc(d.reply || 'Done.') + '</div>' +
        (extra ? '<div class="sub" style="margin-top:6px">' + esc(extra) + '</div>' : '') + jarvisListenBtn('tiny') + '</div>';
      JARVIS_LAST = d.reply || 'Done.';
      note.textContent = '';
      if (JARVIS_SPOKEN) { jarvisSpeak(d.reply || 'Done.'); JARVIS_SPOKEN = false; }
    } catch (e) {
      note.textContent = e.message || 'Jarvis could not do that.';
      if (JARVIS_SPOKEN) { jarvisSpeak(note.textContent); JARVIS_SPOKEN = false; }
    }
    go.disabled = false;
  };
  go.onclick = send;
  box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const label = String.fromCodePoint(127908) + ' Speak';
  if (!SR) { mic.style.display = 'none'; return; }
  mic.textContent = label;
  let rec = null, on = false;
  mic.onclick = () => {
    if (on) { rec && rec.stop(); return; }
    try { rec = new SR(); } catch (e) { mic.style.display = 'none'; return; }
    rec.lang = jarvisRecLang(); rec.interimResults = false; rec.maxAlternatives = 1;
    on = true; mic.textContent = '... Listening';
    const base = box.value.trim();
    rec.onresult = ev => { const heard = jarvisHeard(ev);
      if (heard) { box.value = (base ? base + ' ' : '') + heard; JARVIS_SPOKEN = true; } };
    rec.onerror = rec.onend = () => { on = false; mic.textContent = label; };
    try { rec.start(); } catch (e) { on = false; mic.textContent = label; }
  };
}

function chart(months){
  if (!months || !months.length)
    return '<div class="empty">No payment recorded yet. Record one on a client row and this fills in.</div>';
  const max = Math.max.apply(null, months.map(m => Number(m.amount)));
  return '<div class="bars">' + months.map(m => '<div class="bar" title="' + esc(m.month) +
    ': ' + money(m.amount) + '"><i style="height:' + Math.max(2,(Number(m.amount)/max)*100) +
    '%"></i><span>' + esc(String(m.month).slice(5)) + '</span></div>').join('') +
    '</div><div class="sub">Tallest bar ' + money(max) + '.</div>';
}
function planCell(c){
  const u = D.usage && D.usage.clients && D.usage.clients[c.id], plans = (D.plans && D.plans.plans) || [];

      (p.price_pkr != null ? ' · ' + Math.round(p.price_pkr).toLocaleString('en-US') : '') + '</option>').join('') + '</select>';
  if (u) {

            '<td><span class="pill">' + esc(r.status) + '</span></td>' +
            '<td class="dim">' + when(r.issued_on) + '</td>' +
            '<td class="dim">' + when(r.due_on) + '</td>' +
            '<td class="dim">' + when(r.sent_at) + '</td>' +
            '<td>' + (r.status === 'draft' ? '<button class="tiny" data-send="' + esc(r.id) + '">Send</button>'
              : r.status === 'sent' ? '<button class="tiny" data-mpaid="' + esc(r.id) + '">Mark paid</button>' : '') + '</td></tr>').join('')) +
      '</div></section>';
  },
  health(){
    const h = D.health || {}, q = h.queue || {}, ai = D.ai || {};
    const dot = ok => '<span class="dot ' + (ok === true ? 'ok' : ok === false ? 'bad' : 'warn') + '"></span>';
    return '<div class="grid">' +
      kpi('Event queue', q.events != null ? q.events : '-', 'waiting to be picked up') +
      kpi('Task queue', q.tasks != null ? q.tasks : '-', 'waiting for the worker') +
      kpi('Stuck running', h.stuck_running != null ? h.stuck_running : '-', 'over 15 minutes',
          Number(h.stuck_running) ? 'bad' : 'good') +
      kpi('Tasks waiting', h.tasks_waiting != null ? h.tasks_waiting : '-', 'held behind a dependency') +
      kpi('Admin users', h.admin_users != null ? h.admin_users : '-', 'accounts that can see this page') +
      '</div>' +
      '<section><h2>Right now</h2><div class="card"><div class="health">' +
      '<div>' + dot(true) + 'API answering</div>' +
      '<div>' + dot(Number(q.tasks||0) < 50) + 'Worker draining</div>' +
      '<div>' + dot(ai.status === 'ok') + 'AI workforce ' + esc(ai.status || '?') + '</div>' +
      '<div>' + dot(!(D.inc && D.inc.open)) + ((D.inc && D.inc.open) || 0) + ' open incident(s)</div>' +
      '</div><div class="sub" style="margin-top:10px">Counted live. A red dot here is the same one ' +
      'the monitor sends to your phone.</div></div></section>';
  },
  incidents(){
    const rows = (D.inc && D.inc.incidents) || [];
    if (!rows.length) return '<div class="empty">No open incident. The monitor opens one here when ' +
      'something breaks and clears it when it recovers.</div>';
    return '<div class="card" style="padding:6px 8px">' +
      tbl('<th>Kind</th><th>Detail</th><th>Opened</th>',
        rows.map(i => '<tr><td class="name">' + esc(i.kind || i.type) + '</td><td class="dim">' +
          esc(i.detail || '') + '</td><td class="dim">' + when(i.opened_at || i.created_at) +
          '</td></tr>')) + '</div>';
  }
};

function wireClients(){
  const el = document.getElementById('view');
  el.querySelectorAll('[data-fee]').forEach(i => i.addEventListener('change', async () => {
    try { await api('/techdeva/clients/' + i.getAttribute('data-fee') + '/account',
      {method:'PUT', body: JSON.stringify({monthly_fee: i.value || 0})}); load(); }
    catch (e) { alert(e.message); }
  }));
  el.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const box = document.getElementById('pay-' + b.getAttribute('data-pay'));
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  });
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-save');
    try { await api('/techdeva/clients/' + id + '/payment', {method:'POST',
      body: JSON.stringify({amount: el.querySelector('[data-amt="' + id + '"]').value})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-plan]').forEach(sel => sel.onchange = async () => {
    try { await api('/techdeva/clients/' + sel.getAttribute('data-plan') + '/plan', {method:'PUT', body: JSON.stringify({plan_key: sel.value})});
          D.usage = null; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-psave]').forEach(b => b.onclick = async () => {
    const k = b.getAttribute('data-psave'), v = a => el.querySelector('[' + a + '="' + k + '"]').value;
    try { await api('/techdeva/plans/' + k, {method:'PUT', body: JSON.stringify({price_pkr: v('data-pp'), max_numbers: v('data-pn'), max_conversations: v('data-pc')})});
          b.textContent = 'Saved'; load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-trial]').forEach(b => b.onclick = async () => {
    try { await api('/techdeva/clients/' + b.getAttribute('data-trial') + '/trial', {method:'POST', body: JSON.stringify({days: 7})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-activate]').forEach(b => b.onclick = async () => {
    if (!confirm('Mark this business as a paying client? Its dashboard will never be locked by the trial.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-activate') + '/activate', {method:'POST'}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    if (!confirm('Hide this client from the book? Nothing is deleted.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-hide') + '/hide',
      {method:'POST', body: JSON.stringify({hidden:true})}); load(); }
    catch (e) { alert(e.message); }
  });
}

function openRequests(){
  const ag = (D.agents && D.agents.requests) || [], cl = (D.claims && D.claims.claims) || [],
        rs = (D.resets && D.resets.requests) || [];
  return ag.filter(a => a.status === 'requested' || a.status === 'failed').length +
         cl.filter(c => c.status === 'pending').length + rs.filter(r => r.delivered === 'pending').length;
}
function wireRequests(){
  const el = document.getElementById('view');
  const go = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await fn(b); } catch (e) { alert(e.message); b.disabled = false; }
  });
  go('[data-agok]', async b => { await api('/techdeva/agent-requests/' + b.getAttribute('data-agok') + '/approve', {method:'POST'}); load(); });
  go('[data-agno]', async b => {
    const why = prompt('What should the client read? (e.g. We will call you to set it up)', '');
    if (why === null) { b.disabled = false; return; }
    await api('/techdeva/agent-requests/' + b.getAttribute('data-agno') + '/reject', {method:'POST', body: JSON.stringify({reason: why})}); load();
  });
  go('[data-clok]', async b => {
    if (!confirm('You found this money in your account?')) { b.disabled = false; return; }
    await api('/techdeva/payment-claims/' + b.getAttribute('data-clok') + '/confirm', {method:'POST'}); load();
  });
  go('[data-clno]', async b => {
    const why = prompt('What should the client read?', 'We could not find this payment. Please send a screenshot on WhatsApp.');
    if (why === null) { b.disabled = false; return; }
    await api('/techdeva/payment-claims/' + b.getAttribute('data-clno') + '/reject', {method:'POST', body: JSON.stringify({reason: why})}); load();
  });
  go('[data-rslink]', async b => {
    const d = await api('/techdeva/password-resets/' + b.getAttribute('data-rslink') + '/link', {method:'POST'});
    const out = document.getElementById('rs-out');
    out.innerHTML = 'Link for ' + esc(d.email) + ' (one hour): <input readonly style="width:100%;margin-top:4px" value="' + esc(d.link) + '" onclick="this.select()">';
    b.disabled = false;
  });
  const save = document.getElementById('pay-how-save');
  if (save) save.onclick = async () => {
    const m = document.getElementById('pay-how-msg');
    try { await api('/techdeva/settings/payment_instructions', {method:'PUT', body: JSON.stringify({value: document.getElementById('pay-how').value})}); m.textContent = 'Saved.'; }
    catch (e) { m.textContent = e.message; }
  };
}

function wireInvoices(){
  const el = document.getElementById('view');
  const btn = document.getElementById('inv-create');
  if (btn) btn.onclick = async () => {
    const tid = document.getElementById('inv-tenant').value;
    const amount = document.getElementById('inv-amount').value;
    const currency = document.getElementById('inv-currency').value || 'PKR';
    const description = document.getElementById('inv-desc').value;
    const due_on = document.getElementById('inv-due').value || null;
    if (!tid) { alert('pick a client'); return; }
    try {
      await api('/techdeva/clients/' + tid + '/invoice', {method:'POST',
        body: JSON.stringify({amount, currency, description, due_on})});
      load();
    } catch (e) { alert(e.message); }
  };
  el.querySelectorAll('[data-mpaid]').forEach(b => b.onclick = async () => {
    const ref = prompt('Money arrived for this invoice. Reference / transaction ID (optional):', '');
    if (ref === null) return;
    try { await api('/techdeva/invoices/' + b.getAttribute('data-mpaid') + '/paid', {method:'POST', body: JSON.stringify({reference: ref})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    try { await api('/techdeva/invoices/' + b.getAttribute('data-send') + '/send', {method:'POST'}); load(); }
    catch (e) { alert(e.message); }
  });
}

api('/me').then(m => {
  document.getElementById('who').textContent = m.role || '';
  if (m.role === 'techdeva_admin') show();
}).catch(() => {});
