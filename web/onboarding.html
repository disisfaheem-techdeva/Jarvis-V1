<script>
/* Theme + brand colour, for pages served by FastAPI (web/*.html). Kept free of
   any product name: it is inlined into white-label partner pages too.
   sync.py inlines this into each page's <head>, so the saved theme applies
   before the first paint. Next.js has its own copy of the theme part
   (the Next.js portal's components/ui/theme.ts); both use the "td-theme" key.

   TD.toggleHTML()  markup for the light/dark switch, for script-rendered
                    headers. In static markup, <span data-td-theme-slot></span>
                    is replaced with it. Any [data-td-theme-toggle] works,
                    even if rendered later.
   TD.brand(hex)    a business's own accent colour. Works out readable text
                    on it and a readable text shade of it for the current
                    theme, so a light brand colour never gives white-on-white
                    buttons and a dark one never vanishes on the dark canvas. */
(function () {
  var KEY = "td-theme", doc = document.documentElement, brandHex = null;

  function theme() { return doc.dataset.theme === "light" ? "light" : "dark"; }

  function rgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(c) {
    var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(c, to, t) { return c.map(function (x, i) { return Math.round(x + (to[i] - x) * t); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function applyBrand() {
    var props = ["--accent", "--accent-hover", "--accent-ink", "--accent-tint", "--accent-line", "--fg-on-accent", "--ring"];
    if (!brandHex) { props.forEach(function (p) { doc.style.removeProperty(p); }); return; }
    var c = rgb(brandHex), white = [255, 255, 255], black = [0, 0, 0];
    var light = theme() === "light";
    var bg = light ? white : [10, 10, 15];
    // text on the accent fill: whichever of white or near-black reads better
    var on = contrast(c, white) >= contrast(c, [20, 16, 5]) ? white : [20, 16, 5];
    // the accent as text on the page: step it toward white (dark theme) or
    // black (light theme) until it reaches 4.5:1
    var ink = c, t = 0;
    while (contrast(ink, bg) < 4.5 && t < 1) { t += 0.05; ink = mix(c, light ? black : white, t); }
    var s = doc.style;
    s.setProperty("--accent", hex(c));
    s.setProperty("--accent-hover", hex(mix(c, on === white ? black : white, 0.12)));
    s.setProperty("--fg-on-accent", hex(on));
    s.setProperty("--accent-ink", hex(ink));
    s.setProperty("--ring", hex(ink));
    s.setProperty("--accent-tint", "rgb(" + c.join(" ") + " / " + (light ? 0.1 : 0.16) + ")");
    s.setProperty("--accent-line", "rgb(" + c.join(" ") + " / 0.4)");
  }

  function sync() {
    var light = theme() === "light";
    var btns = document.querySelectorAll("[data-td-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      btns[i].setAttribute("title", light ? "Dark theme" : "Light theme");
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = light ? "light" : "dark";
  }

  function set(next) {
    if (next === "light") doc.dataset.theme = "light"; else delete doc.dataset.theme;
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage blocked: lasts this page view */ }
    applyBrand();
    sync();
  }

  try { if (localStorage.getItem(KEY) === "light") doc.dataset.theme = "light"; } catch (e) { /* default dark */ }

  var SUN = '<svg class="td-i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg class="td-i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  window.TD = {
    theme: theme,
    setTheme: set,
    brand: function (h) { brandHex = h && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(h) ? h.slice(0, h.length === 9 ? 7 : h.length) : null; applyBrand(); },
    toggleHTML: function (cls) {
      var light = theme() === "light";
      return '<button type="button" class="td-theme-btn' + (cls ? " " + cls : "") + '" data-td-theme-toggle aria-label="' +
        (light ? "Switch to dark theme" : "Switch to light theme") + '" title="' + (light ? "Dark theme" : "Light theme") + '">' + SUN + MOON + "</button>";
    }
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-td-theme-toggle]");
    if (b) set(theme() === "light" ? "dark" : "light");
  });
  document.addEventListener("DOMContentLoaded", function () {
    // static pages: <span data-td-theme-slot="extra classes"></span> becomes the switch
    var slots = document.querySelectorAll("[data-td-theme-slot]");
    for (var i = 0; i < slots.length; i++) slots[i].outerHTML = window.TD.toggleHTML(slots[i].getAttribute("data-td-theme-slot"));
    sync();
  });
})();
</script>

<body class="td td-grain page-onboarding min-h-screen bg-bg text-fg">
<main class="mx-auto max-w-4xl px-4 pt-8 pb-20 sm:px-6">

  <header class="td-glass td-rim relative mb-6 flex flex-wrap items-end justify-between gap-4 overflow-hidden rounded-[var(--p-radius-xl)] px-6 py-7 sm:px-8">
    <div aria-hidden="true" class="td-ambient pointer-events-none absolute inset-0"></div>
    <div class="relative max-w-2xl">
      <div class="text-label font-medium text-accent-ink uppercase">TechDeva</div>
      <h1 id="bizname" class="mt-2 font-display text-3xl font-semibold tracking-tight sm:text-4xl">Set up your business</h1>
      <p class="mt-3 text-[15px] leading-relaxed text-fg-muted">Your AI team reads this. The more it knows, the more its work sounds like you
        instead of like a generic marketing agency. You can stop and come back — every step saves on its own.</p>
    </div>
    <div class="relative flex items-center gap-2"><span data-td-theme-slot></span>
    <a class="td-btn td-btn--secondary td-btn--sm" href="/dashboard">Back to dashboard</a></div>
  </header>

  <section aria-label="Progress" class="mb-6 rounded-[var(--card-radius)] border border-line bg-surface p-5">
    <div class="text-sm text-fg-muted"><b id="pct" class="mr-2 font-display text-2xl font-semibold text-fg">0%</b><span id="counts">loading…</span></div>
    <div class="my-3 h-2 overflow-hidden rounded-full bg-surface-3"><i id="fill" class="block h-full w-0 rounded-full bg-[linear-gradient(90deg,var(--p-violet-600),var(--p-violet-400))] transition-[width] duration-300"></i></div>
    <div class="flex flex-wrap gap-2" id="chips"></div>
  </section>

  <div class="err" id="err"></div>
  <div class="card" id="card"></div>

</main>

<script>
const STEPS = [
  {key:'brand',          title:'Your name, logo and colours',
   hint:'How your business is introduced. The AI uses the name and tagline in everything it writes.'},
  {key:'services',       title:'What you sell',
   hint:'Every treatment, service or course. The AI will only write about things on this list.'},
  {key:'price_list',     title:'What it costs',
   hint:'Your real prices. The AI is instructed never to quote a number that is not here.'},
  {key:'working_hours',  title:'When you are open',
   hint:'So the AI never offers a time you are closed.'},
  {key:'geo',            title:'Where you are',
   hint:'Used for local targeting and for answering "where are you located?"'},
  {key:'hermes_persona', title:'How your AI should sound',
   hint:'The voice your customers hear on WhatsApp. Language, tone, how it addresses people.'},
  {key:'locations', table:'locations', title:'Where you work',
   hint:'Each branch you take bookings for. One is fine.',
   cols:[{k:'name',ph:'Branch name',w:'1.3fr'},{k:'address',ph:'Address',w:'1.8fr'},
         {k:'city',ph:'City'},{k:'phone',ph:'Phone'}]},
  {key:'staff', table:'staff', title:'Who works there',
   hint:'The people customers book with. The AI will not offer a name that is not here.',
   cols:[{k:'name',ph:'Name',w:'1.3fr'},{k:'role',ph:'Role, e.g. therapist'},
         {k:'phone',ph:'Phone'}]},
  {key:'products', table:'products', title:'What you sell over the counter',
   hint:'Retail products, as opposed to services. Leave empty if you sell none.',
   optional:true,
   cols:[{k:'name',ph:'Product',w:'1.5fr'},{k:'sku',ph:'SKU'},{k:'price',ph:'Price'}]},
  {key:'business_goals', table:'business_goals', title:'What you are aiming for',
   hint:'What good looks like this month. Your reports measure against these.',
   optional:true,
   cols:[{k:'metric',ph:'Metric, e.g. revenue',w:'1.2fr'},{k:'target',ph:'Target'},
         {k:'period',ph:'Period, e.g. monthly'}]},
  {key:'booking_rules',  title:'How appointments work',
   hint:'Deposits, cancellation notice, whether you take walk-ins.'},
];

// signup seeds brand.website and geo.country, so "not empty" is not "filled in".
// These keys are what actually count as done.
// A phone photo of a logo is four megabytes and still a logo at 512px. SVG is
// already small and scaling it loses nothing, so it passes straight through.
function shrink(dataUrl, mime, done){
  if (mime === 'image/svg+xml') return done(dataUrl);
  const img = new Image();
  img.onload = function(){
    const max = 512;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    done(c.toDataURL(mime === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.9));
  };
  img.onerror = function(){ done(dataUrl); };
  img.src = dataUrl;
}

const REQUIRED = {brand:['name'], geo:['city'], working_hours:['mon_sat'], booking_rules:['cancellation_hours']};
function stepDone(key, v) {
  if (v == null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'string') return v.trim().length > 0;
  if (typeof v === 'object') {
    const need = REQUIRED[key];
    if (need) return need.some(k => String(v[k] ?? '').trim().length > 0);
    return Object.keys(v).length > 0;
  }
  return Boolean(v);
}
let CFG = {}, STATE = null, current = 0;
// Steps backed by a table read their state from the table, not from tenant_config.
// A step is finished when the business actually has the rows, which is the only
// thing the AI and the money screens can use.
let ROWS = {};
async function loadRows(){
  const tables = STEPS.filter(x => x.table).map(x => x.table);
  await Promise.all(tables.map(async t => {
    try { const r = await api('/business/' + t); ROWS[t] = (r && r.items) || []; }
    catch (e) { ROWS[t] = []; }
  }));
}
function isDone(step){
  if (step.table) return (ROWS[step.table] || []).length > 0 || step.optional === true;
  return stepDone(step.key, CFG[step.key]);
}
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({credentials:'include'}, opts,
    {headers: Object.assign({'Content-Type':'application/json'}, opts.headers||{})}));
  if (r.status === 401) { location.href = '/portal'; throw new Error('signed out'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = body.detail;   // one sentence; older servers sent a list of objects
    throw new Error(typeof d === 'string' && d ? d : Array.isArray(d) && d.length
      ? d.map(x => (x && x.msg ? String(x.msg).replace('Value error, ', '') : String(x))).join('. ')
      : 'Could not save (' + r.status + '). Please try again.');
  }
  return body;
}
function showErr(m){ const e=$('err'); e.textContent=m; e.style.display='block'; }
function clearErr(){ $('err').style.display='none'; }

function renderProgress() {
  const done = new Set(STEPS.filter(s => isDone(s)).map(s => s.key));
  STATE.complete = done.size;
  STATE.percent = Math.round(100 * done.size / STEPS.length);
  STATE.missing = STEPS.filter(s => !done.has(s.key)).map(s => ({key:s.key, label:s.title}));
  $('pct').textContent = STATE.percent + '%';
  $('counts').textContent = STATE.complete + ' of ' + STEPS.length + ' steps done';
  $('fill').style.width = STATE.percent + '%';
  $('chips').innerHTML = '';
  STEPS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (done.has(s.key) ? ' done' : '') + (i === current ? ' on' : '');
    b.textContent = (done.has(s.key) ? '✓ ' : '') + s.title;
    b.onclick = () => { current = i; render(); };
    $('chips').appendChild(b);
  });
}

function field(label, id, value, ph) {
  return '<div><label for="'+id+'">'+label+'</label>' +
         '<input id="'+id+'" value="'+(value==null?'':String(value).replace(/"/g,'&quot;'))+
         '" placeholder="'+(ph||'')+'"></div>';
}

function rowsEditor(containerId, rows, cols, addLabel) {
  const box = document.createElement('div');
  box.className = 'items';
  box.id = containerId;
  const draw = () => {
    box.innerHTML = '';
    rows.forEach((r, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      // one track per column, plus a narrow one for Remove - otherwise it wraps
      d.style.gridTemplateColumns = cols.map(c => c.w || '1fr').join(' ') + ' auto';
      d.innerHTML = cols.map(c =>
        '<input data-k="'+c.k+'" placeholder="'+c.ph+'" value="'+
        (r[c.k]==null?'':String(r[c.k]).replace(/"/g,'&quot;'))+'">').join('') +
        '<button class="del" title="Remove">Remove</button>';
      d.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => { r[inp.dataset.k] = inp.value; };
      });
      d.querySelector('.del').onclick = () => { rows.splice(i,1); draw(); };
      box.appendChild(d);
    });
  };
  draw();
  const add = document.createElement('button');
  add.className = 'add';
  add.textContent = addLabel;
  add.onclick = () => { rows.push({}); draw(); };
  const frag = document.createDocumentFragment();
  frag.appendChild(box); frag.appendChild(add);
  return frag;
}

function render() {
  clearErr();
  renderProgress();
  const s = STEPS[current];
  const c = $('card');
  c.innerHTML = '<h2>' + s.title + '</h2><p class="hint">' + s.hint + '</p>';
  const body = document.createElement('div');
  let collect = () => ({});


  if (s.table) {
    const rows = (ROWS[s.table] || []).map(r => {
      const copy = {__id: r.id};
      s.cols.forEach(c => { copy[c.k] = r[c.k] == null ? '' : String(r[c.k]); });
      return copy;
    });
    body.innerHTML = '';
    body.appendChild(rowsEditor('box_' + s.key, rows, s.cols, '+ Add'));
    collect = () => rows;
  }
  else if (s.key === 'brand') {

    const b = CFG.brand || {};
    body.innerHTML =
      '<div class="row row2">' + field('Business name','f_name',b.name,'The Beauty Aesthetic & Lounge') +
      field('Website','f_web',b.website,'https://yourbusiness.com') + '</div>' +
      '<div class="row">' + field('One line about you','f_tag',b.tagline,'Doctor-led aesthetic clinic and academy') + '</div>' +
      '<div class="row"><label>Your logo</label>' +
        '<input type="file" id="f_logo_file" accept="image/png,image/jpeg,image/webp,image/svg+xml">' +
        '<div class="hint" id="f_logo_note">A PNG or JPG from your phone is fine. It sits behind your dashboard.</div>' +
        '<div id="f_logo_prev" style="margin-top:8px"></div></div>' +
      '<div class="row row2">' + field('Logo image URL (optional)','f_logo',b.logo,'only if it is already online') +
      field('Brand colour','f_col',(b.colors||{}).accent,'#3AA0D4') + '</div>';
    const fileInput = body.querySelector('#f_logo_file');
    if (fileInput) fileInput.onchange = function(){
      const f = fileInput.files && fileInput.files[0];
      const note = $('f_logo_note'), prev = $('f_logo_prev');
      if (!f) return;
      if (!/^image\//.test(f.type)) { note.textContent = 'That is not an image.'; return; }
      note.textContent = 'Reading...';
      const fr = new FileReader();
      fr.onload = function(){
        shrink(String(fr.result), f.type, function(dataUrl){
          prev.innerHTML = '<img src="' + dataUrl + '" alt="" style="max-height:64px;border-radius:8px">';
          note.textContent = 'Saving...';
          fetch('/brand/logo', {method:'POST', credentials:'same-origin',
                headers:{'content-type':'application/json'},
                body: JSON.stringify({image: dataUrl})})
            .then(r => r.json().then(d => ({ok:r.ok, d})))
            .then(x => { note.textContent = x.ok ? 'Saved. This is now your dashboard background.'
                                                 : (x.d && x.d.detail) || 'Could not save that image.'; })
            .catch(() => { note.textContent = 'Could not save that image.'; });
        });
      };
      fr.readAsDataURL(f);
    };

    collect = () => ({brand: Object.assign({}, b, {
      name: $('f_name').value.trim(), website: $('f_web').value.trim(),
      tagline: $('f_tag').value.trim(), logo: $('f_logo').value.trim(),
      colors: Object.assign({}, b.colors||{}, {accent: $('f_col').value.trim()})
    })});
  }

  else if (s.key === 'services') {
    const rows = Array.isArray(CFG.services) ? CFG.services.slice() : [];
    if (!rows.length) rows.push({});
    body.appendChild(rowsEditor('svc', rows,
      [{k:'name',ph:'Hair PRP',w:'1.6fr'},{k:'category',ph:'treatment or course',w:'1fr'},{k:'duration_min',ph:'minutes',w:'.7fr'}],
      '+ Add a service'));
    collect = () => ({services: rows.filter(r => (r.name||'').trim())
      .map(r => ({name:r.name.trim(), category:(r.category||'').trim()||'service',
                  duration_min: parseInt(r.duration_min,10) || 0}))});
  }

  else if (s.key === 'price_list') {
    let rows = Array.isArray(CFG.price_list) ? CFG.price_list.slice() : [];
    if (!rows.length) {
      rows = (CFG.services||[]).map(x => ({service:x.name, price:'', currency:'PKR'}));
      if (!rows.length) rows = [{currency:'PKR'}];
    }
    body.appendChild(rowsEditor('pl', rows,
      [{k:'service',ph:'Hair PRP',w:'1.5fr'},{k:'price',ph:'12000',w:'.8fr'},{k:'note',ph:'per session (optional)',w:'1.2fr'}],
      '+ Add a price'));
    const cur = document.createElement('div');
    cur.className = 'row';
    cur.innerHTML = field('Currency','f_cur', (rows[0]||{}).currency || 'PKR', 'PKR');
    body.appendChild(cur);
    collect = () => {
      const currency = ($('f_cur').value || 'PKR').trim();
      return {price_list: rows.filter(r => (r.service||'').trim())
        .map(r => ({service:r.service.trim(), price: Number(r.price)||0,
                    currency, note:(r.note||'').trim()||undefined}))};
    };
  }

  else if (s.key === 'working_hours') {
    const w = CFG.working_hours || {};
    body.innerHTML =
      '<div class="row row2">' + field('Monday to Saturday','f_ms', w.mon_sat, '11:00-20:00') +
      field('Sunday','f_sun', w.sun, 'closed') + '</div>' +
      '<div class="row">' + field('Anything else worth knowing','f_wnote', w.note, 'closed on public holidays') + '</div>';
    collect = () => ({working_hours:{mon_sat:$('f_ms').value.trim(), sun:$('f_sun').value.trim(),
                                     note:$('f_wnote').value.trim()}});
  }

  else if (s.key === 'geo') {
    const g = CFG.geo || {};
    body.innerHTML =
      '<div class="row row2">' + field('City','f_city',g.city,'Lahore') +
      field('Area','f_area',g.area,'Gulberg III') + '</div>' +
      '<div class="row row2">' + field('Country','f_ctry',g.country||'PK','PK') +
      field('Full address','f_addr',g.address,'optional') + '</div>';
    collect = () => ({geo:{city:$('f_city').value.trim(), area:$('f_area').value.trim(),
                           country:$('f_ctry').value.trim(), address:$('f_addr').value.trim()}});
  }

  else if (s.key === 'hermes_persona') {
    const v = CFG.hermes_persona || '';
    body.innerHTML =
      '<div class="row"><label for="f_p">Describe the voice</label>' +
      '<textarea id="f_p" placeholder="Warm Pakistani female consultant. Roman Urdu and English mixed, ' +
      'Latin letters only. Uses ji, Madam, Sir. Short replies. Never quotes a price that is not in the price list.' +
      '">' + v.replace(/</g,'&lt;') + '</textarea></div>' +
      '<p class="note">Say what language, how formal, how long the replies should be, and anything it must never do.</p>';
    collect = () => ({hermes_persona: $('f_p').value.trim()});
  }

  else if (s.key === 'booking_rules') {
    const r = CFG.booking_rules || {};
    body.innerHTML =
      '<div class="row row2">' + field('Deposit required?','f_dep', r.deposit_required ? 'yes':'no','yes or no') +
      field('Cancellation notice (hours)','f_can', r.cancellation_hours, '24') + '</div>' +
      '<div class="row row2">' + field('Do you take walk-ins?','f_walk', r.walk_ins===false?'no':'yes','yes or no') +
      field('Anything else','f_bnote', r.note, 'optional') + '</div>';
    collect = () => ({booking_rules:{
      deposit_required: /^y/i.test($('f_dep').value.trim()),
      cancellation_hours: parseInt($('f_can').value,10) || 0,
      walk_ins: !/^n/i.test($('f_walk').value.trim()),
      note: $('f_bnote').value.trim()}});
  }

  c.appendChild(body);

  const foot = document.createElement('div');
  foot.className = 'foot';
  const save = document.createElement('button');
  save.className = 'primary';
  save.textContent = current === STEPS.length - 1 ? 'Save and finish' : 'Save and continue';
  const skip = document.createElement('button');
  skip.className = 'ghost';
  skip.textContent = 'Skip for now';
  skip.onclick = () => { if (current < STEPS.length-1) { current++; render(); } else { finish(); } };
  const ok = document.createElement('span');
  ok.className = 'saved'; ok.textContent = 'Saved';
  foot.appendChild(save); foot.appendChild(skip); foot.appendChild(ok);
  c.appendChild(foot);

  save.onclick = async () => {
    clearErr();
    save.disabled = true;
    try {
      if (s.table) {
        // Rows go to the real table. Nothing is deleted here: a row the owner
        // cleared is simply not sent, and removing one is done from the dashboard,
        // where the consequences of deleting a member of staff are visible.
        const rows = collect();
        const named = rows.filter(r => String(r[s.cols[0].k] || '').trim());
        for (const r of named) {
          const payload = {};
          s.cols.forEach(c => {
            const v = String(r[c.k] == null ? '' : r[c.k]).trim();
            if (v !== '') payload[c.k] = v;
          });
          if (r.__id) await api('/business/' + s.table + '/' + r.__id,
                                {method:'PATCH', body: JSON.stringify(payload)});
          else await api('/business/' + s.table,
                         {method:'POST', body: JSON.stringify(payload)});
        }
        await loadRows();
        renderProgress();
      } else {
        const patch = collect();
        const res = await api('/portal/config', {method:'PUT', body: JSON.stringify(patch)});
        CFG = res.config; STATE = res.onboarding;
      }
      ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 1400);
      if (current < STEPS.length - 1) { current++; render(); }
      else { finish(); }
    } catch (e) { showErr(e.message); }
    save.disabled = false;
  };
}

function finish() {
  renderProgress();
  const left = STATE.missing.length;
  $('card').innerHTML =
    '<div class="done-panel"><div class="big">' + (left ? '◐' : '✓') + '</div>' +
    '<h2>' + (left ? 'Saved — ' + left + ' step' + (left>1?'s':'') + ' still empty' : 'Your business is set up') + '</h2>' +
    '<p class="hint" style="margin:8px auto 0">' +
    (left ? 'Your AI team can work with what it has, but it will do better once the rest is filled in.'
          : 'Your AI team now knows your services, your prices and your voice. Its next run will use them.') +
    '</p><div class="foot" style="justify-content:center">' +
    '<a class="primary" style="text-decoration:none" href="/dashboard">Go to your dashboard</a></div>' +
    (left ? '<p class="note">Still empty: ' + STATE.missing.map(m=>m.label).join(' · ') + '</p>' : '') +
    '</div>';
}

(async () => {
  try {
    const res = await api('/portal/config');
    CFG = res.config || {}; STATE = res.onboarding;
    await loadRows();
    if ((CFG.brand||{}).name) $('bizname').textContent = CFG.brand.name;
    const firstMissing = STEPS.findIndex(s => !isDone(s));
    current = firstMissing === -1 ? 0 : firstMissing;
    render();
  } catch (e) { showErr(e.message); }
})();
</script>
</body>
</html>
