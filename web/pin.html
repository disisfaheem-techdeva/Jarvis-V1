<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff login</title>
<meta name="robots" content="noindex">

<!-- @td-theme:start -->
<script>
/* Theme + brand colour, for pages served by FastAPI (web/*.html). Kept free of
   any product name: it is inlined into white-label partner pages too.
   sync.py inlines this into each page's <head>, so the saved theme applies
   before the first paint. Next.js has its own copy of the theme part
   (the Next.js portal's components/ui/theme.ts); both use the "td-theme" key.

   TD.toggleHTML()  markup for the light/dark switch, for script-rendered
                    headers. In static markup, <span data-td-theme-slot></span>
                    is replaced with it. Any [data-td-theme-toggle] works,
                    even if rendered later.
   TD.brand(hex)    a business's own accent colour. Works out readable text
                    on it and a readable text shade of it for the current
                    theme, so a light brand colour never gives white-on-white
                    buttons and a dark one never vanishes on the dark canvas. */
(function () {
  var KEY = "td-theme", doc = document.documentElement, brandHex = null;

  function theme() { return doc.dataset.theme === "light" ? "light" : "dark"; }

  function rgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(c) {
    var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(c, to, t) { return c.map(function (x, i) { return Math.round(x + (to[i] - x) * t); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function applyBrand() {
    var props = ["--accent", "--accent-hover", "--accent-ink", "--accent-tint", "--accent-line", "--fg-on-accent", "--ring"];
    if (!brandHex) { props.forEach(function (p) { doc.style.removeProperty(p); }); return; }
    var c = rgb(brandHex), white = [255, 255, 255], black = [0, 0, 0];
    var light = theme() === "light";
    var bg = light ? white : [10, 10, 15];
    // text on the accent fill: whichever of white or near-black reads better
    var on = contrast(c, white) >= contrast(c, [20, 16, 5]) ? white : [20, 16, 5];
    // the accent as text on the page: step it toward white (dark theme) or
    // black (light theme) until it reaches 4.5:1
    var ink = c, t = 0;
    while (contrast(ink, bg) < 4.5 && t < 1) { t += 0.05; ink = mix(c, light ? black : white, t); }
    var s = doc.style;
    s.setProperty("--accent", hex(c));
    s.setProperty("--accent-hover", hex(mix(c, on === white ? black : white, 0.12)));
    s.setProperty("--fg-on-accent", hex(on));
    s.setProperty("--accent-ink", hex(ink));
    s.setProperty("--ring", hex(ink));
    s.setProperty("--accent-tint", "rgb(" + c.join(" ") + " / " + (light ? 0.1 : 0.16) + ")");
    s.setProperty("--accent-line", "rgb(" + c.join(" ") + " / 0.4)");
  }

  function sync() {
    var light = theme() === "light";
    var btns = document.querySelectorAll("[data-td-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      btns[i].setAttribute("title", light ? "Dark theme" : "Light theme");
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = light ? "light" : "dark";
  }

  function set(next) {
    if (next === "light") doc.dataset.theme = "light"; else delete doc.dataset.theme;
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage blocked: lasts this page view */ }
    applyBrand();
    sync();
  }

  try { if (localStorage.getItem(KEY) === "light") doc.dataset.theme = "light"; } catch (e) { /* default dark */ }

  var SUN = '<svg class="td-i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg class="td-i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  window.TD = {
    theme: theme,
    setTheme: set,
    brand: function (h) { brandHex = h && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(h) ? h.slice(0, h.length === 9 ? 7 : h.length) : null; applyBrand(); },
    toggleHTML: function (cls) {
      var light = theme() === "light";
      return '<button type="button" class="td-theme-btn' + (cls ? " " + cls : "") + '" data-td-theme-toggle aria-label="' +
        (light ? "Switch to dark theme" : "Switch to light theme") + '" title="' + (light ? "Dark theme" : "Light theme") + '">' + SUN + MOON + "</button>";
    }
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-td-theme-toggle]");
    if (b) set(theme() === "light" ? "dark" : "light");
  });
  document.addEventListener("DOMContentLoaded", function () {
    // static pages: <span data-td-theme-slot="extra classes"></span> becomes the switch
    var slots = document.querySelectorAll("[data-td-theme-slot]");
    for (var i = 0; i < slots.length; i++) slots[i].outerHTML = window.TD.toggleHTML(slots[i].getAttribute("data-td-theme-slot"));
    sync();
  });
})();
</script>
<!-- @td-theme:end -->
<!-- @td-fonts:start -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<!-- @td-fonts:end -->
<!-- @td-css:start -->
<link rel="stylesheet" href="/assets/td.css?v=68e64eb405">
<!-- @td-css:end -->
</head>
<body class="td page-pin bg-bg text-fg">
<span data-td-theme-slot="td-theme-float"></span>
<div id="bgmark"></div>
<div class="card" id="card"><div class="tag" role="status">Loading…</div></div>
<script>
(function(){
  var card = document.getElementById('card'), code = '', DEV = null;   // DEV: this screen's own business, if it is a reception screen
  try { code = localStorage.getItem('td_pin_code') || ''; } catch (e) {}
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function j(method, path, body){
    return fetch(path, {method: method, credentials: 'include', headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return {ok: r.ok, status: r.status, data: d}; }); })
      .catch(function(){ return {ok: false, status: 0, data: {detail: 'Network error. Try again.'}}; });
  }
  function initials(n){ var w = String(n || '').replace(/^(dr|mr|mrs|ms)\.?\s+/i, '').split(/\s+/).filter(Boolean); return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }
  function dress(info){
    if (info.accent) { if (window.TD) TD.brand(info.accent); else document.documentElement.style.setProperty('--accent', info.accent); }
    document.title = (info.business || 'Staff') + ' · Staff login';
    document.getElementById('bgmark').style.backgroundImage = info.logo ? 'url("' + info.logo + '")' : 'none';
  }
  function askCode(msg){
    dress({});
    card.innerHTML = '<div class="logo">🔒</div><h1>Staff login</h1><div class="tag">Enter your business code. The owner can see it on the Team page.</div>' +
      '<label for="code">BUSINESS CODE</label><input id="code" class="code" maxlength="8" autocomplete="off" value="' + esc(code) + '">' +
      '<button id="next">Next</button><div class="msg" id="msg">' + esc(msg || '') + '</div>' +
      '<div class="links">' + (DEV ? '<a href="#" id="back">Back to ' + esc(DEV.business) + '</a> · ' : '') + '<a href="/dashboard?email=1">Owner? Sign in with email</a></div>';
    var go = function(){
      var c = document.getElementById('code').value.trim().toUpperCase();
      if (c.length < 4) { document.getElementById('msg').textContent = 'Enter the business code.'; return; }
      j('GET', '/auth/pin-info?code=' + encodeURIComponent(c)).then(function(r){
        if (!r.ok) { askCode((r.data && r.data.detail) || 'That code did not work.'); return; }
        code = c; try { localStorage.setItem('td_pin_code', c); } catch (e) {}
        pad(r.data, false);
      });
    };
    document.getElementById('next').onclick = go;
    var back = document.getElementById('back');
    if (back) back.onclick = function(e){ e.preventDefault(); try { localStorage.removeItem('td_pin_pref'); } catch (x) {} pad(DEV, true); };
    document.getElementById('code').onkeydown = function(e){ if (e.key === 'Enter') go(); };
    document.getElementById('code').focus();
  }
  function pad(info, device){
    dress(info);
    var mark = info.logo ? '<div class="logo" style="background-image:url(&quot;' + esc(info.logo) + '&quot;)"></div>'
                         : '<div class="logo">' + esc(initials(info.business)) + '</div>';
    card.innerHTML = mark + '<h1>' + esc(info.business) + '</h1><div class="tag">' + esc(info.tagline || 'Staff login') + '</div>' +
      '<label for="pin">ENTER PIN</label>' +
      '<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="• • • •">' +
      '<button id="go">Login</button><div class="msg" id="msg"></div>' +
      '<div class="foot">Authorized staff only • PIN required</div>' +
      '<div class="links"><a href="#" id="chg">Different business</a> · <a href="/dashboard?email=1">Owner email login</a></div>';
    var inp = document.getElementById('pin'), btn = document.getElementById('go'), msg = document.getElementById('msg');
    inp.oninput = function(){ inp.value = inp.value.replace(/\D/g, '').slice(0, 6); msg.textContent = ''; };
    function submit(){
      var pin = inp.value;
      if (pin.length < 4) { msg.textContent = 'Enter your 4 to 6 digit PIN.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      j('POST', '/auth/pin', {pin: pin, code: device ? undefined : code}).then(function(r){
        if (r.ok) { location.href = '/dashboard'; return; }
        btn.disabled = false; btn.textContent = 'Login'; inp.value = ''; inp.focus();
        msg.textContent = (r.data && r.data.detail) || 'That did not work.';
      });
    }
    btn.onclick = submit;
    inp.onkeydown = function(e){ if (e.key === 'Enter') submit(); };
    var chg = document.getElementById('chg');
    if (chg) chg.onclick = function(e){ e.preventDefault(); try { localStorage.setItem('td_pin_pref', 'code'); } catch (x) {} askCode(''); };
    inp.focus();
  }
  j('GET', '/auth/pin-info').then(function(r){
    var pref = ''; try { pref = localStorage.getItem('td_pin_pref') || ''; } catch (e) {}
    if (r.ok && r.data.device) DEV = r.data;
    // someone chose "Different business" on this screen: keep their business
    if (r.ok && r.data.device && !(pref === 'code' && code)) { pad(r.data, true); return; }
    if (code) {
      j('GET', '/auth/pin-info?code=' + encodeURIComponent(code)).then(function(r2){
        if (r2.ok && r2.data.business) pad(r2.data, false); else askCode('');
      });
    } else askCode('');
  });
})();
</script>
</body>
</html>
