   GST %, live bill, department, date, time, booked / assisted / procedure by,
   amount received, payment method, balance, sessions, next visit, status,
   notes). Saving writes the appointment and its bill in one go. */
(function(){
  var st = document.createElement('style');
  st.textContent =
    '.mdl-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}' +
    '.mdl{background:var(--panel,#161616);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:18px 18px 12px}' +
    '.mdl h3{margin:0 0 12px}' +
    '.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0}' +
    '.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}' +
    '.fgrid .fld{width:100%;box-sizing:border-box}' +
    '.svrow{display:grid;grid-template-columns:2fr 1fr 70px 1fr 34px;gap:6px;margin:6px 0}' +
    '@media(max-width:560px){.svrow{grid-template-columns:1fr 1fr}}' +
    '.billbox{background:rgba(201,168,76,.07);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.9}' +
    '.billbox b{float:right}' +
    '.apt-tbl td,.apt-tbl th{white-space:nowrap}' +
    '.bal-due{color:var(--danger,#e05555);font-weight:700}.bal-ok{color:var(--growth,#3fb96f);font-weight:700}';
  document.head.appendChild(st);
})();

var SOURCES = [['whatsapp','WhatsApp'],['facebook','Facebook'],['instagram','Instagram'],['website','Website'],
               ['google','Google'],['walk-in','Walk-in'],['referral','Referral'],['phone','Phone'],['other','Other']];
function sourceLabel(v){
  if (!v) return '—';
  for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i][0] === String(v).toLowerCase()) return SOURCES[i][1];
  return String(v);
}
function sourceSelect(id, sel, blank){
  return '<select class="fld" id="' + id + '">' + '<option value="">' + esc(blank || 'Source…') + '</option>' +
    SOURCES.map(function(s){ return '<option value="' + s[0] + '"' + (String(sel || '').toLowerCase() === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') +
    (sel && !SOURCES.some(function(s){ return s[0] === String(sel).toLowerCase(); }) ? '<option value="' + esc(sel) + '" selected>' + esc(sel) + '</option>' : '') +
    '</select>';
}
function isOwner(){ return !!(S.me && (S.me.role === 'owner' || S.me.role === 'techdeva_admin')); }
/* Real rows only: onboarding fallback items come back with id null. */
function realItems(key){ return items(key).filter(function(x){ return x.id; }); }

var APT = { from: null, to: null, all: false, status: '', q: '', data: undefined, loading: false,
            form: null, lines: [], busy: false, delArm: null };
var APT_STATUS = { booked: 'Scheduled', completed: 'Completed', cancelled: 'Cancelled', no_show: 'No Show' };
var APT_METHODS = [['cash','Cash'],['jazzcash','JazzCash'],['easypaisa','EasyPaisa'],['bank','Online / Bank Transfer'],['card','Card'],['other','Other']];

function aptQuery(){
  var q = APT.all ? '?include_unlinked=true' : ('?start=' + APT.from + '&end=' + APT.to + '&include_unlinked=true');
  if (APT.status) q += '&status=' + encodeURIComponent(APT.status);
  if (APT.q) q += '&q=' + encodeURIComponent(APT.q);
  return q;
}
function aptLoad(force){
  if (APT.loading || (APT.data !== undefined && !force)) return;
  APT.loading = true;
  api('/appointments/list' + aptQuery()).then(function(r){
    APT.loading = false;
    APT.data = r.ok ? r.data : { error: (r.data && r.data.detail) || ('The appointments service returned ' + r.status + '.') };
    renderShell();
  });
}
function aptMoney(v, cur){ return money(v || 0, cur); }
function aptBill(){
  var sub = 0, ld = 0;
  APT.lines.forEach(function(l){ sub += (Number(l.price) || 0) * (Number(l.qty) || 1); ld += Number(l.discount) || 0; });
  var dt = val('ap_dtype') || 'flat', dv = numv('ap_dval') || 0, gst = numv('ap_gst') || 0;
  var bd = dt === 'percent' ? (sub - ld) * dv / 100 : dv;
  var disc = Math.round((ld + bd) * 100) / 100;
  var tax = Math.round((sub - disc) * gst) / 100;
  var total = Math.round((sub - disc + tax) * 100) / 100;
  var rec = numv('ap_recv') || 0;
  return { sub: sub, disc: disc, tax: tax, total: total, rec: rec, bal: Math.round((total - rec) * 100) / 100 };
}
function aptCur(){ return (val('ap_cur') || 'PKR').toUpperCase(); }
function aptBillHTML(){
  if (!APT.lines.length) return 'Add a service to see the bill.';
  var b = aptBill(), c = aptCur();
  return 'Subtotal <b>' + aptMoney(b.sub, c) + '</b><br>Discount <b>- ' + aptMoney(b.disc, c) + '</b><br>GST <b>' + aptMoney(b.tax, c) +
         '</b><br><span style="font-size:15px">Total <b>' + aptMoney(b.total, c) + '</b></span><br>Received now <b>' + aptMoney(b.rec, c) +
         '</b><br>Remaining balance <b class="' + (b.bal > 0.004 ? 'bal-due' : 'bal-ok') + '">' + aptMoney(Math.max(b.bal, 0), c) + '</b>';
}
function aptRefreshBill(){
  var el = document.getElementById('ap_bill'); if (el) el.innerHTML = aptBillHTML();
  var b = document.getElementById('ap_balance'); if (b) b.value = APT.lines.length ? Math.max(aptBill().bal, 0) : '';
}
/* a: an appointment row to edit, or null for a new one.
   preset: {customer:{id,name,phone}, date, status} for a new one opened from
   Daily Entry or a customer's history. */
function aptOpen(a, preset){
  APT.form = a ? { id: a.id, edit: true, a: a } : { edit: false, a: {}, preset: preset || {} };
  APT.lines = [];
  need('services', '/business/services'); need('staff', '/business/staff');
  need('packages', '/business/packages'); need('locations', '/business/locations');
  renderShell();
}
function aptLinesHTML(){
  if (!APT.lines.length) return '<div class="card-note">No services yet. Pick one above and press Add.</div>';
  return APT.lines.map(function(l, i){
    return '<div class="svrow"><input class="fld" value="' + esc(l.name) + '" data-apl="' + i + '" data-k="name"' + (l.package_id ? ' title="Package"' : '') + '>' +
      '<input class="fld" type="number" min="0" value="' + esc(l.price) + '" data-apl="' + i + '" data-k="price" title="Price">' +
      '<input class="fld" type="number" min="1" value="' + esc(l.qty) + '" data-apl="' + i + '" data-k="qty" title="Qty">' +
      '<input class="fld" type="number" min="0" value="' + esc(l.discount) + '" data-apl="' + i + '" data-k="discount" title="Discount on this line">' +
      '<button class="btn" data-aprm="' + i + '" title="Remove">&times;</button></div>';
  }).join('');
}
function aptPickList(){
  // Services (saved rows and, until they are saved, the onboarding list) and packages.
  var out = [];
  items('services').forEach(function(s, i){
    out.push({ key: s.id ? 's:' + s.id : 'o:' + i, name: s.name, price: s.price, service_id: s.id || null, package_id: null });
  });
  realItems('packages').forEach(function(p){
    if (p.active === false) return;
    out.push({ key: 'k:' + p.id, name: p.name + ' (package)', price: p.price, service_id: null, package_id: p.id, pname: p.name });
  });
  return out;
}
function aptFormHTML(){
  var f = APT.form, a = f.a || {}, pre = f.preset || {};
  var staff = realItems('staff'), locs = realItems('locations');
  var opts = function(list, sel){ return list.map(function(x){ return '<option value="' + esc(x.id) + '"' + (String(sel) === String(x.id) ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join(''); };
  var stOpts = Object.keys(APT_STATUS).map(function(k){ return '<option value="' + k + '"' + ((a.status || pre.status || 'booked') === k ? ' selected' : '') + '>' + APT_STATUS[k] + '</option>'; }).join('');
  var dl = '<datalist id="ap_staffnames">' + staff.map(function(s){ return '<option value="' + esc(s.name) + '">'; }).join('') + '</datalist>';
  var body = '<h3>' + (f.edit ? 'Edit Appointment' : (pre.title || 'Add Appointment')) + '</h3>' + dl;
  if (!f.edit) {
    if (pre.customer && pre.customer.id) {
      body += '<div class="card-note">Client: <strong>' + esc(pre.customer.name) + '</strong> ' + esc(pre.customer.phone || '') + '</div>';
    } else {
      body += '<div class="fgrid"><div><label>Name</label><input class="fld" id="ap_name"></div>' +
              '<div><label>Phone</label><input class="fld" id="ap_phone" type="tel" placeholder="03xx xxxxxxx"></div>' +
              '<div><label>Source (new client)</label>' + sourceSelect('ap_src', '', 'Where did they come from?') + '</div></div>' +
              '<div class="card-note">An existing customer with the same phone number is used automatically.</div>';
    }
    body += '<div class="fgrid" style="margin-top:12px"><div style="grid-column:1/-1"><label>Service or package (pick, then Add)</label>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap"><select class="fld" id="ap_svc" style="flex:1;min-width:180px"><option value="">Choose…</option>' +
            aptPickList().map(function(p){ return '<option value="' + esc(p.key) + '">' + esc(p.name) + (p.price != null ? ' — ' + esc(Number(p.price).toLocaleString()) : '') + '</option>'; }).join('') +
            '<option value="__custom">Other (type it)</option></select><button class="btn" id="ap_addsvc">+ Add</button></div></div></div>' +
            '<label style="font-size:12px;color:var(--muted)">In this appointment — name · price · qty · discount</label>' +
            '<div id="ap_lines">' + aptLinesHTML() + '</div>' +
            '<div class="fgrid"><div><label>Discount type</label><select class="fld" id="ap_dtype"><option value="flat">Flat amount</option><option value="percent">Percentage (%)</option></select></div>' +
            '<div><label>Discount</label><input class="fld" id="ap_dval" type="number" min="0" placeholder="0"></div>' +
            '<div><label>GST %</label><input class="fld" id="ap_gst" type="number" min="0" value="0"></div>' +
            '<div><label>Currency</label><input class="fld" id="ap_cur" maxlength="3" value="PKR" style="text-transform:uppercase"></div></div>' +
            '<div class="billbox"><strong>Bill Summary</strong><div id="ap_bill" style="margin-top:6px">' + aptBillHTML() + '</div></div>';
  } else {
    body += '<div class="card-note">' + esc(a.customer_name || '') + ' · ' + esc(a.service || '') +
            (a.package_names ? ' · Package: ' + esc(a.package_names) : '') +
            (a.invoice_number ? ' · Bill ' + esc(a.invoice_number) + ' · Total ' + aptMoney(a.total, a.currency) + ' · Paid ' + aptMoney(a.paid, a.currency) +
             ' · Balance ' + aptMoney(a.balance, a.currency) : '') + '</div>' +
            '<div class="card-note">Prices on a saved bill are not edited. Take a payment below, or delete and re-book an unpaid one.</div>';
  }
  body += '<div class="fgrid"><div><label>Date</label><input class="fld" id="ap_date" type="date" value="' + esc(a.day || pre.date || todayISO()) + '"></div>' +
          '<div><label>Start</label><input class="fld" id="ap_time" type="time" value="' + esc(a.time || (pre.status === 'completed' ? hhmm(new Date()) : '')) + '"></div>' +
          '<div><label>End</label><input class="fld" id="ap_end" type="time" value="' + esc(a.end_time || '') + '"></div></div>' +
          '<div class="fgrid"><div><label>Staff</label><select class="fld" id="ap_staff"><option value="">—</option>' + opts(staff, a.staff_id) + '</select></div>' +
          (locs.length ? '<div><label>Location</label><select class="fld" id="ap_loc"><option value="">—</option>' + opts(locs, a.location_id) + '</select></div>' : '') +
          '<div><label>Department</label><input class="fld" id="ap_dept" list="ap_depts" value="' + esc(a.department || '') + '">' +
          '<datalist id="ap_depts"><option value="Clinic"><option value="Aesthetic"><option value="Salon"><option value="Academy"></datalist></div></div>' +
          '<div class="fgrid"><div><label>Booked by</label><input class="fld" id="ap_booked" list="ap_staffnames" value="' + esc(a.booked_by || '') + '" placeholder="Staff who booked"></div>' +
          '<div><label>Assisted by</label><input class="fld" id="ap_assist" list="ap_staffnames" value="' + esc(a.assisted_by || '') + '"></div>' +
          '<div><label>Procedure done by</label><input class="fld" id="ap_proc" list="ap_staffnames" value="' + esc(a.procedure_by || '') + '"></div></div>';
  if (!f.edit) {
    body += '<div class="fgrid"><div><label>Amount received now</label><input class="fld" id="ap_recv" type="number" min="0" placeholder="0"></div>' +
            '<div><label>Payment method</label><select class="fld" id="ap_pay"><option value="">-</option>' +
            APT_METHODS.map(function(m){ return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') + '</select></div>' +
            '<div><label>Remaining balance</label><input class="fld" id="ap_balance" readonly style="color:var(--accent,#c9a84c);font-weight:700"></div></div>';
  } else if (a.invoice_id && a.balance > 0.004) {
    body += '<div class="fgrid"><div><label>Take a payment (balance ' + aptMoney(a.balance, a.currency) + ')</label><input class="fld" id="ap_payamt" type="number" min="0" placeholder="Amount"></div>' +
            '<div><label>Payment method</label><select class="fld" id="ap_paym">' +
            [['cash','Cash'],['online','JazzCash / EasyPaisa / Online'],['bank','Bank transfer'],['card','Card'],['other','Other']].map(function(m){ return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') +
            '</select></div></div>';
  }
  body += '<div class="fgrid"><div><label>Total sessions</label><input class="fld" id="ap_sess" type="number" min="1" value="' + esc(a.total_sessions || 1) + '"></div>' +
          '<div><label>Next appointment</label><input class="fld" id="ap_next" type="date" value="' + esc(a.next_appointment || '') + '"></div>' +
          '<div><label>Status</label><select class="fld" id="ap_status">' + stOpts + '</select></div></div>' +
          '<div class="fgrid"><div style="grid-column:1/-1"><label>Notes</label><textarea class="fld" id="ap_notes" rows="2">' + esc(a.notes || '') + '</textarea></div></div>' +
          '<div id="apmsg" class="card-note" style="min-height:18px;margin:10px 0"></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" id="ap_cancel">Cancel</button>' +
          '<button class="btn primary" id="ap_save">Save</button></div>';
  return '<div class="mdl-bg" id="ap_bg"><div class="mdl">' + body + '</div></div>';
}
function aptSay(m, bad){ var e = document.getElementById('apmsg'); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } else say(m); }
function aptPrint(id){
  api('/appointments/' + id + '/bill').then(function(r){
    if (!r.ok) { say((r.data && r.data.detail) || 'Could not load the bill.'); return; }
    var d = r.data, a = d.appointment, inv = d.invoice;
    if (!inv) { say('This appointment has no bill.'); return; }
    var cur = inv.currency || 'PKR';
    var f = function(n){ return cur + ' ' + Number(n || 0).toLocaleString(); };
    var paid = (d.payments || []).reduce(function(s, p){ return s + Number(p.amount || 0); }, 0);
    var due = Math.round((Number(inv.total) - paid) * 100) / 100;
    var lines = (d.items || []).map(function(i){ return '<tr><td>' + esc(i.description) + '</td><td>' + esc(i.quantity) + '</td><td>' + f(i.unit_price) + '</td><td>' + f(i.line_total) + '</td></tr>'; }).join('');
    var logo = (typeof BRAND !== 'undefined' && BRAND && BRAND.has_logo) ? '<img src="/brand/logo" style="height:70px" onerror="this.remove()">' : '';
    var h = '<html><head><title>' + esc(inv.number) + '</title><style>body{font-family:Arial,sans-serif;color:#111;padding:24px;max-width:720px;margin:auto}' +
      '.hd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:12px}h1{margin:0;font-size:26px;letter-spacing:3px}' +
      'table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}th{background:#f4f4f4;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #eee}' +
      '.tot{float:right;width:280px;margin-top:14px;font-size:13px}.tot div{display:flex;justify-content:space-between;padding:4px 0}.g{border-top:2px solid #111;border-bottom:2px solid #111;font-weight:bold}' +
      '.ft{clear:both;padding-top:50px;font-size:11px;color:#555}@media print{.np{display:none}}</style></head><body>' +
      '<div class="hd"><div>' + logo + '<h1>INVOICE</h1></div><div style="text-align:right;font-size:13px"><b>' + esc(d.business || '') + '</b></div></div>' +
      '<p style="font-size:13px;line-height:1.7"><b>Invoice:</b> ' + esc(inv.number) + ' &nbsp;|&nbsp; <b>Date:</b> ' + esc(a.at || '') +
      '<br><b>Client:</b> ' + esc(a.customer_name || 'Walk-in') + ' &nbsp;|&nbsp; <b>Contact:</b> ' + esc(a.customer_phone || '-') +
      (a.department ? '<br><b>Department:</b> ' + esc(a.department) : '') + '</p>' +
      '<table><thead><tr><th>Service</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>' + lines + '</tbody></table>' +
      '<div class="tot"><div><span>Subtotal</span><span>' + f(inv.subtotal) + '</span></div><div><span>Discount</span><span>-' + f(inv.discount) + '</span></div>' +
      '<div><span>GST</span><span>' + f(inv.tax) + '</span></div><div class="g"><span>Total</span><span>' + f(inv.total) + '</span></div>' +
      '<div><span>Paid</span><span>' + f(paid) + '</span></div>' + (due > 0.004 ? '<div><span>Due</span><span>' + f(due) + '</span></div>' : '<div style="color:#1b7f3b;font-weight:bold"><span>PAID IN FULL</span><span>&#10003;</span></div>') + '</div>' +
      '<div class="ft">Payment mode: ' + esc(a.payment_method || '-') + ' &nbsp;|&nbsp; Served by: ' + esc(a.procedure_by || a.assisted_by || '-') + ' &nbsp;|&nbsp; Booked by: ' + esc(a.booked_by || '-') +
      (a.next_appointment ? '<br>Next appointment: ' + esc(a.next_appointment) : '') + '<p style="text-align:center;margin-top:20px">Thank you for visiting ' + esc(d.business || '') + '</p></div>' +
      '<div class="np" style="text-align:center;margin-top:20px"><button onclick="window.print()" style="padding:10px 24px">Print</button></div></body></html>';
    var w = window.open('', '_blank', 'width=820,height=920');
    if (!w) { say('Allow pop-ups for this site to print the bill.'); return; }
    w.document.write(h); w.document.close();
  });
}
function aptExport(rows){
  var cols = ['Client','Phone','Service','Package','Date','Start','End','Staff','Location','Currency','Total','Paid','Balance','Payment','Sessions','Next','Booked by','Assisted by','Procedure by','Status','Notes'];
  var csv = cols.join(',') + '\n' + rows.map(function(a){
    return [a.customer_name, a.customer_phone, a.service, a.package_names, a.day, a.time, a.end_time, a.staff_name, a.location_name, a.currency,
            a.total, a.paid, a.balance == null ? '' : a.balance, a.payment_method, a.total_sessions, a.next_appointment,
            a.booked_by, a.assisted_by, a.procedure_by, APT_STATUS[a.status] || a.status, a.notes]
      .map(function(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var el = document.createElement('a');
  el.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  el.download = 'appointments.csv'; el.click();
}
function aptSnap(){
  // The page re-renders when data arrives; keep what the person has typed.
  var s = {};
  document.querySelectorAll('.mdl [id^="ap_"]').forEach(function(el){
    if (el.id !== 'ap_bill' && el.id !== 'ap_lines' && el.id !== 'ap_bg') s[el.id] = el.value;
  });
  return s;
}
function aptRestore(snap){
  if (!snap) return;
  Object.keys(snap).forEach(function(id){ var el = document.getElementById(id); if (el && snap[id] !== undefined && el.type !== 'button' && snap[id] !== '') el.value = snap[id]; });
  aptRefreshBill();
}
/* Everything that shows appointments reads fresh data after a change. */
function aptInvalidate(){
  APT.data = undefined;
  Object.keys(S).forEach(function(k){ if (/^(de_|hist_)/.test(k)) { S[k] = undefined; LOADING[k] = false; } });
  need('invoices', '/business/invoices', true); need('payments', '/business/payments', true); need('customers', '/business/customers', true);
}
/* A table of appointment rows, shared by Appointments, Daily Entry and a customer's history. */
function aptTableHTML(rows, opts){
  opts = opts || {};
  var own = isOwner();
  return '<div class="tbl-wrap"><table class="apt-tbl"><thead><tr>' + (opts.noClient ? '' : '<th>Client</th><th>Phone</th>') +
    '<th>Service</th><th>Package</th><th>Date</th><th>Start</th><th>End</th><th>Staff</th><th>Location</th><th>Total</th><th>Discount</th><th>GST</th>' +
    '<th>Received</th><th>Balance</th><th>Payment</th><th>Sessions</th><th>Next</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>' +
    rows.map(function(a){
      var c = a.currency;
      var bal = a.balance == null ? '—' : '<span class="' + (a.balance > 0.004 ? 'bal-due' : 'bal-ok') + '">' + aptMoney(a.balance, c) + '</span>';
      return '<tr>' + (opts.noClient ? '' : '<td>' + (a.customer_id ? '<a href="#/customers?c=' + esc(a.customer_id) + '">' + esc(a.customer_name || '—') + '</a>' : esc(a.customer_name || '—')) +
        '</td><td>' + esc(a.customer_phone || '') + '</td>') +
        '<td>' + esc(a.service || '—') + '</td><td>' + esc(a.package_names || '') + '</td><td>' + esc(a.day) + '</td><td>' + esc(a.time) + '</td><td>' + esc(a.end_time || '') +
        '</td><td>' + esc(a.staff_name || a.procedure_by || '') + '</td><td>' + esc(a.location_name || '') +
        '</td><td>' + aptMoney(a.total, c) + '</td><td>' + (Number(a.discount) ? aptMoney(a.discount, c) : '—') + '</td><td>' + (Number(a.tax) ? aptMoney(a.tax, c) : '—') + '</td><td>' + aptMoney(a.paid, c) + '</td><td>' + bal +
        '</td><td>' + esc(a.payment_method || '') + '</td><td>' + esc(a.total_sessions || 1) + '</td><td>' + esc(a.next_appointment || '') +

/* Wire table buttons. rows: the rows currently shown (for Edit). */
function aptWireRows(rows){

  document.querySelectorAll('[data-apedit]').forEach(function(b){

  });

    b.onclick = function(){

/* Wire the open modal. Works from any view that rendered aptFormHTML(). */
function aptWireForm(){
  if (!APT.form) return;
  var f = APT.form, pre = f.preset || {};
  var g = function(id){ return document.getElementById(id); };
  if (!g('ap_save')) return;
  if (g('ap_bg')) g('ap_bg').onclick = function(e){ if (e.target === g('ap_bg')) { APT.form = null; renderShell(); } };
  g('ap_cancel').onclick = function(){ APT.form = null; renderShell(); };
  ['ap_dtype','ap_dval','ap_gst','ap_recv','ap_cur'].forEach(function(id){ if (g(id)) g(id).oninput = aptRefreshBill; });
  if (g('ap_dtype')) g('ap_dtype').onchange = aptRefreshBill;
  aptRefreshBill();
  aptWireLines();
  if (g('ap_addsvc')) g('ap_addsvc').onclick = function(){
    var key = val('ap_svc');
    if (!key) { aptSay('Choose a service or package first.', true); return; }
    if (key === '__custom') APT.lines.push({ service_id: null, package_id: null, name: '', price: '', qty: 1, discount: '' });
    else aptPickList().forEach(function(p){
      if (p.key === key) APT.lines.push({ service_id: p.service_id, package_id: p.package_id, name: p.pname || p.name,
                                          price: p.price != null ? Number(p.price) : '', qty: 1, discount: '' });
    });
    aptRerenderLines();
  };
  g('ap_save').onclick = function(){
    if (APT.busy) return;
    var body, path, method;
    var tm = val('ap_time'), en = val('ap_end');
    if (en && !tm) { aptSay('Set the start time as well as the end time.', true); return; }
    if (en && tm && en <= tm) { aptSay('The end time must be after the start time.', true); return; }
    var common = { date: val('ap_date'), time: tm || '00:00', end_time: en, staff_id: val('ap_staff'),
                   department: val('ap_dept'), booked_by: val('ap_booked'), assisted_by: val('ap_assist'), procedure_by: val('ap_proc'),
                   total_sessions: numv('ap_sess') || 1, next_appointment: val('ap_next'), status: val('ap_status'), notes: val('ap_notes') };
    if (g('ap_loc')) common.location_id = val('ap_loc');
    if (!common.date) { aptSay('Pick the appointment date.', true); return; }
    if (f.edit) {
      path = '/appointments/' + f.id; method = 'PATCH'; body = common;
    } else {
      var cust = pre.customer && pre.customer.id ? pre.customer : null;
      if (!cust && !val('ap_name')) { aptSay('Enter the client\'s name.', true); return; }
      var bad = APT.lines.filter(function(l){ return !String(l.name).trim() || l.price === '' || Number(l.price) < 0; });
      if (bad.length) { aptSay('Every line needs a name and a price.', true); return; }
      if (!/^[A-Za-z]{3}$/.test(aptCur())) { aptSay('Currency must be a 3-letter code like PKR.', true); return; }
      var b = aptBill();
      if (b.rec > 0 && !val('ap_pay')) { aptSay('Pick how they paid.', true); return; }
      if (b.rec - b.total > 0.009) { aptSay('Amount received is more than the bill.', true); return; }
      path = '/appointments/book'; method = 'POST';
      body = Object.assign({}, common, {
        services: APT.lines.map(function(l){ return { service_id: l.service_id, package_id: l.package_id, name: String(l.name).trim(), price: Number(l.price) || 0, qty: Number(l.qty) || 1, discount: Number(l.discount) || 0 }; }),
        discount_type: val('ap_dtype'), discount_value: numv('ap_dval') || 0, gst_percent: numv('ap_gst') || 0, currency: aptCur(),
        received: b.rec, payment_method: val('ap_pay') });
      if (cust) body.customer_id = cust.id;
      else { body.name = val('ap_name'); body.phone = val('ap_phone'); body.source = val('ap_src'); }
      if (!body.staff_id) delete body.staff_id;
      if (!body.end_time) delete body.end_time;
    }
    APT.busy = true; g('ap_save').disabled = true; aptSay('Saving…');
    var payAmt = f.edit ? (numv('ap_payamt') || 0) : 0, payM = f.edit ? val('ap_paym') : '';
    api(path, { method: method, body: body }).then(function(r){
      if (!r.ok) { aptSay((r.data && r.data.detail) || ('Not saved (' + r.status + ').'), true); return null; }
      if (payAmt > 0 && f.a && f.a.invoice_id)
        return api('/operations/invoices/' + f.a.invoice_id + '/pay', { method: 'POST', body: { amount: payAmt, method: payM || 'cash' } })
          .then(function(p){ if (!p.ok) { aptSay('Saved, but the payment was refused: ' + ((p.data && p.data.detail) || p.status), true); return null; } return r; });
      return r;
    }).then(function(r){
      APT.busy = false;
      if (!r) { if (g('ap_save')) g('ap_save').disabled = false; return; }
      APT.form = null; APT.lines = [];
      if (!f.edit && body.date && !APT.all && APT.from) { if (body.date < APT.from || body.date > APT.to) { APT.from = APT.to = body.date; } }
      aptInvalidate();
      say(f.edit ? 'Appointment updated.' : 'Appointment saved.');
      renderShell();
    });
  };
}
function aptWireLines(){
  document.querySelectorAll('[data-apl]').forEach(function(inp){
    inp.oninput = function(){
      var l = APT.lines[Number(inp.getAttribute('data-apl'))], k = inp.getAttribute('data-k');
      l[k] = k === 'name' ? inp.value : (inp.value === '' ? '' : Number(inp.value));
      aptRefreshBill();
    };

}
/* Views that host the modal call this at the top of their render. */

        return '<tr><td>' + when(p.paid_at) + '</td><td>' + esc(p.invoice_number || '') + '</td><td>' + money(p.amount, p.currency) + '</td><td>' +
          esc(p.method) + '</td><td>' + esc(p.reference || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="card-note">No payments yet.</div>');
  body += '<h3>WhatsApp</h3><div id="c_wa">' + custWaHTML(c) + '</div>';
  body += '</div>';
  return panel(esc(c.name), body, head);
}
/* Conversations are matched on the last 10 digits of the phone number. */
function custWaHTML(c){
  if (!c.phone) return '<div class="card-note">No phone number on file, so no WhatsApp conversation can be matched.</div>';
  ibxLoad(false);
  if (IBX.data === undefined) return '<div class="card-note">Checking WhatsApp…</div>';
  if (IBX.data.error) return '<div class="card-note">WhatsApp conversations are not available: ' + esc(IBX.data.error) + '</div>';
  var want = digits10(c.phone);
  var mine = (IBX.data.chats || []).filter(function(ch){ return want && digits10(ch.phone) === want; });
  if (!mine.length) return '<div class="card-note">No WhatsApp conversation with ' + esc(c.phone) + ' yet.</div>';
  return mine.map(function(ch){
    return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><strong>' + esc(ch.messages) + ' messages</strong> · last ' + (ch.last_at ? when(ch.last_at) : '') +
      '<div class="card-note">' + esc(ch.last || '') + '</div><a class="btn" href="#/inbox?sid=' + encodeURIComponent(ch.session_id) + '" style="margin-top:6px;display:inline-block">Open conversation</a></div>';
  }).join('');
}
function custWire(){
  var id = CUS.open; if (!id) return;
  var h = S['hist_' + id]; if (!h) return;
  var g = function(x){ return document.getElementById(x); };
  var msg = function(m, bad){ var e = g('cmsg'); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
  if (g('c_close')) g('c_close').onclick = function(){ CUS.open = null; CUS.edit = false; location.hash = '#/customers'; };
  if (g('c_edit')) g('c_edit').onclick = function(){ CUS.edit = !CUS.edit; renderShell(); };
  if (g('ce_cancel')) g('ce_cancel').onclick = function(){ CUS.edit = false; renderShell(); };
  if (g('c_book')) g('c_book').onclick = function(){
    aptOpen(null, { customer: { id: h.customer.id, name: h.customer.name, phone: h.customer.phone }, date: todayISO() });
  };
  if (g('ce_save')) g('ce_save').onclick = function(){
    var name = val('ce_name');
    if (!name) { msg('A name is required.', true); return; }
    g('ce_save').disabled = true;
    api('/business/customers/' + id, { method: 'PATCH', body: { name: name, phone: val('ce_phone') || null, email: val('ce_email') || null,
      source: val('ce_src') || null, status: val('ce_status') || 'active', notes: val('ce_notes') || null } }).then(function(r){
      if (!r.ok) { g('ce_save').disabled = false; msg((r.data && r.data.detail) || 'Not saved.', true); return; }
      CUS.edit = false;
      need('customers', '/business/customers', true); need('hist_' + id, '/customers/' + id + '/history', true);
    });
  };
  if (g('c_del')) g('c_del').onclick = function(){
    if (!CUS.delArm) { CUS.delArm = true; renderShell(); return; }
    CUS.delArm = false;
    api('/business/customers/' + id, { method: 'DELETE' }).then(function(r){
      if (!r.ok) { renderShell(); setTimeout(function(){ msg((r.data && r.data.detail) || 'Not deleted.', true); }, 0); return; }
      CUS.open = null; location.hash = '#/customers'; need('customers', '/business/customers', true);
    });
  };
}

/* ------------------------------------------------------------- Inventory
   Add a product here (it lands in the same products table the catalogue uses),
   optionally with its opening stock, then record movements. Stock on hand is
   always summed from the movement ledger by the server. */
VIEWS.inventory = function(){
  var out = '<h1>Inventory</h1>' +
    '<p class="sub">Stock on hand, added up from every movement rather than stored as a number someone can edit.</p>';
  if (!need('inventory', '/operations/inventory'))
    return out + panel('Inventory', loading('Counting stock...'));
  if (S.inventory === null)
    return out + panel('Inventory', errState('The inventory service did not respond.'));
  var inv = S.inventory, prods = inv.products || [];
  out += '<div class="grid">' +
    metric('Products', prods.length) +
    metric('Stock tracked', inv.tracked_count) +
    metric('Low on stock', inv.low_stock_count, inv.low_stock_count ? 'Reorder these' : 'Nothing below its threshold') +
    '</div>';
  out += '<h2>Add a product</h2>' + panel('New product',
    '<div style="padding:14px 16px"><div class="fgrid">' +
    '<div><label>Product name *</label><input class="fld" id="ip_name"></div>' +
    '<div><label>SKU</label><input class="fld" id="ip_sku"></div>' +
    '<div><label>Category</label><input class="fld" id="ip_cat"></div>' +
    '<div><label>Sale price</label><input class="fld" id="ip_price" type="number" min="0"></div></div>' +
    '<div class="fgrid"><div><label>Opening stock (units now on the shelf)</label><input class="fld" id="ip_open" type="number" min="0" placeholder="0"></div>' +
    '<div><label>Warn when stock falls to</label><input class="fld" id="ip_low" type="number" min="0"></div>' +
    '<div><label>Unit cost (optional)</label><input class="fld" id="ip_cost" type="number" min="0"></div>' +
    '<div><label style="margin-top:22px"><input type="checkbox" id="ip_track" checked> Track stock</label></div></div>' +
    '<button class="btn primary" id="ip_add">Save product</button><div id="ipmsg" class="card-note" style="min-height:18px;margin-top:8px"></div></div>');

  if ((inv.low_stock || []).length) {
    out += panel('Running low',
      '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>On hand</th><th>Threshold</th></tr></thead><tbody>' +
      inv.low_stock.map(function(p){
        return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.on_hand) + '</td><td>' + esc(p.low_stock_threshold) + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  }
  out += '<h2>Record a stock movement</h2>' + row() +
    select('stprod', prods, 'Product') +
    '<select class="fld" id="stkind" style="flex:1;min-width:140px">' +
    '<option value="purchase">Purchase in</option><option value="sale">Sale out</option>' +
    '<option value="adjustment">Adjustment</option><option value="return">Return</option>' +
    '<option value="opening">Opening balance</option></select>' +
    inp('stqty', 'Quantity', 'number', 120) +
    inp('streason', 'Reason', 'text', 150) +
    '<button class="btn primary" id="stadd">Record</button></div>' +
    '<div class="card-note">Purchase, return and opening add stock; sale takes it away; an adjustment uses the sign you type (-2 removes two).</div>' + actbar();
  out += panel('Stock on hand', prods.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Tracked</th>' +
      '<th>On hand</th><th>Warn at</th><th>Last movement</th></tr></thead><tbody>' + prods.map(function(p){
        var low = p.track_stock && p.low_stock_threshold != null && Number(p.on_hand) <= Number(p.low_stock_threshold);
        return '<tr><td>' + esc(p.name) + (p.active === false ? ' <span class="tag">inactive</span>' : '') + '</td><td>' + esc(p.sku || '—') + '</td><td>' + esc(p.category || '—') +
          '</td><td>' + money(p.price, p.currency) + '</td>' +
          '<td>' + (p.track_stock ? '<span class="tag">yes</span>' : '—') + '</td>' +
          '<td' + (low ? ' class="bal-due"' : '') + '>' + (p.track_stock ? esc(p.on_hand) : '—') + '</td><td>' + esc(p.low_stock_threshold == null ? '—' : p.low_stock_threshold) +
          '</td><td>' + when(p.last_movement) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : empty('No products yet', 'Add your first product above.'),
    '<span class="pill count">' + prods.length + '</span>');

  setTimeout(function(){
    var g = function(id){ return document.getElementById(id); };
    var msg = function(m, bad){ var e = g('ipmsg'); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
    if (g('ip_add')) g('ip_add').onclick = function(){
      var name = val('ip_name'), price = numv('ip_price'), open = numv('ip_open'), low = numv('ip_low'), cost = numv('ip_cost');
      if (!name) { msg('A product needs a name.', true); return; }
      if ([price, open, low, cost].some(function(n){ return n !== null && (isNaN(n) || n < 0); })) { msg('Numbers cannot be negative.', true); return; }
      var track = g('ip_track').checked || (open || 0) > 0;
      g('ip_add').disabled = true; msg('Saving…');
      api('/business/products', { method: 'POST', body: { name: name, sku: val('ip_sku') || null, category: val('ip_cat') || null,
        price: price, track_stock: track, low_stock_threshold: low } }).then(function(r){
        if (!r.ok) { g('ip_add').disabled = false; msg((r.data && r.data.detail) || ('Not saved (' + r.status + ').'), true); return null; }
        var pid = r.data.item.id;
        if (!(open > 0)) return { ok: true };
        return api('/business/stock_movements', { method: 'POST', body: { product_id: pid, kind: 'opening', quantity_delta: open,
          unit_cost: cost, reason: 'Opening stock' } }).then(function(m){
          if (!m.ok) msg('Product saved, but the opening stock was refused: ' + ((m.data && m.data.detail) || m.status), true);
          return m.ok ? m : { ok: true, partial: true };
        });
      }).then(function(r){
        if (!r) return;
        need('inventory', '/operations/inventory', true); need('products', '/business/products', true);
        if (!r.partial) setTimeout(function(){ msg('Product saved.'); }, 50);
      });
    };
    var b = g('stadd');
    if (b) b.onclick = function(){
      var pid = val('stprod'), q = numv('stqty'), kind = val('stkind') || 'adjustment';
      if (!pid) { say('Pick a product.'); return; }
      if (q === null || isNaN(q) || q === 0) { say('A movement needs a non-zero quantity.'); return; }
      if (kind === 'sale') q = -Math.abs(q);
      else if (kind !== 'adjustment') q = Math.abs(q);
      b.disabled = true;
      act('/business/stock_movements', {method:'POST', body:{
        product_id: pid, kind: kind, quantity_delta: q, reason: val('streason') || null
      }}, 'Movement recorded.').then(function(r){
        b.disabled = false;
        if (r.ok) need('inventory', '/operations/inventory', true);
      });
    };
  }, 0);
  return out;
};

/* ---------------------------------------------------------------- crudTable
   One editable table for every simple catalogue/settings list: view, edit in
   place, deactivate, delete. The server decides what is allowed (owner-only
   writes, in-use rows refused); this only hides buttons an operator could not
   use anyway and shows the server's reason when it says no.
   spec: {key, resource, cols:[{f,label,type:'text'|'number'|'int'|'date'|'bool'|'select',opts,money}],
          rows, ownerOnly:true, noDelete, empty:[title,msg], reload:fn} */
var CRUD = { editing: {}, arm: {} };
function crudCell(c, r){
  var v = r[c.f];
  if (c.type === 'bool') return v === false ? '<span class="tag">no</span>' : '<span class="tag">yes</span>';
  if (c.money) return money(v, r.currency);
  if (c.type === 'select' && c.opts) { for (var i = 0; i < c.opts.length; i++) if (String(c.opts[i][0]) === String(v)) return esc(c.opts[i][1]); }
  if (c.type === 'date' && v) return esc(String(v).slice(0, 10));
  return v === null || v === undefined || v === '' ? '—' : esc(v);
}
function crudInput(key, c, r){
  var v = r[c.f], id = 'ce_' + key + '_' + c.f;
  if (c.type === 'bool') return '<input type="checkbox" id="' + id + '"' + (v === false ? '' : ' checked') + '>';
  if (c.type === 'select') return '<select class="fld" id="' + id + '">' + (c.blank ? '<option value="">' + esc(c.blank) + '</option>' : '') +
    c.opts.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  var t = c.type === 'number' || c.type === 'int' ? 'number' : (c.type === 'date' ? 'date' : 'text');
  var val_ = v === null || v === undefined ? '' : (c.type === 'date' ? String(v).slice(0, 10) : v);
  return '<input class="fld" id="' + id + '" type="' + t + '" value="' + esc(val_) + '" style="min-width:' + (t === 'number' ? 80 : 120) + 'px">';
}
function crudRead(key, c){
  var e = document.getElementById('ce_' + key + '_' + c.f);
  if (!e) return undefined;
  if (c.type === 'bool') return e.checked;
  var v = String(e.value).trim();
  if (v === '') return null;
  if (c.type === 'number') return Number(v);
  if (c.type === 'int') return parseInt(v, 10);
  return v;
}
function crudTable(sp){
  var own = isOwner(), canWrite = own || !sp.ownerOnly;
  var ed = CRUD.editing[sp.key];
  if (!sp.rows.length) return '<div id="cm_' + sp.key + '" class="card-note" style="min-height:0"></div>' + empty(sp.empty ? sp.empty[0] : 'Nothing here yet', sp.empty ? sp.empty[1] : '');
  var hasActive = sp.cols.some(function(c){ return c.f === 'active'; });
  return '<div id="cm_' + sp.key + '" class="card-note" style="min-height:18px;padding:6px 16px"></div><div class="tbl-wrap"><table><thead><tr>' +
    sp.cols.map(function(c){ return '<th>' + esc(c.label) + '</th>'; }).join('') + (canWrite ? '<th></th>' : '') + '</tr></thead><tbody>' +
    sp.rows.map(function(r){
      if (!r.id) return '<tr>' + sp.cols.map(function(c){ return '<td>' + crudCell(c, r) + '</td>'; }).join('') + (canWrite ? '<td><span class="card-note">not saved yet</span></td>' : '') + '</tr>';
      if (ed === r.id) return '<tr>' + sp.cols.map(function(c){ return '<td>' + (c.readonly ? crudCell(c, r) : crudInput(sp.key, c, r)) + '</td>'; }).join('') +
        '<td><button class="btn primary" data-cs="' + sp.key + '" data-id="' + esc(r.id) + '">Save</button> <button class="btn" data-cc="' + sp.key + '">Cancel</button></td></tr>';
      var btns = '';
      if (canWrite) {
        btns = '<button class="btn" data-ce="' + sp.key + '" data-id="' + esc(r.id) + '">Edit</button>' +
          (hasActive ? ' <button class="btn" data-ca="' + sp.key + '" data-id="' + esc(r.id) + '" data-on="' + (r.active === false ? '1' : '0') + '">' + (r.active === false ? 'Activate' : 'Deactivate') + '</button>' : '') +
          (sp.noDelete || (sp.deleteOwnerOnly && !own) ? '' : ' <button class="btn" data-cd="' + sp.key + '" data-id="' + esc(r.id) + '">' + (CRUD.arm[sp.key] === r.id ? 'Tap again to delete' : 'Delete') + '</button>');
      }
      return '<tr' + (r.active === false ? ' style="opacity:.6"' : '') + '>' + sp.cols.map(function(c){ return '<td>' + crudCell(c, r) + '</td>'; }).join('') +
        (canWrite ? '<td style="white-space:nowrap">' + btns + '</td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function crudWire(sp){
  var msg = function(m, bad){ var e = document.getElementById('cm_' + sp.key); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
  var after = function(r, okMsg){
    if (!r.ok) { var why = (r.data && r.data.detail) || ('Refused (' + r.status + ').'); renderShell(); setTimeout(function(){ msg(why, true); }, 0); return; }
    CRUD.editing[sp.key] = null; CRUD.arm[sp.key] = null;
    sp.reload(); setTimeout(function(){ msg(okMsg); }, 60);
  };
  document.querySelectorAll('[data-ce="' + sp.key + '"]').forEach(function(b){ b.onclick = function(){ CRUD.editing[sp.key] = b.getAttribute('data-id'); CRUD.arm[sp.key] = null; renderShell(); }; });
  document.querySelectorAll('[data-cc="' + sp.key + '"]').forEach(function(b){ b.onclick = function(){ CRUD.editing[sp.key] = null; renderShell(); }; });
  document.querySelectorAll('[data-cs="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      var body = {};
      sp.cols.forEach(function(c){ if (c.readonly) return; var v = crudRead(sp.key, c); if (v !== undefined) body[c.f] = v; });
      var bad = sp.cols.filter(function(c){ return c.required && (body[c.f] === null || body[c.f] === ''); });
      if (bad.length) { msg(bad.map(function(c){ return c.label; }).join(', ') + ' cannot be empty.', true); return; }
      if (sp.cols.some(function(c){ return (c.type === 'number' || c.type === 'int') && body[c.f] !== null && (isNaN(body[c.f]) || body[c.f] < 0); })) { msg('Numbers cannot be negative.', true); return; }
      b.disabled = true;
      api('/business/' + sp.resource + '/' + b.getAttribute('data-id'), { method: 'PATCH', body: body }).then(function(r){ after(r, 'Saved.'); });
    };
  });
  document.querySelectorAll('[data-ca="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      b.disabled = true;
      api('/business/' + sp.resource + '/' + b.getAttribute('data-id'), { method: 'PATCH', body: { active: b.getAttribute('data-on') === '1' } })
        .then(function(r){ after(r, b.getAttribute('data-on') === '1' ? 'Activated.' : 'Deactivated. It stays on old records but is no longer offered.'); });
    };
  });
  document.querySelectorAll('[data-cd="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-id');
      if (CRUD.arm[sp.key] !== id) { CRUD.arm[sp.key] = id; renderShell(); return; }
      b.disabled = true;
      api('/business/' + sp.resource + '/' + id, { method: 'DELETE' }).then(function(r){ after(r, 'Deleted.'); });
    };
  });
}

/* ----------------------------------------------- Services & Products (one list)
   The services table is the single source of truth: appointments, bills,
   packages and the AI all read it. Services the client typed during onboarding
   and never saved are shown with a one-click "save as editable" (A5). */
var SVC_COLS = [{f:'name', label:'Name', required:true}, {f:'category', label:'Category'}, {f:'price', label:'Price', type:'number', money:true},
                {f:'duration_minutes', label:'Minutes', type:'int'}, {f:'active', label:'Active', type:'bool'}];
var PRD_COLS = [{f:'name', label:'Name', required:true}, {f:'sku', label:'SKU'}, {f:'category', label:'Category'},
                {f:'price', label:'Price', type:'number', money:true}, {f:'track_stock', label:'Track stock', type:'bool'},
                {f:'low_stock_threshold', label:'Warn at', type:'number'}, {f:'active', label:'Active', type:'bool'}];
function svcSpec(){ return { key:'svc', resource:'services', ownerOnly:true, cols:SVC_COLS, rows: items('services'),
  empty:['No services yet', 'Add the ones you sell most often first.'], reload:function(){ need('services', '/business/services', true); } }; }
function prdSpec(){ return { key:'prd', resource:'products', ownerOnly:true, cols:PRD_COLS, rows: items('products'),
  empty:['No products yet', 'Add anything the business sells over the counter.'], reload:function(){ need('products', '/business/products', true); need('inventory', '/operations/inventory', true); } }; }
function pendingOnboardingHTML(){
  var d = S.services || {}, pend = d.pending_onboarding || [];
  var fromFallback = (d.items || []).filter(function(x){ return !x.id; });
  var list = pend.length ? pend : fromFallback;
  if (!list.length) return '';
  return '<div class="banner"><div class="banner-txt"><strong>' + list.length + ' service' + (list.length === 1 ? '' : 's') + ' from your onboarding ' +
    (list.length === 1 ? 'is' : 'are') + ' not saved as editable services yet</strong><span>' +
    esc(list.map(function(x){ return x.name + (x.price != null ? ' (' + Number(x.price).toLocaleString() + ')' : ''); }).join(', ')) +
    '. Until saved they cannot be edited, booked with a price, or put in a package.</span></div>' +
    (isOwner() ? '<button class="btn primary" id="svc_import">Save them as services</button>' : '<span class="card-note">The owner can save them.</span>') + '</div>';
}
VIEWS.catalogue = function(){
  var out = '<h1>Services &amp; Products</h1><p class="sub">What the business sells. Appointments, bills, packages and your AI all use this one list.</p>';
  // One page, reachable as Services, Products or both (#18 lists them apart).
  var cv = currentView(), showS = cv !== 'products', showP = cv !== 'services';
  if (cv === 'services') out = '<h1>Services</h1><p class="sub">What the business offers. Appointments, bills, packages and your AI all use this one list.</p>';
  if (cv === 'products') out = '<h1>Products</h1><p class="sub">What the business sells over the counter. Stock is kept on the Inventory page.</p>';
  if (!need('services', '/business/services') | !need('products', '/business/products'))
    return out + panel('Services', loading('Loading the catalogue...'));
  if (S.services === null || S.products === null) return out + panel('Services', errState('The catalogue service did not respond.'));
  var own = isOwner();
  if (showS) {
  out += pendingOnboardingHTML() + actbar();
  if (own) out += panel('Add a service', '<div style="padding:12px 16px">' + row() + inp('svname', 'Service name *', 'text', 180) + inp('svprice', 'Price', 'number', 110) +
    inp('svmins', 'Minutes', 'number', 100) + inp('svcat', 'Category', 'text', 130) + '<button class="btn primary" id="svadd">Add service</button></div></div>');
  out += panel('Services', crudTable(svcSpec()), '<span class="pill count">' + items('services').filter(function(x){ return x.id; }).length + '</span>');
  } else out += actbar();
  if (showP) {
  if (showS) out += '<h2>Products</h2>';
  if (own) out += panel('Add a product', '<div style="padding:12px 16px">' + row() + inp('prname', 'Product name *', 'text', 180) + inp('prprice', 'Price', 'number', 110) +
    inp('prsku', 'SKU', 'text', 110) + inp('prcat', 'Category', 'text', 130) + '</div>' + row() +
    '<label class="card-note" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="prtrack" checked> Track stock</label>' +
    inp('prlow', 'Warn below', 'number', 120) + '<button class="btn primary" id="pradd">Add product</button></div>' +
    '<div class="card-note">Opening stock is recorded on the Inventory page.</div></div>');
  out += panel('Products', crudTable(prdSpec()), '<span class="pill count">' + items('products').length + '</span>');
  }
  if (!own) out += '<div class="card-note" style="margin-top:8px">Only the owner can change what the business sells or its prices.</div>';
  setTimeout(function(){
    if (showS) crudWire(svcSpec());
    if (showP) crudWire(prdSpec());
    var g = function(id){ return document.getElementById(id); };
    if (g('svc_import')) g('svc_import').onclick = function(){
      g('svc_import').disabled = true;
      act('/business/services/import-onboarding', { method: 'POST' }, '').then(function(r){
        if (r.ok) { need('services', '/business/services', true); setTimeout(function(){ say(r.data.count + ' service(s) saved. You can edit them now.'); }, 60); }
        else g('svc_import').disabled = false;
      });

var PKG_COLS = [{f:'name', label:'Name', required:true}, {f:'description', label:'Description'}, {f:'price', label:'Price', type:'number', money:true},

/* -------------------------------------------------------- WhatsApp Inbox
   Who said what comes from the agent's own history: role 'user' is the
   customer, 'assistant' is the AI agent. 'owner' rows are replies a person
   sent from here (kept in the audit log, so they survive a refresh). */
var IBX_WHO = { user: 'Customer', assistant: 'AI agent', owner: 'You (dashboard)', system: 'Internal note to the AI (the customer never saw this)' };
IBX.draft = ''; IBX.sending = false; IBX.note = null;
function ibxSidParam(){ var m = /[?&]sid=([^&]+)/.exec(location.hash || ''); return m ? decodeURIComponent(m[1]) : null; }
VIEWS.inbox = function(){
  var out = '<h1>WhatsApp Inbox</h1><p class="sub">Every WhatsApp conversation with your customers. Reply here and it is sent from your business number.</p>';
  var want = ibxSidParam();
  if (want && IBX.sel !== want) { setTimeout(function(){ ibxOpen(want); }, 0); }
  ibxLoad(false);
  if (IBX.data === undefined) return out + panel('Conversations', loading('Reading your conversations...'));
  if (IBX.data.error) return out + panel('Conversations', errState(IBX.data.error +
    ' If your number is not connected yet, open WhatsApp in the menu and scan the QR code.'));
  var chats = IBX.data.chats || [];
  var head = '<button class="btn" id="ibx_ref">Refresh</button>';
  if (!chats.length) return out + panel('Conversations', empty('No conversations yet',
    IBX.data.connected ? 'When customers message your WhatsApp, their chats appear here.'
                       : 'Connect your WhatsApp number first: open WhatsApp in the menu and scan the QR code.'), head) + ibxWire();
  var list = chats.map(function(c){
    return '<div class="ibx-item' + (IBX.sel === c.session_id ? ' sel' : '') + '" data-sid="' + esc(c.session_id) + '">' +
      '<div style="display:flex;justify-content:space-between;gap:8px"><strong>' + esc(c.phone ? '+' + c.phone : 'Unknown number') +
      '</strong><span class="card-note">' + esc(c.messages) + ' msgs</span></div>' +
      '<div class="card-note" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.last || '') + '</div>' +
      '<div class="card-note">' + (c.last_at ? when(c.last_at) : '') +
      (IBX.data.numbers > 1 && c.number ? ' · to +' + esc(c.number) : '') + '</div></div>';
  }).join('');
  var chat, reply = '';
  if (!IBX.sel) chat = empty('Select a conversation', 'Tap a chat to read it and reply.');
  else if (IBX.msgs === null) chat = loading('Opening the chat...');
  else if (IBX.msgs.error) chat = errState(IBX.msgs.error);
  else {
    chat = IBX.msgs.map(function(m){
      if (m.role === 'system') return '<details class="bub sys"><summary class="t">' + esc(IBX_WHO.system) + (m.at ? ' · ' + when(m.at) : '') +
        '</summary><div style="white-space:pre-wrap">' + esc(m.content) + '</div></details>';
      var mine = m.role === 'assistant' || m.role === 'owner';
      var st = m.role === 'owner' ? (m.status === 'sent' ? ' · <span style="color:var(--growth)">Sent ✓</span>'
                                    : ' · <span style="color:var(--danger)" title="' + esc(m.error || '') + '">Not sent</span>') : '';
      return '<div class="bub ' + (mine ? 'assistant' : 'user') + (m.role === 'owner' ? ' owner' : '') + '">' + esc(m.content) +
             '<div class="t">' + esc(IBX_WHO[m.role] || m.role) + (m.at ? ' · ' + when(m.at) : '') + st + '</div>' +
             (m.role === 'owner' && m.status !== 'sent' && m.error ? '<div class="t" style="color:var(--danger)">' + esc(m.error) + '</div>' : '') + '</div>';
    }).join('') || empty('Empty chat', '');
    var connected = IBX.data.connected;
    reply = '<div class="ibx-reply">' +
      (connected ? '' : '<div class="card-note" style="color:var(--warn)">Your number is not connected, so replies cannot be sent.</div>') +
      '<textarea class="fld" id="ibx_text" rows="2" maxlength="4000" placeholder="Type a reply to this customer…"' + (connected ? '' : ' disabled') + '>' + esc(IBX.draft) + '</textarea>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn primary" id="ibx_send"' + (connected && !IBX.sending ? '' : ' disabled') + '>' +
      (IBX.sending ? 'Sending…' : 'Send') + '</button><span id="ibx_note" class="card-note" style="' + (IBX.note && IBX.note.bad ? 'color:var(--danger)' : 'color:var(--growth)') + '">' +
      esc(IBX.note ? IBX.note.text : '') + '</span>' +
      (IBX.note && IBX.note.wa ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(IBX.note.wa) + '" title="Opens WhatsApp with this customer and your message typed in. Send it from your business WhatsApp.">Reply in WhatsApp</a>' : '') +
      '</div>' +
      '<div class="card-note">Your AI agent keeps answering this chat too. Replies sent here go out from your business number.</div></div>';
  }
  out += panel('Conversations', '<div class="ibx"><div class="ibx-list">' + list + '</div><div><div class="ibx-chat" id="ibx_chat">' +
    chat + '</div>' + reply + '</div></div>', '<span class="pill count">' + chats.length + '</span> ' + head);
  return out + ibxWire();
};
function ibxWire(){
  setTimeout(function(){
    var r = document.getElementById('ibx_ref');
    if (r) r.onclick = function(){ IBX.data = undefined; ibxLoad(true); if (IBX.sel) ibxOpen(IBX.sel); };
    document.querySelectorAll('[data-sid]').forEach(function(el){
      el.onclick = function(){ IBX.draft = ''; IBX.note = null; ibxOpen(el.getAttribute('data-sid')); };
    });
    var box = document.getElementById('ibx_chat');
    if (box) box.scrollTop = box.scrollHeight;
    var t = document.getElementById('ibx_text'), b = document.getElementById('ibx_send');
    if (t) { t.oninput = function(){ IBX.draft = t.value; };
             t.onkeydown = function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (b) b.click(); } }; }
    if (b) b.onclick = function(){
      var text = (t && t.value || '').trim(), sid = IBX.sel;
      if (!text) { IBX.note = { text: 'Type a message first.', bad: true }; renderShell(); return; }
      IBX.sending = true; IBX.note = null; renderShell();
      api('/whatsapp/chats/' + encodeURIComponent(sid) + '/send', { method: 'POST', body: { text: text } }).then(function(res){
        IBX.sending = false;
        if (res.ok) { IBX.draft = ''; IBX.note = { text: 'Sent at ' + when(res.data.at || new Date().toISOString()) + '.', bad: false }; }
        else {
          IBX.note = { text: (res.data && res.data.detail) || ('Not sent (HTTP ' + res.status + ').'), bad: true };
          // Still let them answer: open WhatsApp with this customer and the text typed in.
          var ch = null; ((IBX.data && IBX.data.chats) || []).forEach(function(c){ if (c.session_id === sid) ch = c; });
          var ph = ch && String(ch.phone || '').replace(/\D/g, '');
          if (ph && ph.length >= 8) IBX.note.wa = 'https://wa.me/' + ph + '?text=' + encodeURIComponent(text);
        }
        if (IBX.sel === sid) ibxOpen(sid); else renderShell();
      });
    };
  }, 0);
  return '';
}

/* #14/#15 Jarvis. One button: LISTEN starts, STOP ends (and sends what was
   heard). The orb and label always say what Jarvis is doing:
   Idle -> Listening -> Processing -> Responding -> Idle, or Error with the
   reason (microphone blocked gets its own instructions). Reuses the existing
   voice helpers: jarvisHeard, the server voice (/console/speak), consoleSend's
   API call. */
var JV = { state: 'idle', msg: '', rec: null, heard: '', audio: null };
var JV_LABEL = { idle: 'Idle', listening: 'Listening…', processing: 'Processing…', responding: 'Responding…', error: 'Error' };
function jvSet(state, msg){
  JV.state = state; JV.msg = msg || '';
  var orb = document.getElementById('jv-orb'), lab = document.getElementById('jv-state'), m = document.getElementById('jv-msg'), b = document.getElementById('con-mic');
  if (orb) orb.className = 'jv-orb ' + state;
  if (lab) lab.textContent = JV_LABEL[state];
  if (m) { m.textContent = JV.msg; m.style.color = state === 'error' ? 'var(--danger)' : 'var(--muted)'; }
  if (b) {
    b.textContent = (state === 'listening' || state === 'responding') ? '■ STOP' : '● LISTEN';
    b.classList.toggle('stop', state === 'listening' || state === 'responding');
    b.disabled = state === 'processing';
  }
}
function jvSpeak(text){
  return new Promise(function(done){
    if (!text) return done();
    JARVIS_LAST = String(text).slice(0, 600);
    var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(JARVIS_LAST);
    fetch('/console/speak', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ text: JARVIS_LAST, lang: urdu ? 'ur' : 'en' }) })
      .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
      .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JV.audio = a; a.onended = done; a.onerror = done; return a.play(); })
      .catch(function(){
        try {
          if (!window.speechSynthesis) return done();
          var u = new SpeechSynthesisUtterance(JARVIS_LAST); u.lang = urdu ? 'ur-PK' : 'en-US';
          u.onend = done; u.onerror = done; window.speechSynthesis.speak(u);
        } catch (e) { done(); }
      });
  });
}
function jvStopAudio(){ try { if (JV.audio) JV.audio.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }
function jvMicError(code){
  if (code === 'not-allowed' || code === 'service-not-allowed')
    return 'Microphone is blocked for this site. Click the lock icon next to the address bar, set Microphone to Allow, then press LISTEN again. You can also type below.';
  if (code === 'audio-capture') return 'No microphone was found on this device. Plug one in, or type below.';
  if (code === 'no-speech') return 'I did not hear anything. Press LISTEN and speak, or type below.';
  if (code === 'network') return 'The browser could not reach its speech service. Check the connection, or type below.';
  return 'Voice stopped (' + code + '). Press LISTEN to try again, or type below.';
}
function wireConsoleMic(){
  var mic = document.getElementById('con-mic'), box = document.getElementById('con-in');
  if (!mic || !box) return;
  var lb = document.getElementById('con-lang'); if (lb) lb.textContent = jarvisLangLabel();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  mic.style.display = '';
  jvSet(JV.state === 'processing' ? 'processing' : 'idle', JV.state === 'error' ? '' : JV.msg);
  mic.onclick = function(){
    if (JV.state === 'responding') { jvStopAudio(); jvSet('idle'); return; }
    if (JV.state === 'listening') { if (JV.rec) JV.rec.stop(); return; }
    if (!SR) { jvSet('error', 'Voice needs Chrome or Edge on this device. You can type below.'); return; }
    try { JV.rec = new SR(); } catch (e) { jvSet('error', 'This browser would not start voice input. Type below instead.'); return; }
    var rec = JV.rec, failed = null;
    rec.lang = jarvisRecLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    JV.heard = '';
    rec.onresult = function(ev){ JV.heard = jarvisHeard(ev); box.value = JV.heard; };
    rec.onerror = function(ev){ failed = ev.error || 'unknown'; };
    rec.onend = function(){
      JV.rec = null;
      if (failed && failed !== 'aborted') { jvSet('error', jvMicError(failed)); return; }
      if (JV.heard.trim()) { JARVIS_SPOKEN = true; consoleSend(); }
      else jvSet('idle', 'Nothing heard.');
    };
    try { rec.start(); jvSet('listening', 'Speak now. Press STOP when you are done.'); }
    catch (e) { jvSet('error', jvMicError('start-failed')); }
  };
}
function consoleSend(){
  var box = document.getElementById('con-in'), out = document.getElementById('con-out');
  if (!box || !box.value.trim() || JV.state === 'processing') return;
  var msg = box.value.trim(), spoken = JARVIS_SPOKEN; JARVIS_SPOKEN = false;
  jvSet('processing', 'Working on: "' + msg.slice(0, 80) + (msg.length > 80 ? '…' : '') + '"');
  api('/console', { method: 'POST', body: { message: msg } }).then(function(r){
    if (!r.ok) {
      var why = (r.data && r.data.detail) || ('Jarvis could not do that (HTTP ' + r.status + ').');
      if (out) out.innerHTML = errState(why);
      jvSet('error', why);
      if (spoken) jvSpeak(why);
      return;
    }
    var d = r.data || {}, extra = '';
    box.value = '';
    if (d.kind === 'teach') { extra = '<div class="sub" style="margin-top:8px">Your agent will now follow: <em>' + esc(d.lesson || '') + '</em></div>'; loadLessons(); }
    if (d.kind === 'dashboard') { PREFS = d.prefs || PREFS; applyBrand(); extra = '<div class="sub" style="margin-top:8px">Applied: ' + esc(JSON.stringify(d.changed || {})) + '</div>'; }
    if (d.kind === 'post') { extra = '<div class="sub" style="margin-top:8px">Nothing is public yet. Review it under Social posts below.</div>'; loadPosts(); }
    if (d.kind === 'business') {
      need('biz_' + d.resource, '/business/' + d.resource, true);
      extra = '<div class="sub" style="margin-top:8px">' + (d.action === 'create' ? 'Added to ' : 'Updated in ') + esc(d.resource || 'your business details') + '.</div>';
    }
    var reply = d.reply || 'Done.';
    if (out) out.innerHTML = '<div class="jv-reply">' + esc(reply) + extra + jarvisListenBtn('btn') + '</div>';
    JARVIS_LAST = reply;
    if (spoken) { jvSet('responding', 'Speaking the answer. Press STOP to cut it short.'); jvSpeak(reply).then(function(){ if (JV.state === 'responding') jvSet('idle'); }); }
    else jvSet('idle');
  });
}

/* Shrink in the browser (the API accepts up to 1 MB), keep transparency. */
function shrinkImage(file, max){
  return new Promise(function(ok, bad){
    if (!file) return bad(new Error('Pick an image first.'));
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) return bad(new Error('Use a PNG, JPEG, WEBP or SVG image.'));
    var rd = new FileReader();
    rd.onerror = function(){ bad(new Error('That file could not be read.')); };
    rd.onload = function(){
      if (file.type === 'image/svg+xml') return ok(rd.result);
      var img = new Image();
      img.onerror = function(){ bad(new Error('That image could not be opened.')); };
      img.onload = function(){
        var k = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var out = c.toDataURL('image/webp', 0.9);
        if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/png');
        ok(out);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

  // so the upload starts the moment a file is picked.
  if (g('br_up')) g('br_up').onclick = function(){ g('br_file').click(); };
  if (g('br_file')) g('br_file').onchange = function(){

/* ======================================================== Jarvis, conversation
   ONE button. Press it once: Jarvis listens, answers, speaks, and listens again
   by itself until you press it again (or stay silent twice).
   Speed: the answer is spoken sentence by sentence (the first sentence starts
   while the rest is still being voiced), and if the server voice is slow the
   browser's own voice speaks instead of leaving silence. Each turn shows where
   the time went (thinking vs voice) so a slow turn can be pinned down.
   Pictures: 📎 attaches a photo; it is uploaded (JPEG, for Instagram) and the
   post Jarvis drafts uses it. Nothing is published until Approve & post. */
var JV = { state: 'idle', msg: '', rec: null, heard: '', audio: null, conv: false, silent: 0,
           img: null, imgUrl: null, abort: null, timing: '' };
var JV_LABEL = { idle: 'Ready', listening: 'Listening…', processing: 'Thinking…', responding: 'Speaking…', error: 'Something went wrong' };
var JV_VOICE_WAIT_MS = 5000;   // after this, the browser voice speaks instead

function jvSet(state, msg){
  JV.state = state; if (msg !== undefined) JV.msg = msg || '';
  var orb = document.getElementById('jv-orb'), lab = document.getElementById('jv-state'), m = document.getElementById('jv-msg'),
      b = document.getElementById('con-mic'), t = document.getElementById('jv-time');
  if (orb) orb.className = 'jv-orb ' + state;
  if (lab) lab.textContent = JV.conv && state === 'idle' ? 'Conversation on' : JV_LABEL[state];
  if (m) { m.textContent = JV.msg; m.style.color = state === 'error' ? 'var(--danger)' : 'var(--muted)'; }
  if (t) t.textContent = JV.timing;
  if (b) {
    b.textContent = JV.conv ? '■  End conversation' : '●  Start conversation';
    b.classList.toggle('stop', JV.conv);
  }
}
function jvStopAudio(){
  try { if (JV.abort) JV.abort.abort(); } catch (e) {}
  try { if (JV.audio) { JV.audio.onended = null; JV.audio.pause(); } } catch (e) {}
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
}
function jvSentences(text){
  var parts = String(text).match(/[^.!?؟۔\n]+[.!?؟۔]*\s*/g) || [String(text)];
  var first = parts.shift().trim(), rest = parts.join('').trim();
  // A very short first sentence ("Done.") joins the next so the voice is not choppy.
  if (first.length < 25 && rest) { var nx = (rest.match(/[^.!?؟۔\n]+[.!?؟۔]*\s*/) || [''])[0]; first += ' ' + nx.trim(); rest = rest.slice(nx.length).trim(); }
  return [first, rest].filter(Boolean);
}
function jvBrowserVoice(text, urdu){
  return new Promise(function(done){
    try {
      if (!window.speechSynthesis || !text) return done();
      var u = new SpeechSynthesisUtterance(text); u.lang = urdu ? 'ur-PK' : 'en-US';
      u.onend = done; u.onerror = done; window.speechSynthesis.speak(u);
    } catch (e) { done(); }
  });
}
/* Fetch one piece of speech; resolves to a blob URL, or null if slow/failed. */
function jvFetchVoice(text, urdu, signal){
  var t0 = Date.now();
  return fetch('/console/speak', { method: 'POST', credentials: 'include', signal: signal,
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text, lang: urdu ? 'ur' : 'en' }) })
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ return { url: URL.createObjectURL(b), ms: Date.now() - t0 }; })
    .catch(function(){ return null; });
}
function jvPlay(url){
  return new Promise(function(done){
    var a = new Audio(url); JV.audio = a; a.onended = done; a.onerror = done;
    a.play().catch(done);
  });
}
function jvSpeak(text){
  jvStopAudio();
  text = String(text || '').slice(0, 600);
  JARVIS_LAST = text;
  if (!text) return Promise.resolve();
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  var ctl = new AbortController(); JV.abort = ctl;
  var parts = jvSentences(text);
  var jobs = parts.map(function(p){ return jvFetchVoice(p, urdu, ctl.signal); });   // all start now
  var first = Promise.race([jobs[0], new Promise(function(r){ setTimeout(function(){ r('slow'); }, JV_VOICE_WAIT_MS); })]);
  return first.then(function(v){
    if (ctl.signal.aborted) return;
    if (!v || v === 'slow') {                          // server voice too slow: speak now in the browser
      ctl.abort(); JV.timing += ' · voice: browser (server voice slow)';
      jvSet(JV.state); return jvBrowserVoice(text, urdu);
    }
    JV.timing += ' · voice ' + (v.ms / 1000).toFixed(1) + 's'; jvSet(JV.state);
    var chain = jvPlay(v.url);
    for (var i = 1; i < jobs.length; i++) (function(job, part){
      chain = chain.then(function(){ return ctl.signal.aborted ? null : job; })
                   .then(function(w){ if (ctl.signal.aborted) return; return w ? jvPlay(w.url) : jvBrowserVoice(part, urdu); });
    })(jobs[i], parts[i]);
    return chain;
  });
}
function jvListen(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { JV.conv = false; jvSet('error', 'Voice needs Chrome or Edge. You can type below instead.'); return; }
  var rec; try { rec = new SR(); } catch (e) { JV.conv = false; jvSet('error', 'This browser would not start the microphone. Type below instead.'); return; }
  JV.rec = rec; JV.heard = '';
  var box = document.getElementById('con-in'), failed = null;
  rec.lang = jarvisRecLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = function(ev){ JV.heard = jarvisHeard(ev); if (box) box.value = JV.heard; };
  rec.onerror = function(ev){ failed = ev.error || 'unknown'; };
  rec.onend = function(){
    JV.rec = null;
    if (!JV.conv) return;
    if (failed && failed !== 'no-speech' && failed !== 'aborted') { JV.conv = false; jvSet('error', jvMicError(failed)); return; }
    if (JV.heard.trim()) { JV.silent = 0; JARVIS_SPOKEN = true; consoleSend(); return; }
    JV.silent++;
    if (JV.silent >= 2) { JV.conv = false; jvSet('idle', 'Conversation ended: I did not hear anything.'); return; }
    jvListen();
  };
  try { rec.start(); jvSet('listening', 'Speak now. I reply when you pause.'); }
  catch (e) { JV.conv = false; jvSet('error', jvMicError('start-failed')); }
}
function wireConsoleMic(){
  var mic = document.getElementById('con-mic');
  if (!mic) return;
  var lb = document.getElementById('con-lang'); if (lb) lb.textContent = jarvisLangLabel();
  mic.style.display = '';
  jvSet(JV.state === 'processing' ? 'processing' : (JV.conv ? JV.state : 'idle'));
  mic.onclick = function(){
    if (JV.conv) {                                      // end everything
      JV.conv = false; JV.silent = 0; jvStopAudio();
      try { if (JV.rec) JV.rec.abort(); } catch (e) {}
      jvSet('idle', 'Conversation ended.'); return;
    }
    JV.conv = true; JV.silent = 0; jvStopAudio(); jvListen();
  };
}
/* Photo -> JPEG (Instagram accepts only JPEG), longest side 1600 px. */
function jvToJpeg(file){
  return new Promise(function(ok, bad){
    if (!file || !/^image\/(png|jpeg|webp|gif|heic|heif)$/.test(file.type)) return bad(new Error('Pick a photo (JPG, PNG or WEBP).'));
    var rd = new FileReader();
    rd.onerror = function(){ bad(new Error('That photo could not be read.')); };
    rd.onload = function(){
      var img = new Image();
      img.onerror = function(){ bad(new Error('That photo could not be opened here. Try a JPG or PNG.')); };
      img.onload = function(){
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.86));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
function jvAttachHTML(){
  if (!JV.img) return '';
  return '<div class="jv-att"><img src="' + JV.img + '" alt=""><span class="card-note">' + (JV.imgUrl ? 'Picture ready for the post' : 'Uploading picture…') +
    '</span><button class="btn" id="jv-att-x" title="Remove picture">✕</button></div>';
}
function jvRenderAttach(){ var el = document.getElementById('jv-attach'); if (el) { el.innerHTML = jvAttachHTML(); var x = document.getElementById('jv-att-x'); if (x) x.onclick = function(){ JV.img = JV.imgUrl = null; jvRenderAttach(); }; } }
function consoleSend(){
  var box = document.getElementById('con-in'), out = document.getElementById('con-out');
  if (!box || !box.value.trim() || JV.state === 'processing') return;
  if (JV.img && !JV.imgUrl) { jvSet('error', 'The picture is still uploading. Try again in a moment.'); return; }
  var msg = box.value.trim(), spoken = JARVIS_SPOKEN; JARVIS_SPOKEN = false;
  var t0 = Date.now(); JV.timing = '';
  jvSet('processing', '“' + msg.slice(0, 80) + (msg.length > 80 ? '…' : '') + '”');
  var body = { message: msg, voice: !!(spoken || JV.conv) };
  if (JV.imgUrl) body.image_url = JV.imgUrl;
  fetch('/console', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r){
      var st = r.headers.get('Server-Timing') || '', m = /think;dur=(\d+)/.exec(st);
      JV.timing = 'thinking ' + (m ? (m[1] / 1000).toFixed(1) + 's' : ((Date.now() - t0) / 1000).toFixed(1) + 's') +
                  (r.headers.get('X-Jarvis-Model') ? ' (' + r.headers.get('X-Jarvis-Model').split(':').pop() + ')' : '');
      return r.text().then(function(t){ var d = null; try { d = JSON.parse(t); } catch (e) {} return { ok: r.ok, status: r.status, data: d }; });
    })
    .catch(function(){ return { ok: false, status: 0, data: null }; })
    .then(function(r){
      if (!r.ok) {
        var why = (r.data && r.data.detail) || ('Jarvis could not do that (HTTP ' + r.status + ').');
        if (out) out.innerHTML = errState(why);
        jvSet('error', why);
        if (spoken || JV.conv) jvSpeak(why).then(function(){ if (JV.conv) jvListen(); });
        return;
      }
      var d = r.data || {}, extra = '';
      box.value = '';
      if (d.kind === 'teach') { extra = '<div class="sub" style="margin-top:8px">Your agent will now follow: <em>' + esc(d.lesson || '') + '</em></div>'; loadLessons(); }
      if (d.kind === 'dashboard') { PREFS = d.prefs || PREFS; applyBrand(); extra = '<div class="sub" style="margin-top:8px">Applied: ' + esc(JSON.stringify(d.changed || {})) + '</div>'; }
      if (d.kind === 'post') {
        extra = '<div class="sub" style="margin-top:8px">Nothing is public yet. Review it under Social posts below' + (d.post && d.post.image_url ? ' (with your picture)' : '') + '.</div>';
        JV.img = JV.imgUrl = null; jvRenderAttach(); loadPosts();
      }
      if (d.kind === 'business') {
        need('biz_' + d.resource, '/business/' + d.resource, true);
        extra = '<div class="sub" style="margin-top:8px">' + (d.action === 'create' ? 'Added to ' : 'Updated in ') + esc(d.resource || 'your business details') + '.</div>';
      }

      if (out) out.innerHTML = '<div class="jv-reply">' + esc(reply) + extra + jarvisListenBtn('btn') + '</div>';
      JARVIS_LAST = reply;
      if (spoken || JV.conv) {
        jvSet('responding', 'Speaking. Press End conversation to stop.');
        jvSpeak(reply).then(function(){
          if (!JV.conv) { if (JV.state === 'responding') jvSet('idle', ''); return; }
          jvListen();                                   // the conversation carries on
        });

    });
}

/* ---------- boot ---------- */
function boot(){
  root.innerHTML = loading();
  api('/me').then(function(r){
    if (r.status === 401 || r.status === 403) { gate('Your session has expired. Please sign in again.'); return; }
    if (!r.ok || !r.data) { root.innerHTML = errState('The platform did not respond. Please try again.'); return; }
    S.me = r.data;
    if (S.me.auth_enforced && !S.me.authenticated) { gate(); return; }
    /* A founder account has no business of its own: its home is the founder
       console (clients, requests, plans), not an empty business dashboard. */
    if (S.me.role === 'techdeva_admin') { location.replace('/techdeva'); return; }
    if (!S.me.tenant_id) {
      root.innerHTML = '<div class="gate"><div class="gate-box"><h1>No business linked</h1>' +
        '<p class="sub">This account is not attached to a business yet.</p>' +
        '<a class="btn primary" href="/onboarding" style="display:inline-block">Set up your business</a></div></div>';
      return;
    }
    /* Everything below is tenant-scoped by the backend from the session. */
    loadBrand();   /* their logo and colour, before the first paint of content */
    Promise.all([
      api('/portal/summary'), api('/leads'), api('/portal/config'), api('/portal/deliverables')
    ]).then(function(res){
      S.summary = res[0].ok ? res[0].data : null;
      S.leads   = res[1].ok && res[1].data ? (res[1].data.leads || []) : null;
      S.config  = res[2].ok ? res[2].data : null;
      S.deliv   = res[3].ok && res[3].data ? (res[3].data.deliverables || res[3].data.items || []) : null;
      renderShell();
    });
  });
}

   posts are published by the platform's worker at that time; the owner can

// imgs: the new post's pictures in order, each { src: preview, url: link once uploaded }
var PST = { imgs: [], busy: false, MAX: 10 };
function pstWhen(s){
  if (!s) return '';
  var d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function pstLocalMin(){
  var d = new Date(Date.now() + 10 * 60000); d.setSeconds(0, 0);
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
var PST_LABEL = { draft: 'Draft', scheduled: 'Scheduled', publishing: 'Posting…', published: 'Posted',
                  partial: 'Partly posted', failed: 'Not posted', discarded: 'Discarded' };
VIEWS.posts = function(){
