  out += '<div class="grid">' +
    metric('Products', prods.length) +
    metric('Stock tracked', inv.tracked_count) +
    metric('Low on stock', inv.low_stock_count, inv.low_stock_count ? 'Reorder these' : 'Nothing below its threshold') +
    '</div>';
  out += '<h2>Add a product</h2>' + panel('New product',
    '<div style="padding:14px 16px"><div class="fgrid">' +
    '<div><label>Product name *</label><input class="fld" id="ip_name"></div>' +
    '<div><label>SKU</label><input class="fld" id="ip_sku"></div>' +
    '<div><label>Category</label><input class="fld" id="ip_cat"></div>' +
    '<div><label>Sale price</label><input class="fld" id="ip_price" type="number" min="0"></div></div>' +
    '<div class="fgrid"><div><label>Opening stock (units now on the shelf)</label><input class="fld" id="ip_open" type="number" min="0" placeholder="0"></div>' +
    '<div><label>Warn when stock falls to</label><input class="fld" id="ip_low" type="number" min="0"></div>' +
    '<div><label>Unit cost (optional)</label><input class="fld" id="ip_cost" type="number" min="0"></div>' +
    '<div><label style="margin-top:22px"><input type="checkbox" id="ip_track" checked> Track stock</label></div></div>' +
    '<button class="btn primary" id="ip_add">Save product</button><div id="ipmsg" class="card-note" style="min-height:18px;margin-top:8px"></div></div>');

  if ((inv.low_stock || []).length) {
    out += panel('Running low',
      '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>On hand</th><th>Threshold</th></tr></thead><tbody>' +
      inv.low_stock.map(function(p){
        return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.on_hand) + '</td><td>' + esc(p.low_stock_threshold) + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  }
  out += '<h2>Record a stock movement</h2>' + row() +
    select('stprod', prods, 'Product') +
    '<select class="fld" id="stkind" style="flex:1;min-width:140px">' +
    '<option value="purchase">Purchase in</option><option value="sale">Sale out</option>' +
    '<option value="adjustment">Adjustment</option><option value="return">Return</option>' +
    '<option value="opening">Opening balance</option></select>' +
    inp('stqty', 'Quantity', 'number', 120) +
    inp('streason', 'Reason', 'text', 150) +
    '<button class="btn primary" id="stadd">Record</button></div>' +
    '<div class="card-note">Purchase, return and opening add stock; sale takes it away; an adjustment uses the sign you type (-2 removes two).</div>' + actbar();
  out += panel('Stock on hand', prods.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Tracked</th>' +
      '<th>On hand</th><th>Warn at</th><th>Last movement</th></tr></thead><tbody>' + prods.map(function(p){
        var low = p.track_stock && p.low_stock_threshold != null && Number(p.on_hand) <= Number(p.low_stock_threshold);
        return '<tr><td>' + esc(p.name) + (p.active === false ? ' <span class="tag">inactive</span>' : '') + '</td><td>' + esc(p.sku || '—') + '</td><td>' + esc(p.category || '—') +
          '</td><td>' + money(p.price, p.currency) + '</td>' +
          '<td>' + (p.track_stock ? '<span class="tag">yes</span>' : '—') + '</td>' +
          '<td' + (low ? ' class="bal-due"' : '') + '>' + (p.track_stock ? esc(p.on_hand) : '—') + '</td><td>' + esc(p.low_stock_threshold == null ? '—' : p.low_stock_threshold) +
          '</td><td>' + when(p.last_movement) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : empty('No products yet', 'Add your first product above.'),
    '<span class="pill count">' + prods.length + '</span>');

  setTimeout(function(){
    var g = function(id){ return document.getElementById(id); };
    var msg = function(m, bad){ var e = g('ipmsg'); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
    if (g('ip_add')) g('ip_add').onclick = function(){
      var name = val('ip_name'), price = numv('ip_price'), open = numv('ip_open'), low = numv('ip_low'), cost = numv('ip_cost');
      if (!name) { msg('A product needs a name.', true); return; }
      if ([price, open, low, cost].some(function(n){ return n !== null && (isNaN(n) || n < 0); })) { msg('Numbers cannot be negative.', true); return; }
      var track = g('ip_track').checked || (open || 0) > 0;
      g('ip_add').disabled = true; msg('Saving…');
      api('/business/products', { method: 'POST', body: { name: name, sku: val('ip_sku') || null, category: val('ip_cat') || null,
        price: price, track_stock: track, low_stock_threshold: low } }).then(function(r){
        if (!r.ok) { g('ip_add').disabled = false; msg((r.data && r.data.detail) || ('Not saved (' + r.status + ').'), true); return null; }
        var pid = r.data.item.id;
        if (!(open > 0)) return { ok: true };
        return api('/business/stock_movements', { method: 'POST', body: { product_id: pid, kind: 'opening', quantity_delta: open,
          unit_cost: cost, reason: 'Opening stock' } }).then(function(m){
          if (!m.ok) msg('Product saved, but the opening stock was refused: ' + ((m.data && m.data.detail) || m.status), true);
          return m.ok ? m : { ok: true, partial: true };
        });
      }).then(function(r){
        if (!r) return;
        need('inventory', '/operations/inventory', true); need('products', '/business/products', true);
        if (!r.partial) setTimeout(function(){ msg('Product saved.'); }, 50);
      });
    };
    var b = g('stadd');
    if (b) b.onclick = function(){
      var pid = val('stprod'), q = numv('stqty'), kind = val('stkind') || 'adjustment';
      if (!pid) { say('Pick a product.'); return; }
      if (q === null || isNaN(q) || q === 0) { say('A movement needs a non-zero quantity.'); return; }
      if (kind === 'sale') q = -Math.abs(q);
      else if (kind !== 'adjustment') q = Math.abs(q);
      b.disabled = true;
      act('/business/stock_movements', {method:'POST', body:{
        product_id: pid, kind: kind, quantity_delta: q, reason: val('streason') || null
      }}, 'Movement recorded.').then(function(r){
        b.disabled = false;
        if (r.ok) need('inventory', '/operations/inventory', true);
      });
    };
  }, 0);
  return out;
};

/* ---------------------------------------------------------------- crudTable
   One editable table for every simple catalogue/settings list: view, edit in
   place, deactivate, delete. The server decides what is allowed (owner-only
   writes, in-use rows refused); this only hides buttons an operator could not
   use anyway and shows the server's reason when it says no.
   spec: {key, resource, cols:[{f,label,type:'text'|'number'|'int'|'date'|'bool'|'select',opts,money}],
          rows, ownerOnly:true, noDelete, empty:[title,msg], reload:fn} */
var CRUD = { editing: {}, arm: {} };
function crudCell(c, r){
  var v = r[c.f];
  if (c.type === 'bool') return v === false ? '<span class="tag">no</span>' : '<span class="tag">yes</span>';
  if (c.money) return money(v, r.currency);
  if (c.type === 'select' && c.opts) { for (var i = 0; i < c.opts.length; i++) if (String(c.opts[i][0]) === String(v)) return esc(c.opts[i][1]); }
  if (c.type === 'date' && v) return esc(String(v).slice(0, 10));
  return v === null || v === undefined || v === '' ? '—' : esc(v);
}
function crudInput(key, c, r){
  var v = r[c.f], id = 'ce_' + key + '_' + c.f;
  if (c.type === 'bool') return '<input type="checkbox" id="' + id + '"' + (v === false ? '' : ' checked') + '>';
  if (c.type === 'select') return '<select class="fld" id="' + id + '">' + (c.blank ? '<option value="">' + esc(c.blank) + '</option>' : '') +
    c.opts.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  var t = c.type === 'number' || c.type === 'int' ? 'number' : (c.type === 'date' ? 'date' : 'text');
  var val_ = v === null || v === undefined ? '' : (c.type === 'date' ? String(v).slice(0, 10) : v);
  return '<input class="fld" id="' + id + '" type="' + t + '" value="' + esc(val_) + '" style="min-width:' + (t === 'number' ? 80 : 120) + 'px">';
}
function crudRead(key, c){
  var e = document.getElementById('ce_' + key + '_' + c.f);
  if (!e) return undefined;
  if (c.type === 'bool') return e.checked;
  var v = String(e.value).trim();
  if (v === '') return null;
  if (c.type === 'number') return Number(v);
  if (c.type === 'int') return parseInt(v, 10);
  return v;
}
function crudTable(sp){
  var own = isOwner(), canWrite = own || !sp.ownerOnly;
  var ed = CRUD.editing[sp.key];
  if (!sp.rows.length) return '<div id="cm_' + sp.key + '" class="card-note" style="min-height:0"></div>' + empty(sp.empty ? sp.empty[0] : 'Nothing here yet', sp.empty ? sp.empty[1] : '');
  var hasActive = sp.cols.some(function(c){ return c.f === 'active'; });
  return '<div id="cm_' + sp.key + '" class="card-note" style="min-height:18px;padding:6px 16px"></div><div class="tbl-wrap"><table><thead><tr>' +
    sp.cols.map(function(c){ return '<th>' + esc(c.label) + '</th>'; }).join('') + (canWrite ? '<th></th>' : '') + '</tr></thead><tbody>' +
    sp.rows.map(function(r){
      if (!r.id) return '<tr>' + sp.cols.map(function(c){ return '<td>' + crudCell(c, r) + '</td>'; }).join('') + (canWrite ? '<td><span class="card-note">not saved yet</span></td>' : '') + '</tr>';
      if (ed === r.id) return '<tr>' + sp.cols.map(function(c){ return '<td>' + (c.readonly ? crudCell(c, r) : crudInput(sp.key, c, r)) + '</td>'; }).join('') +
        '<td><button class="btn primary" data-cs="' + sp.key + '" data-id="' + esc(r.id) + '">Save</button> <button class="btn" data-cc="' + sp.key + '">Cancel</button></td></tr>';
      var btns = '';
      if (canWrite) {
        btns = '<button class="btn" data-ce="' + sp.key + '" data-id="' + esc(r.id) + '">Edit</button>' +
          (hasActive ? ' <button class="btn" data-ca="' + sp.key + '" data-id="' + esc(r.id) + '" data-on="' + (r.active === false ? '1' : '0') + '">' + (r.active === false ? 'Activate' : 'Deactivate') + '</button>' : '') +
          (sp.noDelete || (sp.deleteOwnerOnly && !own) ? '' : ' <button class="btn" data-cd="' + sp.key + '" data-id="' + esc(r.id) + '">' + (CRUD.arm[sp.key] === r.id ? 'Tap again to delete' : 'Delete') + '</button>');
      }
      return '<tr' + (r.active === false ? ' style="opacity:.6"' : '') + '>' + sp.cols.map(function(c){ return '<td>' + crudCell(c, r) + '</td>'; }).join('') +
        (canWrite ? '<td style="white-space:nowrap">' + btns + '</td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function crudWire(sp){
  var msg = function(m, bad){ var e = document.getElementById('cm_' + sp.key); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
  var after = function(r, okMsg){
    if (!r.ok) { var why = (r.data && r.data.detail) || ('Refused (' + r.status + ').'); renderShell(); setTimeout(function(){ msg(why, true); }, 0); return; }
    CRUD.editing[sp.key] = null; CRUD.arm[sp.key] = null;
    sp.reload(); setTimeout(function(){ msg(okMsg); }, 60);
  };
  document.querySelectorAll('[data-ce="' + sp.key + '"]').forEach(function(b){ b.onclick = function(){ CRUD.editing[sp.key] = b.getAttribute('data-id'); CRUD.arm[sp.key] = null; renderShell(); }; });
  document.querySelectorAll('[data-cc="' + sp.key + '"]').forEach(function(b){ b.onclick = function(){ CRUD.editing[sp.key] = null; renderShell(); }; });
  document.querySelectorAll('[data-cs="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      var body = {};
      sp.cols.forEach(function(c){ if (c.readonly) return; var v = crudRead(sp.key, c); if (v !== undefined) body[c.f] = v; });
      var bad = sp.cols.filter(function(c){ return c.required && (body[c.f] === null || body[c.f] === ''); });
      if (bad.length) { msg(bad.map(function(c){ return c.label; }).join(', ') + ' cannot be empty.', true); return; }
      if (sp.cols.some(function(c){ return (c.type === 'number' || c.type === 'int') && body[c.f] !== null && (isNaN(body[c.f]) || body[c.f] < 0); })) { msg('Numbers cannot be negative.', true); return; }
      b.disabled = true;
      api('/business/' + sp.resource + '/' + b.getAttribute('data-id'), { method: 'PATCH', body: body }).then(function(r){ after(r, 'Saved.'); });
    };
  });
  document.querySelectorAll('[data-ca="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      b.disabled = true;
      api('/business/' + sp.resource + '/' + b.getAttribute('data-id'), { method: 'PATCH', body: { active: b.getAttribute('data-on') === '1' } })
        .then(function(r){ after(r, b.getAttribute('data-on') === '1' ? 'Activated.' : 'Deactivated. It stays on old records but is no longer offered.'); });
    };
  });
  document.querySelectorAll('[data-cd="' + sp.key + '"]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-id');
      if (CRUD.arm[sp.key] !== id) { CRUD.arm[sp.key] = id; renderShell(); return; }
      b.disabled = true;
      api('/business/' + sp.resource + '/' + id, { method: 'DELETE' }).then(function(r){ after(r, 'Deleted.'); });
    };
  });
}

/* ----------------------------------------------- Services & Products (one list)
   The services table is the single source of truth: appointments, bills,
   packages and the AI all read it. Services the client typed during onboarding
   and never saved are shown with a one-click "save as editable" (A5). */
var SVC_COLS = [{f:'name', label:'Name', required:true}, {f:'category', label:'Category'}, {f:'price', label:'Price', type:'number', money:true},
                {f:'duration_minutes', label:'Minutes', type:'int'}, {f:'active', label:'Active', type:'bool'}];
var PRD_COLS = [{f:'name', label:'Name', required:true}, {f:'sku', label:'SKU'}, {f:'category', label:'Category'},
                {f:'price', label:'Price', type:'number', money:true}, {f:'track_stock', label:'Track stock', type:'bool'},
                {f:'low_stock_threshold', label:'Warn at', type:'number'}, {f:'active', label:'Active', type:'bool'}];
function svcSpec(){ return { key:'svc', resource:'services', ownerOnly:true, cols:SVC_COLS, rows: items('services'),
  empty:['No services yet', 'Add the ones you sell most often first.'], reload:function(){ need('services', '/business/services', true); } }; }
function prdSpec(){ return { key:'prd', resource:'products', ownerOnly:true, cols:PRD_COLS, rows: items('products'),
  empty:['No products yet', 'Add anything the business sells over the counter.'], reload:function(){ need('products', '/business/products', true); need('inventory', '/operations/inventory', true); } }; }
function pendingOnboardingHTML(){
  var d = S.services || {}, pend = d.pending_onboarding || [];
  var fromFallback = (d.items || []).filter(function(x){ return !x.id; });
  var list = pend.length ? pend : fromFallback;
  if (!list.length) return '';
  return '<div class="banner"><div class="banner-txt"><strong>' + list.length + ' service' + (list.length === 1 ? '' : 's') + ' from your onboarding ' +
    (list.length === 1 ? 'is' : 'are') + ' not saved as editable services yet</strong><span>' +
    esc(list.map(function(x){ return x.name + (x.price != null ? ' (' + Number(x.price).toLocaleString() + ')' : ''); }).join(', ')) +
    '. Until saved they cannot be edited, booked with a price, or put in a package.</span></div>' +
    (isOwner() ? '<button class="btn primary" id="svc_import">Save them as services</button>' : '<span class="card-note">The owner can save them.</span>') + '</div>';
}
VIEWS.catalogue = function(){
  var out = '<h1>Services &amp; Products</h1><p class="sub">What the business sells. Appointments, bills, packages and your AI all use this one list.</p>';
  // One page, reachable as Services, Products or both (#18 lists them apart).
  var cv = currentView(), showS = cv !== 'products', showP = cv !== 'services';
  if (cv === 'services') out = '<h1>Services</h1><p class="sub">What the business offers. Appointments, bills, packages and your AI all use this one list.</p>';
  if (cv === 'products') out = '<h1>Products</h1><p class="sub">What the business sells over the counter. Stock is kept on the Inventory page.</p>';
  if (!need('services', '/business/services') | !need('products', '/business/products'))
    return out + panel('Services', loading('Loading the catalogue...'));
  if (S.services === null || S.products === null) return out + panel('Services', errState('The catalogue service did not respond.'));
  var own = isOwner();
  if (showS) {
  out += pendingOnboardingHTML() + actbar();
  if (own) out += panel('Add a service', '<div style="padding:12px 16px">' + row() + inp('svname', 'Service name *', 'text', 180) + inp('svprice', 'Price', 'number', 110) +
    inp('svmins', 'Minutes', 'number', 100) + inp('svcat', 'Category', 'text', 130) + '<button class="btn primary" id="svadd">Add service</button></div></div>');
  out += panel('Services', crudTable(svcSpec()), '<span class="pill count">' + items('services').filter(function(x){ return x.id; }).length + '</span>');
  } else out += actbar();
  if (showP) {
  if (showS) out += '<h2>Products</h2>';
  if (own) out += panel('Add a product', '<div style="padding:12px 16px">' + row() + inp('prname', 'Product name *', 'text', 180) + inp('prprice', 'Price', 'number', 110) +
    inp('prsku', 'SKU', 'text', 110) + inp('prcat', 'Category', 'text', 130) + '</div>' + row() +
    '<label class="card-note" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="prtrack" checked> Track stock</label>' +
    inp('prlow', 'Warn below', 'number', 120) + '<button class="btn primary" id="pradd">Add product</button></div>' +
    '<div class="card-note">Opening stock is recorded on the Inventory page.</div></div>');
  out += panel('Products', crudTable(prdSpec()), '<span class="pill count">' + items('products').length + '</span>');
  }
  if (!own) out += '<div class="card-note" style="margin-top:8px">Only the owner can change what the business sells or its prices.</div>';
  setTimeout(function(){
    if (showS) crudWire(svcSpec());
    if (showP) crudWire(prdSpec());
    var g = function(id){ return document.getElementById(id); };
    if (g('svc_import')) g('svc_import').onclick = function(){
      g('svc_import').disabled = true;
      act('/business/services/import-onboarding', { method: 'POST' }, '').then(function(r){
        if (r.ok) { need('services', '/business/services', true); setTimeout(function(){ say(r.data.count + ' service(s) saved. You can edit them now.'); }, 60); }
        else g('svc_import').disabled = false;
      });
    };
    if (g('svadd')) g('svadd').onclick = function(){
      var n = val('svname'), p = numv('svprice'), m = numv('svmins');
      if (!n) { say('A service needs a name.'); return; }
      if ((p !== null && (isNaN(p) || p < 0)) || (m !== null && (isNaN(m) || m < 0))) { say('Price and minutes cannot be negative.'); return; }
      g('svadd').disabled = true;
      act('/business/services', {method:'POST', body:{ name: n, price: p, duration_minutes: m === null ? null : Math.round(m), category: val('svcat') || null }}, 'Service added.')
        .then(function(r){ g('svadd') && (g('svadd').disabled = false); if (r.ok) need('services', '/business/services', true); });
    };
    if (g('pradd')) g('pradd').onclick = function(){
      var n = val('prname'), p = numv('prprice'), low = numv('prlow');
      if (!n) { say('A product needs a name.'); return; }
      if ([p, low].some(function(x){ return x !== null && (isNaN(x) || x < 0); })) { say('Numbers cannot be negative.'); return; }
      g('pradd').disabled = true;
      act('/business/products', {method:'POST', body:{ name: n, price: p, sku: val('prsku') || null, category: val('prcat') || null,
        track_stock: !!g('prtrack').checked, low_stock_threshold: low }}, 'Product added.')
        .then(function(r){ g('pradd') && (g('pradd').disabled = false); if (r.ok) { need('products', '/business/products', true); need('inventory', '/operations/inventory', true); } });
    };
  }, 0);
  return out;
};

/* --------------------------------------------------------------- Expenses */
var EXP_METHODS = [['cash','Cash'],['card','Card'],['bank','Bank'],['online','Online'],['other','Other']];
var EXP_COLS = [{f:'spent_on', label:'Date', type:'date', required:true}, {f:'description', label:'Description', required:true},
                {f:'category', label:'Category'}, {f:'amount', label:'Amount', type:'number', money:true, required:true},
                {f:'method', label:'Paid by', type:'select', opts:EXP_METHODS, blank:'—'}, {f:'notes', label:'Notes'}];
function expSpec(){ return { key:'exp', resource:'expenses', ownerOnly:true, cols:EXP_COLS, rows: items('expenses'),
  empty:['No expenses recorded', 'Record one above.'], reload:function(){ need('expenses', '/business/expenses', true); } }; }
VIEWS.expenses = function(){
  var out = '<h1>Expenses</h1><p class="sub">What the business spent, and on what.</p>';
  if (!need('expenses', '/business/expenses')) return out + panel('Expenses', loading('Loading expenses...'));
  if (S.expenses === null) return out + panel('Expenses', errState('The expense service did not respond.'));

    '<select class="fld" id="exmeth" style="min-width:110px"><option value="">Paid by…</option>' + EXP_METHODS.map(function(m){ return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') + '</select>' +
    '<button class="btn primary" id="exadd">Record</button></div></div>' + actbar());
  var list = items('expenses'), total = list.reduce(function(a, e){ return a + Number(e.amount || 0); }, 0);
  out += panel('Expenses', crudTable(expSpec()) + (list.length ? '<div class="card-note" style="padding:8px 16px">' + list.length + ' recorded, ' + money(total) + ' in total.</div>' : ''),
    '<span class="pill count">' + list.length + '</span>');

      var desc = val('exdesc'), amt = numv('examt');
      if (!desc) { say('An expense needs a description.'); return; }
      if (amt === null || isNaN(amt) || !(amt > 0)) { say('An expense needs an amount above zero.'); return; }
      b.disabled = true;
      act('/business/expenses', {method:'POST', body:{ description: desc, amount: amt, category: val('excat') || 'general',
        spent_on: val('exdate') || todayISO(), method: val('exmeth') || null }}, 'Expense recorded.')
        .then(function(r){ b.disabled = false; if (r.ok) need('expenses', '/business/expenses', true); });
    };
  }, 0);
  return out;
};

/* --------------------------------------------------------------- Packages
   A package is a price plus real rows pointing at real services/products (the
   database refuses a line that is both or neither, or a quantity under 1). A
   package already sold on a bill cannot be deleted, only deactivated. */
var PKG_COLS = [{f:'name', label:'Name', required:true}, {f:'description', label:'Description'}, {f:'price', label:'Price', type:'number', money:true},
                {f:'validity_days', label:'Valid (days)', type:'int'}, {f:'terms', label:'Terms'}, {f:'active', label:'Active', type:'bool'}];
function pkgSpec(){ return { key:'pkg', resource:'packages', ownerOnly:true, cols:PKG_COLS, rows: items('packages'),
  empty:['No packages yet', 'Create one above, then add what it includes.'], reload:function(){ need('packages', '/business/packages', true); } }; }
VIEWS.packages = function(){

function ibxWire(){
  setTimeout(function(){
    var r = document.getElementById('ibx_ref');
    if (r) r.onclick = function(){ IBX.data = undefined; ibxLoad(true); if (IBX.sel) ibxOpen(IBX.sel); };
    document.querySelectorAll('[data-sid]').forEach(function(el){
      el.onclick = function(){ IBX.draft = ''; IBX.note = null; ibxOpen(el.getAttribute('data-sid')); };
    });
    var box = document.getElementById('ibx_chat');
    if (box) box.scrollTop = box.scrollHeight;
    var t = document.getElementById('ibx_text'), b = document.getElementById('ibx_send');
    if (t) { t.oninput = function(){ IBX.draft = t.value; };
             t.onkeydown = function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (b) b.click(); } }; }
    if (b) b.onclick = function(){
      var text = (t && t.value || '').trim(), sid = IBX.sel;
      if (!text) { IBX.note = { text: 'Type a message first.', bad: true }; renderShell(); return; }
      IBX.sending = true; IBX.note = null; renderShell();
      api('/whatsapp/chats/' + encodeURIComponent(sid) + '/send', { method: 'POST', body: { text: text } }).then(function(res){
        IBX.sending = false;
        if (res.ok) { IBX.draft = ''; IBX.note = { text: 'Sent at ' + when(res.data.at || new Date().toISOString()) + '.', bad: false }; }
        else {
          IBX.note = { text: (res.data && res.data.detail) || ('Not sent (HTTP ' + res.status + ').'), bad: true };
          // Still let them answer: open WhatsApp with this customer and the text typed in.
          var ch = null; ((IBX.data && IBX.data.chats) || []).forEach(function(c){ if (c.session_id === sid) ch = c; });
          var ph = ch && String(ch.phone || '').replace(/\D/g, '');
          if (ph && ph.length >= 8) IBX.note.wa = 'https://wa.me/' + ph + '?text=' + encodeURIComponent(text);
        }
        if (IBX.sel === sid) ibxOpen(sid); else renderShell();
      });
    };
  }, 0);
  return '';
}

/* #14/#15 Jarvis. One button: LISTEN starts, STOP ends (and sends what was
   heard). The orb and label always say what Jarvis is doing:
   Idle -> Listening -> Processing -> Responding -> Idle, or Error with the
   reason (microphone blocked gets its own instructions). Reuses the existing
   voice helpers: jarvisHeard, the server voice (/console/speak), consoleSend's
   API call. */
var JV = { state: 'idle', msg: '', rec: null, heard: '', audio: null };
var JV_LABEL = { idle: 'Idle', listening: 'Listening…', processing: 'Processing…', responding: 'Responding…', error: 'Error' };
function jvSet(state, msg){
  JV.state = state; JV.msg = msg || '';
  var orb = document.getElementById('jv-orb'), lab = document.getElementById('jv-state'), m = document.getElementById('jv-msg'), b = document.getElementById('con-mic');
  if (orb) orb.className = 'jv-orb ' + state;
  if (lab) lab.textContent = JV_LABEL[state];
  if (m) { m.textContent = JV.msg; m.style.color = state === 'error' ? 'var(--danger)' : 'var(--muted)'; }
  if (b) {
    b.textContent = (state === 'listening' || state === 'responding') ? '■ STOP' : '● LISTEN';
    b.classList.toggle('stop', state === 'listening' || state === 'responding');
    b.disabled = state === 'processing';
  }
}
function jvSpeak(text){
  return new Promise(function(done){
    if (!text) return done();
    JARVIS_LAST = String(text).slice(0, 600);
    var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(JARVIS_LAST);
    fetch('/console/speak', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ text: JARVIS_LAST, lang: urdu ? 'ur' : 'en' }) })
      .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
      .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JV.audio = a; a.onended = done; a.onerror = done; return a.play(); })
      .catch(function(){
        try {
          if (!window.speechSynthesis) return done();
          var u = new SpeechSynthesisUtterance(JARVIS_LAST); u.lang = urdu ? 'ur-PK' : 'en-US';
          u.onend = done; u.onerror = done; window.speechSynthesis.speak(u);
        } catch (e) { done(); }
      });
  });
}
function jvStopAudio(){ try { if (JV.audio) JV.audio.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }
function jvMicError(code){
  if (code === 'not-allowed' || code === 'service-not-allowed')
    return 'Microphone is blocked for this site. Click the lock icon next to the address bar, set Microphone to Allow, then press LISTEN again. You can also type below.';
  if (code === 'audio-capture') return 'No microphone was found on this device. Plug one in, or type below.';
  if (code === 'no-speech') return 'I did not hear anything. Press LISTEN and speak, or type below.';
  if (code === 'network') return 'The browser could not reach its speech service. Check the connection, or type below.';
  return 'Voice stopped (' + code + '). Press LISTEN to try again, or type below.';
}
function wireConsoleMic(){
  var mic = document.getElementById('con-mic'), box = document.getElementById('con-in');
  if (!mic || !box) return;
  var lb = document.getElementById('con-lang'); if (lb) lb.textContent = jarvisLangLabel();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  mic.style.display = '';
  jvSet(JV.state === 'processing' ? 'processing' : 'idle', JV.state === 'error' ? '' : JV.msg);
  mic.onclick = function(){
    if (JV.state === 'responding') { jvStopAudio(); jvSet('idle'); return; }
    if (JV.state === 'listening') { if (JV.rec) JV.rec.stop(); return; }
    if (!SR) { jvSet('error', 'Voice needs Chrome or Edge on this device. You can type below.'); return; }
    try { JV.rec = new SR(); } catch (e) { jvSet('error', 'This browser would not start voice input. Type below instead.'); return; }
    var rec = JV.rec, failed = null;
    rec.lang = jarvisRecLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    JV.heard = '';
    rec.onresult = function(ev){ JV.heard = jarvisHeard(ev); box.value = JV.heard; };
    rec.onerror = function(ev){ failed = ev.error || 'unknown'; };
    rec.onend = function(){
      JV.rec = null;
      if (failed && failed !== 'aborted') { jvSet('error', jvMicError(failed)); return; }
      if (JV.heard.trim()) { JARVIS_SPOKEN = true; consoleSend(); }
      else jvSet('idle', 'Nothing heard.');
    };
    try { rec.start(); jvSet('listening', 'Speak now. Press STOP when you are done.'); }
    catch (e) { jvSet('error', jvMicError('start-failed')); }
  };
}
function consoleSend(){
  var box = document.getElementById('con-in'), out = document.getElementById('con-out');
  if (!box || !box.value.trim() || JV.state === 'processing') return;
  var msg = box.value.trim(), spoken = JARVIS_SPOKEN; JARVIS_SPOKEN = false;
  jvSet('processing', 'Working on: "' + msg.slice(0, 80) + (msg.length > 80 ? '…' : '') + '"');
  api('/console', { method: 'POST', body: { message: msg } }).then(function(r){
    if (!r.ok) {
      var why = (r.data && r.data.detail) || ('Jarvis could not do that (HTTP ' + r.status + ').');
      if (out) out.innerHTML = errState(why);
      jvSet('error', why);
      if (spoken) jvSpeak(why);
      return;
    }
    var d = r.data || {}, extra = '';
    box.value = '';
    if (d.kind === 'teach') { extra = '<div class="sub" style="margin-top:8px">Your agent will now follow: <em>' + esc(d.lesson || '') + '</em></div>'; loadLessons(); }
    if (d.kind === 'dashboard') { PREFS = d.prefs || PREFS; applyBrand(); extra = '<div class="sub" style="margin-top:8px">Applied: ' + esc(JSON.stringify(d.changed || {})) + '</div>'; }
    if (d.kind === 'post') { extra = '<div class="sub" style="margin-top:8px">Nothing is public yet. Review it under Social posts below.</div>'; loadPosts(); }
    if (d.kind === 'business') {
      need('biz_' + d.resource, '/business/' + d.resource, true);
      extra = '<div class="sub" style="margin-top:8px">' + (d.action === 'create' ? 'Added to ' : 'Updated in ') + esc(d.resource || 'your business details') + '.</div>';
    }
    var reply = d.reply || 'Done.';
    if (out) out.innerHTML = '<div class="jv-reply">' + esc(reply) + extra + jarvisListenBtn('btn') + '</div>';
    JARVIS_LAST = reply;
    if (spoken) { jvSet('responding', 'Speaking the answer. Press STOP to cut it short.'); jvSpeak(reply).then(function(){ if (JV.state === 'responding') jvSet('idle'); }); }
    else jvSet('idle');
  });
}

/* Shrink in the browser (the API accepts up to 1 MB), keep transparency. */
function shrinkImage(file, max){
  return new Promise(function(ok, bad){
    if (!file) return bad(new Error('Pick an image first.'));
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) return bad(new Error('Use a PNG, JPEG, WEBP or SVG image.'));
    var rd = new FileReader();
    rd.onerror = function(){ bad(new Error('That file could not be read.')); };
    rd.onload = function(){
      if (file.type === 'image/svg+xml') return ok(rd.result);
      var img = new Image();
      img.onerror = function(){ bad(new Error('That image could not be opened.')); };
      img.onload = function(){
        var k = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var out = c.toDataURL('image/webp', 0.9);
        if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/png');
        ok(out);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ======================================================== Jarvis, conversation
   ONE button. Press it once: Jarvis listens, answers, speaks, and listens again
   by itself until you press it again (or stay silent twice).
   Speed: the answer is spoken sentence by sentence (the first sentence starts
   while the rest is still being voiced), and if the server voice is slow the
   browser's own voice speaks instead of leaving silence. Each turn shows where
   the time went (thinking vs voice) so a slow turn can be pinned down.
   Pictures: 📎 attaches a photo; it is uploaded (JPEG, for Instagram) and the
   post Jarvis drafts uses it. Nothing is published until Approve & post. */
var JV = { state: 'idle', msg: '', rec: null, heard: '', audio: null, conv: false, silent: 0,

var JV_LABEL = { idle: 'Ready', listening: 'Listening…', processing: 'Thinking…', responding: 'Speaking…', error: 'Something went wrong' };

function jvSet(state, msg){

function jvSentences(text){

/* Fetch one piece of speech; resolves to a blob URL, or null if slow/failed. */
function jvFetchVoice(text, urdu, signal){
  var t0 = Date.now();
  return fetch('/console/speak', { method: 'POST', credentials: 'include', signal: signal,
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text, lang: urdu ? 'ur' : 'en' }) })
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ return { url: URL.createObjectURL(b), ms: Date.now() - t0 }; })

function jvSpeak(text){

  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  var ctl = new AbortController(); JV.abort = ctl;
  var parts = jvSentences(text);
  var jobs = parts.map(function(p){ return jvFetchVoice(p, urdu, ctl.signal); });   // all start now
  var first = Promise.race([jobs[0], new Promise(function(r){ setTimeout(function(){ r('slow'); }, JV_VOICE_WAIT_MS); })]);
  return first.then(function(v){
    if (ctl.signal.aborted) return;
    if (!v || v === 'slow') {                          // server voice too slow: speak now in the browser
      ctl.abort(); JV.timing += ' · voice: browser (server voice slow)';
      jvSet(JV.state); return jvBrowserVoice(text, urdu);
    }
    JV.timing += ' · voice ' + (v.ms / 1000).toFixed(1) + 's'; jvSet(JV.state);
    var chain = jvPlay(v.url);
    for (var i = 1; i < jobs.length; i++) (function(job, part){
      chain = chain.then(function(){ return ctl.signal.aborted ? null : job; })

/* Photo -> JPEG (Instagram accepts only JPEG), longest side 1600 px. */
function jvToJpeg(file){
  return new Promise(function(ok, bad){
    if (!file || !/^image\/(png|jpeg|webp|gif|heic|heif)$/.test(file.type)) return bad(new Error('Pick a photo (JPG, PNG or WEBP).'));
    var rd = new FileReader();
    rd.onerror = function(){ bad(new Error('That photo could not be read.')); };
    rd.onload = function(){
      var img = new Image();
      img.onerror = function(){ bad(new Error('That photo could not be opened here. Try a JPG or PNG.')); };
      img.onload = function(){
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.86));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

    if (code.length !== 6) { err.textContent = 'Enter all 6 digits of the code.'; document.getElementById('vc').focus(); return; }
    go.disabled = true; go.textContent = 'Checking...'; err.textContent = '';
    api('/auth/verify-email', {method:'POST', body:{email:em, code:code}}).then(function(r){
      if (!r.ok) {
        go.disabled = false; go.textContent = 'Confirm and sign in';
        err.textContent = r.status === 400 ? 'That code is wrong or has expired. Check it, or use "Resend code".' :
          ((r.data && r.data.detail) || 'Could not check the code. Please try again.');
        return;
      }
      api('/auth/login', {method:'POST', body:{email:em, password:pw}}).then(function(l){
        clearInterval(timer);
        if (l.ok) { boot(); return; }
        gate('Email confirmed. Please sign in.');
      });
    });
  }
  re.onclick = function(){
    re.disabled = true; err.textContent = '';
    api('/auth/resend-code', {method:'POST', body:{email:em}}).then(function(r){
      if (!r.ok) { err.textContent = (r.data && r.data.detail) || 'Could not send a new code just now.'; re.disabled = false; return; }
      st.textContent = 'A new code is on its way to ' + em + '. Only the newest code works.';
      countdown((r.data && r.data.retry_after) || 60);
    });
  };
  go.onclick = verify;
  document.getElementById('vc').onkeydown = function(e){ if (e.key === 'Enter') verify(); };
  document.getElementById('vback').onclick = function(e){ e.preventDefault(); clearInterval(timer); gate(); };
  countdown(wait > 0 ? wait : 5);
  document.getElementById('vc').focus();
}

/* ---------- boot ---------- */
function boot(){
  root.innerHTML = loading();
  api('/me').then(function(r){
    if (r.status === 401 || r.status === 403) { gate('Your session has expired. Please sign in again.'); return; }
    if (!r.ok || !r.data) { root.innerHTML = errState('The platform did not respond. Please try again.'); return; }
    S.me = r.data;
    if (S.me.auth_enforced && !S.me.authenticated) { gate(); return; }
    /* A founder account has no business of its own: its home is the founder
       console (clients, requests, plans), not an empty business dashboard. */
    if (S.me.role === 'techdeva_admin') { location.replace('/techdeva'); return; }
    if (!S.me.tenant_id) {
      root.innerHTML = '<div class="gate"><div class="gate-box"><h1>No business linked</h1>' +
        '<p class="sub">This account is not attached to a business yet.</p>' +
        '<a class="btn primary" href="/onboarding" style="display:inline-block">Set up your business</a></div></div>';
      return;
    }
    /* Everything below is tenant-scoped by the backend from the session. */
    loadBrand();   /* their logo and colour, before the first paint of content */
    Promise.all([
      api('/portal/summary'), api('/leads'), api('/portal/config'), api('/portal/deliverables')
    ]).then(function(res){
      S.summary = res[0].ok ? res[0].data : null;
      S.leads   = res[1].ok && res[1].data ? (res[1].data.leads || []) : null;
      S.config  = res[2].ok ? res[2].data : null;
      S.deliv   = res[3].ok && res[3].data ? (res[3].data.deliverables || res[3].data.items || []) : null;
      renderShell();
    });
  });
}

function pstWhen(s){

function pstImgHTML(){

}
function pstImgs(p){ return (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []); }
function pstCard(p, own, connected, pgList){
  var res = p.results || {};
  var errs = Object.keys(res).filter(function(k){ return res[k] && res[k].ok === false; })
    .map(function(k){ return k + ': ' + (res[k].error || 'failed'); });
  if (res.error) errs.push(res.error);
  var meta = esc((p.platforms || []).join(' + ')) + ' · <span class="tag">' + esc(PST_LABEL[p.status] || p.status) + '</span>';
  var onPage = (res.facebook && res.facebook.page) || ((pgList || []).filter(function(x){ return x.id === p.page_id; })[0] || {}).name;
  if (onPage && p.status !== 'draft') meta += ' · Page <b>' + esc(onPage) + '</b>';
  if (p.status === 'scheduled') meta += ' · goes out <b>' + esc(pstWhen(p.scheduled_at)) + '</b>';
  else if (p.published_at) meta += ' · ' + esc(pstWhen(p.published_at));
  else meta += ' · written ' + esc(pstWhen(p.created_at));
  var acts = '';
  if (own && (p.status === 'draft' || p.status === 'failed')) {
    acts = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">' +
      (connected ? '<button class="btn primary" data-pnow="' + esc(p.id) + '">Post now</button>' +
        '<input type="datetime-local" class="fld" id="pat_' + esc(p.id) + '" data-pat="' + esc(p.id) + '" min="' + pstLocalMin() + '" value="' + esc(PST.at[p.id] || pstLocalMin()) + '" style="max-width:220px">' +

  } else if (own && p.status === 'scheduled') {

  }
  return '<div class="pst-card">' +
    '<div class="card-note">' + meta + '</div>' +
    (pstImgs(p).length ? '<div class="pst-imgs">' + pstImgs(p).map(function(u){ return '<img src="' + esc(u) + '" alt="" class="pst-img">'; }).join('') + '</div>' : '') +
    '<div style="white-space:pre-wrap;margin:6px 0">' + esc(p.caption) + '</div>' +
    (errs.length ? '<div class="card-note" style="color:var(--danger)">' + esc(errs.join(' | ')) + '</div>' : '') +
    acts + '</div>';

function pstReload(){ S.social_posts = undefined; LOADING.social_posts = false; need('social_posts', '/social/posts', true); }
function pstWire(){
  var g = function(id){ return document.getElementById(id); };
  if (g('ps_pick')) g('ps_pick').onclick = function(){ g('ps_file').click(); };
  if (g('ps_page')) g('ps_page').onchange = function(){ PST.page = g('ps_page').value || null; };
  var needPage = function(){
    if (g('ps_page') && !PST.page) { say('Choose which Facebook Page to post to (top of this page).'); g('ps_page').focus(); return true; }
    return false;
  };
  var redraw = function(){ var b = g('ps_img'); if (b) { b.innerHTML = pstImgHTML(); pstWire(); } };
  document.querySelectorAll('[data-psrm]').forEach(function(b){
    b.onclick = function(){ PST.imgs.splice(+b.getAttribute('data-psrm'), 1); redraw(); };
  });
  if (g('ps_file')) g('ps_file').onchange = function(){
    var files = Array.prototype.slice.call(g('ps_file').files || []);
    g('ps_file').value = '';
    var room = PST.MAX - PST.imgs.length;
    if (files.length > room) say(room > 0 ? 'A post can have ' + PST.MAX + ' pictures, so only the first ' + room + ' were added.' : 'A post can have ' + PST.MAX + ' pictures.');
    files.slice(0, Math.max(room, 0)).forEach(function(f){
      var m = { src: '', url: null };
      jvToJpeg(f).then(function(jpeg){
        m.src = jpeg; PST.imgs.push(m); redraw();
        return api('/social/media', { method: 'POST', body: { image: jpeg } });
      }).then(function(r){
        if (!r || !r.ok) throw new Error((r && r.data && r.data.detail) || 'A picture was not saved.');
        m.url = r.data.url; redraw();
      }).catch(function(e){ var i = PST.imgs.indexOf(m); if (i !== -1) PST.imgs.splice(i, 1); redraw(); say(e.message); });
    });
  };
  if (g('ps_save')) g('ps_save').onclick = function(){
    var cap = (g('ps_cap').value || '').trim(), plats = [];
    if (g('ps_fb').checked) plats.push('facebook');
    if (g('ps_ig').checked) plats.push('instagram');
    if (cap.length < 2) { say('Write what the post should say.'); return; }
    if (!plats.length) { say('Tick Facebook, Instagram or both.'); return; }
    if (PST.imgs.some(function(m){ return !m.url; })) { say('Wait a moment, the pictures are still uploading.'); return; }
    var urls = PST.imgs.map(function(m){ return m.url; });
    if (plats.indexOf('instagram') !== -1 && !urls.length) { say('Instagram needs a picture. Add one, or untick Instagram.'); return; }
    g('ps_save').disabled = true;
    act('/social/posts', { method: 'POST', body: { caption: cap, platforms: plats, image_urls: urls } }, 'Draft saved. Post it now or pick a time below.')
      .then(function(r){ if (r.ok) { PST.imgs = []; pstReload(); } else g('ps_save').disabled = false; });
  };
  document.querySelectorAll('[data-pnow]').forEach(function(b){
    b.onclick = function(){
      if (needPage()) return;
      if (!b.getAttribute('data-armed')) { b.setAttribute('data-armed', '1'); b.textContent = 'Tap again to post publicly'; return; }
      b.disabled = true; b.textContent = 'Posting…';
      act('/social/posts/' + b.getAttribute('data-pnow') + '/publish', { method: 'POST', body: { page_id: PST.page } }, 'Posted.').then(pstReload);
    };
  });
  // a redraw (new data, Page picked) must not reset the time the owner chose
  document.querySelectorAll('[data-pat]').forEach(function(inp){
    inp.oninput = inp.onchange = function(){ PST.at[inp.getAttribute('data-pat')] = inp.value; };
  });
  document.querySelectorAll('[data-psch]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-psch'), v = (g('pat_' + id) || {}).value;
      var d = v ? new Date(v) : null;
      if (!d || isNaN(d)) { say('Pick a date and time.'); return; }
      if (needPage()) return;
      if (!confirm('Schedule this post for ' + pstWhen(d) + '?')) return;
      b.disabled = true;
      act('/social/posts/' + id + '/schedule', { method: 'POST', body: { at: d.toISOString(), page_id: PST.page } }, 'Scheduled for ' + pstWhen(d) + '.')
        .then(function(r){ if (r.ok) { delete PST.at[id]; pstReload(); } else b.disabled = false; });
    };
  });
  document.querySelectorAll('[data-punsch]').forEach(function(b){
    b.onclick = function(){ b.disabled = true; act('/social/posts/' + b.getAttribute('data-punsch') + '/unschedule', { method: 'POST' }, 'Back to drafts.').then(pstReload); };
  });
  document.querySelectorAll('[data-pdis]').forEach(function(b){
    b.onclick = function(){ b.disabled = true; act('/social/posts/' + b.getAttribute('data-pdis'), { method: 'DELETE' }, 'Discarded.').then(pstReload); };
  });
}

/* ======================================================== WhatsApp agent request
   A business without an agent asks for one here. TechDeva approves it and the
   server builds it (ops/agent-template/provision-queue.sh); this page then
   shows Connect WhatsApp like any other business. */
var AR_TEXT = {
  requested: ['Request sent', 'TechDeva has your request and will approve it shortly. This page updates by itself.'],
  approved:  ['Setting up', 'Your agent is being set up. It usually takes a few minutes; this page updates by itself and then shows the QR code to scan.'],
  building:  ['Building your agent', 'Setting up your WhatsApp agent now. This takes a few minutes.'],
  failed:    ['Delayed', 'Setting up your agent hit a problem. TechDeva has been told and will retry.'],
  rejected:  ['Not approved yet', '']
};
var AR_POLL = null;
function arStop(){ if (AR_POLL) { clearInterval(AR_POLL); AR_POLL = null; } }
function arForm(){
  if (!isOwner()) return empty('No WhatsApp agent yet', 'Ask the business owner to request one from this page.');
  return '<div style="padding:16px">' +
    '<p>Your business does not have its WhatsApp agent yet. Ask for one here: it answers your customers on WhatsApp, in your business name, and books appointments into this dashboard.</p>' +
    '<div class="ar-grid">' +
      '<div><label class="card-note">Your own WhatsApp number (the owner)</label><input id="ar_phone" class="fld" placeholder="0300 1234567" inputmode="tel"></div>' +
      '<div><label class="card-note">How the agent should call you</label><input id="ar_home" class="fld" placeholder="e.g. Dr Noor"></div>' +
      '<div><label class="card-note">Assistant name</label><input id="ar_asst" class="fld" value="Zara" maxlength="20"></div>' +
    '</div>' +
    '<p class="card-note">Your number is where the agent sends you alerts and questions it cannot answer. Customers message your business number, which you connect after the agent is ready.</p>' +
    '<button class="btn primary" id="ar_go">Request my WhatsApp agent</button><div id="ar_msg" class="card-note" style="min-height:18px;margin-top:8px"></div></div>';
}
function arStatus(r){
  var t = AR_TEXT[r.status] || [r.status, ''];
  var msg = r.status === 'rejected' ? (r.error || 'TechDeva will contact you about your WhatsApp agent.') : t[1];
  return '<div style="padding:16px"><p><span class="tag">' + esc(t[0]) + '</span></p><p class="sub">' + esc(msg) + '</p>' +
    '<div class="card-note">Asked ' + esc(pstWhen(r.created_at)) + ' · assistant ' + esc(r.assistant) + '</div></div>';
}
function arMount(){
  api('/whatsapp/agent-request').then(function(r){
    var req = r.ok && r.data && r.data.request;
    if (req && req.status === 'ready') {
      arStop();
      /* built; only hand over to Connect once the platform has it linked,
         otherwise say so (never bounce between the two screens) */
      api('/whatsapp').then(function(w){
        if (w.status === 409) waRender('<div style="padding:16px"><p><span class="tag">Almost ready</span></p><p class="sub">Your agent is built. TechDeva is linking it to this dashboard; refresh in a few minutes.</p></div>');
        else waMount();
      });
      return;
    }
    if (!req) {
      if (waRender(arForm())) arWire();
      return;
    }
    waRender(arStatus(req));
    if (!AR_POLL && ['requested', 'approved', 'building', 'failed'].indexOf(req.status) !== -1) AR_POLL = setInterval(arMount, 15000);
  });
}
function arWire(){
  var b = document.getElementById('ar_go'); if (!b) return;
  b.onclick = function(){
    var m = document.getElementById('ar_msg');
    b.disabled = true; m.textContent = 'Sending...'; m.style.color = '';
    api('/whatsapp/agent-request', { method: 'POST', body: {
      owner_phone: document.getElementById('ar_phone').value,
      home_name: document.getElementById('ar_home').value,
      assistant: document.getElementById('ar_asst').value } }).then(function(r){
      if (!r.ok) { b.disabled = false; m.style.color = 'var(--danger)'; m.textContent = (r.data && r.data.detail) || 'That did not work.'; return; }
      arMount();
    });
  };
}
function waMount(){
  arStop();
  api('/whatsapp').then(function(r){
    if (r.status === 409) { arMount(); return; }
    if (!r.ok) { waRender(errState('The WhatsApp service returned ' + r.status + '.')); return; }
    var d = r.data || {};
    if (waRender(d.connected ? waConnected(d) : waIdle(d))) waWire();
    if (d.status === 'pairing') { waPoll(); waStop(); WA_POLL = setInterval(waPoll, 3000); }
  });
}
window.addEventListener('hashchange', arStop);
(function(){
  var st = document.createElement('style');
  st.textContent = '.ar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}.ar-grid .fld{width:100%}';
  document.head.appendChild(st);
})();

/* ======================================================== Trial lock screen
   When the 7-day trial has ended unpaid the API answers 402 for the business's
   own logins (app/trial.py). This replaces the whole dashboard with one screen:
   what happened, how to pay, "I have paid". The WhatsApp agent keeps working. */
var LOCK_SHOWN = false;
function lockScreen(){
  LOCK_SHOWN = true;
  if (typeof stopAllPolls === 'function') try { stopAllPolls(); } catch (e) {}
  var own = S.me && S.me.role === 'owner';
  root.innerHTML = '<div class="gate"><div class="gate-box lock-box" id="lockbox">' + loading('Loading...') + '</div></div>';
  var p = own ? api('/billing') : Promise.resolve({ ok: false });
  Promise.all([p, api('/portal/summary')]).then(function(rs){
    var b = rs[0].ok ? rs[0].data : null, sm = rs[1].ok ? rs[1].data : null;
    var name = (sm && sm.trial && sm.trial.name) || 'Your business';
    var a = (b && b.account) || {};
    var fee = Number(a.monthly_fee) || 0;
    var h = (BRAND && BRAND.has_logo ? '<img src="' + brandLogoURL() + '" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:12px;margin-bottom:10px">' : '') +
      '<h1>Your free trial has ended</h1>' +
      '<p class="sub">' + esc(name) + ': your ' + esc((a.trial_days || 7) + '-day') + ' free trial' +
      (a.trial_ends_at ? ' ended on ' + esc(bilDate(a.trial_ends_at)) : ' has ended') + '. ' +
      'Pay to unlock your dashboard.' + (a.deletes_on ? '' : ' Your WhatsApp agent is still answering your customers.') + '</p>' +
      (a.deletes_on ? '<div class="lock-sec" style="border:1px solid ' + (a.delete_warning ? 'var(--danger)' : 'var(--line)') + ';border-radius:10px;padding:12px">' +
        '<b style="color:' + (a.delete_warning ? 'var(--danger)' : 'inherit') + '">' + (a.delete_warning ? 'Your data will be deleted on ' : 'Your data is kept until ') + esc(bilDate(a.deletes_on)) + '.</b>' +
        '<div class="sub" style="margin-top:4px">If your plan is not paid by then, everything is deleted for good: customers, bookings, invoices and your WhatsApp agent. Pay before then to keep it all.</div></div>' : '');
    if (!own) {
      h += '<p class="sub">Please ask the business owner to pay. The dashboard unlocks for everyone as soon as TechDeva receives it (usually within 2 hours).</p>';
    } else {
      var pending = (b && b.claims || []).some(function(c){ return c.status === 'pending'; });
      h += '<div class="lock-sec"><div class="card-note">Amount</div><div class="lock-fee">' +
        (fee > 0 ? esc(bilMoney(fee, a.currency)) + ' / month' : 'TechDeva will confirm your monthly fee') + '</div></div>';
      h += '<div class="lock-sec"><div class="card-note">How to pay</div><div style="white-space:pre-wrap">' +
        (b && b.payment_instructions ? esc(b.payment_instructions) : 'Contact TechDeva for payment details.') + '</div></div>';
      if (pending) {
        h += '<div class="lock-sec"><span class="tag">Payment being checked</span><p class="sub" style="margin-top:8px">We have your payment details. ' +
          'Our team checks payments within 2 hours, and your dashboard unlocks the moment it is confirmed. This page checks by itself.</p></div>';
        setTimeout(function(){ if (LOCK_SHOWN) boot(); }, 30000);
      } else {
        h += '<div class="lock-sec"><div class="card-note" style="margin-bottom:6px">Already paid? Tell us so we can unlock you:</div>' +
          '<div class="bil-pay" style="margin-top:0"><select class="fld" id="lk_m">' + BIL_METHODS.map(function(m){ return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') + '</select>' +
          '<input class="fld" id="lk_amt" inputmode="decimal" placeholder="Amount (PKR)" value="' + (fee > 0 ? esc(Math.round(fee)) : '') + '">' +
          '<input class="fld" id="lk_ref" placeholder="Transaction ID / reference"></div>' +
          '<button class="btn primary" id="lk_go" style="width:100%;margin-top:10px;padding:10px">I have paid</button>' +
          '<div id="lk_msg" class="card-note" style="min-height:18px;margin-top:8px"></div></div>';
      }
    }
    h += '<div style="margin-top:14px;text-align:center"><a href="#" id="lk_out" style="color:var(--muted);font-size:13px">Sign out</a></div>';
    var box = document.getElementById('lockbox'); if (!box) return;
    box.innerHTML = h;
    var out = document.getElementById('lk_out');
    if (out) out.onclick = function(e){ e.preventDefault(); api('/auth/logout', { method: 'POST' }).then(function(){ LOCK_SHOWN = false; gate(); }); };
    var go = document.getElementById('lk_go');
    if (go) go.onclick = function(){
      var msg = document.getElementById('lk_msg');
      go.disabled = true; msg.style.color = ''; msg.textContent = 'Sending...';
      api('/billing/paid', { method: 'POST', body: { method: document.getElementById('lk_m').value,
        amount: document.getElementById('lk_amt').value, reference: document.getElementById('lk_ref').value.trim() } }).then(function(r){
        if (!r.ok) { go.disabled = false; msg.style.color = 'var(--danger)'; msg.textContent = (r.data && r.data.detail) || 'That did not work.'; return; }
        lockScreen();
      });
    };
  });
}
/* While locked nothing may draw the dashboard over the lock screen (hash
   changes, late responses, polls all call renderShell). */
var _renderShellBeforeLock = renderShell;
renderShell = function(){ if (LOCK_SHOWN) return; return _renderShellBeforeLock.apply(this, arguments); };
/* Any 402 "locked" answer (e.g. the trial ends while the page is open) shows the lock screen. */
var _apiBeforeLock = api;
api = function(path, opts){
  return _apiBeforeLock(path, opts).then(function(r){
    if (r.status === 402 && r.data && r.data.locked && !LOCK_SHOWN) setTimeout(lockScreen, 0);
    return r;
  });
};
var _bootBeforeLock = boot;
boot = function(){
  LOCK_SHOWN = false;
  _apiBeforeLock('/me').then(function(r){
    if (r.ok && r.data && r.data.locked && r.data.tenant_id) { S.me = r.data; loadBrand(); lockScreen(); return; }
    _bootBeforeLock();
  });
};

  var st = document.createElement('style');
  st.textContent = '.lock-box{max-width:460px}.lock-sec{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}' +
    '.lock-fee{font-size:22px;font-weight:700;margin-top:2px}.lock-box .bil-pay .fld{max-width:none;flex:1 1 130px}';
  document.head.appendChild(st);
})();

/* ======================================================== Several WhatsApp numbers
   A plan allows 1 (Starter), 2 (Growth) or 5 (Pro) numbers. The WhatsApp page
   shows one tab per number; every connect / QR / disconnect call names the
   number (?conn=<id>). The inbox mixes all numbers, and a chat is opened and
   answered through the number it came in on. */
var WA_CONN = null, WA_LIST = [], WA_PLAN = null, WA_ADD = false;
function waQ(){ return WA_CONN ? '?conn=' + encodeURIComponent(WA_CONN) : ''; }
function waTabs(){
  if (WA_LIST.length < 2 && !WA_ADD && !(WA_PLAN && WA_LIST.length < WA_PLAN.max_numbers && isOwner())) return '';
  var t = WA_LIST.map(function(n, i){
    var on = !WA_ADD && n.id === WA_CONN;
    return '<button class="btn' + (on ? ' primary' : '') + '" data-waconn="' + esc(n.id) + '">' +
      esc(n.phone_number ? '+' + n.phone_number : 'Number ' + (i + 1)) + (n.connected ? ' ✓' : '') + '</button>';
  }).join('');
  if (WA_PLAN && isOwner()) {
    t += WA_LIST.length < WA_PLAN.max_numbers
      ? '<button class="btn' + (WA_ADD ? ' primary' : '') + '" id="wa_add">+ Add another number</button>'
      : '<span class="card-note">' + esc(WA_PLAN.name) + ' plan: ' + WA_PLAN.max_numbers + ' number' + (WA_PLAN.max_numbers === 1 ? '' : 's') + '. <a href="#/billing">Upgrade</a> for more.</span>';
  }
  return '<div class="wa-tabs">' + t + '</div>';
}
function waRenderAll(inner){
  var el = document.getElementById('wa'); if (!el) { waStop(); return false; }
  el.innerHTML = waTabs() + '<div id="wa_body">' + inner + '</div>';
  document.querySelectorAll('[data-waconn]').forEach(function(b){
    b.onclick = function(){ WA_ADD = false; WA_CONN = b.getAttribute('data-waconn'); waStop(); waMount(); };
  });
  var add = document.getElementById('wa_add');
  if (add) add.onclick = function(){ WA_ADD = true; waStop(); arStop(); arMount(); };
  return true;
}
/* keep the tabs when the single-number code redraws the card */
function waRender(html){
  if (!document.getElementById('wa')) { waStop(); return false; }
  if (WA_ADD || !document.getElementById('wa_body')) return waRenderAll(html);
  document.getElementById('wa_body').innerHTML = html;
  return true;
}
function waWire(){
  var on = document.getElementById('wa-on');
  if (on) on.onclick = function(){
    waRender(loading('Starting the pairing session...'));
    act('/whatsapp/connect' + waQ(), { method: 'POST' }, 'Pairing started').then(function(r){
      if (!r.ok) { waRender(errState((r.data && r.data.detail) || 'Could not start pairing.')); return; }
      waPoll(); WA_POLL = setInterval(waPoll, 3000);
    });
  };
  var off = document.getElementById('wa-off');
  if (off) off.onclick = function(){
    waRender(loading('Disconnecting...'));
    act('/whatsapp/disconnect' + waQ(), { method: 'POST' }, 'Disconnected').then(function(){ waStop(); waMount(); });
  };
}
function waPoll(){
  api('/whatsapp/qr' + waQ()).then(function(r){
    if (!r.ok) { waFail(r); return; }
    WA_FAILS = 0;
    var d = r.data || {};
    if (d.state === 'connected') { waStop(); waMount(); return; }
    if (d.state === 'expired' || d.state === 'idle') {
      waStop();
      if (waRender('<div style="padding:16px"><p class="sub">The pairing window closed without a scan.</p><button id="wa-on" class="btn">Try again</button></div>')) waWire();
      return;
    }
    if (!d.qr_svg) { waRender(loading('Waiting for the code...')); return; }
    waRender('<div style="padding:16px;text-align:center"><div style="background:#fff;display:inline-block;padding:12px;border-radius:12px;max-width:280px">' +
      d.qr_svg + '</div><p class="sub" style="margin-top:12px">WhatsApp on the phone with this number - Settings - Linked devices - Link a device, then scan this. The code refreshes on its own.</p></div>');
  });
}
function waMount(){
  arStop();
  api('/whatsapp' + waQ()).then(function(r){
    if (r.status === 409) { WA_LIST = []; WA_CONN = null; WA_ADD = true; arMount(); return; }
    if (r.status === 404 && WA_CONN) { WA_CONN = null; waMount(); return; }
    if (!r.ok) { waRender(errState('The WhatsApp service returned ' + r.status + '.')); return; }
    var d = r.data || {};
    WA_LIST = d.numbers || []; WA_PLAN = d.plan || null; WA_CONN = d.id || WA_CONN; WA_ADD = false;
    if (waRenderAll(d.connected ? waConnected(d) : waIdle(d))) waWire();
    if (d.status === 'pairing') { waPoll(); waStop(); WA_POLL = setInterval(waPoll, 3000); }
  });
}
/* the request form draws inside the tab area when adding a second number */
var _arFormFirst = arForm;
arForm = function(){
  var html = _arFormFirst();
  if (!WA_LIST.length) return html;
  return html.replace('Your business does not have its WhatsApp agent yet. Ask for one here:',
                      'Add another WhatsApp number to your business. Each number gets its own agent:')
             .replace('Request my WhatsApp agent', 'Request another number');
};
/* Adding a 2nd+ number: the business's latest request may be the (finished)
   one for its first number, so only an OPEN request is shown as status. */
var _arMountFirst = arMount, AR_WAITING = false;
arMount = function(){
  if (!WA_LIST.length) return _arMountFirst();
  api('/whatsapp/agent-request').then(function(r){
    var req = r.ok && r.data && r.data.request;
    if (req && ['requested', 'approved', 'building', 'failed'].indexOf(req.status) !== -1) {
      AR_WAITING = true; waRender(arStatus(req));
      if (!AR_POLL) AR_POLL = setInterval(arMount, 15000);
      return;
    }
    if (AR_WAITING && req && req.status === 'ready') { AR_WAITING = false; arStop(); WA_CONN = null; waMount(); return; }
    arStop();
    if (waRender(arForm())) arWire();
  });
};
/* inbox: open and answer a chat through the number it belongs to */
function ibxConn(sid){
  var c = ((IBX.data && IBX.data.chats) || []).filter(function(x){ return x.session_id === sid; })[0];
  return c && c.conn;
}
var _apiBeforeMulti = api;
api = function(path, opts){
  var m = /^\/whatsapp\/chats\/([^?\/]+)(\/send)?$/.exec(path);
  if (m) { var cn = ibxConn(decodeURIComponent(m[1])); if (cn) path += '?conn=' + encodeURIComponent(cn); }
  return _apiBeforeMulti(path, opts);
};
(function(){
  var st = document.createElement('style');
  st.textContent = '.wa-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px 0}';
  document.head.appendChild(st);
})();

/* ======================================================== Plan & usage
   Which plan the business is on, this month's WhatsApp conversations against
   its limit, its numbers, and the three plans. Owner only (the API refuses
   staff). Warnings at 80% and 100%; the agent is never cut off. */
function planBar(used, max){
  var pct = max ? Math.min(100, Math.round(100 * used / max)) : 0;
  var col = pct >= 100 ? 'var(--danger)' : pct >= 80 ? 'var(--warning,#F0A83C)' : 'var(--growth)';
  return '<div class="plan-bar"><div style="width:' + pct + '%;background:' + col + '"></div></div>';
}
function planTrialHTML(t){
  if (!t) return '';
  var left = Math.max(t.cap - t.used, 0);
  return '<div style="padding:14px 16px;border-bottom:1px solid var(--line)"><b>Free trial</b>' +
    '<div style="margin-top:8px">Customer messages answered by your WhatsApp agent: <b>' + esc(t.used) + '</b> of ' + esc(t.cap) + '</div>' + planBar(t.used, t.cap) +
    (t.paused || left === 0
      ? '<div class="plan-warn">Your agent has answered the ' + esc(t.cap) + ' messages of the free trial and is paused. Choose a plan and pay below: it starts answering again within a few minutes, with your plan\'s limits.</div>'
      : '<div class="card-note" style="margin-top:6px">' + esc(left) + ' left. At ' + esc(t.cap) + ' the agent pauses until you choose a plan.</div>') +
    '<div class="card-note" style="margin-top:6px">The trial also includes ' + esc(t.ai_pictures) + ' AI pictures for your posts.</div></div>';
}
function planHTML(pl){
  var p = pl.plan || {}, u = pl.usage || {}, cur = p.key;
  var out = planTrialHTML(pl.trial) + '<div style="padding:14px 16px">' +
    '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>' + esc(p.name || 'Starter') + '</b>' +
    (p.chosen ? '' : ' <span class="card-note">(free trial: Starter limits)</span>') + '</div>' +
    '<div class="card-note">since ' + esc(u.since || '') + '</div></div>' +
    '<div style="margin-top:10px">WhatsApp conversations this month: <b>' + esc((u.conversations || 0).toLocaleString('en-US')) + '</b> of ' +
    esc((p.max_conversations || 0).toLocaleString('en-US')) + (u.approximate ? ' <span class="card-note">(about)</span>' : '') + '</div>' +
    planBar(u.conversations || 0, p.max_conversations) +
    '<div style="margin-top:10px">WhatsApp numbers: <b>' + esc(u.numbers || 0) + '</b> of ' + esc(p.max_numbers || 1) + '</div>' +
    (pl.warning === 'over' ? '<div class="plan-warn">You have used your plan\'s conversations for this month. Your agent keeps answering; TechDeva will talk to you about moving up a plan.</div>'
      : pl.warning === 'near' ? '<div class="plan-warn">You have used ' + esc(pl.percent) + '% of this month\'s conversations.</div>' : '') +
    ((u.incomplete || []).length ? '<div class="card-note" style="margin-top:6px">Could not count one of your numbers right now: ' + esc(u.incomplete.join('; ')) + '</div>' : '') +
    '<div class="card-note" style="margin-top:8px">A conversation is one customer who writes to your business on WhatsApp in a month, however many messages they send.</div></div>';
  var plans = pl.plans || [];
  if (plans.length) out += '<div class="plan-grid">' + plans.map(function(x){
    return '<div class="plan-card' + (x.key === cur && p.chosen ? ' on' : '') + '"><div class="card-note">' + esc(x.name) + (x.key === cur && p.chosen ? ' · your plan' : '') + '</div>' +
      '<div class="plan-price">' + (x.price_pkr != null ? 'PKR ' + esc(Math.round(x.price_pkr).toLocaleString('en-US')) + '<span class="card-note"> / month</span>' : 'Talk to us') + '</div>' +
      '<div>' + esc(x.max_numbers) + ' WhatsApp number' + (x.max_numbers === 1 ? '' : 's') + '</div>' +
      '<div>' + esc(x.max_conversations.toLocaleString('en-US')) + ' conversations / month</div>' +
      '<div class="card-note">Full dashboard, Jarvis and posting included</div></div>';
  }).join('') + '</div><div class="card-note" style="padding:0 16px 14px">To change plan, message TechDeva; your fee and limits change the same day.</div>';
  return out;
}
var _billingBeforePlan = VIEWS.billing;
VIEWS.billing = function(){
  var html = _billingBeforePlan();
  if (!isOwner() || !S.billing) return html;
  var box = need('plan', '/plan') ? (S.plan ? planHTML(S.plan) : errState('Could not read your plan.')) : loading('Counting this month\'s conversations...');
  var at = html.indexOf('<div class="panel');
  var pn = panel('Plan & WhatsApp usage', box);
  return at === -1 ? html + pn : html.slice(0, at) + pn + html.slice(at);
};
var _overviewBeforePlan = VIEWS.overview;
VIEWS.overview = function(){
  var html = _overviewBeforePlan();
  if (!isOwner()) return html;
  need('plan', '/plan');
  var pl = S.plan;

/* ======================================================== Jarvis that does things (Part 16)
   - Remembers the conversation: the last few turns go with every message, so
     "5 pm" or "yes, her number is 0300..." continues what was being asked.
   - Does the work: books, moves, cancels and finishes appointments, adds
     customers, leads and expenses, schedules posts, opens any page. The server
     runs each through the same endpoints as the buttons, with the same rights.
   - Money, cancelling and anything public asks first: "Shall I...?" with Yes /
     No buttons, or just say "yes" / "haan".
   - On every page: a Jarvis button bottom right opens a small panel, and a
     conversation carries on while Jarvis opens other pages for you.
   - Quick voice: English replies are spoken at once in the best voice this
     browser has (Voice: quick); the studio voice is one tap away (Voice:
     natural) and is always used for Urdu. */
JV.hist = JV.hist || []; JV.pending = null; JV.dock = false; JV.extra = '';
try { JV.voice = localStorage.getItem('jarvis_voice') || 'fast'; } catch (e) { JV.voice = 'fast'; }
JV_VOICE_WAIT_MS = 3500;
var JV_BEST = null;
function jvPickVoice(){
  try {
    var vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [], best = null, bs = -1;
    vs.forEach(function(v){
      if (!/^en([-_]|$)/i.test(v.lang || '')) return;
      var s = 0, n = v.name || '';
      if (/natural|neural|online|premium|enhanced/i.test(n)) s += 4;
      if (/google/i.test(n)) s += 2;
      if (/aria|jenny|sonia|libby|samantha|zira|female/i.test(n)) s += 1;
      if (/en[-_](GB|US)/i.test(v.lang)) s += 1;
      if (s > bs) { bs = s; best = v; }
    });
    JV_BEST = best;
  } catch (e) {}
}
if (window.speechSynthesis) { jvPickVoice(); try { window.speechSynthesis.addEventListener('voiceschanged', jvPickVoice); } catch (e) {} }
function jvVoiceLabel(){ return JV.voice === 'fast' ? 'Voice: quick' : 'Voice: natural'; }
function jvToggleVoice(btn){
  JV.voice = JV.voice === 'fast' ? 'natural' : 'fast';
  try { localStorage.setItem('jarvis_voice', JV.voice); } catch (e) {}
  if (btn) btn.textContent = jvVoiceLabel();
}
function jvBrowserVoice(text, urdu){
  return new Promise(function(done){
    var fin = false, end = function(){ if (!fin) { fin = true; done(); } };
    try {
      if (!window.speechSynthesis || !text) return end();
      var u = new SpeechSynthesisUtterance(text); u.lang = urdu ? 'ur-PK' : 'en-US';
      if (!urdu && JV_BEST) { u.voice = JV_BEST; u.lang = JV_BEST.lang; }
      u.rate = 1.05;
      u.onend = end; u.onerror = end;
      setTimeout(end, 4000 + String(text).length * 90);   // some browsers never say they finished
      window.speechSynthesis.speak(u);
    } catch (e) { end(); }
  });
}
function jvSpeakServer(text, urdu){
  var ctl = new AbortController(); JV.abort = ctl;
  var parts = jvSentences(text);
  var jobs = parts.map(function(p){ return jvFetchVoice(p, urdu, ctl.signal); });
  var first = Promise.race([jobs[0], new Promise(function(r){ setTimeout(function(){ r('slow'); }, JV_VOICE_WAIT_MS); })]);
  return first.then(function(v){
    if (ctl.signal.aborted) return;
    if (!v || v === 'slow') { ctl.abort(); JV.timing += ' · voice: browser (studio voice slow)'; jvSet(JV.state); return jvBrowserVoice(text, urdu); }
    JV.timing += ' · voice ' + (v.ms / 1000).toFixed(1) + 's'; jvSet(JV.state);
    var chain = jvPlay(v.url);
    for (var i = 1; i < jobs.length; i++) (function(job, part){
      chain = chain.then(function(){ return ctl.signal.aborted ? null : job; })
                   .then(function(w){ if (ctl.signal.aborted) return; return w ? jvPlay(w.url) : jvBrowserVoice(part, urdu); });
    })(jobs[i], parts[i]);
    return chain;
  });
}
function jvSpeak(text){
  jvStopAudio();
  text = String(text || '').slice(0, 600);
  JARVIS_LAST = text;
  if (!text) return Promise.resolve();
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  if (!urdu && JV.voice === 'fast' && JV_BEST) { JV.timing += ' · voice: instant'; jvSet(JV.state); return jvBrowserVoice(text, false); }
  return jvSpeakServer(text, urdu);
}
function jvListen(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { JV.conv = false; jvSet('error', 'Voice needs Chrome or Edge. You can type instead.'); return; }
  var rec; try { rec = new SR(); } catch (e) { JV.conv = false; jvSet('error', 'This browser would not start the microphone. Type instead.'); return; }
  JV.rec = rec; JV.heard = '';
  var failed = null;
  rec.lang = jarvisRecLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = function(ev){ JV.heard = jarvisHeard(ev); var box = document.getElementById('con-in'); if (box) box.value = JV.heard; };
  rec.onerror = function(ev){ failed = ev.error || 'unknown'; };
  rec.onend = function(){
    JV.rec = null;
    if (!JV.conv || JV.state === 'processing' || JV.state === 'responding') return;   // a button was used meanwhile
    if (failed && failed !== 'no-speech' && failed !== 'aborted') { JV.conv = false; jvSet('error', jvMicError(failed)); return; }
    if (JV.heard.trim()) { JV.silent = 0; JARVIS_SPOKEN = true; consoleSend(); return; }
    JV.silent++;
    if (JV.silent >= 2) { JV.conv = false; jvSet('idle', 'Conversation ended: I did not hear anything.'); return; }
    jvListen();
  };
  try { rec.start(); jvSet('listening', 'Go ahead, I\'m listening.'); }
  catch (e) { JV.conv = false; jvSet('error', jvMicError('start-failed')); }
}

function jvHist(role, text){ JV.hist.push({ role: role, text: String(text || '').slice(0, 400) }); if (JV.hist.length > 20) JV.hist.shift(); }
function jvYesNo(msg){
  var m = String(msg).toLowerCase().replace(/[.!,?؟۔]/g, ' ').replace(/\s+/g, ' ').trim();
  if (m.length > 40) return null;
  if (/^(yes|yeah|yep|yup|sure|ok|okay|confirm|go ahead|do it|haan|han|ha|haa|ji|jee|g|theek|thik|kar do|kardo|bilkul|ہاں|جی|ٹھیک|بالکل)( |$)/.test(m)) return 'yes';
  if (/^(post it|post kar|post karo|post kardo|post now|publish|share it|daal do|dal do|پوسٹ کر)/.test(m)) return 'yes';
  if (/^(keep (it )?(as )?(a )?draft|draft|baad me|baad mein|abhi nahi|later)( |$)/.test(m)) return 'no';
  if (/^(no|nope|cancel|stop|dont|don't|leave it|nahi|nahin|nai|na|mat|نہیں|نہ)( |$)/.test(m)) return 'no';
  return null;
}

function jvConfirm(yes){
  var p = JV.pending; JV.pending = null;

function jvLocal(reply){
  jvHist('jarvis', reply); JV.extra = ''; jvShowOut();

/* Jarvis designs the post: its headline and line go on the first picture (or
   on the brand colour when there is none) with the logo, using the Posts
   designer's own painter, and the result replaces that picture in the draft.
   Resolves with the designed picture's link, or null when nothing changed. */
function jvDesignDraft(post, design, srcs){
  if (!post || !design || !(design.head || design.sub)) return Promise.resolve(null);
  var first = srcs && srcs[0];
  var st = { img: null, img2: null, size: 'square', zoom: 1, ox: 0, oy: 0, head: design.head || '', sub: design.sub || '',
             pos: first ? 'bottom' : 'center', band: !!first, bg: edBrandColor(), fg: '#ffffff', logo: false, tpl: '' };
  return (first ? edLoadImg(first).then(function(i){ st.img = i; }) : Promise.resolve())
    .then(edLogo).then(function(logo){
      st.logo = !!logo;
      var cv = document.createElement('canvas'); edPaint(cv, st);
      return api('/social/media', { method: 'POST', body: { image: cv.toDataURL('image/jpeg', 0.9) } });
    }).then(function(r){
      if (!r || !r.ok) throw new Error('upload');
      var urls = (post.image_urls || []).slice();
      if (first) urls[0] = r.data.url; else urls = [r.data.url];
      return api('/social/posts/' + post.id, { method: 'PATCH', body: { image_urls: urls, platforms: design.platforms || post.platforms } })
        .then(function(p){ if (!p || !p.ok) throw new Error('save'); return r.data.url; });
    }).catch(function(){ return null; });   // the plain draft is still there
}
function consoleSend(opt){
  var box = document.getElementById('con-in');
  if (JV.state === 'processing') return;
  var body, msg;
  if (opt && opt.confirm && JV.designing) {
    // a "post it" before the designed picture is in the draft waits for it
    jvSet('processing', 'Finishing the design…');
    JV.designing.then(function(){ jvSet('idle', ''); consoleSend(opt); });
    return;
  }
  if (opt && opt.confirm) { body = { confirm: opt.confirm, said: opt.label || 'Yes' }; msg = opt.label || 'Yes'; }
  else {
    if (!box || !box.value.trim()) return;
    if (jvImgsBusy()) { jvSet('error', 'The pictures are still uploading. Try again in a moment.'); return; }
    msg = box.value.trim();
    if (JV.pending) {
      var p = JV.pending, yn = jvYesNo(msg); JV.pending = null;
      if (yn === 'yes') { box.value = ''; return consoleSend({ confirm: p.confirm, label: msg }); }
      if (yn === 'no') { box.value = ''; jvHist('user', msg); jvNote(msg, p.no || 'Okay, I\'ve left it as it is.'); return jvLocal(p.no || 'Okay, I\'ve left it as it is.'); }

  body.voice = spoken;

  if (box) box.value = '';
  jvHist('user', msg); JV.extra = '';
  var t0 = Date.now(); JV.timing = '';
  jvSet('processing', ''); jvShowOut();
  fetch('/console', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r){
      var st = r.headers.get('Server-Timing') || '', m = /think;dur=(\d+)/.exec(st);
      JV.timing = 'thinking ' + (m ? (m[1] / 1000).toFixed(1) : ((Date.now() - t0) / 1000).toFixed(1)) + 's';

    })
    .catch(function(){ return { ok: false, status: 0, data: null }; })

      if (r.ok) {
        if (d.kind === 'teach') { extra = '<div class="jv-x">Your agent will now follow: <em>' + esc(d.lesson || '') + '</em></div>'; loadLessons(); }
        if (d.kind === 'dashboard') { PREFS = d.prefs || PREFS; applyBrand(); }
        if (d.kind === 'post') {

          extra = '<div class="jv-x"><div id="jv-prev" class="jv-prev">' + (d.design ? '<span class="card-note">Designing the picture…</span>' : '') + '</div>' +
                  (d.confirm ? '<button class="btn primary" type="button" onclick="jvConfirm(true)">Post it now</button> ' +
                               '<button class="btn" type="button" onclick="jvConfirm(false)">Keep as draft</button> ' : '') +
                  '<a class="btn" href="#/posts">Edit on Posts</a></div>';
          JV.designing = jvDesignDraft(d.post, d.design, srcs).then(function(url){
            JV.designing = null;
            var pv = document.getElementById('jv-prev');

      if (go) {

        if (currentView() !== go) location.hash = '#/' + go;

      jvShowOut();

        jvSet('responding', 'Speaking. Press End conversation to stop.');
        jvSpeak(reply).then(function(){
