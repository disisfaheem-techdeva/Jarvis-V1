        (acc.facebook_login
          ? 'Facebook is connected, but no Facebook Page came through, so posts can only be saved as drafts. Press Reconnect and, when Facebook asks, tick your Page (and its Instagram). If your Page is in a Business Portfolio, choose that business too.'
          : 'Facebook is not connected yet. You can write drafts now; posting needs the connection.') + '</div>' +
        '<a class="btn primary" href="/connect/meta">' + (acc.facebook_login ? 'Reconnect Facebook &amp; Instagram' : 'Connect Facebook &amp; Instagram') + '</a></div>');
  if (own) {

          '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ps_ig" checked> Instagram</label>' +
          '<button class="btn" id="ps_pick" type="button">📎 Add pictures</button>' +
          '<input type="file" id="ps_file" accept="image/*" multiple style="display:none">' +
        '</div>' +
        '<div class="card-note" style="margin-top:8px">Add up to 10 pictures: several pictures go out as one Facebook album post and one Instagram carousel. Instagram needs at least one picture. Each picture is sent as JPEG, up to 4 MB.</div>' +
        '<div style="margin-top:12px"><button class="btn primary" id="ps_save" type="button">Save as draft</button></div>' +
      '</div>');
  }

  var groups = [

    ['Scheduled', list.filter(function(p){ return p.status === 'scheduled' || p.status === 'publishing'; })
       .sort(function(a, b){ return String(a.scheduled_at || '').localeCompare(String(b.scheduled_at || '')); })],
    ['Posted', list.filter(function(p){ return p.status === 'published' || p.status === 'partial'; })]

  out += actbar();

function pstImgHTML(){
  if (!PST.imgs.length) return '';
  var waiting = PST.imgs.filter(function(m){ return !m.url; }).length;
  return '<div style="display:flex;gap:10px;flex-wrap:wrap">' + PST.imgs.map(function(m, i){
      return '<div class="pst-thumb"><img src="' + m.src + '" alt="Picture ' + (i + 1) + '">' +
        (m.url ? '' : '<span class="pst-up">Uploading…</span>') +
        '<button type="button" class="pst-x" data-psrm="' + i + '" aria-label="Remove picture ' + (i + 1) + '">×</button></div>';
    }).join('') + '</div>' +
    '<div class="card-note" style="margin-top:6px">' + PST.imgs.length + ' of ' + PST.MAX + ' pictures' +
      (waiting ? ', ' + waiting + ' still uploading…' : ' ready.') + '</div>';
}
function pstImgs(p){ return (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []); }
function pstCard(p, own, connected){
  var res = p.results || {};
  var errs = Object.keys(res).filter(function(k){ return res[k] && res[k].ok === false; })
    .map(function(k){ return k + ': ' + (res[k].error || 'failed'); });
  if (res.error) errs.push(res.error);
  var meta = esc((p.platforms || []).join(' + ')) + ' · <span class="tag">' + esc(PST_LABEL[p.status] || p.status) + '</span>';
  if (p.status === 'scheduled') meta += ' · goes out <b>' + esc(pstWhen(p.scheduled_at)) + '</b>';
  else if (p.published_at) meta += ' · ' + esc(pstWhen(p.published_at));
  else meta += ' · written ' + esc(pstWhen(p.created_at));
  var acts = '';
  if (own && (p.status === 'draft' || p.status === 'failed')) {
    acts = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">' +
      (connected ? '<button class="btn primary" data-pnow="' + esc(p.id) + '">Post now</button>' +
        '<input type="datetime-local" class="fld" id="pat_' + esc(p.id) + '" min="' + pstLocalMin() + '" value="' + pstLocalMin() + '" style="max-width:220px">' +
        '<button class="btn" data-psch="' + esc(p.id) + '">Schedule</button>' : '') +
      '<button class="btn" data-pdis="' + esc(p.id) + '">Discard</button>' +
      (connected ? '' : '<span class="card-note">Post now and Schedule appear once a Facebook Page is connected (see the top of this page).</span>') + '</div>';
  } else if (own && p.status === 'scheduled') {
    acts = '<div style="margin-top:10px"><button class="btn" data-punsch="' + esc(p.id) + '">Cancel schedule (back to draft)</button></div>';
  }
  return '<div class="pst-card">' +
    '<div class="card-note">' + meta + '</div>' +
    (pstImgs(p).length ? '<div class="pst-imgs">' + pstImgs(p).map(function(u){ return '<img src="' + esc(u) + '" alt="" class="pst-img">'; }).join('') + '</div>' : '') +
    '<div style="white-space:pre-wrap;margin:6px 0">' + esc(p.caption) + '</div>' +
    (errs.length ? '<div class="card-note" style="color:var(--danger)">' + esc(errs.join(' | ')) + '</div>' : '') +
    acts + '</div>';
}
function pstReload(){ S.social_posts = undefined; LOADING.social_posts = false; need('social_posts', '/social/posts', true); }
function pstWire(){
  var g = function(id){ return document.getElementById(id); };
  if (g('ps_pick')) g('ps_pick').onclick = function(){ g('ps_file').click(); };
  var redraw = function(){ var b = g('ps_img'); if (b) { b.innerHTML = pstImgHTML(); pstWire(); } };
  document.querySelectorAll('[data-psrm]').forEach(function(b){
    b.onclick = function(){ PST.imgs.splice(+b.getAttribute('data-psrm'), 1); redraw(); };
  });
  if (g('ps_file')) g('ps_file').onchange = function(){
    var files = Array.prototype.slice.call(g('ps_file').files || []);
    g('ps_file').value = '';
    var room = PST.MAX - PST.imgs.length;
    if (files.length > room) say(room > 0 ? 'A post can have ' + PST.MAX + ' pictures, so only the first ' + room + ' were added.' : 'A post can have ' + PST.MAX + ' pictures.');
    files.slice(0, Math.max(room, 0)).forEach(function(f){
      var m = { src: '', url: null };
      jvToJpeg(f).then(function(jpeg){
        m.src = jpeg; PST.imgs.push(m); redraw();
        return api('/social/media', { method: 'POST', body: { image: jpeg } });
      }).then(function(r){
        if (!r || !r.ok) throw new Error((r && r.data && r.data.detail) || 'A picture was not saved.');
        m.url = r.data.url; redraw();
      }).catch(function(e){ var i = PST.imgs.indexOf(m); if (i !== -1) PST.imgs.splice(i, 1); redraw(); say(e.message); });
    });
  };
  if (g('ps_save')) g('ps_save').onclick = function(){
    var cap = (g('ps_cap').value || '').trim(), plats = [];
    if (g('ps_fb').checked) plats.push('facebook');
    if (g('ps_ig').checked) plats.push('instagram');
    if (cap.length < 2) { say('Write what the post should say.'); return; }
    if (!plats.length) { say('Tick Facebook, Instagram or both.'); return; }
    if (PST.imgs.some(function(m){ return !m.url; })) { say('Wait a moment, the pictures are still uploading.'); return; }
    var urls = PST.imgs.map(function(m){ return m.url; });
    if (plats.indexOf('instagram') !== -1 && !urls.length) { say('Instagram needs a picture. Add one, or untick Instagram.'); return; }
    g('ps_save').disabled = true;
    act('/social/posts', { method: 'POST', body: { caption: cap, platforms: plats, image_urls: urls } }, 'Draft saved. Post it now or pick a time below.')
      .then(function(r){ if (r.ok) { PST.imgs = []; pstReload(); } else g('ps_save').disabled = false; });
  };
  document.querySelectorAll('[data-pnow]').forEach(function(b){
    b.onclick = function(){
      if (!b.getAttribute('data-armed')) { b.setAttribute('data-armed', '1'); b.textContent = 'Tap again to post publicly'; return; }
      b.disabled = true; b.textContent = 'Posting…';
      act('/social/posts/' + b.getAttribute('data-pnow') + '/publish', { method: 'POST' }, 'Posted.').then(pstReload);
    };
  });
  document.querySelectorAll('[data-psch]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-psch'), v = (g('pat_' + id) || {}).value;
      var d = v ? new Date(v) : null;
      if (!d || isNaN(d)) { say('Pick a date and time.'); return; }
      b.disabled = true;
      act('/social/posts/' + id + '/schedule', { method: 'POST', body: { at: d.toISOString() } }, 'Scheduled for ' + pstWhen(d) + '.')
        .then(function(r){ if (r.ok) pstReload(); else b.disabled = false; });
    };
  });
  document.querySelectorAll('[data-punsch]').forEach(function(b){
    b.onclick = function(){ b.disabled = true; act('/social/posts/' + b.getAttribute('data-punsch') + '/unschedule', { method: 'POST' }, 'Back to drafts.').then(pstReload); };
  });
  document.querySelectorAll('[data-pdis]').forEach(function(b){
    b.onclick = function(){ b.disabled = true; act('/social/posts/' + b.getAttribute('data-pdis'), { method: 'DELETE' }, 'Discarded.').then(pstReload); };
  });
}

/* ======================================================== Several WhatsApp numbers
   A plan allows 1 (Starter), 2 (Growth) or 5 (Pro) numbers. The WhatsApp page
   shows one tab per number; every connect / QR / disconnect call names the
   number (?conn=<id>). The inbox mixes all numbers, and a chat is opened and
   answered through the number it came in on. */
var WA_CONN = null, WA_LIST = [], WA_PLAN = null, WA_ADD = false;
function waQ(){ return WA_CONN ? '?conn=' + encodeURIComponent(WA_CONN) : ''; }
function waTabs(){
  if (WA_LIST.length < 2 && !WA_ADD && !(WA_PLAN && WA_LIST.length < WA_PLAN.max_numbers && isOwner())) return '';
  var t = WA_LIST.map(function(n, i){
    var on = !WA_ADD && n.id === WA_CONN;
    return '<button class="btn' + (on ? ' primary' : '') + '" data-waconn="' + esc(n.id) + '">' +
      esc(n.phone_number ? '+' + n.phone_number : 'Number ' + (i + 1)) + (n.connected ? ' ✓' : '') + '</button>';
  }).join('');
  if (WA_PLAN && isOwner()) {
    t += WA_LIST.length < WA_PLAN.max_numbers
      ? '<button class="btn' + (WA_ADD ? ' primary' : '') + '" id="wa_add">+ Add another number</button>'
      : '<span class="card-note">' + esc(WA_PLAN.name) + ' plan: ' + WA_PLAN.max_numbers + ' number' + (WA_PLAN.max_numbers === 1 ? '' : 's') + '. <a href="#/billing">Upgrade</a> for more.</span>';
  }
  return '<div class="wa-tabs">' + t + '</div>';
}
function waRenderAll(inner){
  var el = document.getElementById('wa'); if (!el) { waStop(); return false; }
  el.innerHTML = waTabs() + '<div id="wa_body">' + inner + '</div>';
  document.querySelectorAll('[data-waconn]').forEach(function(b){
    b.onclick = function(){ WA_ADD = false; WA_CONN = b.getAttribute('data-waconn'); waStop(); waMount(); };
  });
  var add = document.getElementById('wa_add');
  if (add) add.onclick = function(){ WA_ADD = true; waStop(); arStop(); arMount(); };
  return true;
}
/* keep the tabs when the single-number code redraws the card */
function waRender(html){
  if (!document.getElementById('wa')) { waStop(); return false; }
  if (WA_ADD || !document.getElementById('wa_body')) return waRenderAll(html);
  document.getElementById('wa_body').innerHTML = html;
  return true;
}
function waWire(){
  var on = document.getElementById('wa-on');
  if (on) on.onclick = function(){
    waRender(loading('Starting the pairing session...'));
    act('/whatsapp/connect' + waQ(), { method: 'POST' }, 'Pairing started').then(function(r){
      if (!r.ok) { waRender(errState((r.data && r.data.detail) || 'Could not start pairing.')); return; }
      waPoll(); WA_POLL = setInterval(waPoll, 3000);
    });
  };
  var off = document.getElementById('wa-off');
  if (off) off.onclick = function(){
    waRender(loading('Disconnecting...'));
    act('/whatsapp/disconnect' + waQ(), { method: 'POST' }, 'Disconnected').then(function(){ waStop(); waMount(); });
  };
}
function waPoll(){
  api('/whatsapp/qr' + waQ()).then(function(r){
    if (!r.ok) { waStop(); waRender(errState('The pairing service stopped responding.')); return; }
    var d = r.data || {};
    if (d.state === 'connected') { waStop(); waMount(); return; }
    if (d.state === 'expired' || d.state === 'idle') {
      waStop();
      if (waRender('<div style="padding:16px"><p class="sub">The pairing window closed without a scan.</p><button id="wa-on" class="btn">Try again</button></div>')) waWire();
      return;
    }
    if (!d.qr_svg) { waRender(loading('Waiting for the code...')); return; }
    waRender('<div style="padding:16px;text-align:center"><div style="background:#fff;display:inline-block;padding:12px;border-radius:12px;max-width:280px">' +
      d.qr_svg + '</div><p class="sub" style="margin-top:12px">WhatsApp on the phone with this number - Settings - Linked devices - Link a device, then scan this. The code refreshes on its own.</p></div>');
  });
}
function waMount(){
  arStop();
  api('/whatsapp' + waQ()).then(function(r){
    if (r.status === 409) { WA_LIST = []; WA_CONN = null; WA_ADD = true; arMount(); return; }
    if (r.status === 404 && WA_CONN) { WA_CONN = null; waMount(); return; }
    if (!r.ok) { waRender(errState('The WhatsApp service returned ' + r.status + '.')); return; }
    var d = r.data || {};
    WA_LIST = d.numbers || []; WA_PLAN = d.plan || null; WA_CONN = d.id || WA_CONN; WA_ADD = false;
    if (waRenderAll(d.connected ? waConnected(d) : waIdle(d))) waWire();

    if (req && ['requested', 'approved', 'building', 'failed'].indexOf(req.status) !== -1) {

/* ======================================================== Jarvis that does things (Part 16)
   - Remembers the conversation: the last few turns go with every message, so
     "5 pm" or "yes, her number is 0300..." continues what was being asked.
   - Does the work: books, moves, cancels and finishes appointments, adds
     customers, leads and expenses, schedules posts, opens any page. The server
     runs each through the same endpoints as the buttons, with the same rights.
   - Money, cancelling and anything public asks first: "Shall I...?" with Yes /
     No buttons, or just say "yes" / "haan".
   - On every page: a Jarvis button bottom right opens a small panel, and a
     conversation carries on while Jarvis opens other pages for you.
   - Quick voice: English replies are spoken at once in the best voice this
     browser has (Voice: quick); the studio voice is one tap away (Voice:
     natural) and is always used for Urdu. */
JV.hist = JV.hist || []; JV.pending = null; JV.dock = false; JV.extra = '';
try { JV.voice = localStorage.getItem('jarvis_voice') || 'fast'; } catch (e) { JV.voice = 'fast'; }
JV_VOICE_WAIT_MS = 3500;
var JV_BEST = null;
function jvPickVoice(){
  try {
    var vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [], best = null, bs = -1;
    vs.forEach(function(v){
      if (!/^en([-_]|$)/i.test(v.lang || '')) return;
      var s = 0, n = v.name || '';
      if (/natural|neural|online|premium|enhanced/i.test(n)) s += 4;
      if (/google/i.test(n)) s += 2;
      if (/aria|jenny|sonia|libby|samantha|zira|female/i.test(n)) s += 1;
      if (/en[-_](GB|US)/i.test(v.lang)) s += 1;
      if (s > bs) { bs = s; best = v; }
    });
    JV_BEST = best;
  } catch (e) {}
}
if (window.speechSynthesis) { jvPickVoice(); try { window.speechSynthesis.addEventListener('voiceschanged', jvPickVoice); } catch (e) {} }
function jvVoiceLabel(){ return JV.voice === 'fast' ? 'Voice: quick' : 'Voice: natural'; }
function jvToggleVoice(btn){
  JV.voice = JV.voice === 'fast' ? 'natural' : 'fast';
  try { localStorage.setItem('jarvis_voice', JV.voice); } catch (e) {}
  if (btn) btn.textContent = jvVoiceLabel();
}
function jvBrowserVoice(text, urdu){
  return new Promise(function(done){
    var fin = false, end = function(){ if (!fin) { fin = true; done(); } };
    try {
      if (!window.speechSynthesis || !text) return end();
      var u = new SpeechSynthesisUtterance(text); u.lang = urdu ? 'ur-PK' : 'en-US';
      if (!urdu && JV_BEST) { u.voice = JV_BEST; u.lang = JV_BEST.lang; }
      u.rate = 1.05;
      u.onend = end; u.onerror = end;
      setTimeout(end, 4000 + String(text).length * 90);   // some browsers never say they finished
      window.speechSynthesis.speak(u);
    } catch (e) { end(); }
  });
}
function jvSpeakServer(text, urdu){
  var ctl = new AbortController(); JV.abort = ctl;
  var parts = jvSentences(text);
  var jobs = parts.map(function(p){ return jvFetchVoice(p, urdu, ctl.signal); });
  var first = Promise.race([jobs[0], new Promise(function(r){ setTimeout(function(){ r('slow'); }, JV_VOICE_WAIT_MS); })]);
  return first.then(function(v){
    if (ctl.signal.aborted) return;
    if (!v || v === 'slow') { ctl.abort(); JV.timing += ' · voice: browser (studio voice slow)'; jvSet(JV.state); return jvBrowserVoice(text, urdu); }
    JV.timing += ' · voice ' + (v.ms / 1000).toFixed(1) + 's'; jvSet(JV.state);
    var chain = jvPlay(v.url);
    for (var i = 1; i < jobs.length; i++) (function(job, part){
      chain = chain.then(function(){ return ctl.signal.aborted ? null : job; })
                   .then(function(w){ if (ctl.signal.aborted) return; return w ? jvPlay(w.url) : jvBrowserVoice(part, urdu); });
    })(jobs[i], parts[i]);
    return chain;
  });
}
function jvSpeak(text){
  jvStopAudio();
  text = String(text || '').slice(0, 600);
  JARVIS_LAST = text;
  if (!text) return Promise.resolve();
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  if (!urdu && JV.voice === 'fast' && JV_BEST) { JV.timing += ' · voice: instant'; jvSet(JV.state); return jvBrowserVoice(text, false); }
  return jvSpeakServer(text, urdu);
}
function jvListen(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { JV.conv = false; jvSet('error', 'Voice needs Chrome or Edge. You can type instead.'); return; }
  var rec; try { rec = new SR(); } catch (e) { JV.conv = false; jvSet('error', 'This browser would not start the microphone. Type instead.'); return; }
  JV.rec = rec; JV.heard = '';
  var failed = null;
  rec.lang = jarvisRecLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = function(ev){ JV.heard = jarvisHeard(ev); var box = document.getElementById('con-in'); if (box) box.value = JV.heard; };
  rec.onerror = function(ev){ failed = ev.error || 'unknown'; };
  rec.onend = function(){
    JV.rec = null;
    if (!JV.conv || JV.state === 'processing' || JV.state === 'responding') return;   // a button was used meanwhile
    if (failed && failed !== 'no-speech' && failed !== 'aborted') { JV.conv = false; jvSet('error', jvMicError(failed)); return; }
    if (JV.heard.trim()) { JV.silent = 0; JARVIS_SPOKEN = true; consoleSend(); return; }
    JV.silent++;
    if (JV.silent >= 2) { JV.conv = false; jvSet('idle', 'Conversation ended: I did not hear anything.'); return; }
    jvListen();
  };
  try { rec.start(); jvSet('listening', 'Go ahead, I\'m listening.'); }
  catch (e) { JV.conv = false; jvSet('error', jvMicError('start-failed')); }
}

function jvHist(role, text){ JV.hist.push({ role: role, text: String(text || '').slice(0, 400) }); if (JV.hist.length > 20) JV.hist.shift(); }
function jvYesNo(msg){
  var m = String(msg).toLowerCase().replace(/[.!,?؟۔]/g, ' ').replace(/\s+/g, ' ').trim();
  if (m.length > 40) return null;
  if (/^(yes|yeah|yep|yup|sure|ok|okay|confirm|go ahead|do it|haan|han|ha|haa|ji|jee|g|theek|thik|kar do|kardo|bilkul|ہاں|جی|ٹھیک|بالکل)( |$)/.test(m)) return 'yes';
  if (/^(no|nope|cancel|stop|dont|don't|leave it|nahi|nahin|nai|na|mat|نہیں|نہ)( |$)/.test(m)) return 'no';
  return null;
}
function jvTranscript(){
  var h = JV.hist.slice(-6);
  if (!h.length) return '<div class="card-note">Try: “Book Ayesha for a HydraFacial tomorrow at 4”, “Open appointments”, “Add an expense of 3,000 for tea”, “How many leads this week?”</div>';
  return '<div class="jv-chat">' + h.map(function(m, i){
    return '<div class="jv-b ' + (m.role === 'user' ? 'me' : 'ai') + '">' + esc(m.text) +
      (i === h.length - 1 && m.role !== 'user' ? (JV.extra || '') : '') + '</div>';
  }).join('') + (JV.state === 'processing' ? '<div class="jv-b ai jv-typing"><span></span><span></span><span></span></div>' : '') + '</div>';
}
function jvShowOut(){

  o.innerHTML = jvTranscript();

}
function jvConfirm(yes){
  var p = JV.pending; JV.pending = null;
  if (!p) return;
  try { if (JV.rec) JV.rec.abort(); } catch (e) {}
  if (!yes) { jvHist('user', 'No'); jvLocal('Okay, I\'ve left it as it is.'); return; }
  consoleSend({ confirm: p.confirm, label: 'Yes' });
}
function jvLocal(reply){
  jvHist('jarvis', reply); JV.extra = ''; jvShowOut();
  if (JV.conv) { jvSet('responding', 'Speaking.'); jvSpeak(reply).then(function(){ if (JV.conv) jvListen(); else jvSet('idle', ''); }); }
  else jvSet('idle', '');
}
function jvFreshData(){
  Object.keys(NEEDED).forEach(function(k){ S[k] = undefined; LOADING[k] = false; });
  if (typeof APT !== 'undefined') { APT.data = undefined; }
}
function consoleSend(opt){
  var box = document.getElementById('con-in');
  if (JV.state === 'processing') return;
  var body, msg;
  if (opt && opt.confirm) { body = { confirm: opt.confirm }; msg = opt.label || 'Yes'; }
  else {
    if (!box || !box.value.trim()) return;
    if (JV.img && !JV.imgUrl) { jvSet('error', 'The picture is still uploading. Try again in a moment.'); return; }
    msg = box.value.trim();
    if (JV.pending) {
      var p = JV.pending, yn = jvYesNo(msg); JV.pending = null;
      if (yn === 'yes') { box.value = ''; return consoleSend({ confirm: p.confirm, label: msg }); }
      if (yn === 'no') { box.value = ''; jvHist('user', msg); return jvLocal('Okay, I\'ve left it as it is.'); }
    }
    body = { message: msg, history: JV.hist.slice(-8) };
    if (JV.imgUrl) body.image_url = JV.imgUrl;
  }
  var spoken = !!(JARVIS_SPOKEN || JV.conv); JARVIS_SPOKEN = false;
  body.voice = spoken;
  if (box) box.value = '';

  var t0 = Date.now(); JV.timing = '';
  jvSet('processing', ''); jvShowOut();
  fetch('/console', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r){
      var st = r.headers.get('Server-Timing') || '', m = /think;dur=(\d+)/.exec(st);
      JV.timing = 'thinking ' + (m ? (m[1] / 1000).toFixed(1) : ((Date.now() - t0) / 1000).toFixed(1)) + 's';
      return r.text().then(function(t){ var d = null; try { d = JSON.parse(t); } catch (e) {} return { ok: r.ok, status: r.status, data: d }; });
    })
    .catch(function(){ return { ok: false, status: 0, data: null }; })
    .then(function(r){
      var d = r.data || {}, extra = '', go = null;
      var reply = r.ok ? (d.reply || 'Done.') : ((d && d.detail) || (r.status ? 'Sorry, that didn\'t work (error ' + r.status + ').' : 'I couldn\'t reach the server. Check the internet and try again.'));
      if (r.ok) {
        if (d.kind === 'teach') { extra = '<div class="jv-x">Your agent will now follow: <em>' + esc(d.lesson || '') + '</em></div>'; loadLessons(); }
        if (d.kind === 'dashboard') { PREFS = d.prefs || PREFS; applyBrand(); }
        if (d.kind === 'post') {
          extra = '<div class="jv-x">Nothing is public yet. <a href="#/needshuman">Review it in Needs Human</a></div>';
          JV.img = JV.imgUrl = null; jvRenderAttach(); loadPosts();
        }
        if (d.kind === 'business') { need('biz_' + d.resource, '/business/' + d.resource, true); }
        if (d.kind === 'confirm') {
          JV.pending = { confirm: d.confirm };
          extra = '<div class="jv-x"><button class="btn primary" type="button" onclick="jvConfirm(true)">Yes, do it</button> ' +
                  '<button class="btn" type="button" onclick="jvConfirm(false)">No</button></div>';
        }
        if (d.kind === 'action' && d.ok) {
          if (d.navigate) go = d.navigate;

            jvFreshData();
            var page = { appointments: 'appointments', customers: 'customers', leads: 'leads', expenses: 'expenses', posts: 'posts' }[d.refresh[0]];

          if (!JV.conv) { if (JV.state === 'responding') jvSet('idle', ''); return; }

    h += '<div style="display:flex;gap:12px;flex-wrap:wrap">' + (d.image_url ? '<img src="' + esc(d.image_url) + '" style="width:110px;height:110px;object-fit:cover;border-radius:8px">' : '<div class="card-note">No photo yet: upload one on the Posts page.</div>') +
      '<div style="flex:1;min-width:220px"><div style="font-weight:700">' + esc(m.headline || '') + '</div><div style="margin:4px 0;white-space:pre-wrap">' + esc(m.primary_text || '') + '</div>' +
      '<div class="card-note">' + esc((m.hashtags || []).map(function(x){ return '#' + x; }).join(' ')) + '</div><div class="card-note">' + esc(m.description || '') + ' · button: WhatsApp</div></div></div>';
  } else {
    h += '<div style="font-weight:700">' + esc((g.headlines || []).slice(0, 3).join(' | ')) + '</div>' +
      '<div class="card-note" style="margin:4px 0">' + esc((g.descriptions || []).join(' ')) + '</div>' +
      '<div class="card-note">Keywords: ' + esc((g.keywords || []).join(', ')) + '</div>';
  }
  if (d.error) h += '<div class="card-note" style="color:var(--danger);margin-top:6px">' + esc(d.error) + '</div>';
  if (!editing) {
    var ext = d.external || {};
    h += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      (open ? '<button class="btn primary" data-aplaunch="' + esc(d.id) + '" data-budget="' + esc(d.daily_budget) + '">🚀 Launch</button><button class="btn" data-apedit="' + esc(d.id) + '">Edit</button><button class="btn" data-apdiscard="' + esc(d.id) + '">Discard</button>' : '') +
      (d.status === 'launched' && ext.campaign_id ? '<button class="btn" data-apstat="0" data-prov="' + esc(d.provider) + '" data-cid="' + esc(ext.campaign_id) + '" data-name="' + esc('TechDeva · ' + d.service) + '">⏸ Pause</button>' : '') +
      (d.status === 'paused' && ext.campaign_id ? '<button class="btn" data-apstat="1" data-prov="' + esc(d.provider) + '" data-cid="' + esc(ext.campaign_id) + '" data-name="' + esc('TechDeva · ' + d.service) + '">▶ Turn back on</button>' : '') + '</div>';
  }
  return h + '</div>';
}
function apPanels(){
  if (!need('adpilot', '/adpilot')) return panel('Ad autopilot', loading('Loading your ad settings...'));
  var p = S.adpilot; if (!p) return '';
  var s = p.settings || {}, con = p.connected || {};
  var set = '<div style="padding:14px 16px">' +
    '<div class="sub" style="margin-bottom:10px">Your rules for the planner. It never spends more than you allow here.</div>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" id="ap_auto"' + (s.auto_pause ? ' checked' : '') + '> <b>Auto-pause</b> any running campaign that costs more than</label>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px 24px"><input class="fld" id="ap_limit" type="number" min="1" placeholder="e.g. 800" value="' + esc(s.max_cost_per_result == null ? '' : s.max_cost_per_result) + '" style="max-width:130px"> per lead or chat, after it has spent at least <input class="fld" id="ap_min" type="number" min="0" value="' + esc(s.min_spend || 0) + '" style="max-width:110px"> in 7 days.</div>' +
    '<div style="font-weight:600;margin:6px 0">Daily budget the planner may launch by itself</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap"><label class="card-note">Facebook & Instagram per day<input class="fld" id="ap_mcap" type="number" min="0" value="' + esc(s.meta_daily_cap || 0) + '" style="max-width:150px"></label>' +
    '<label class="card-note">Google per day<input class="fld" id="ap_gcap" type="number" min="0" value="' + esc(s.google_daily_cap || 0) + '" style="max-width:150px"></label></div>' +
    '<div class="card-note" style="margin:4px 0 12px">0 = the planner never launches by itself; it only writes drafts for you. With a cap, it may launch one new campaign a week per platform, and all its campaigns together stay within the cap. In your ad account\'s currency.</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap"><label class="card-note">Show ads in<select class="fld" id="ap_city"><option value="">the whole country</option>' + (p.cities || []).map(function(c){ return '<option value="' + esc(c) + '"' + (s.city === c ? ' selected' : '') + '>' + esc(c.charAt(0).toUpperCase() + c.slice(1)) + '</option>'; }).join('') + '</select></label>' +
    '<label class="card-note">within km<input class="fld" id="ap_radius" type="number" min="1" max="80" value="' + esc(s.radius_km || 15) + '" style="max-width:90px"></label>' +
    '<label class="card-note">Country<select class="fld" id="ap_country">' + (p.countries || []).map(function(c){ return '<option' + (s.country === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
    '<label class="card-note">Website (for Google ads)<input class="fld" id="ap_web" placeholder="https://yourclinic.com" value="' + esc(s.website_url || '') + '" style="min-width:240px"></label></div>' +
    '<div style="margin-top:12px"><button class="btn primary" id="ap_save">Save rules</button></div></div>';
  var out = panel('Ad autopilot: your rules', set);
  var neu = '<div style="padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
    '<select class="fld" id="ap_newprov"><option value="meta"' + (con.meta ? '' : ' disabled') + '>Facebook & Instagram' + (con.meta ? '' : ' (not connected)') + '</option><option value="google"' + (con.google ? '' : ' disabled') + '>Google' + (con.google ? '' : ' (not connected)') + '</option></select>' +
    '<select class="fld" id="ap_newsvc"><option value="">Your best seller</option>' + (p.services || []).map(function(x){ return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
    '<button class="btn primary" id="ap_new"' + (con.meta || con.google ? '' : ' disabled') + '>✨ Write a campaign</button>' +
    (con.meta || con.google ? '' : '<a class="btn" href="#/integrations">Connect ad accounts first</a>') + '</div>';
  var drafts = p.drafts || [];
  out += panel('Campaigns the planner wrote', neu + (drafts.length ? drafts.map(function(d){ return apDraft(d, p); }).join('') :
    '<div style="padding:0 16px 14px" class="card-note">None yet. The planner writes the headline, text, hashtags and keywords and picks one of your photos; you check it and press Launch.</div>'));
  var log = p.actions || [];
  if (log.length) out += panel('What was done to your ads', log.map(function(x, i){
    var what = { pause: 'Paused', resume: 'Turned back on', launch: 'Launched' }[x.kind] || x.kind;
    var back = x.kind === 'pause' && x.status === 'done' && x.by_who === 'planner' ?
      ' <button class="btn" data-apstat="1" data-prov="' + esc(x.provider) + '" data-cid="' + esc(x.campaign_id) + '" data-name="' + esc(x.campaign_name) + '">▶ Turn back on</button>' : '';
    return '<div style="padding:10px 16px;border-top:' + (i ? '1px solid var(--line)' : '0') + '"><span class="card-note">' + esc(new Date(x.created_at).toLocaleString()) + '</span> · <b>' + esc(what) + '</b> ' + esc(x.campaign_name || x.campaign_id) +
      ' <span class="card-note">(' + esc(AP_PROV[x.provider]) + ', by ' + (x.by_who === 'planner' ? 'the planner' : 'you') + ')</span>' +
      (x.reason ? '<div class="card-note">' + esc(x.reason) + '</div>' : '') +
      (x.status === 'failed' ? '<div class="card-note" style="color:var(--danger)">Did not work: ' + esc(x.error || '') + '</div>' : '') + back + '</div>';
  }).join(''));
  return out;
}
VIEWS.advisor = function(){
  var out = '<h1>Growth advisor</h1><p class="sub">What your own numbers say this week, what to do next to grow, and your ads on autopilot within the rules you set.</p>';
  if (!need('advisor', '/advisor')) return out + panel('This week', loading('Reading this week\'s numbers...'));
  var d = S.advisor;
  if (!d) return out + panel('This week', errState('Could not read the advice right now.'));
  if (!d.available) return out + panel('Part of the Pro plan',
    '<div style="padding:14px 16px"><div class="sub" style="margin-bottom:10px">You are on <b>' + esc(d.plan) + '</b>. The growth advisor comes with Pro: every week it reads your leads, bookings, payments and ad results, tells you what to do next, pauses ads that cost too much and writes new campaigns for you.</div>' +
    '<a class="btn primary" href="#/billing">See plans</a></div>');
  var when = d.generated_at ? new Date(d.generated_at).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  out += '<div class="card-note" style="margin-bottom:12px">Week of ' + esc(d.week_start) + ' · updated ' + esc(when) +
    ' <button class="btn" id="adv_refresh" style="margin-left:8px">Refresh</button></div>' + actbar();
  var tips = d.tips || [], steps = d.next_steps || [];
  out += panel(d.headline || 'This week', tips.length ? tips.map(advTip).join('') : '<div style="padding:14px 16px" class="sub">Nothing needs fixing this week. Your numbers are steady.</div>');
  if (steps.length) out += panel('What to do next to grow', steps.map(advTip).join(''));
  out += apPanels();
  if ((d.history || []).length) out += panel('Earlier weeks', d.history.map(function(h){
    return '<div style="padding:10px 16px;border-top:1px solid var(--line)"><span class="card-note">Week of ' + esc(h.week_start) + '</span> · ' + esc(h.headline || '') + '</div>';
  }).join(''));
  setTimeout(advWire, 0);
  return out;
};
function advWire(){
  var g = function(id){ return document.getElementById(id); };
  var all = (S.advisor && (S.advisor.tips || []).concat(S.advisor.next_steps || [])) || [];
  var byKey = function(k){ for (var i = 0; i < all.length; i++) if (all[i].key === k) return all[i]; return null; };
  if (g('adv_refresh')) g('adv_refresh').onclick = function(){ advLoad(true); };
  document.querySelectorAll('[data-advpause]').forEach(function(b){ b.onclick = function(){
    var t = byKey(b.getAttribute('data-advpause')); if (!t) return;
    if (!confirm('Pause "' + t.action.campaign_name + '"? It stops spending now. You can turn it back on any time.')) return;
    b.disabled = true;
    act('/adpilot/pause', { method: 'POST', body: { provider: t.action.provider, campaign_id: t.action.campaign_id, campaign_name: t.action.campaign_name, reason: t.why } }, 'Paused.')
      .then(function(r){ if (r.ok) { ADV.done[t.key] = 'Paused ✓'; pilotLoad(); } else b.disabled = false; });
  }; });
  document.querySelectorAll('[data-advcreate]').forEach(function(b){ b.onclick = function(){
    var t = byKey(b.getAttribute('data-advcreate')); if (!t) return;
    b.disabled = true; b.textContent = 'Writing...';
    act('/adpilot/drafts', { method: 'POST', body: { provider: t.action.provider, service: t.action.service } }, 'Written. Check it below and press Launch.')
      .then(function(r){ if (r.ok) { ADV.done[t.key] = 'Written ✓ see below'; pilotLoad(); } else { b.disabled = false; b.textContent = '✨ Write this campaign'; } });
  }; });
  if (g('ap_save')) g('ap_save').onclick = function(){
    var body = { auto_pause: g('ap_auto').checked, max_cost_per_result: g('ap_limit').value, min_spend: g('ap_min').value || 0,
      meta_daily_cap: g('ap_mcap').value || 0, google_daily_cap: g('ap_gcap').value || 0, city: g('ap_city').value,
      radius_km: g('ap_radius').value || 15, country: g('ap_country').value, website_url: g('ap_web').value };
    g('ap_save').disabled = true;
    act('/adpilot/settings', { method: 'PUT', body: body }, 'Rules saved.').then(function(r){ if (r.ok) pilotLoad(); else g('ap_save').disabled = false; });
  };
  if (g('ap_new')) g('ap_new').onclick = function(){
    g('ap_new').disabled = true; g('ap_new').textContent = 'Writing...';
    act('/adpilot/drafts', { method: 'POST', body: { provider: g('ap_newprov').value, service: g('ap_newsvc').value || null } }, 'Written. Check it and press Launch.')
      .then(function(r){ if (r.ok) pilotLoad(); else { g('ap_new').disabled = false; g('ap_new').textContent = '✨ Write a campaign'; } });
  };
  document.querySelectorAll('[data-aplaunch]').forEach(function(b){ b.onclick = function(){
    if (!confirm('Launch this campaign with a daily budget of ' + apMoney(b.getAttribute('data-budget')) + '? It starts spending today.')) return;
    b.disabled = true; b.textContent = 'Launching...';
    act('/adpilot/drafts/' + b.getAttribute('data-aplaunch') + '/launch', { method: 'POST', body: {} }, 'Launched. It is live now.')
      .then(function(){ pilotLoad(); });
  }; });
  document.querySelectorAll('[data-apdiscard]').forEach(function(b){ b.onclick = function(){
    if (!confirm('Discard this campaign draft?')) return;
    act('/adpilot/drafts/' + b.getAttribute('data-apdiscard'), { method: 'DELETE' }, 'Discarded.').then(function(){ pilotLoad(); });
  }; });
  document.querySelectorAll('[data-apedit]').forEach(function(b){ b.onclick = function(){ ADV.edit = b.getAttribute('data-apedit'); renderShell(); }; });
  document.querySelectorAll('[data-apcancel]').forEach(function(b){ b.onclick = function(){ ADV.edit = null; renderShell(); }; });
  document.querySelectorAll('[data-apsave]').forEach(function(b){ b.onclick = function(){
    var body = { daily_budget: g('apd_budget').value }, lines = function(id){ return g(id).value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean); };
    if (g('apd_head')) {
      body.headline = g('apd_head').value; body.primary_text = g('apd_text').value; body.description = g('apd_desc').value;
      body.hashtags = g('apd_tags').value.split(/\s+/).filter(Boolean);
      var img = document.querySelector('input[name=apd_img]:checked'); if (img) body.image_url = img.value;
    } else { body.headlines = lines('apd_heads'); body.descriptions = lines('apd_descs'); body.keywords = lines('apd_keys'); }
    b.disabled = true;
    act('/adpilot/drafts/' + b.getAttribute('data-apsave'), { method: 'PUT', body: body }, 'Saved.').then(function(r){ if (r.ok) { ADV.edit = null; pilotLoad(); } else b.disabled = false; });
  }; });
  document.querySelectorAll('[data-apstat]').forEach(function(b){ b.onclick = function(){
    var on = b.getAttribute('data-apstat') === '1';
    if (!confirm((on ? 'Turn back on "' : 'Pause "') + b.getAttribute('data-name') + '"?' + (on ? ' It starts spending again.' : ''))) return;
    b.disabled = true;
    act('/adpilot/pause', { method: 'POST', body: { provider: b.getAttribute('data-prov'), campaign_id: b.getAttribute('data-cid'), campaign_name: b.getAttribute('data-name'), resume: on } }, on ? 'Turned back on.' : 'Paused.')
      .then(function(){ pilotLoad(); });
  }; });
}
(function(){
  NAV.forEach(function(g){
    var i = -1; g.items.forEach(function(it, k){ if (it.id === 'ai') i = k; });
    if (i !== -1 && !g.items.some(function(it){ return it.id === 'advisor'; }))
      g.items.splice(i + 1, 0, { id: 'advisor', icon: '🧭', name: 'Growth Advisor', sub: false });
  });
  OWNER_ONLY_NAV.advisor = 1;
})();

window.addEventListener('hashchange', function(){
  // Every section reads fresh data when it is opened, so something added in
  // one section (a staff member, a product, a booking) shows up in the others.
  Object.keys(NEEDED).forEach(function(k){ S[k] = undefined; LOADING[k] = false; });
  if (typeof APT !== 'undefined') { APT.data = undefined; APT.form = null; }
  if (typeof IBX !== 'undefined') { IBX.data = undefined; }
  S.navOpen = false; if (S.me) renderShell();
});
boot();
</script>
