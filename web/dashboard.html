<!-- @td-theme:start -->
<script>
/* TechDeva theme + brand colour, for pages served by FastAPI (web/*.html).
   sync.py inlines this into each page's <head>, so the saved theme applies
   before the first paint. Next.js has its own copy of the theme part
   (techdeva-web/src/components/ui/theme.ts); both use the "td-theme" key.

   TD.toggleHTML()  markup for the light/dark switch, for script-rendered
                    headers. In static markup, <span data-td-theme-slot></span>
                    is replaced with it. Any [data-td-theme-toggle] works,
                    even if rendered later.
   TD.brand(hex)    a business's own accent colour. Works out readable text
                    on it and a readable text shade of it for the current
                    theme, so a light brand colour never gives white-on-white
                    buttons and a dark one never vanishes on the dark canvas. */
(function () {
  var KEY = "td-theme", doc = document.documentElement, brandHex = null;

  function theme() { return doc.dataset.theme === "light" ? "light" : "dark"; }

  function rgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(c) {
    var v = c.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(c, to, t) { return c.map(function (x, i) { return Math.round(x + (to[i] - x) * t); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }

  function applyBrand() {
    var props = ["--accent", "--accent-hover", "--accent-ink", "--accent-tint", "--accent-line", "--fg-on-accent", "--ring"];
    if (!brandHex) { props.forEach(function (p) { doc.style.removeProperty(p); }); return; }
    var c = rgb(brandHex), white = [255, 255, 255], black = [0, 0, 0];
    var light = theme() === "light";
    var bg = light ? white : [10, 10, 15];
    // text on the accent fill: whichever of white or near-black reads better
    var on = contrast(c, white) >= contrast(c, [20, 16, 5]) ? white : [20, 16, 5];
    // the accent as text on the page: step it toward white (dark theme) or
    // black (light theme) until it reaches 4.5:1
    var ink = c, t = 0;
    while (contrast(ink, bg) < 4.5 && t < 1) { t += 0.05; ink = mix(c, light ? black : white, t); }
    var s = doc.style;
    s.setProperty("--accent", hex(c));
    s.setProperty("--accent-hover", hex(mix(c, on === white ? black : white, 0.12)));
    s.setProperty("--fg-on-accent", hex(on));
    s.setProperty("--accent-ink", hex(ink));
    s.setProperty("--ring", hex(ink));
    s.setProperty("--accent-tint", "rgb(" + c.join(" ") + " / " + (light ? 0.1 : 0.16) + ")");
    s.setProperty("--accent-line", "rgb(" + c.join(" ") + " / 0.4)");
  }

  function sync() {
    var light = theme() === "light";
    var btns = document.querySelectorAll("[data-td-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      btns[i].setAttribute("title", light ? "Dark theme" : "Light theme");
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = light ? "light" : "dark";
  }

  function set(next) {
    if (next === "light") doc.dataset.theme = "light"; else delete doc.dataset.theme;
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage blocked: lasts this page view */ }
    applyBrand();
    sync();
  }

  try { if (localStorage.getItem(KEY) === "light") doc.dataset.theme = "light"; } catch (e) { /* default dark */ }

  var SUN = '<svg class="td-i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg class="td-i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  window.TD = {
    theme: theme,
    setTheme: set,
    brand: function (h) { brandHex = h && /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(h) ? h.slice(0, h.length === 9 ? 7 : h.length) : null; applyBrand(); },
    toggleHTML: function (cls) {
      var light = theme() === "light";
      return '<button type="button" class="td-theme-btn' + (cls ? " " + cls : "") + '" data-td-theme-toggle aria-label="' +
        (light ? "Switch to dark theme" : "Switch to light theme") + '" title="' + (light ? "Dark theme" : "Light theme") + '">' + SUN + MOON + "</button>";
    }
  };

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-td-theme-toggle]");
    if (b) set(theme() === "light" ? "dark" : "light");
  });
  document.addEventListener("DOMContentLoaded", function () {
    // static pages: <span data-td-theme-slot="extra classes"></span> becomes the switch
    var slots = document.querySelectorAll("[data-td-theme-slot]");
    for (var i = 0; i < slots.length; i++) slots[i].outerHTML = window.TD.toggleHTML(slots[i].getAttribute("data-td-theme-slot"));
    sync();
  });
})();
</script>
<!-- @td-theme:end -->

<body class="td td-grain page-dashboard min-h-screen bg-bg text-fg">
<div id="root"><div class="state" role="status"><span class="spin"></span>Loading your business data...</div></div>
<script>
"use strict";
/* TechDeva universal tenant dashboard.
   Rules this file obeys:
   - The tenant is decided by the backend from the signed session. Nothing here
     sends a tenant id, and nothing here would be trusted if it did.
   - No invented numbers. A metric renders only if the API actually returned it.
     Missing data says so; it never becomes a zero.
   - Every async section has loading / error / empty / success. */

var root = document.getElementById('root');
var S = { me:null, summary:null, config:null, leads:null, deliv:null, navOpen:false };

/* ---------- api ---------- */
function api(path, opts){
  opts = opts || {};
  return fetch(path, {
    method: opts.method || 'GET',
    credentials: 'include',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch(e) { d = null; }
      return { ok:r.ok, status:r.status, data:d, raw:t };
    });
  }).catch(function(e){
    return { ok:false, status:0, data:null, err:String(e) };
  });
}

/* ---------- helpers ---------- */
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* Renders a number only when one truly came back. Never turns absence into 0. */
function metric(label, value, note){
  var has = (value !== null && value !== undefined && value !== '' && !Number.isNaN(value));
  return '<div class="card"><div class="card-label">' + esc(label) + '</div>' +
    '<div class="card-value' + (has ? '' : ' none') + '">' +
    (has ? esc(value) : 'No data yet') + '</div>' +
    (note ? '<div class="card-note">' + esc(note) + '</div>' : '') + '</div>';
}
function loading(msg){ return '<div class="state"><span class="spin"></span>' + esc(msg || 'Loading your business data...') + '</div>'; }
function empty(title, msg){ return '<div class="state"><strong>' + esc(title) + '</strong>' + esc(msg || '') + '</div>'; }
function errState(msg){
  return '<div class="state err"><strong>Unable to load this information</strong>' +
    esc(msg || 'Please try again.') + '</div>';
}
function soon(what, why){
  return '<div class="state"><strong>Coming in the next module</strong>' + esc(why || (what + ' is not built yet.')) + '</div>';
}
function panel(title, inner, right){
  return '<div class="panel"><div class="panel-head"><div class="panel-title">' + esc(title) + '</div>' +
    (right || '') + '</div>' + inner + '</div>';
}
function sumCounts(obj){
  if (!obj) return null;
  var t = 0, k;
  for (k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) t += Number(obj[k]) || 0;
  return t;
}

/* ---------- nav ---------- */
var NAV = [
  { label:null, items:[ {id:'overview', name:'Overview'} ] },
  { label:'CRM', items:[
      {id:'leads', name:'Leads'},
      {id:'whatsapp', name:'WhatsApp'},
      {id:'customers', name:'Customers', soon:true},
      {id:'appointments', name:'Appointments', soon:true},
      {id:'revenue', name:'Sales / Revenue', soon:true}
  ]},
  { label:'AI', items:[
      {id:'ai', name:'AI Workforce'},
      {id:'needshuman', name:'Needs Human', sub:true},
      {id:'inbox', name:'Inbox', soon:true}
  ]},
  { label:'Business', items:[
      {id:'integrations', name:'Integrations'},
      {id:'console',      name:'Jarvis'},
      {id:'reports', name:'Reports'},
      {id:'settings', name:'Business Settings'}
  ]}
];

function navHTML(active){
  var out = '<div class="nav">';
  NAV.forEach(function(g){
    if (g.label) out += '<div class="nav-label">' + esc(g.label) + '</div>';
    g.items.forEach(function(it){
      // A business can hide sections it does not use. The console writes the
      // list; this is where it takes effect. The console itself is never
      // hidden, or there would be no way to ask for it back.
      var hidden = (PREFS && PREFS.hidden_sections) || [];
      if (it.id !== 'console' && hidden.indexOf(it.id) !== -1) return;
      var badge = '';
      if (it.soon) badge = '<span class="pill soon">Soon</span>';
      else if (it.id === 'needshuman') {
        var n = S.summary && S.summary.work_by_status ? S.summary.work_by_status.needs_human : null;
        if (n) badge = '<span class="pill attn">' + esc(n) + '</span>';
      } else if (it.id === 'leads' && S.leads && S.leads.length) {
        badge = '<span class="pill count">' + esc(S.leads.length) + '</span>';
      }
      out += '<a href="#/' + it.id + '" class="' + (active === it.id ? 'active' : '') +
             (it.sub ? ' sub' : '') + '">' + esc(it.name) + badge + '</a>';
    });
  });
  return out + '</div>';
}

/* ---------- business identity (from the backend record, never hard-coded) ---------- */
function bizIdentity(){
  var t = (S.summary && S.summary.trial) || {};
  var name = t.name;
  var setup = !name;
  var bits = [];
  if (typeof BP !== 'undefined' && BP.data && BP.data.category) bits.push(BP.data.category.name);
  else if (t.industry) bits.push(t.industry);
  if (t.plan) bits.push(t.plan);
  if (t.status) bits.push(t.status);
  if (typeof t.days_left === 'number') bits.push(t.days_left + ' days left in trial');
  return {
    name: setup ? 'Complete your business setup' : name,
    sub: setup ? 'Your business name has not been set yet' : bits.join(' · '),
    setup: setup
  };
}

/* ---------- views ---------- */
var VIEWS = {};

VIEWS.overview = function(){
  var s = S.summary, out = '';
  var id = bizIdentity();
  out += '<h1>Overview</h1><p class="sub">Live figures for ' + esc(id.setup ? 'your business' : id.name) + '.</p>';

  var ob = S.config && S.config.onboarding;
  if (ob && ob.percent < 100) {
    out += '<div class="banner"><div class="banner-txt"><strong>Complete your business setup</strong>' +
      '<span>' + esc(ob.complete) + ' of ' + esc(ob.total) + ' steps done' +
      (ob.missing && ob.missing.length ? ' — next: ' + esc(ob.missing[0].label) : '') + '</span>' +
      '<div class="bar"><i style="width:' + esc(ob.percent) + '%"></i></div></div>' +
      '<a class="btn primary" href="/onboarding">Continue setup</a></div>';
  }

  if (!s) return out + errState('The summary service did not respond.');

  var work = s.work_by_status || null;
  var dlv  = s.deliverables_by_status || null;
  var integ = s.integrations || null;
  var connected = integ ? Object.keys(integ).filter(function(k){
    return String(integ[k]).toLowerCase() === 'connected';
  }).length : null;

  out += '<div class="grid">';
  out += metric('Leads', S.leads ? S.leads.length : null, S.leads ? 'Most recent first' : 'Could not load leads');
  out += metric('AI tasks', work ? sumCounts(work) : null, work ? 'All statuses' : null);
  out += metric('Needs your approval', work ? (work.needs_human || 0) : null, 'Human decisions pending');
  out += metric('AI deliverables', dlv ? sumCounts(dlv) : null);
  out += metric('Analysis runs', typeof s.analysis_runs === 'number' ? s.analysis_runs : null);
  out += metric('Integrations connected', connected, integ ? Object.keys(integ).length + ' configured' : null);
  out += '</div>';

  out += '<h2>This month</h2>';
  // money totals are the owner's: staff get bookings and customers only
  var own = isOwner();
  var gP = own ? need('ov_pnl', '/operations/pnl') : true,
      gA = need('ov_appts', '/operations/appointments?when=upcoming'),
      gC = need('ov_cust', '/business/customers');
  if (!(gP && gA && gC)) return out + panel('Money and bookings', loading('Loading your figures...'));
  var P = S.ov_pnl, AP = S.ov_appts, CU = S.ov_cust;
  out += '<div class="grid">';
  if (own) {
    out += metric('Collected', P ? money(P.collected) : null, P ? (P.payment_count + ' payment(s) this month') : 'Could not load');
    out += metric('Invoiced', P ? money(P.invoiced) : null, P ? (P.invoice_count + ' invoice(s) this month') : null);
    out += metric('Outstanding', P ? money(P.outstanding_all_time) : null, 'Owed to you, all time');
  }
  out += metric('Upcoming appointments', AP ? AP.count : null);
  out += metric('Customers', CU ? CU.count : null);
  out += '</div>';
  return out;
};

VIEWS.leads = function(){
  var out = '<h1>Leads</h1><p class="sub">Every lead belonging to this business.</p>';
  if (S.leads === null) return out + panel('Leads', errState('The leads service did not respond.'));
  if (!S.leads.length) return out + panel('Leads', empty('No leads yet', 'Leads will appear here as they arrive.'));
  var rows = S.leads.map(function(l){
    return '<tr><td>' + esc(l.name || '—') + '</td><td>' + esc(l.phone || '—') + '</td>' +
      '<td>' + esc(l.service || '—') + '</td>' +
      '<td><span class="tag">' + esc(stageName(l.status || 'new')) + '</span></td>' +
      '<td>' + esc(l.source || '—') + '</td>' +
      '<td>' + esc(l.priority === null || l.priority === undefined ? '—' : l.priority) + '</td></tr>';
  }).join('');
  return out + panel('Leads',
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Service</th>' +
    '<th>Status</th><th>Source</th><th>Priority</th></tr></thead><tbody>' + rows + '</tbody></table></div>',
    '<span class="pill count">' + S.leads.length + '</span>');
};


VIEWS.ai = function(){
  var out = '<h1>AI Workforce</h1><p class="sub">What your AI employees have done for this business.</p>';
  var s = S.summary;
  if (!s) return out + errState('The summary service did not respond.');
  var work = s.work_by_status;
  if (!work || !sumCounts(work)) {
    out += panel('Tasks', empty('No AI activity yet', 'Work will appear here once agents start running for this business.'));
  } else {
    out += '<div class="grid">';
    out += metric('Waiting', work.waiting);
    out += metric('Running', work.running);
    out += metric('Done', work.done);
    out += metric('Needs human', work.needs_human);
    out += metric('Failed', work.dead || work.failed);
    out += '</div>';
  }
  out += '<h2>Deliverables</h2>';
  if (S.deliv === null) out += panel('AI deliverables', errState('The deliverables service did not respond.'));
  else if (!S.deliv.length) out += panel('AI deliverables', empty('Nothing produced yet', 'Finished AI work will appear here for your approval.'));
  else {
    var rows = S.deliv.map(function(d){
      return '<tr><td>' + esc(d.kind || d.type || '—') + '</td>' +
        '<td><span class="tag">' + esc(d.status || '—') + '</span></td>' +
        '<td>' + esc(d.title || d.summary || '—') + '</td></tr>';
    }).join('');
    out += panel('AI deliverables',
      '<div class="tbl-wrap"><table><thead><tr><th>Kind</th><th>Status</th><th>Detail</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>');
  }
  return out;
};


// ---- the client's brand ----
// A business owner should recognise their own dashboard at a glance. Their logo
// sits behind the whole screen, faint enough to read across it, and their accent
// colour replaces ours. Both come from their own tenant row, so no business can
// ever be shown another's mark.
var BRAND = {};
var PREFS = {};

function applyBrand(){
  var root = document.documentElement;
  var accent = PREFS.accent || BRAND.accent;
  if (accent && /^#[0-9a-fA-F]{3,8}$/.test(accent)) {
    /* TD.brand also sets readable text on the colour and a readable shade of
       it for text, so a light brand colour never gives white-on-white buttons */
    if (window.TD) TD.brand(accent); else root.style.setProperty('--accent', accent);
  }
  var wanted = PREFS.show_logo_background !== false;
  var el = document.getElementById('brandbg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'brandbg';
    el.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;' +
      'background-repeat:no-repeat;background-position:center;background-size:min(60vw,560px)';
    document.body.insertBefore(el, document.body.firstChild);
  }
  if (BRAND.has_logo && wanted) {
    var o = PREFS.logo_opacity;
    el.style.opacity = (typeof o === 'number' ? Math.min(Math.max(o, 0.02), 0.35) : 0.06);
    el.style.backgroundImage = "url('/brand/logo?v=" + encodeURIComponent(BRAND.logo_updated_at || '1') + "')";
  } else {
    el.style.backgroundImage = 'none';
  }
}

function loadBrand(){
  return Promise.all([api('/brand'), api('/console/prefs')]).then(function(r){
    BRAND = (r[0] && r[0].ok && r[0].data) || {};
    PREFS = (r[1] && r[1].ok && r[1].data && r[1].data.prefs) || {};
    applyBrand();
  }).catch(function(){});
}

// ---- WhatsApp pairing ----
// The client scans the code with their own phone. Nothing here is drawn until
// the pairing service hands back a real code, and the code on screen is never
// older than the one WhatsApp will accept: it is re-fetched, not cached.
var WA_POLL = null;

function waStop(){ if (WA_POLL) { clearInterval(WA_POLL); WA_POLL = null; } }

function waRender(html){
  var el = document.getElementById('wa');
  if (!el) { waStop(); return false; }
  el.innerHTML = html;
  return true;
}

function waConnected(d){
  return '<div style="padding:16px">' +
    '<p><span class="tag" style="color:var(--growth)">Connected</span> ' +
    esc(d.phone_number || '') + (d.display_name ? ' - ' + esc(d.display_name) : '') + '</p>' +
    '<p class="sub">Your AI is answering this number. Disconnecting stops it answering ' +
    'immediately, and customers who message will get no reply until you connect again.</p>' +
    '<button id="wa-off" class="btn">Disconnect</button></div>';
}

function waIdle(d){
  var was = d.status === 'disconnected' || d.status === 'error';
  return '<div style="padding:16px">' +
    '<p><span class="tag">' + (was ? 'Disconnected' : 'Never connected') + '</span></p>' +
    (d.last_error ? '<p class="sub">Last error: ' + esc(d.last_error) + '</p>' : '') +
    '<p class="sub">Connecting puts your AI in front of everyone who messages this ' +
    'number. Have the phone in your hand: the code is only good for about twenty ' +
    'seconds at a time.</p>' +
    '<button id="wa-on" class="btn">Connect WhatsApp</button></div>';
}

function waWire(){
  var on = document.getElementById('wa-on');
  if (on) on.onclick = function(){
    waRender(loading('Starting the pairing session...'));
    act('/whatsapp/connect', { method: 'POST' }, 'Pairing started').then(function(r){
      if (!r.ok) { waRender(errState('Could not start pairing.')); return; }
      waPoll();
      WA_POLL = setInterval(waPoll, 3000);
    });
  };
  var off = document.getElementById('wa-off');
  if (off) off.onclick = function(){
    waRender(loading('Disconnecting...'));
    act('/whatsapp/disconnect', { method: 'POST' }, 'Disconnected').then(function(){ waStop(); waMount(); });
  };
}

/* One slow answer used to end pairing with "stopped responding" and no
   reason. Now three misses in a row (about 9 s) are needed, and the
   server's own reason is shown with a way to try again. */
var WA_FAILS = 0;
function waFail(r){
  if (++WA_FAILS < 3) return;
  WA_FAILS = 0; waStop();
  var why = (r && r.data && r.data.detail) || 'The pairing service stopped responding.';
  if (waRender('<div style="padding:16px">' + errState(why) +
      '<div class="card-note" style="margin:8px 0">If this keeps happening, tell TechDeva: it is on our side, not your phone.</div>' +
      '<button id="wa-on" class="btn primary">Try again</button></div>')) waWire();
}
function waPoll(){
  api('/whatsapp/qr').then(function(r){
    if (!r.ok) { waFail(r); return; }
    WA_FAILS = 0;
    var d = r.data || {};
    if (d.state === 'connected') { waStop(); waMount(); return; }
    if (d.state === 'expired' || d.state === 'idle') {
      waStop();
      if (waRender('<div style="padding:16px"><p class="sub">The pairing window closed ' +
                   'without a scan.</p><button id="wa-on" class="btn">Try again</button></div>')) waWire();
      return;
    }
    if (!d.qr_svg) { waRender(loading('Waiting for the code...')); return; }
    waRender('<div style="padding:16px;text-align:center">' +
      '<div style="background:#fff;display:inline-block;padding:12px;border-radius:12px;max-width:280px">' +
      d.qr_svg + '</div>' +
      '<p class="sub" style="margin-top:12px">WhatsApp on your phone - Settings - Linked devices - ' +
      'Link a device, then scan this. The code refreshes on its own.</p></div>');
  });
}

function waMount(){
  api('/whatsapp').then(function(r){
    if (r.status === 409) {
      waRender(empty('No agent assigned yet',
        'TechDeva assigns your business its own WhatsApp agent during onboarding.'));
      return;
    }

/* ---- Jarvis voice helpers ----
   jarvisHeard: the phrase heard in THIS listening session. Chrome (Android
   especially) fires onresult repeatedly, often re-sending the same or a growing
   copy of the phrase; appending each one typed the user's words several times.
   jarvisSpeak: read Jarvis's reply aloud after a spoken request. */
function jarvisHeard(ev){
  var parts = [];
  for (var i = 0; i < ev.results.length; i++) {
    var t = ((ev.results[i][0] && ev.results[i][0].transcript) || '').trim();
    if (!t) continue;
    var last = parts.length ? parts[parts.length - 1] : '';
    if (last && (t === last || t.toLowerCase().indexOf(last.toLowerCase()) === 0)) parts[parts.length - 1] = t;
    else if (last && last.toLowerCase().indexOf(t.toLowerCase()) === 0) continue;
    else parts.push(t);
  }
  return parts.join(' ');
}
var JARVIS_SPOKEN = false;
var JARVIS_LANG = 'en', JARVIS_AUDIO = null, JARVIS_LAST = '';
try { JARVIS_LANG = localStorage.getItem('jarvis_lang') || 'en'; } catch (e) {}
function jarvisLangLabel(){ return JARVIS_LANG === 'ur' ? 'اردو' : 'EN'; }
function jarvisToggleLang(btn){
  JARVIS_LANG = JARVIS_LANG === 'ur' ? 'en' : 'ur';
  try { localStorage.setItem('jarvis_lang', JARVIS_LANG); } catch (e) {}
  if (btn) btn.textContent = jarvisLangLabel();
}
function jarvisRecLang(){ return JARVIS_LANG === 'ur' ? 'ur-PK' : 'en-US'; }
function jarvisBrowserSpeak(text){
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text)) ? 'ur-PK' : 'en-US';
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* Jarvis speaks through the server (Gemini voice, real Urdu); the browser's
   own voice is only the fallback when the server voice is busy. */
function jarvisSpeak(text){
  if (!text) return;
  text = String(text).slice(0, 600);
  JARVIS_LAST = text;
  var urdu = JARVIS_LANG === 'ur' || /[؀-ۿ]/.test(text);
  try { if (JARVIS_AUDIO) JARVIS_AUDIO.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  var h = {'Content-Type': 'application/json'};
  if (typeof TOKEN !== 'undefined' && TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  fetch('/console/speak', {method: 'POST', credentials: 'include', headers: h,
                           body: JSON.stringify({text: text, lang: urdu ? 'ur' : 'en'})})
    .then(function(r){ if (!r.ok) throw new Error('voice ' + r.status); return r.blob(); })
    .then(function(b){ var a = new Audio(URL.createObjectURL(b)); JARVIS_AUDIO = a; return a.play(); })
    .catch(function(){ jarvisBrowserSpeak(text); });
}
function jarvisListenBtn(cls){
  return ' <button class="' + cls + '" type="button" onclick="jarvisSpeak(JARVIS_LAST)" title="Hear this reply">&#128266; Listen</button>';
}
function wireConsoleMic(){
  var mic = document.getElementById('con-mic');
  var box = document.getElementById('con-in');
  if (!mic || !box) return;
  var lb = document.getElementById('con-lang'); if (lb) lb.textContent = jarvisLangLabel();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { mic.style.display = 'none'; return; }
  mic.style.display = '';
  var rec = null;
  var listening = false;
  mic.onclick = function(){
    if (listening) { if (rec) rec.stop(); return; }
    try { rec = new SR(); } catch (e) { mic.style.display = 'none'; return; }
    rec.lang = jarvisRecLang();
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    listening = true;
    mic.textContent = '... Listening';
    var base = box.value.trim();
    rec.onresult = function(ev){
      var heard = jarvisHeard(ev);
      if (heard) { box.value = (base ? base + ' ' : '') + heard; JARVIS_SPOKEN = true; }
    };
    rec.onerror = function(){
      listening = false;
      mic.textContent = String.fromCodePoint(127908) + ' Speak';
    };
    rec.onend = function(){
      listening = false;
      mic.textContent = String.fromCodePoint(127908) + ' Speak';
    };
    try { rec.start(); } catch (e) { listening = false; mic.textContent = String.fromCodePoint(127908) + ' Speak'; }
  };
}

/* Lazily fetch a section's data the first time it is opened, instead of
   loading everything on boot. null means "tried and failed" so the view can
   tell an error apart from an empty business. */
var LOADING = {};
var NEEDED = {};
function need(key, path, force){
  NEEDED[key] = true;
  if (force) { S[key] = undefined; LOADING[key] = false; }
  if (S[key] !== undefined) return true;
  if (LOADING[key]) return false;
  LOADING[key] = true;
  api(path).then(function(r){
    LOADING[key] = false;
    S[key] = r.ok ? r.data : null;
    S[key + '_status'] = r.ok ? 200 : r.status;      // so a page can say "not on your plan" instead of nothing
    S[key + '_detail'] = r.ok ? null : (r.data && r.data.detail) || null;
    renderShell();
  });
  return false;
}
function act(path, opts, msg){
  var el = document.getElementById('actmsg');
  if (el) el.textContent = 'Working...';
  return api(path, opts).then(function(r){
    if (el) {
      el.textContent = r.ok ? (msg || 'Saved.')
        : ((r.data && (r.data.detail || r.data.message)) || 'That did not work.');
      el.style.color = r.ok ? 'var(--growth)' : 'var(--danger)';
    }
    return r;
  });
}
function actbar(){ return '<div id="actmsg" class="card-note" style="min-height:18px;margin:10px 0"></div>'; }
function money(v, cur){
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  return esc((cur || 'PKR') + ' ' + n.toLocaleString());
}

      if (f.getAttribute('data-f') === 'price' || f.getAttribute('data-f') === 'target') v = Number(v);
      else if (f.getAttribute('data-f') === 'duration_minutes' || f.getAttribute('data-f') === 'day_of_week') v = parseInt(v, 10);
      body[f.getAttribute('data-f')] = v;
    });
    var missing = sec.req.filter(function(r){
      return body[r] === undefined || body[r] === '' || (typeof body[r] === 'number' && Number.isNaN(body[r]));
    });
    if (missing.length) { msg.textContent = missing.join(' and ') + ' required.'; msg.style.color = 'var(--danger)'; return; }
    act('/business/' + sec.key, {method:'POST', body:body}, 'Saved.').then(function(r){
      if (r.ok) need('biz_' + sec.key, '/business/' + sec.key, true);
    });
  };

  Array.prototype.forEach.call(document.querySelectorAll('.bizdel'), function(b){
    b.onclick = function(){
      b.disabled = true;
      act('/business/' + sec.key + '/' + b.getAttribute('data-id'), {method:'DELETE'}, 'Removed.')
        .then(function(r){ if (r.ok) need('biz_' + sec.key, '/business/' + sec.key, true); else b.disabled = false; });
    };
  });

  var parse = document.getElementById('parsebtn');
  if (parse) parse.onclick = function(){
    var box = document.getElementById('pastebox'), out = document.getElementById('proposals');
    out.innerHTML = loading('Reading...');
    api('/brain/extract', {method:'POST', body:{text: box.value}}).then(function(r){
      if (!r.ok) {
        out.innerHTML = errState((r.data && r.data.detail) || 'Could not read that.');
        return;
      }
      var p = r.data.proposals || [];
      if (!p.length) {
        out.innerHTML = empty('Nothing recognised',
          'Try one service per line, like "Full Face - 15,000".');
        return;
      }
      var html = '<div style="margin-top:14px"><div class="card-note" style="margin-bottom:6px">' +
        'Found ' + p.length + '. Nothing is saved yet — uncheck anything wrong, then confirm.' +
        (r.data.counts.not_understood ? ' ' + r.data.counts.not_understood + ' line(s) were not understood and were skipped.' : '') +
        '</div>';
      p.forEach(function(x, i){
        html += '<label class="prop"><input type="checkbox" class="propchk" checked data-i="' + i + '">' +
          '<span style="flex:1;min-width:140px">' + esc(x.name) + '</span>' +
          '<span class="mono growth">' + money(x.price, x.currency) + '</span>' +
          (x.duration_minutes ? '<span class="tag">' + esc(x.duration_minutes) + ' min</span>' : '') +
          (x.category ? '<span class="tag">' + esc(x.category) + '</span>' : '') + '</label>';
      });
      html += '<div style="margin-top:12px"><button class="btn primary" id="confirmprops">Save selected</button>' +
              '<span id="propmsg" class="card-note" style="margin-left:10px"></span></div></div>';
      out.innerHTML = html;
      document.getElementById('confirmprops').onclick = function(){
        var chosen = [];
        Array.prototype.forEach.call(document.querySelectorAll('.propchk'), function(c){
          if (c.checked) chosen.push(p[parseInt(c.getAttribute('data-i'), 10)]);
        });
        var m = document.getElementById('propmsg');
        if (!chosen.length) { m.textContent = 'Nothing selected.'; return; }
        m.textContent = 'Saving ' + chosen.length + '...';
        var done = 0, failed = 0;
        chosen.forEach(function(x){
          api('/business/services', {method:'POST', body:{
            name: x.name, price: x.price, currency: x.currency,
            duration_minutes: x.duration_minutes, category: x.category
          }}).then(function(r2){
            if (r2.ok) done++; else failed++;
            if (done + failed === chosen.length) {
              m.textContent = done + ' saved' + (failed ? ', ' + failed + ' failed (duplicate names are refused)' : '') + '.';
              m.style.color = failed ? 'var(--warn)' : 'var(--growth)';
              need('biz_services', '/business/services', true);
            }
          });
        });
      };
    });
  };

  var pub = document.getElementById('pubbtn');
  if (pub) pub.onclick = function(){
    var o = document.getElementById('pubout');
    o.textContent = 'Publishing...';
    api('/brain/publish', {method:'POST', body:{}}).then(function(r){
      if (!r.ok) {
        o.textContent = (r.data && r.data.detail) || 'Could not publish.';
        o.style.color = 'var(--danger)';
        return;
      }
      var w = r.data.written || [];
      o.innerHTML = '<span style="color:var(--growth)">' + esc(r.data.message || 'Published.') + '</span>' +
        (w.length ? '<br>Updated: ' + esc(w.join(', ')) : '') +
        ((r.data.skipped || []).length ? '<br>Left alone: ' + esc(r.data.skipped.join('; ')) : '');
    });
  };
}

function inp(id, ph, type, width){
  return '<input class="fld" id="' + id + '" type="' + (type || 'text') +
         '" placeholder="' + esc(ph) + '" style="flex:1;min-width:' + (width || 120) + 'px">';
}
function val(id){ var e = document.getElementById(id); return e ? String(e.value).trim() : ''; }
function numv(id){ var v = val(id); return v === '' ? null : Number(v); }
function say(m){ var e = document.getElementById('actmsg'); if (e) e.textContent = m; }
function row(){ return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">'; }
function when(ts){
  if (!ts) return '—';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return esc(ts);
  return esc(d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}));
}
function onlyDate(ts){
  if (!ts) return '—';
  var d = new Date(ts);
  return isNaN(d.getTime()) ? esc(ts) : esc(d.toLocaleDateString());
}
function pickOptions(items, labelKey){
  return (items || []).map(function(x){
    return '<option value="' + esc(x.id) + '">' + esc(x[labelKey || 'name']) + '</option>';
  }).join('');
}
function select(id, items, placeholder, labelKey){
  return '<select class="fld" id="' + id + '" style="flex:1;min-width:160px">' +
         '<option value="">' + esc(placeholder) + '</option>' +
         pickOptions(items, labelKey) + '</select>';
}

/* ---------- Part 3: Reports the owner can actually read ----------
   The previous version printed the analysis JSON. This one answers the
   questions an owner asks at the end of a month, and keeps the raw analysis
   available underneath rather than in place of an answer. */

var RANGE = 'month';

function rangeDates(which){
  var now = new Date(), start, end = new Date();
  if (which === 'last30') { start = new Date(now.getTime() - 29 * 86400000); }
  else if (which === 'year') { start = new Date(now.getFullYear(), 0, 1); }
  else { start = new Date(now.getFullYear(), now.getMonth(), 1); }
  var iso = function(d){ return d.toISOString().slice(0, 10); };
  return {start: iso(start), end: iso(end)};
}

function inRange(ts, r){
  if (!ts) return false;
  var d = String(ts).slice(0, 10);
  return d >= r.start && d <= r.end;
}

VIEWS.reports = function(){
  var r = rangeDates(RANGE);
  var out = '<h1>Reports</h1><p class="sub">What the business did, and what your AI team found.</p>';

  var tabs = [['month', 'This month'], ['last30', 'Last 30 days'], ['year', 'This year']]

  out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">' + tabs +
         '<button class="btn" id="printrep">Print or save as PDF</button></div>';

  var key = 'pnl_' + RANGE;
  if (!need(key, '/operations/pnl?start=' + r.start + '&end=' + r.end))
    return out + panel('Business performance', loading('Adding up the period...'));
  if (S[key] === null)
    return out + panel('Business performance', errState('The reporting service did not respond.'));
  need('appointments_all', '/operations/appointments?when=all');
  need('customers', '/business/customers');

  var p = S[key];
  out += '<div class="card-note">' + esc(r.start) + ' to ' + esc(r.end) + '</div>';
  out += '<h2>Money</h2><div class="grid">' +
    metric('Collected', money(p.collected), p.payment_count + ' payments') +
    metric('Invoiced', money(p.invoiced), p.invoice_count + ' invoices') +
    metric('Expenses', money(p.expenses)) +
    metric('Net', money(p.net), 'Collected less expenses') +
    metric('Still owed', money(p.outstanding_all_time), 'All time, unpaid invoices') +

  var appts = (S.appointments_all && S.appointments_all.appointments) || [];

      '</tbody></table></div>');

  out += '<h2>What your AI team found</h2>' + panel('Latest analysis',
    '<div id="rep">' + loading('Loading the analysis...') + '</div>');

    });

      if (d.status === 'pending' || !d || Object.keys(d).length === 0) {
        el.innerHTML = empty('Nothing to show yet',
          d.message || 'Your analysis has not produced a report yet.');

      var rep = d.report || d;
      var client = rep.client || {};

        html += '<div class="card-note" style="margin-bottom:10px"><strong>Top priority</strong></div>' +
                '<p>' + esc(summary.top_priority) + '</p>';

        if (!arr || !arr.length) return '<h3>' + esc(title) + '</h3>' +
          '<div class="card-note">' + esc(note) + '</div>';
        return '<h3>' + esc(title) + '</h3><ul>' +
          arr.map(function(x){ return '<li>' + esc(typeof x === 'string' ? x : JSON.stringify(x)) + '</li>'; }).join('') +
          '</ul>';
      };
      html += list('Strengths', client.strengths, 'The analysis found none to report.');
      html += list('Weaknesses', client.weaknesses, 'The analysis found none to report.');
      if (d.status && d.status !== 'complete') {
        html += '<div class="card-note" style="margin-top:10px">This analysis is ' +
                esc(d.status) + '. It will improve once the missing inputs are in place.</div>';
      }
      html += '<details style="margin-top:14px"><summary class="card-note" style="cursor:pointer">' +
              'The full analysis, as produced</summary>' +
              '<pre class="mono" style="white-space:pre-wrap;margin:8px 0 0;font-size:12px;color:var(--muted)">' +
              esc(JSON.stringify(d, null, 2)) + '</pre></details>';
      el.innerHTML = html;
    });
  }, 0);
  return out;
};

// A degraded platform should be readable from the screen the client is already
// looking at. Before Part 4 this lived in a log file on the server, which is
// why a workforce that had stopped thinking went unnoticed for weeks.
/* A9: this used to call GET /incidents on EVERY redraw, and the shell redraws
   each time any section's data arrives -- about once a second while a page
   loads. Now: at most one call a minute, only while the tab is visible, and
   every redraw paints the last answer from memory. */
var INC = { html: '', at: 0, busy: false, open: false, items: [] };
var INC_EVERY_MS = 60000;
function incidentBar(){
  var el = document.getElementById('incbar');
  if (el) el.innerHTML = INC.html;
  if (INC.busy || document.hidden || Date.now() - INC.at < INC_EVERY_MS) return;
  INC.busy = true; INC.at = Date.now();
  api('/incidents').then(function(r){
    INC.busy = false;
    if (!r.ok) return;
    INC.html = incidentHTML((r.data && r.data.incidents) || []);
    var e2 = document.getElementById('incbar');
    if (e2) e2.innerHTML = INC.html;
  });
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.me) incidentBar(); });
setInterval(function(){ if (S.me) incidentBar(); }, INC_EVERY_MS);
/* Alerts sit behind a bell in the top bar, not across every page: the count
   shows on the bell and the list opens on click. INC.open survives redraws. */
function incidentHTML(items){
    INC.items = items;
    if (!items.length) { INC.open = false; return ''; }
    var critical = items.some(function(i){ return i.severity === 'critical'; });
    var col = critical ? 'var(--danger)' : 'var(--warn)';
    var btn = '<button class="btn" type="button" id="incbell-btn" aria-haspopup="true" aria-expanded="' + (INC.open ? 'true' : 'false') + '"' +
      ' aria-label="Alerts: ' + items.length + '" title="Alerts" style="position:relative">&#128276;' +
      '<span style="position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;' +
      'background:' + col + ';color:#111;font-size:11px;font-weight:700;line-height:18px;text-align:center">' + items.length + '</span></button>';
    if (!INC.open) return btn;
    return btn + '<div role="dialog" aria-label="Alerts" style="position:absolute;right:0;top:calc(100% + 8px);z-index:60;' +
      'width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;padding:12px;border-radius:12px;' +
      'background:var(--panel);border:1px solid var(--line,rgba(255,255,255,.14));box-shadow:0 12px 32px rgba(0,0,0,.35)">' +
      items.slice(0, 10).map(function(i){
        var c = i.severity === 'critical' ? 'var(--danger)' : 'var(--warn)';
        return '<div style="padding:10px 0;border-bottom:1px solid var(--line,rgba(255,255,255,.08))">' +
          '<strong style="color:' + c + '">' + esc(i.title) + '</strong>' +
          (i.detail ? '<div class="sub" style="margin-top:4px">' + esc(i.detail) + '</div>' : '') +
          '<div class="sub" style="margin-top:4px">Since ' +
          esc(String(i.opened_at).slice(0, 16).replace('T', ' ')) +
          (i.seen_count > 1 ? ' - seen ' + i.seen_count + ' times' : '') + '</div></div>';
      }).join('') + '</div>';
}
document.addEventListener('click', function(e){
  var t = e.target, box = document.getElementById('incbar');
  if (!box) return;
  if (t.closest && t.closest('#incbell-btn')) INC.open = !INC.open;
  else if (INC.open && !box.contains(t)) INC.open = false;
  else return;
  box.innerHTML = INC.html = incidentHTML(INC.items || []);
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape' || !INC.open) return;
  INC.open = false;
  var box = document.getElementById('incbar');
  if (box) box.innerHTML = INC.html = incidentHTML(INC.items || []);
});

function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayOf(ts){
  var d = new Date(ts);
  if (isNaN(d)) return String(ts || '').slice(0, 10);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function hhmm(ts){
  var d = new Date(ts);
  return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function items(key){ return (S[key] && S[key].items) || []; }
function nameOf(list, id){
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i].name;
  return '';
}
function statTile(label, value){
  return '<div class="panel" style="flex:1;min-width:140px;margin:0;padding:12px 14px"><div class="card-note">' + esc(label) +
         '</div><div style="font-size:22px;font-weight:700;margin-top:4px">' + value + '</div></div>';
}
function tiles(list){ return '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0">' + list.join('') + '</div>'; }

/* ---------------------------------------------------------- Daily Entry
   A day's visits. Each visit is saved through POST /appointments/book (status
   Completed), so it has a date, a time, a bill and payments, and shows up in
   Appointments and in the customer's history. It used to write a bare invoice,
   which is why a visit could be on the books but nowhere in Appointments. */
var DE_DAY = null, DE_Q = '', DE_ST = '';
VIEWS.dailyentry = function(){
  if (!DE_DAY) DE_DAY = todayISO();
  var modal = aptModalPrep();
  var key = 'de_' + DE_DAY;
  var out = '<h1>Daily Entry</h1><p class="sub">Record what actually happened today: who came, what was done, what was paid. ' +
            'Every visit is saved as a completed appointment with its bill.</p>';
  out += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0">' +
    '<button class="btn primary" id="de_new">+ Record a visit</button>' +
    '<input class="fld" type="date" id="de_day" value="' + esc(DE_DAY) + '">' +
    '<button class="btn" id="de_today">Today</button>' +
    '<select class="fld" id="de_st"><option value="">All statuses</option>' + Object.keys(APT_STATUS).map(function(k){ return '<option value="' + k + '"' + (DE_ST === k ? ' selected' : '') + '>' + APT_STATUS[k] + '</option>'; }).join('') + '</select>' +
    '<input class="fld" id="de_q" placeholder="Search name, phone, service, bill" value="' + esc(DE_Q) + '" style="min-width:200px">' +
    '</div>' + actbar();
  var ok = need(key, '/appointments/list?start=' + DE_DAY + '&end=' + DE_DAY + '&include_unlinked=true') &
           need('payments', '/business/payments');
  need('services', '/business/services'); need('staff', '/business/staff');
  var rows = [];
  if (!ok) out += panel('Visits', loading('Loading ' + DE_DAY + '...'));
  else if (S[key] === null) out += panel('Visits', errState('The appointments service did not respond.'));
  else {
    var all = S[key].appointments || [], unl = S[key].unlinked_bills || [];
    var q = DE_Q.toLowerCase();
    rows = all.filter(function(a){
      if (DE_ST && a.status !== DE_ST) return false;
      if (!q) return true;
      return [a.customer_name, a.customer_phone, a.service, a.invoice_number, a.notes].some(function(x){ return String(x || '').toLowerCase().indexOf(q) !== -1; });
    });
    var billed = all.concat(unl).reduce(function(s, a){ return s + (a.voided_at ? 0 : Number(a.total || 0)); }, 0);
    var got = items('payments').filter(function(p){ return dayOf(p.paid_at) === DE_DAY; })
      .reduce(function(s, p){ return s + Number(p.amount || 0); }, 0);
    var owed = all.concat(unl).reduce(function(s, a){ return s + Number(a.balance || 0); }, 0);
    out += tiles([statTile('Visits recorded', all.length), statTile('Billed', money(billed)),
                  statTile('Collected on this day', money(got)), statTile('Still owed on these bills', money(owed))]);
    out += panel('Visits on ' + DE_DAY, rows.length ? aptTableHTML(rows, { viewLabel: 'View / Edit' })
      : empty(all.length ? 'No visit matches' : 'Nothing recorded', all.length ? 'Clear the search or status filter.' : 'Press + Record a visit.'),
      '<span class="pill count">' + rows.length + '</span>');
    out += unlinkedHTML(unl);
  }
  out += modal;
  setTimeout(function(){
    var g = function(id){ return document.getElementById(id); };
    if (g('de_new')) g('de_new').onclick = function(){ aptOpen(null, { date: DE_DAY, status: 'completed', title: 'Record a visit' }); };
    if (g('de_day')) g('de_day').onchange = function(){ DE_DAY = g('de_day').value || todayISO(); renderShell(); };
    if (g('de_today')) g('de_today').onclick = function(){ DE_DAY = todayISO(); renderShell(); };
    if (g('de_st')) g('de_st').onchange = function(){ DE_ST = g('de_st').value; renderShell(); };
    if (g('de_q')) g('de_q').oninput = function(){
      DE_Q = g('de_q').value.trim();
      clearTimeout(VIEWS._deT); VIEWS._deT = setTimeout(function(){ renderShell(); var e = g('de_q'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 300);
    };
    aptWireRows(rows);
  }, 0);
  return out;
};

var IBX = { data: undefined, loading: false, sel: null, msgs: null };
function ibxLoad(force){
  if (IBX.loading || (IBX.data !== undefined && !force)) return;
  IBX.loading = true;
  api('/whatsapp/chats').then(function(r){
    IBX.loading = false;
    IBX.data = r.ok ? r.data : { error: (r.data && r.data.detail) || ('The inbox returned ' + r.status + '.') };

function ibxOpen(sid){
  IBX.sel = sid; IBX.msgs = null; renderShell();
  api('/whatsapp/chats/' + encodeURIComponent(sid)).then(function(r){
    if (IBX.sel !== sid) return;
    IBX.msgs = r.ok ? (r.data.messages || []) : { error: (r.data && r.data.detail) || 'Could not open this chat.' };
    renderShell();
  });
}
function ibxWire(){
  setTimeout(function(){
    var r = document.getElementById('ibx_ref');
    if (r) r.onclick = function(){ IBX.data = undefined; ibxLoad(true); if (IBX.sel) ibxOpen(IBX.sel); };

var CAL_MONTH = null, CAL_DAY = null;
VIEWS.calendar = function(){
  var out = '<h1>Calendar</h1><p class="sub">Every appointment on a month view. Tap a day to see who is booked.</p>';
  if (!need('appts_all', '/operations/appointments?when=all&limit=500'))
    return out + panel('Calendar', loading('Loading the diary...'));
  if (S.appts_all === null) return out + panel('Calendar', errState('The appointments service did not respond.'));
  var now = new Date();
  if (!CAL_MONTH) { CAL_MONTH = new Date(now.getFullYear(), now.getMonth(), 1); CAL_DAY = now.getDate(); }
  var y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
  var byDay = {};
  (S.appts_all.appointments || []).forEach(function(a){
    var d = new Date(a.starts_at);
    if (isNaN(d) || d.getFullYear() !== y || d.getMonth() !== m) return;
    (byDay[d.getDate()] = byDay[d.getDate()] || []).push(a);
  });
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  var cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(x){ return '<div class="cal-h">' + x + '</div>'; }).join('');
  for (var i = 0; i < first; i++) cells += '<div class="cal-c off"></div>';
  for (var dd = 1; dd <= days; dd++) {
    var n = (byDay[dd] || []).length;
    var today = y === now.getFullYear() && m === now.getMonth() && dd === now.getDate();
    cells += '<div class="cal-c' + (today ? ' today' : '') + (CAL_DAY === dd ? ' sel' : '') + '" data-cday="' + dd + '">' +
             '<div class="cal-n">' + dd + '</div>' + (n ? '<div class="cal-b">' + n + ' booked</div>' : '') + '</div>';
  }
  var title = CAL_MONTH.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
  out += panel(title, '<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn" id="cal_prev">&larr; Previous</button>' +
    '<button class="btn" id="cal_today">This month</button><button class="btn" id="cal_next">Next &rarr;</button>' +
    '<a class="btn primary" href="#/appointments" style="margin-left:auto">+ Book</a></div><div class="cal-grid">' + cells + '</div>');
  var list = (byDay[CAL_DAY] || []).slice().sort(function(a, b){ return new Date(a.starts_at) - new Date(b.starts_at); });
  var label = CAL_DAY ? new Date(y, m, CAL_DAY).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  out += panel(label || 'Pick a day', list.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Customer</th><th>Service</th><th>Staff</th><th>Status</th></tr></thead><tbody>' +
      list.map(function(a){
        return '<tr><td>' + hhmm(a.starts_at) + '</td><td>' + esc(a.customer_name || '—') + '<div class="card-note">' + esc(a.customer_phone || '') +
               '</div></td><td>' + esc(a.service_name || a.service_text || '—') + '</td><td>' + esc(a.staff_name || '—') +
               '</td><td><span class="tag">' + esc(a.status || '') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>'
    : empty('Nothing booked', 'No appointments on this day.'));
  setTimeout(function(){
    function go(k){ CAL_MONTH = new Date(y, m + k, 1); CAL_DAY = null; renderShell(); }
    var p = document.getElementById('cal_prev'), t = document.getElementById('cal_today'), nx = document.getElementById('cal_next');
    if (p) p.onclick = function(){ go(-1); };
    if (nx) nx.onclick = function(){ go(1); };
    if (t) t.onclick = function(){ CAL_MONTH = null; renderShell(); };
    document.querySelectorAll('[data-cday]').forEach(function(c){
      c.onclick = function(){ CAL_DAY = Number(c.getAttribute('data-cday')); renderShell(); };
    });
  }, 0);
  return out;
};

    '<button class="btn primary" id="hr_save">Save</button></div>' + actbar());
  out += panel('Employees', '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Salary</th><th>Joined</th><th>Emergency</th><th>Address</th><th></th></tr></thead><tbody>' +
    list.map(function(s){
      return '<tr><td>' + esc(s.name) + (s.active === false ? ' <span class="tag">Inactive</span>' : '') + '</td><td>' + esc(s.role || '') +
        '</td><td>' + (s.salary != null ? money(s.salary) : '—') + '</td><td>' + esc(s.joining_date ? String(s.joining_date).slice(0, 10) : '—') +
        '</td><td>' + esc(s.emergency_contact || '—') + '</td><td>' + esc(s.address || '—') + '</td>' +
        '<td><button class="btn" data-hredit="' + esc(s.id) + '">Edit</button></td></tr>';
    }).join('') + '</tbody></table></div>');
  setTimeout(function(){
    var F = ['hr_salary', 'hr_join', 'hr_emerg', 'hr_addr', 'hr_notes'];
    var who = document.getElementById('hr_who');
    function fill(id){
      var s = null;
      for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) s = list[i];
      if (!s) return;
      HRF = { id: String(s.id), v: {
        hr_salary: s.salary != null ? s.salary : '', hr_join: s.joining_date ? String(s.joining_date).slice(0, 10) : '',
        hr_emerg: s.emergency_contact || '', hr_addr: s.address || '', hr_notes: s.hr_notes || '' } };
      paint();
    }
    // the dashboard redraws itself when data arrives: put back what is being typed
    function paint(){
      if (!HRF.id || !who) return;
      who.value = HRF.id;
      F.forEach(function(k){ var e = document.getElementById(k); if (e) e.value = HRF.v[k] != null ? HRF.v[k] : ''; });
    }
    paint();
    F.forEach(function(k){ var e = document.getElementById(k); if (e) e.oninput = e.onchange = function(){ if (HRF.id) HRF.v[k] = e.value; }; });
    if (who) who.onchange = function(){ if (who.value) fill(who.value); else HRF = {}; };
    document.querySelectorAll('[data-hredit]').forEach(function(b){
      b.onclick = function(){
        fill(b.getAttribute('data-hredit'));
        var f = document.getElementById('hr_salary');
        if (f) { f.scrollIntoView({ block: 'center', behavior: 'smooth' }); f.focus(); }
      };
    });
    var sv = document.getElementById('hr_save');
    if (sv) sv.onclick = function(){
      if (!val('hr_who')) { say('Choose an employee first.'); return; }
      act('/team/hr/' + val('hr_who'), {method:'PATCH', body:{salary: val('hr_salary'), joining_date: val('hr_join'),
        emergency_contact: val('hr_emerg'), address: val('hr_addr'), hr_notes: val('hr_notes')}}, 'Record saved.')
      .then(function(r){ if (r.ok) { HRF = {}; need('hr', '/team/hr', true); } });
    };
  }, 0);
  return out;
};

var APT = { from: null, to: null, all: false, status: '', q: '', data: undefined, loading: false,
            form: null, lines: [], busy: false, delArm: null };
var APT_STATUS = { booked: 'Scheduled', completed: 'Completed', cancelled: 'Cancelled', no_show: 'No Show' };
var APT_METHODS = [['cash','Cash'],['jazzcash','JazzCash'],['easypaisa','EasyPaisa'],['bank','Online / Bank Transfer'],['card','Card'],['other','Other']];

function aptQuery(){
  var q = APT.all ? '?include_unlinked=true' : ('?start=' + APT.from + '&end=' + APT.to + '&include_unlinked=true');
  if (APT.status) q += '&status=' + encodeURIComponent(APT.status);
  if (APT.q) q += '&q=' + encodeURIComponent(APT.q);
  return q;
}
function aptLoad(force){
  if (APT.loading || (APT.data !== undefined && !force)) return;
  APT.loading = true;
  api('/appointments/list' + aptQuery()).then(function(r){
    APT.loading = false;
    APT.data = r.ok ? r.data : { error: (r.data && r.data.detail) || ('The appointments service returned ' + r.status + '.') };
    renderShell();
  });
}
function aptMoney(v, cur){ return money(v || 0, cur); }
function aptBill(){
  var sub = 0, ld = 0;
  APT.lines.forEach(function(l){ sub += (Number(l.price) || 0) * (Number(l.qty) || 1); ld += Number(l.discount) || 0; });
  var dt = val('ap_dtype') || 'flat', dv = numv('ap_dval') || 0, gst = numv('ap_gst') || 0;
  var bd = dt === 'percent' ? (sub - ld) * dv / 100 : dv;
  var disc = Math.round((ld + bd) * 100) / 100;
  var tax = Math.round((sub - disc) * gst) / 100;
  var total = Math.round((sub - disc + tax) * 100) / 100;
  var rec = numv('ap_recv') || 0;
  var cr = Math.min(numv('ap_credit') || 0, APT.credit || 0);           // the customer's credit used (db/63)
  return { sub: sub, disc: disc, tax: tax, total: total, rec: rec, cr: cr, bal: Math.round((total - rec - cr) * 100) / 100 };
}
function aptCur(){ return (val('ap_cur') || 'PKR').toUpperCase(); }
function aptBillHTML(){
  if (!APT.lines.length) return 'Add a service to see the bill.';
  var b = aptBill(), c = aptCur();
  return 'Subtotal <b>' + aptMoney(b.sub, c) + '</b><br>Discount <b>- ' + aptMoney(b.disc, c) + '</b><br>GST <b>' + aptMoney(b.tax, c) +
         '</b><br><span style="font-size:15px">Total <b>' + aptMoney(b.total, c) + '</b></span>' + (b.cr > 0 ? '<br>Credit used <b>- ' + aptMoney(b.cr, c) + '</b>' : '') + '<br>Received now <b>' + aptMoney(b.rec, c) +
         '</b><br>Remaining balance <b class="' + (b.bal > 0.004 ? 'bal-due' : 'bal-ok') + '">' + aptMoney(Math.max(b.bal, 0), c) + '</b>';
}
function aptRefreshBill(){
  var el = document.getElementById('ap_bill'); if (el) el.innerHTML = aptBillHTML();
  var b = document.getElementById('ap_balance'); if (b) b.value = APT.lines.length ? Math.max(aptBill().bal, 0) : '';
}
/* a: an appointment row to edit, or null for a new one.
   preset: {customer:{id,name,phone}, date, status} for a new one opened from
   Daily Entry or a customer's history. */
function aptOpen(a, preset){
  APT.form = a ? { id: a.id, edit: true, a: a } : { edit: false, a: {}, preset: preset || {} };
  APT.lines = [];
  need('services', '/business/services'); need('staff', '/business/staff');
  need('packages', '/business/packages'); need('locations', '/business/locations');

      APT.credit = r.ok ? (r.data.credit || 0) : 0;

    else aptPickList().forEach(function(p){
      if (p.key === key) APT.lines.push({ service_id: p.service_id, package_id: p.package_id, name: p.pname || p.name,

    if (f.edit) {
      path = '/appointments/' + f.id; method = 'PATCH'; body = common;
    } else {
      var cust = pre.customer && pre.customer.id ? pre.customer : null;
      if (!cust && !val('ap_name')) { aptSay('Enter the client\'s name.', true); return; }
      var bad = APT.lines.filter(function(l){ return !String(l.name).trim() || l.price === '' || Number(l.price) < 0; });
      if (bad.length) { aptSay('Every line needs a name and a price.', true); return; }
      if (!/^[A-Za-z]{3}$/.test(aptCur())) { aptSay('Currency must be a 3-letter code like PKR.', true); return; }
      var b = aptBill();
      if (b.rec > 0 && !val('ap_pay')) { aptSay('Pick how they paid.', true); return; }
      if (b.rec + b.cr - b.total > 0.009) { aptSay('Amount received plus credit is more than the bill.', true); return; }
      path = '/appointments/book'; method = 'POST';
      body = Object.assign({}, common, {
        services: APT.lines.map(function(l){ return { service_id: l.service_id, package_id: l.package_id, name: String(l.name).trim(), price: Number(l.price) || 0, qty: Number(l.qty) || 1, discount: Number(l.discount) || 0 }; }),
        discount_type: val('ap_dtype'), discount_value: numv('ap_dval') || 0, gst_percent: numv('ap_gst') || 0, currency: aptCur(),
        received: b.rec, payment_method: val('ap_pay'), use_credit: b.cr || 0 });
      if (cust) body.customer_id = cust.id;
      else { body.name = val('ap_name'); body.phone = val('ap_phone'); body.source = val('ap_src'); }
      if (!body.staff_id) delete body.staff_id;
      if (!body.end_time) delete body.end_time;
    }
    APT.busy = true; g('ap_save').disabled = true; aptSay('Saving…');
    var payAmt = f.edit ? (numv('ap_payamt') || 0) : 0, payM = f.edit ? val('ap_paym') : '';
    api(path, { method: method, body: body }).then(function(r){
      if (!r.ok) { aptSay((r.data && r.data.detail) || ('Not saved (' + r.status + ').'), true); return null; }
      if (payAmt > 0 && f.a && f.a.invoice_id)
        return api('/operations/invoices/' + f.a.invoice_id + '/pay', { method: 'POST', body: { amount: payAmt, method: payM || 'cash' } })
          .then(function(p){ if (!p.ok) { aptSay('Saved, but the payment was refused: ' + ((p.data && p.data.detail) || p.status), true); return null; } return r; });
      return r;
    }).then(function(r){
      APT.busy = false;
      if (!r) { if (g('ap_save')) g('ap_save').disabled = false; return; }
      APT.form = null; APT.lines = [];
      if (!f.edit && body.date && !APT.all && APT.from) { if (body.date < APT.from || body.date > APT.to) { APT.from = APT.to = body.date; } }
      aptInvalidate();
      say(f.edit ? 'Appointment updated.' : 'Appointment saved.');
      renderShell();
    });
  };
}
function aptWireLines(){
  document.querySelectorAll('[data-apl]').forEach(function(inp){
    inp.oninput = function(){
      var l = APT.lines[Number(inp.getAttribute('data-apl'))], k = inp.getAttribute('data-k');
      l[k] = k === 'name' ? inp.value : (inp.value === '' ? '' : Number(inp.value));
      aptRefreshBill();
    };
  });
  document.querySelectorAll('[data-aprm]').forEach(function(b){
    b.onclick = function(){ APT.lines.splice(Number(b.getAttribute('data-aprm')), 1); aptRerenderLines(); };
  });
}
function aptRerenderLines(){
  var el = document.getElementById('ap_lines');
  if (!el) return;
  el.innerHTML = aptLinesHTML();
  aptWireLines();
  aptRefreshBill();
}
/* Views that host the modal call this at the top of their render. */
function aptModalPrep(){
  var snap = APT.form ? aptSnap() : null;
  setTimeout(function(){ aptRestore(snap); aptWireForm(); }, 0);
  return APT.form ? aptFormHTML() : '';
}

    if (g('ap_today')) g('ap_today').onclick = function(){ APT.from = APT.to = todayISO(); APT.all = false; reload(); };
    if (g('ap_all')) g('ap_all').onchange = function(){ APT.all = g('ap_all').checked; reload(); };

/* ------------------------------------------------------------- Customers

   staff and WhatsApp conversations. Edit and delete from the same place;
   the server refuses a delete that would orphan money or bookings. */
var CUS = { q: '', src: '', open: null, edit: false, delArm: false };
function custParam(){
  var m = /[?&]c=([0-9a-fA-F-]{36})/.exec(location.hash || '');

}
function digits10(p){ var d = String(p || '').replace(/\D/g, ''); return d.slice(-10); }

  var q = CUS.q.toLowerCase();
  var shown = list.filter(function(c){

  });
  out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px">' +
    '<input class="fld" id="cq" placeholder="Search name, phone, email" value="' + esc(CUS.q) + '" style="flex:1;min-width:180px">' +

  out += panel('All customers', shown.length

      shown.map(function(c){

          '</td><td>' + esc(sourceLabel(c.source)) + '</td><td><span class="tag">' + esc(c.status || '—') + '</span></td><td>' + onlyDate(c.created_at) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : empty(list.length ? 'No customer matches' : 'No customers yet', list.length ? 'Clear the search or source filter.' : 'Add one above, or book an appointment.'),
    '<span class="pill count">' + shown.length + '</span>');
  if (CUS.open) out += custDetailHTML(CUS.open);
  out += modal;

  setTimeout(function(){
    var g = function(id){ return document.getElementById(id); };
    if (g('caddbtn')) g('caddbtn').onclick = function(){
      var name = val('cname');
      if (!name) { say('A name is required.'); return; }
      var btn = g('caddbtn'); btn.disabled = true;
      act('/business/customers', {method:'POST', body:{ name: name, phone: val('cphone') || null, email: val('cemail') || null,
        source: val('csrc') || null, notes: val('cnotes') || null }}, 'Customer added.').then(function(r){
        btn.disabled = false;
        if (r.ok) { CUS.open = r.data.item.id; need('customers','/business/customers',true); }
      });
    };
    if (g('cq')) g('cq').oninput = function(){
      CUS.q = g('cq').value.trim();
      clearTimeout(VIEWS._cT); VIEWS._cT = setTimeout(function(){ renderShell(); var e = g('cq'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 300);
    };
    if (g('csf')) g('csf').onchange = function(){ CUS.src = g('csf').value; renderShell(); };
    document.querySelectorAll('[data-cust]').forEach(function(tr){
      tr.onclick = function(e){
        if (e.target.tagName === 'A') return;   // the link changes the hash itself

};

                 statTile('Balance', '<span class="' + (t.balance > 0.004 ? 'bal-due' : 'bal-ok') + '">' + money(t.balance) + '</span>')]);
  body += '<div class="card-note">Packages: ' + (h.packages.length ? esc(h.packages.join(', ')) : 'none') +

  body += '<h3>Appointments</h3>' + (h.appointments.length

      h.appointments.map(function(a){

/* Conversations are matched on the last 10 digits of the phone number. */
function custWaHTML(c){
  if (!c.phone) return '<div class="card-note">No phone number on file, so no WhatsApp conversation can be matched.</div>';
  ibxLoad(false);
  if (IBX.data === undefined) return '<div class="card-note">Checking WhatsApp…</div>';
  if (IBX.data.error) return '<div class="card-note">WhatsApp conversations are not available: ' + esc(IBX.data.error) + '</div>';
  var want = digits10(c.phone);
  var mine = (IBX.data.chats || []).filter(function(ch){ return want && digits10(ch.phone) === want; });
  if (!mine.length) return '<div class="card-note">No WhatsApp conversation with ' + esc(c.phone) + ' yet.</div>';
  return mine.map(function(ch){
    return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><strong>' + esc(ch.messages) + ' messages</strong> · last ' + (ch.last_at ? when(ch.last_at) : '') +
      '<div class="card-note">' + esc(ch.last || '') + '</div><a class="btn" href="#/inbox?sid=' + encodeURIComponent(ch.session_id) + '" style="margin-top:6px;display:inline-block">Open conversation</a></div>';
  }).join('');
}
/* Close always redraws: when the details were opened without ?c= in the
   address (e.g. right after adding a customer) setting the same hash fires
   no hashchange, so nothing happened and Close looked broken. */
function custClose(){
  CUS.open = null; CUS.edit = false; CUS.delArm = false; CUS.shown = null;
  if (location.hash !== '#/customers') history.replaceState(null, '', '#/customers');
  renderShell();
}
function custWire(){
  var id = CUS.open; if (!id) return;
  var h = S['hist_' + id]; if (!h) return;
  var g = function(x){ return document.getElementById(x); };
  var msg = function(m, bad){ var e = g('cmsg'); if (e) { e.textContent = m; e.style.color = bad ? 'var(--danger)' : 'var(--growth)'; } };
  if (g('c_close')) g('c_close').onclick = custClose;
  // on a phone the details sit below the whole list: bring them up once per opening
  if (CUS.shown !== id && g('c_close')) {
    CUS.shown = id;
    var pnl = g('c_close').closest('.panel') || g('c_close');
    if (pnl.getBoundingClientRect().top > innerHeight * 0.6) pnl.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  if (g('c_edit')) g('c_edit').onclick = function(){ CUS.edit = !CUS.edit; renderShell(); };
  if (g('ce_cancel')) g('ce_cancel').onclick = function(){ CUS.edit = false; renderShell(); };
  if (g('c_book')) g('c_book').onclick = function(){
    aptOpen(null, { customer: { id: h.customer.id, name: h.customer.name, phone: h.customer.phone }, date: todayISO() });
  };
  if (g('ce_save')) g('ce_save').onclick = function(){
    var name = val('ce_name');
    if (!name) { msg('A name is required.', true); return; }
    g('ce_save').disabled = true;
    api('/business/customers/' + id, { method: 'PATCH', body: { name: name, phone: val('ce_phone') || null, email: val('ce_email') || null,
      source: val('ce_src') || null, status: val('ce_status') || 'active', notes: val('ce_notes') || null } }).then(function(r){
      if (!r.ok) { g('ce_save').disabled = false; msg((r.data && r.data.detail) || 'Not saved.', true); return; }
      CUS.edit = false;
      need('customers', '/business/customers', true); need('hist_' + id, '/customers/' + id + '/history', true);
    });
  };
  if (g('c_del')) g('c_del').onclick = function(){
    if (!CUS.delArm) { CUS.delArm = true; renderShell(); return; }
    CUS.delArm = false;
    api('/business/customers/' + id, { method: 'DELETE' }).then(function(r){
      if (!r.ok) { renderShell(); setTimeout(function(){ msg((r.data && r.data.detail) || 'Not deleted.', true); }, 0); return; }
      CUS.open = null; location.hash = '#/customers'; need('customers', '/business/customers', true);
    });
  };

/* ------------------------------------------------------------- Inventory
