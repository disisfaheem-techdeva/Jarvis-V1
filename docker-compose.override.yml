services:
  api:
    labels:
      - traefik.enable=true
      - "traefik.http.routers.techdeva-api.rule=Host(`api.techdeva.net`)"
      - traefik.http.routers.techdeva-api.entrypoints=websecure
      - traefik.http.routers.techdeva-api.tls.certresolver=letsencrypt
      - traefik.http.services.techdeva-api.loadbalancer.server.port=8000
      # clients' own addresses (ops/setup/add_subdomain.sh)
      - "traefik.http.routers.techdeva-tenants.rule=Host(`drirfan.techdeva.net`)"
      - traefik.http.routers.techdeva-tenants.entrypoints=websecure
      - traefik.http.routers.techdeva-tenants.tls.certresolver=letsencrypt
      - traefik.http.routers.techdeva-tenants.service=techdeva-api
      - "traefik.http.routers.techdeva-tenants-http.rule=Host(`drirfan.techdeva.net`)"
      - traefik.http.routers.techdeva-tenants-http.entrypoints=web
      - traefik.http.routers.techdeva-tenants-http.middlewares=techdeva-to-https
      - traefik.http.routers.techdeva-tenants-http.service=techdeva-api
      - traefik.http.middlewares.techdeva-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.techdeva-to-https.redirectscheme.permanent=true
    networks:
      - default
      - hermes_net
  worker:
    networks:
      - default
      - hermes_net
  web:
    build:
      context: ./techdeva-web
      args:
        NEXT_PUBLIC_API_BASE: https://api.techdeva.net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - "traefik.http.routers.techdeva-web.rule=Host(`portal.techdeva.net`)"
      - traefik.http.routers.techdeva-web.entrypoints=websecure
      - traefik.http.routers.techdeva-web.tls.certresolver=letsencrypt
      - traefik.http.services.techdeva-web.loadbalancer.server.port=3000
    networks:
      - default
  # Instant Grill new website, PREVIEW only (new.instantgrill.shop, noindex).
  # Source: git worktree of branch claude/relaxed-brown-mq7qmz. Secrets: IG_* in .env.
  instantgrill-new:
    build:
      context: ../instantgrill-preview/instantgrill-web
      args:
        NEXT_PUBLIC_META_PIXEL_ID: "1140593618463651"
        NEXT_PUBLIC_GA4_ID: ""
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://instantgrill_app:${IG_DB_PASSWORD}@db:5432/instantgrill
      ADMIN_EMAIL: info@instantgrill.shop
      ADMIN_PASSWORD: ${IG_ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${IG_ADMIN_SESSION_SECRET}
      # Existing platform tenant "Instant GRill"; stays silent until the secret is set.
      PLATFORM_WEBHOOK_URL: http://api:8000/storefront/webhook/9c3e853c-568b-4f31-8324-5246e8cfd269
      PLATFORM_WEBHOOK_SECRET: ${IG_PLATFORM_WEBHOOK_SECRET:-}
      OWNER_EMAIL: info@instantgrill.shop
    labels:
      - traefik.enable=true
      - "traefik.http.routers.instantgrill-new.rule=Host(`new.instantgrill.shop`)"
      - traefik.http.routers.instantgrill-new.entrypoints=websecure
      - traefik.http.routers.instantgrill-new.tls.certresolver=letsencrypt
      - traefik.http.routers.instantgrill-new.middlewares=instantgrill-new-noindex
      - "traefik.http.middlewares.instantgrill-new-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      # The real domain. Priority 1 is the lowest, so while the old site's
      # containers (instantgrill_web/_admin) are running they win; stopping
      # them is the switch, starting them again is the way back.
      - "traefik.http.routers.instantgrill-live.rule=Host(`instantgrill.shop`) || Host(`www.instantgrill.shop`)"
      - traefik.http.routers.instantgrill-live.entrypoints=websecure
      - traefik.http.routers.instantgrill-live.tls.certresolver=letsencrypt
      - traefik.http.routers.instantgrill-live.priority=1
      - traefik.http.routers.instantgrill-live.service=instantgrill-new
      - traefik.http.routers.instantgrill-new.service=instantgrill-new
      - traefik.http.services.instantgrill-new.loadbalancer.server.port=3000
    networks:
      - default

networks:
  hermes_net:
    external: true
    name: hermes-workspace-ofsd_default
