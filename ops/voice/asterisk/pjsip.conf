; SIP for the AI phone agent. Only the provider's line (trunk.conf, written by
; ops/voice/setup.sh into /etc/techdeva/voice, root-only) can reach the
; dialplan: there is no anonymous endpoint, so unknown callers are refused.
[global]
type = global
user_agent = TechDeva
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

#include /etc/asterisk/techdeva/trunk.conf
