; Incoming calls from the provider's line.
; 1. ask the voice bridge whether this number is answered (an ENABLED number
;    of an active business, under its daily minutes, fewer than VOICE_MAX_CALLS
;    calls running); it returns a call id or nothing
; 2. nothing -> busy tone, never answered (the caller is not charged)
; 3. a call id -> answer and hand the audio to the bridge (AudioSocket)
[general]
static = yes
writeprotect = yes

[from-trunk]
exten => _[+0-9].,1,Set(DID=${EXTEN})
 same => n,Goto(ai,s,1)
; providers that send every call to "s": the dialled number is in the To header
exten => s,1,Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,Goto(ai,s,1)

[ai]
exten => s,1,Verbose(1,AI call to ${DID} from ${CALLERID(num)})
 same => n,Set(TOKEN=${FILTER(0-9a-zA-Z,${FILE(/etc/asterisk/techdeva/bridge.token)})})
 same => n,Set(CALLID=${CURL(http://127.0.0.1:9093/start?to=${URIENCODE(${DID})}&from=${URIENCODE(${CALLERID(num)})}&token=${TOKEN})})
 same => n,GotoIf($["${LEN(${CALLID})}" != "36"]?closed)
 same => n,Answer()
 same => n,AudioSocket(${CALLID},127.0.0.1:9092)
 same => n,Hangup()
 same => n(closed),Busy(5)
 same => n,Hangup()
