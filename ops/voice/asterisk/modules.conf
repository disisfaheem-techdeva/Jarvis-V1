; Load what Asterisk needs automatically, but never anything that opens a port
; or reaches out that the AI phone agent does not use. Only SIP (pjsip.conf,
; provider's line only) and audio (RTP, rtp.conf) are reachable from outside.
[modules]
autoload = yes
noload => chan_iax2.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_motif.so
noload => chan_dahdi.so
noload => chan_ooh323.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_sip.so
noload => pbx_dundi.so
noload => res_xmpp.so
noload => res_config_ldap.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_http_websocket.so
noload => res_ari.so
noload => res_stasis_test.so
noload => app_voicemail.so
noload => res_config_sqlite3.so
noload => cdr_radius.so
noload => cel_radius.so
noload => res_snmp.so
noload => res_calendar.so
